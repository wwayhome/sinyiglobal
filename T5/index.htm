<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>營業項目編號對應台北市土管歸組</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5YQY4RT9H2');
    </script>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei'; background-color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 設定區：您部署 Google Apps Script 後取得的「網頁應用程式網址」 ---
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwBVp5KhefjBTkU0V9cOpj9pDS7nKD1GoKt003sSil5feVM2OUatIFZpiWzCDO31OOU/exec";

        // 萃取土管/建管歸組編號的工具函數
        const extractGroupNumbers = (text) => {
            if (!text) return [];
            const groups = new Set();
            const textStr = String(text).replace(/：/g, ':').replace(/；/g, ';');
            const parts = textStr.split(';');
            
            parts.forEach(part => {
                const afterColon = part.includes(':') ? part.split(':')[1] : part;
                const subParts = afterColon.split(/[、,&＆]/);
                
                subParts.forEach(sp => {
                    const match = sp.match(/[a-zA-Z0-9-]+/);
                    if (match) {
                        groups.add(match[0].toUpperCase());
                    }
                });
            });
            
            return Array.from(groups);
        };

        // 轉換中文數字為阿拉伯數字的工具函數
        const normalizeGroupIdentifier = (str) => {
            if (!str) return '';
            const s = String(str).trim();
            
            if (/[A-Za-z]/.test(s)) return s.toUpperCase();
            
            const cnMatch = s.match(/[一二三四五六七八九十]+/);
            if (cnMatch && !/\d/.test(s)) {
                const cnStr = cnMatch[0];
                const numMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
                let total = 0;
                let temp = 0;
                for (let i = 0; i < cnStr.length; i++) {
                    let char = cnStr[i];
                    let val = numMap[char];
                    if (val === 10) {
                        if (temp === 0) temp = 1;
                        total += temp * 10;
                        temp = 0;
                    } else {
                        temp = val;
                    }
                }
                total += temp;
                return String(total);
            }
            
            const arabicMatch = s.match(/\d+/);
            if (arabicMatch) return arabicMatch[0];

            return s; 
        };

        // 升級版：將字串聰明拆解並展開所有別名的工具函數 (處理 "第二種住宅區(住二、住二之一)" -> ["第二種住宅區", "住二", "住二之一"])
        const parseZones = (rawStr) => {
            const cleaned = String(rawStr || '').replace(/[\s　]/g, '');
            if (!cleaned) return [];
            
            const expanded = new Set();
            expanded.add(cleaned); // 保留完整原始字串
            
            // 1. 處理括號：將括號內外的文字分開
            const match = cleaned.match(/^(.*?)[(（](.*?)[)）]$/);
            let outside = cleaned;
            let inside = "";
            if (match) {
                outside = match[1]; // 例如：第二種住宅區
                inside = match[2];  // 例如：住二、住二之一、住二之二
                if (outside) expanded.add(outside);
                if (inside) expanded.add(inside);
            }
            
            // 2. 將文字依頓號、逗號等符號切分，並加入集合
            const splitAndAdd = (str) => {
                if (!str) return;
                str.split(/[、,，/]/).filter(Boolean).forEach(p => expanded.add(p));
            };
            
            splitAndAdd(cleaned);
            splitAndAdd(outside);
            splitAndAdd(inside);
            
            return Array.from(expanded);
        };

        function App() {
            const [mainData, setMainData] = useState([]);
            const [groupData, setGroupData] = useState([]);
            const [buildingData, setBuildingData] = useState([]);
            const [rulesData, setRulesData] = useState([]);
            const [conditionsData, setConditionsData] = useState([]); 
            const [isLoaded, setIsLoaded] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [filteredData, setFilteredData] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [showDropdown, setShowDropdown] = useState(false);
            const dropdownRef = useRef(null);

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalData, setModalData] = useState(null);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setShowDropdown(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const fetchJsonData = async (type) => {
                if (!GAS_URL) return [];
                const response = await fetch(`${GAS_URL}?type=${type}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return data;
            };

            useEffect(() => {
                const loadData = async () => {
                    try {
                        if (!GAS_URL) {
                            throw new Error("尚未設定 Google Apps Script (GAS) URL。請確認程式碼設定。");
                        }

                        const [mainRaw, groupRaw, buildingRaw, rulesRaw, conditionsRaw] = await Promise.all([
                            fetchJsonData('main'),
                            fetchJsonData('group').catch(e => { console.warn("組別載入失敗", e); return []; }),
                            fetchJsonData('building').catch(e => { console.warn("建管載入失敗", e); return []; }),
                            fetchJsonData('rules').catch(e => { console.warn("規定載入失敗", e); return []; }),
                            fetchJsonData('conditions').catch(e => { console.warn("附條件載入失敗", e); return []; })
                        ]);

                        if (!mainRaw || mainRaw.length === 0) {
                            throw new Error("讀取到的資料為空，請確認 Apps Script 權限或試算表 ID。");
                        }

                        setMainData(mainRaw);
                        setGroupData(groupRaw);
                        setBuildingData(buildingRaw);
                        setRulesData(rulesRaw);
                        setConditionsData(conditionsRaw);
                        setIsLoaded(true);
                    } catch (error) {
                        console.error("載入失敗:", error);
                        setErrorMsg(`連線至資料庫時發生錯誤：\n${error.message}`);
                    }
                };

                loadData();
            }, []);

            const handleSearch = (e) => {
                const value = e.target.value;
                setSearchTerm(value);
                setSelectedItem(null);

                if (value.trim() === '') {
                    setFilteredData([]);
                    setShowDropdown(false);
                    return;
                }

                const upperTerm = value.toUpperCase();
                const results = mainData.filter(item => {
                    const code = item['營業項目代碼'] ? String(item['營業項目代碼']).toUpperCase() : '';
                    const name = item['營業項目'] ? String(item['營業項目']).toUpperCase() : '';
                    return code.includes(upperTerm) || name.includes(upperTerm);
                });

                setFilteredData(results);
                setShowDropdown(true);
            };

            const selectItem = (item) => {
                setSearchTerm(item['營業項目代碼']);
                setSelectedItem(item);
                setShowDropdown(false);
            };

            // 處理點擊「△」的邏輯，開啟視窗
            const handleConditionClick = (zone, group) => {
                const targetGroup = normalizeGroupIdentifier(group);
                console.log(`\n[附條件搜尋啟動] 正在尋找 -> 分區: "${zone}", 組別: "${targetGroup}"`);

                if (!conditionsData || conditionsData.length === 0) {
                    setModalData({ 
                        zone, 
                        group: targetGroup, 
                        error: "附條件資料表尚未載入或讀取失敗。",
                        details: [] 
                    });
                    setIsModalOpen(true);
                    return;
                }

                const cKeyZone = Object.keys(conditionsData[0])[0]; 
                const cKeyGroup = Object.keys(conditionsData[0])[1]; 
                // 從B欄(索引1)開始提取，這樣彈出視窗會顯示B、C、D...欄
                const conditionKeys = Object.keys(conditionsData[0]).slice(1); 

                // 將點擊的分區展開成陣列
                const targetZones = parseZones(zone);
                console.log(`[展開橘色表格的查詢條件]:`, targetZones);

                const matched = conditionsData.filter(c => {
                    // 將條件表的分區也展開成陣列
                    const cZones = parseZones(c[cKeyZone]);
                    const gVal = normalizeGroupIdentifier(c[cKeyGroup]);
                    
                    // 精準交集比對：只要有一個陣列元素「完全相等」才算符合
                    const zMatch = targetZones.some(tz => cZones.includes(tz));
                    const gMatch = gVal === targetGroup;

                    return zMatch && gMatch;
                }).map(c => {
                    const extracted = {};
                    conditionKeys.forEach(k => {
                        if (c[k] && String(c[k]).trim() !== '') {
                            extracted[k] = c[k];
                        }
                    });
                    return extracted;
                }).filter(obj => Object.keys(obj).length > 0);

                setModalData({ zone, group: targetGroup, details: matched });
                setIsModalOpen(true);
            };

            const SearchIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            );

            if (errorMsg) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-red-100">
                            <h1 className="text-xl font-bold text-red-600 mb-4 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                雲端連線失敗
                            </h1>
                            <p className="text-gray-600 whitespace-pre-wrap leading-relaxed bg-red-50 p-4 rounded-lg text-sm">{errorMsg}</p>
                        </div>
                    </div>
                );
            }

            if (!isLoaded) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="flex flex-col items-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                            <p className="text-gray-500 font-medium">正在連線至 API 資料庫...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto relative">
                    <div className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">營業項目編號對應台北市土管歸組</h1>
                        <div className="text-sm text-gray-600 bg-gray-100 inline-block px-4 py-3 rounded-md mb-2 leading-relaxed">
                            <div className="font-bold mb-1 text-gray-700">資料更新：</div>
                            <ol className="list-decimal list-inside ml-1 space-y-1">
                                <li>
                                    <a href="https://tcooc-co.gov.taipei/Content_List.aspx?n=C359BAE6A481EB85" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 hover:underline transition-colors">
                                        113.07.09 經濟部營業項目總表_對應土管歸組及歸目
                                    </a>
                                </li>
                                <li>
                                    <a href="https://laws.gov.taipei/Law/LawSearch/LawArticleContent/FL003962" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 hover:underline transition-colors">
                                        114.07.09 臺北市土地使用分區管制自治條例
                                    </a>
                                </li>
                                <li>
                                    <a href="https://laws.gov.taipei/Law/LawSearch/LawArticleContent/FL025529" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 hover:underline transition-colors">
                                        114.07.09 臺北市土地使用分區附條件允許使用標準
                                    </a>
                                </li>
                            </ol>
                        </div>
                        <p className="text-xs text-gray-500 mt-1 font-medium bg-white px-2 py-1 rounded inline-block border border-gray-200 shadow-sm">
                            主資料: <span className="text-blue-600 font-bold">{mainData.length}</span> 筆 | 
                            附條件: <span className={conditionsData.length > 0 ? "text-green-600 font-bold" : "text-red-600 font-bold"}>{conditionsData.length}</span> 筆
                        </p>
                    </div>

                    <div className="relative mb-8 z-40" ref={dropdownRef}>
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <SearchIcon />
                            </div>
                            <input
                                type="text"
                                className="block w-full pl-12 pr-4 py-4 bg-white border-2 border-transparent shadow-sm rounded-xl text-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all"
                                placeholder="輸入代碼或名稱..."
                                value={searchTerm}
                                onChange={handleSearch}
                                onFocus={() => { if (searchTerm) setShowDropdown(true); }}
                            />
                        </div>

                        {showDropdown && filteredData.length > 0 && (
                            <div className="absolute w-full mt-2 bg-white rounded-xl shadow-2xl border border-gray-100 max-h-80 overflow-y-auto custom-scrollbar">
                                {filteredData.slice(0, 50).map((item, index) => (
                                    <div 
                                        key={index}
                                        className="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0 flex items-center gap-3"
                                        onClick={() => selectItem(item)}
                                    >
                                        <span className="font-mono font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded text-sm">{item['營業項目代碼']}</span>
                                        <span className="text-gray-700 font-medium">{item['營業項目']}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {selectedItem && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden animate-fade-in relative z-10">
                            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-6 text-white">
                                <span className="bg-white/20 text-white border border-white/30 px-3 py-1 rounded-lg font-mono text-xl font-bold block mb-2 w-fit">
                                    {selectedItem['營業項目代碼']}
                                </span>
                                <h2 className="text-3xl font-extrabold">{selectedItem['營業項目']}</h2>
                            </div>

                            <div className="p-6 md:p-8">
                                {(() => {
                                    const landKey = Object.keys(selectedItem).find(k => k.includes('土管'));
                                    const landValue = landKey ? selectedItem[landKey] : null;
                                    
                                    const buildKey = Object.keys(selectedItem).find(k => k.includes('建管') || k.includes('建築'));
                                    const buildValue = buildKey ? selectedItem[buildKey] : null;

                                    let buildingDef = null;
                                    if (buildValue && buildingData.length > 0) {
                                        const bKeyName = Object.keys(buildingData[0])[0];
                                        const buildNums = extractGroupNumbers(buildValue);
                                        const defs = [];
                                        
                                        buildNums.forEach(bNum => {
                                            const matchedBItem = buildingData.find(b => String(b[bKeyName]).toUpperCase() === String(bNum));
                                            if (matchedBItem) {
                                                const defKey = Object.keys(matchedBItem).find(k => k.includes('組別定義'));
                                                if (defKey && matchedBItem[defKey]) {
                                                    defs.push(buildNums.length > 1 ? `【${bNum}】${matchedBItem[defKey]}` : matchedBItem[defKey]);
                                                }
                                            }
                                        });
                                        if (defs.length > 0) {
                                            buildingDef = defs.join('\n\n');
                                        }
                                    }

                                    return (
                                        <React.Fragment>
                                            <div className="mb-6 bg-gray-50 p-6 rounded-xl border border-gray-200 text-gray-800">
                                                <h3 className="text-sm font-bold text-gray-500 mb-2 uppercase tracking-widest">定義內容</h3>
                                                <p className="text-lg leading-relaxed">{selectedItem['定義內容'] || '無詳細說明'}</p>
                                            </div>

                                            <div className="flex flex-wrap gap-4 mb-6">
                                                {landValue && (
                                                    <div className="flex-1 min-w-[200px] bg-green-50 border border-green-200 rounded-xl p-4 flex items-center gap-4 shadow-sm">
                                                        <div className="bg-green-200 text-green-700 p-3 rounded-lg">
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                                            </svg>
                                                        </div>
                                                        <div>
                                                            <div className="text-xs font-bold text-green-600 uppercase tracking-widest mb-1">{landKey || '臺北市土管歸組'}</div>
                                                            <div className="text-2xl font-black text-green-900">{landValue}</div>
                                                        </div>
                                                    </div>
                                                )}
                                                {buildValue && (
                                                    <div className="flex-1 min-w-[200px] bg-purple-50 border border-purple-200 rounded-xl p-4 flex items-center gap-4 shadow-sm">
                                                        <div className="bg-purple-200 text-purple-700 p-3 rounded-lg">
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                                            </svg>
                                                        </div>
                                                        <div>
                                                            <div className="text-xs font-bold text-purple-600 uppercase tracking-widest mb-1">{buildKey || '建管歸組'}</div>
                                                            <div className="text-2xl font-black text-purple-900">{buildValue}</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {(() => {
                                                    let entries = Object.entries(selectedItem)
                                                        .filter(([key]) => !['營業項目代碼', '營業項目', '定義內容', '', landKey, buildKey].includes(key));
                                                    
                                                    if (buildingDef) {
                                                        entries.push(['組別定義', buildingDef]);
                                                    }

                                                    return entries.sort(([keyA], [keyB]) => {
                                                        const customOrder = ['本業目別', '組別定義', '限辦歸組', '限辦目別', '策略型產業'];
                                                        let indexA = customOrder.indexOf(keyA);
                                                        let indexB = customOrder.indexOf(keyB);
                                                        if (indexA === -1) indexA = 999;
                                                        if (indexB === -1) indexB = 999;
                                                        return indexA - indexB;
                                                    })
                                                    .map(([key, value]) => (
                                                        <div key={key} className="bg-gray-50 p-5 rounded-xl border border-gray-100">
                                                            <div className="text-xs font-bold text-gray-500 mb-1">{key}</div>
                                                            <div className="text-gray-900 font-medium whitespace-pre-wrap">{value || '-'}</div>
                                                        </div>
                                                    ));
                                                })()}
                                            </div>
                                        </React.Fragment>
                                    );
                                })()}

                                {/* 下方關聯附屬組別表格 */}
                                {(() => {
                                    const landKey = Object.keys(selectedItem).find(k => k.includes('土管'));
                                    const landValue = landKey ? selectedItem[landKey] : null;
                                    const targetGroupNums = extractGroupNumbers(landValue);
                                    
                                    if (targetGroupNums.length === 0 || groupData.length === 0) return null;
                                    
                                    return targetGroupNums.map(targetGroupNum => {
                                        const groupKeyName = Object.keys(groupData[0])[0];
                                        const matchedItems = groupData.filter(g => String(g[groupKeyName]) === String(targetGroupNum));
                                        
                                        if (matchedItems.length === 0) return null;

                                        const displayKeys = Object.keys(groupData[0]).filter(k => k !== groupKeyName);
                                        const col2Name = displayKeys[0] || '使用組';
                                        const col3Name = displayKeys[1] || '使用項目';

                                        return (
                                            <div key={`group-${targetGroupNum}`} className="mt-8 bg-green-50 rounded-xl border border-green-200 overflow-hidden">
                                                <div className="px-6 py-4 bg-green-100/60 font-bold text-green-800">
                                                    土管歸組資料 (第 {targetGroupNum} 組)
                                                </div>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm">
                                                        <thead className="bg-green-200/50 text-green-800 text-left">
                                                            <tr>
                                                                <th className="px-6 py-3 w-1/3">{col2Name}</th>
                                                                <th className="px-6 py-3 w-2/3">{col3Name}</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {matchedItems.map((g, i) => (
                                                                <tr key={i} className="border-b border-green-100 bg-white">
                                                                    <td className="px-6 py-4 font-bold text-green-800 align-top whitespace-pre-wrap">{g[displayKeys[0]]}</td>
                                                                    <td className="px-6 py-4 whitespace-pre-wrap">{g[displayKeys[1]]}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}

                                {/* 下方關聯「建管歸組/使用項目」表格 */}
                                {(() => {
                                    const buildKey = Object.keys(selectedItem).find(k => k.includes('建管') || k.includes('建築'));
                                    const buildValue = buildKey ? selectedItem[buildKey] : null;
                                    const targetBuildNums = extractGroupNumbers(buildValue);
                                    
                                    if (targetBuildNums.length === 0 || buildingData.length === 0) return null;
                                    
                                    return targetBuildNums.map(targetBuildNum => {
                                        const bKeyName = Object.keys(buildingData[0])[0];
                                        const matchedBItems = buildingData.filter(b => String(b[bKeyName]).toUpperCase() === String(targetBuildNum));
                                        
                                        if (matchedBItems.length === 0) return null;

                                        const displayBKeys = Object.keys(buildingData[0]).filter(k => k !== bKeyName && !k.includes('組別定義'));
                                        const col2Name = displayBKeys[0] || '使用項目舉例';

                                        return (
                                            <div key={`build-${targetBuildNum}`} className="mt-8 bg-purple-50 rounded-xl border border-purple-200 overflow-hidden">
                                                <div className="px-6 py-4 bg-purple-100/60 font-bold text-purple-800">
                                                    建管使用類組說明 ({targetBuildNum})
                                                </div>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm">
                                                        <thead className="bg-purple-200/50 text-purple-800 text-left">
                                                            <tr>
                                                                <th className="px-6 py-3 w-1/4">建築類組</th>
                                                                <th className="px-6 py-3 w-3/4">{col2Name}</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {matchedBItems.map((b, i) => {
                                                                const rawText = b[displayBKeys[0]] || '';
                                                                const formattedText = String(rawText).replace(/;/g, ';\n').replace(/；/g, '；\n');
                                                                return (
                                                                    <tr key={i} className="border-b border-purple-100 bg-white hover:bg-purple-50/50 transition-colors">
                                                                        <td className="px-6 py-4 font-bold text-purple-800 align-top whitespace-pre-wrap">{b[bKeyName]}</td>
                                                                        <td className="px-6 py-4 whitespace-pre-wrap text-gray-700 leading-relaxed">{formattedText}</td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}

                                {/* 下方關聯「使用規定一覽表」區塊 (一般組別) */}
                                {(() => {
                                    const landKey = Object.keys(selectedItem).find(k => k.includes('土管'));
                                    const landValue = landKey ? selectedItem[landKey] : null;
                                    const targetGroupNums = extractGroupNumbers(landValue);
                                    
                                    if (targetGroupNums.length === 0 || rulesData.length === 0) return null;
                                    
                                    return targetGroupNums.map(targetGroupNum => {
                                        const rKeyName = Object.keys(rulesData[0])[0];
                                        const matchedRules = rulesData.filter(r => String(r[rKeyName]) === String(targetGroupNum));
                                        if (matchedRules.length === 0) return null;

                                        const displayKeys = Object.keys(rulesData[0]).filter(k => k !== rKeyName);

                                        return (
                                            <div key={`rules-${targetGroupNum}`} className="mt-8 bg-orange-50 rounded-xl border border-orange-200 overflow-hidden">
                                                <div className="px-6 py-4 bg-orange-100/60 font-bold text-orange-800 flex justify-between items-center">
                                                    <span>使用規定一覽表 (第 {targetGroupNum} 組)</span>
                                                </div>
                                                
                                                <div className="px-6 py-3 bg-white border-b border-orange-100 text-sm text-gray-700">
                                                    <span className="font-bold text-orange-800 mr-3">符號圖例：</span>
                                                    <div className="inline-block md:inline-flex flex-wrap gap-4 mt-2 md:mt-0 items-center">
                                                        <span className="flex items-center gap-1"><span className="text-base font-bold text-orange-600 leading-none" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>○</span> 允許使用</span>
                                                        <span className="flex items-center gap-1">
                                                            <span className="text-lg font-bold text-blue-600 underline decoration-blue-300 underline-offset-4 leading-none -mt-1 cursor-pointer" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>△</span> 附條件允許 <span className="text-xs text-gray-400 font-normal ml-1">(可點擊查看條件)</span>
                                                        </span>
                                                        <span className="flex items-center gap-1"><span className="text-base font-bold text-orange-600 leading-none" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>※</span> 限於原有合法建築物</span>
                                                        <span className="flex items-center gap-1"><span className="text-base font-bold text-orange-600 leading-none" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>×</span> 不允許使用</span>
                                                    </div>
                                                </div>

                                                <div className="overflow-x-auto custom-scrollbar">
                                                    <table className="w-full text-sm text-center">
                                                        <thead className="bg-orange-200/50 text-orange-800">
                                                            <tr>
                                                                {matchedRules.length > 1 && (
                                                                    <th className="px-2 py-5 border-b border-orange-200 align-middle min-w-[50px]">項次</th>
                                                                )}
                                                                {displayKeys.map((k, i) => (
                                                                    <th key={i} className="px-2 py-5 border-b border-orange-200 align-middle min-w-[50px]">{k}</th>
                                                                ))}
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-orange-100 bg-white">
                                                            {matchedRules.map((rule, idx) => (
                                                                <tr key={idx} className="hover:bg-orange-50/50 transition-colors">
                                                                    {matchedRules.length > 1 && (
                                                                        <td className="px-2 py-4 font-bold text-orange-700 bg-orange-50/30 align-middle border-r border-orange-100">{idx + 1}</td>
                                                                    )}
                                                                    {displayKeys.map((k, i) => {
                                                                        const rawText = rule[k] || '-';
                                                                        const formattedText = String(rawText).replace(/;/g, ';\n').replace(/；/g, '；\n');

                                                                        const renderFormattedText = () => {
                                                                            return formattedText.split(/(○|△|※|×)/g).map((part, index) => {
                                                                                if (part === '△') {
                                                                                    return (
                                                                                        <button 
                                                                                            key={index} 
                                                                                            onClick={() => handleConditionClick(k, targetGroupNum)}
                                                                                            className="text-lg font-bold leading-none inline-block -translate-y-[1px] text-blue-600 hover:text-blue-800 hover:scale-125 transition-transform cursor-pointer relative group underline decoration-blue-300 decoration-2 underline-offset-4"
                                                                                            title="點擊查看附帶條件"
                                                                                        >
                                                                                            {part}
                                                                                        </button>
                                                                                    );
                                                                                }
                                                                                if (['○', '※', '×'].includes(part)) {
                                                                                    return <span key={index} className="text-base font-bold leading-none inline-block text-orange-700">{part}</span>;
                                                                                }
                                                                                return part;
                                                                            });
                                                                        };

                                                                        return (
                                                                            <td key={i} 
                                                                                className="px-2 py-4 whitespace-pre-wrap text-gray-700 align-middle border-r border-orange-50 last:border-r-0 leading-relaxed"
                                                                                style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}
                                                                            >
                                                                                {renderFormattedText()}
                                                                            </td>
                                                                        );
                                                                    })}
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}

                                {/* 下方關聯「策略型產業」專屬使用規定一覽表 */}
                                {(() => {
                                    const strategyValue = selectedItem['策略型產業'];
                                    
                                    if (!strategyValue || String(strategyValue).trim() === '' || String(strategyValue).trim() === '-') {
                                        return null;
                                    }
                                    if (rulesData.length === 0) return null;

                                    const rKeyName = Object.keys(rulesData[0])[0];
                                    const matchedRules = rulesData.filter(r => String(r[rKeyName]).trim() === '策略');
                                    
                                    if (matchedRules.length === 0) return null;

                                    const displayKeys = Object.keys(rulesData[0]).filter(k => k !== rKeyName);

                                    return (
                                        <div className="mt-8 bg-orange-50 rounded-xl border border-orange-300 overflow-hidden shadow-sm relative">
                                            <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-orange-500"></div>
                                            
                                            <div className="px-6 py-4 bg-orange-200/70 font-bold text-orange-900 flex justify-between items-center border-b border-orange-200">
                                                <span>使用規定一覽表 ({strategyValue})</span>
                                            </div>
                                            
                                            <div className="px-6 py-3 bg-white border-b border-orange-100 text-sm text-gray-700">
                                                <span className="font-bold text-orange-800 mr-3">符號圖例：</span>
                                                <div className="inline-block md:inline-flex flex-wrap gap-4 mt-2 md:mt-0 items-center">
                                                    <span className="flex items-center gap-1"><span className="text-base font-bold text-orange-600 leading-none" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>○</span> 允許使用</span>
                                                    <span className="flex items-center gap-1">
                                                        <span className="text-lg font-bold text-blue-600 underline decoration-blue-300 underline-offset-4 leading-none -mt-1 cursor-pointer" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>△</span> 附條件允許 <span className="text-xs text-gray-400 font-normal ml-1">(可點擊查看條件)</span>
                                                    </span>
                                                    <span className="flex items-center gap-1"><span className="text-base font-bold text-orange-600 leading-none" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>※</span> 限於原有合法建築物</span>
                                                    <span className="flex items-center gap-1"><span className="text-base font-bold text-orange-600 leading-none" style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}>×</span> 不允許使用</span>
                                                </div>
                                            </div>

                                            <div className="overflow-x-auto custom-scrollbar">
                                                <table className="w-full text-sm text-center">
                                                    <thead className="bg-orange-100/50 text-orange-800">
                                                        <tr>
                                                            {matchedRules.length > 1 && (
                                                                <th className="px-2 py-5 border-b border-orange-200 align-middle min-w-[50px]">項次</th>
                                                            )}
                                                            {displayKeys.map((k, i) => (
                                                                <th key={i} className="px-2 py-5 border-b border-orange-200 align-middle min-w-[50px]">{k}</th>
                                                            ))}
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-orange-100 bg-white">
                                                        {matchedRules.map((rule, idx) => (
                                                            <tr key={idx} className="hover:bg-orange-50/50 transition-colors">
                                                                {matchedRules.length > 1 && (
                                                                    <td className="px-2 py-4 font-bold text-orange-700 bg-orange-50/30 align-middle border-r border-orange-100">{idx + 1}</td>
                                                                )}
                                                                {displayKeys.map((k, i) => {
                                                                    const rawText = rule[k] || '-';
                                                                    const formattedText = String(rawText).replace(/;/g, ';\n').replace(/；/g, '；\n');

                                                                    const renderFormattedText = () => {
                                                                        return formattedText.split(/(○|△|※|×)/g).map((part, index) => {
                                                                            if (part === '△') {
                                                                                return (
                                                                                    <button 
                                                                                        key={index} 
                                                                                        onClick={() => handleConditionClick(k, '策略')}
                                                                                        className="text-lg font-bold leading-none inline-block -translate-y-[1px] text-blue-600 hover:text-blue-800 hover:scale-125 transition-transform cursor-pointer relative group underline decoration-blue-300 decoration-2 underline-offset-4"
                                                                                        title="點擊查看附帶條件"
                                                                                    >
                                                                                        {part}
                                                                                    </button>
                                                                                );
                                                                            }
                                                                            if (['○', '※', '×'].includes(part)) {
                                                                                return <span key={index} className="text-base font-bold leading-none inline-block text-orange-700">{part}</span>;
                                                                            }
                                                                            return part;
                                                                        });
                                                                    };

                                                                    return (
                                                                        <td key={i} 
                                                                            className="px-2 py-4 whitespace-pre-wrap text-gray-700 align-middle border-r border-orange-50 last:border-r-0 leading-relaxed"
                                                                            style={{ fontFamily: "'Microsoft JhengHei', 'PingFang TC', sans-serif" }}
                                                                        >
                                                                            {renderFormattedText()}
                                                                        </td>
                                                                    );
                                                                })}
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* 彈出視窗 Modal */}
                    {isModalOpen && modalData && (
                        <div 
                            className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in"
                            onClick={() => setIsModalOpen(false)}
                        >
                            <div 
                                className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden transform transition-all"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="px-6 py-4 bg-blue-600 text-white flex justify-between items-center shrink-0">
                                    <h3 className="font-bold text-lg flex items-center gap-2">
                                        <svg className="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        【{modalData.zone}】 - 第 {modalData.group} 組 附帶條件
                                    </h3>
                                    <button 
                                        onClick={() => setIsModalOpen(false)} 
                                        className="text-white/70 hover:text-white hover:bg-blue-700 p-1 rounded-lg transition-colors"
                                    >
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                
                                <div className="p-6 overflow-y-auto custom-scrollbar bg-gray-50/50">
                                    {modalData.error ? (
                                        <div className="text-center py-10 bg-red-50 rounded-xl border border-red-100">
                                            <svg className="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                            <p className="text-red-600 font-bold text-lg mb-2">無法讀取資料</p>
                                            <p className="text-red-500/80 text-sm">{modalData.error}</p>
                                        </div>
                                    ) : modalData.details && modalData.details.length > 0 ? (
                                        <div className="space-y-4">
                                            {modalData.details.map((detail, idx) => (
                                                <div key={idx} className="bg-white p-5 rounded-xl border border-blue-100 shadow-sm">
                                                    {Object.entries(detail).map(([key, val], i) => (
                                                        <div key={i} className="mb-4 last:mb-0">
                                                            <div className="text-xs font-bold text-blue-500 mb-1 tracking-wider uppercase">{key}</div>
                                                            <div className="text-gray-800 whitespace-pre-wrap leading-relaxed bg-blue-50/30 p-3 rounded-lg border border-blue-50/50">
                                                                {val}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-12 flex flex-col items-center">
                                            <svg className="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                            <p className="text-gray-500 font-medium">目前查無「{modalData.zone}」與「第 {modalData.group} 組」的附帶條件資料。</p>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="px-6 py-4 bg-white border-t border-gray-100 shrink-0 flex justify-end">
                                    <button 
                                        onClick={() => setIsModalOpen(false)}
                                        className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-sm"
                                    >
                                        關閉說明
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</body>
</html>
