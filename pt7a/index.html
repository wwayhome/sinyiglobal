<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <title>拍攝引導相機</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" id="appShell" data-orientation="portrait">
      <section class="top-panel" aria-label="拍攝設定">
        <div class="brand-row">
          <div>
            <p class="eyebrow">手機拍攝助手</p>
            <h1>拍攝引導相機</h1>
          </div>
          <div class="count-pill" id="progressPill">0 / 10</div>
        </div>

        <div class="subject-tabs" role="tablist" aria-label="選擇拍攝主題">
          <button class="subject-tab active" type="button" data-subject="office">辦公</button>
          <button class="subject-tab" type="button" data-subject="land">土地</button>
          <button class="subject-tab" type="button" data-subject="factory">廠房</button>
        </div>

        <div class="orientation-tabs" role="group" aria-label="選擇拍攝方向">
          <button class="orientation-tab active" type="button" data-orientation="portrait">直拍</button>
          <button class="orientation-tab" type="button" data-orientation="landscape">橫拍</button>
        </div>
      </section>

      <section class="camera-panel" aria-label="相機預覽">
        <video id="cameraView" autoplay playsinline muted></video>
        <canvas id="photoCanvas" hidden></canvas>

        <div class="camera-placeholder" id="cameraPlaceholder">
          <div class="placeholder-mark"></div>
          <p id="cameraStatus">正在開啟相機，請允許瀏覽器使用鏡頭。</p>
        </div>

        <div class="guide-overlay" id="guideOverlay" data-guide="facade" aria-hidden="true">
          <div class="grid-lines"></div>
          <div class="center-cross"></div>
          <div class="frame-box"></div>
          <div class="perspective perspective-left"></div>
          <div class="perspective perspective-right"></div>
          <div class="horizon-line"></div>
          <div class="boundary boundary-left"></div>
          <div class="boundary boundary-right"></div>
          <div class="wide-room"></div>
          <div class="level-meter" id="levelMeter">
            <span></span>
          </div>
        </div>

        <div class="camera-topbar">
          <button class="icon-button" id="permissionBtn" type="button" aria-label="開啟相機">
            <span aria-hidden="true">相機</span>
          </button>
          <button class="icon-button" id="levelBtn" type="button" aria-label="開啟水平儀">
            <span aria-hidden="true">水平</span>
          </button>
        </div>

        <div class="task-card" aria-live="polite">
          <div>
            <p class="task-step" id="taskStep">第 1 張</p>
            <h2 id="taskTitle">大樓主視覺</h2>
            <p id="taskHint">站到對街或稍遠處，讓整棟建築完整入鏡，注意垂直線不要歪。</p>
          </div>
          <button class="skip-button" id="skipBtn" type="button">跳過</button>
        </div>
      </section>

      <section class="action-panel" aria-label="拍攝操作">
        <button class="secondary-button" id="prevBtn" type="button">上一張</button>
        <button class="capture-button" id="captureBtn" type="button" aria-label="拍照"></button>
        <button class="secondary-button" id="nextBtn" type="button">下一張</button>
      </section>

      <section class="status-panel" aria-label="完成狀態">
        <div class="meter-row">
          <span id="completionText">已完成 0 張，建議至少 8 張</span>
          <span id="subjectName">辦公</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <section class="shot-list" id="shotList" aria-label="拍攝清單"></section>
    </main>

    <dialog class="review-dialog" id="reviewDialog">
      <form method="dialog">
        <div class="review-head">
          <div>
            <p class="eyebrow">照片預覽</p>
            <h2 id="reviewTitle">確認這張照片</h2>
          </div>
          <button class="icon-button dark" value="close" aria-label="關閉預覽" type="submit">X</button>
        </div>
        <img id="reviewImage" alt="剛拍攝的照片預覽" />
        <p class="save-note" id="saveNote">請先儲存到手機，再進入下一張。</p>
        <div class="review-actions">
          <button class="secondary-button" id="retakeBtn" value="close" type="submit">重拍</button>
          <button class="primary-button" id="saveBtn" type="button">儲存到手機</button>
          <button class="secondary-button" id="acceptBtn" value="close" type="submit">已儲存</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
