                                        )}
                                    </div>

                                    <div className="mt-4 rounded-lg bg-white border border-gray-100 p-4">
                                        <div className="flex items-center justify-between gap-3">
                                            <div>
                                                <div className="text-xs text-gray-500">目前已載入</div>
                                                <div className="text-2xl font-bold text-gray-800">{pages.length} <span className="text-sm font-medium text-gray-500">頁</span></div>
                                            </div>
                                            <div className="text-right text-xs text-gray-500 leading-relaxed">
                                                {pages.length > 0 ? '可預覽、排序、旋轉、刪除' : '尚未載入 PDF'}
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className={`rounded-xl border p-4 ${pages.length > 0 ? 'border-blue-100 bg-blue-50/60' : 'border-gray-100 bg-gray-50'}`}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <span className="flex h-7 w-7 items-center justify-center rounded-full bg-blue-100 text-blue-700 text-sm font-bold">2</span>
                                        <div>
                                            <h2 className="font-bold text-gray-800">頁面選取 / 多選</h2>
                                            <p className="text-xs text-gray-500">選取頁面後可整批拖曳到藍線位置</p>
                                        </div>
                                    </div>
                                    <div className="rounded-lg bg-white border border-gray-100 p-4">
                                        <div className="text-sm font-semibold text-gray-700">
                                            {pages.length > 0 ? (isMultiSelectMode ? `多選模式已啟動，已選取 ${selectedPageIds.length} 頁` : '可啟動多選，或直接拖曳單頁排序') : '請先載入 PDF 後再進行頁面選取'}
                                        </div>
                                        <div className="mt-2 text-xs text-gray-500 leading-relaxed">
                                            {pages.length > 0 ? (isMultiSelectMode ? '勾選多頁後，拖曳任一已選頁面即可整批移動。' : '單頁仍可直接拖曳排序；需要批次移動時再啟動多選。') : '載入後，頁面縮圖會顯示在下方工作區。'}
                                        </div>
                                        {pages.length > 0 && (
                                            <div className="mt-4 space-y-3">
                                                <div className="flex flex-wrap gap-2">
                                                    <button type="button" onClick={toggleMultiSelectMode} className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${isMultiSelectMode ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border border-gray-200 text-gray-700 hover:bg-gray-100'}`}>
                                                        {isMultiSelectMode ? '關閉多選' : '啟動多選'}
                                                    </button>
                                                    {isMultiSelectMode && (
                                                        <>
                                                            <button type="button" onClick={selectAllPages} className="px-3 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 transition">全選</button>
                                                            <button type="button" onClick={clearPageSelection} className="px-3 py-2 rounded-lg text-sm font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 transition">取消選取</button>
                                                        </>
                                                    )}
                                                </div>

                                                {isMultiSelectMode && (
                                                    <div className="rounded-lg border border-blue-100 bg-blue-50/60 p-3">
                                                        <div className="mb-2 text-xs font-semibold text-blue-800">範圍選取</div>
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <label className="text-xs text-gray-600">
                                                                起始頁
                                                                <input type="number" min="1" max={pages.length} value={selectionRangeStart} onChange={e => setSelectionRangeStart(e.target.value)} placeholder="1" className="mt-1 w-full px-2 py-2 border border-blue-200 rounded-lg focus:outline-none focus:border-blue-500 bg-white" />
                                                            </label>
                                                            <label className="text-xs text-gray-600">
                                                                結束頁
                                                                <input type="number" min="1" max={pages.length} value={selectionRangeEnd} onChange={e => setSelectionRangeEnd(e.target.value)} placeholder={pages.length} className="mt-1 w-full px-2 py-2 border border-blue-200 rounded-lg focus:outline-none focus:border-blue-500 bg-white" />
                                                            </label>
                                                        </div>
                                                        <button type="button" onClick={addRangeSelection} className="mt-2 w-full rounded-lg bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition">加入選取範圍</button>
                                                        <p className="mt-2 text-[11px] leading-relaxed text-blue-700">桌機也可先勾選一頁，再按住 Shift 勾選另一頁，自動選取中間範圍。</p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </section>

                                <section className={`rounded-xl border p-4 ${pages.length > 0 ? 'border-green-100 bg-green-50/60' : 'border-gray-100 bg-gray-50'}`}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <span className="flex h-7 w-7 items-center justify-center rounded-full bg-green-100 text-green-700 text-sm font-bold">3</span>
                                        <div>
                                            <h2 className="font-bold text-gray-800">匯出 PDF</h2>
                                            <p className="text-xs text-gray-500">選擇匯出方式後按同一顆按鈕</p>
                                        </div>
                                    </div>

                                    <div className="space-y-3">

                                                        </div>
                                                    </div>

                                                    {/* 上移 / 下移 / 移除按鈕 */}
                                                    <div className="flex items-center gap-1 flex-shrink-0">
                                                        <button
                                                            type="button"
                                                            onClick={() => movePendingFile(index, -1)}
                                                            disabled={index === 0}
                                                            className="p-1.5 rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-100 disabled:opacity-35 disabled:cursor-not-allowed transition"
                                                            title="上移"
                                                        >
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7"></path>
                                                            </svg>
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => movePendingFile(index, 1)}
                                                            disabled={index === pendingFiles.length - 1}
                                                            className="p-1.5 rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-100 disabled:opacity-35 disabled:cursor-not-allowed transition"
                                                            title="下移"
                                                        >
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path>
                                                            </svg>
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => removePendingFile(item.id)}
                                                            className="p-1.5 rounded-lg border border-red-100 bg-red-50/60 text-red-500 hover:bg-red-500 hover:text-white transition ml-1"
                                                            title="從此次匯入移除"
                                                        >
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* 底部操作列 */}
                                    <div className="px-6 py-4 bg-gray-50 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <span className="text-xs text-gray-500">
                                            {pages.length > 0 ? '確認後將依此順序附加在現有頁面後方' : '確認後將依此順序載入所有頁面'}
                                        </span>
                                        <div className="flex justify-end gap-3">
                                            <button
                                                type="button"
                                                onClick={cancelPendingImport}
                                                className="px-4 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-200/70 rounded-xl transition"
                                            >
                                                取消
                                            </button>
                                            <button
                                                type="button"
                                                onClick={confirmPendingImport}
                                                className="px-5 py-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition"
                                            >
                                                開始匯入（{pendingFiles.length} 個檔案）
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 自訂對話框的 UI */}
                        {dialog && (
                            <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm transition-opacity">
                                <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full border border-gray-100 transform transition-all">
                                    <h3 className="text-xl font-bold text-gray-800 mb-3">
                                        {dialog.type === 'confirm' ? '請確認' : '提示'}
                                    </h3>
                                    <p className="text-gray-600 mb-8 leading-relaxed">{dialog.message}</p>
                                    <div className="flex justify-end gap-3">
                                        {dialog.type === 'confirm' && (
                                            <button
                                                type="button"
                                                onClick={() => setDialog(null)}
                                                className="px-5 py-2.5 text-sm font-semibold text-gray-600 hover:bg-gray-100 rounded-xl transition-colors"
                                            >
                                                取消
                                            </button>
                                        )}
                                        <button
                                            type="button"
                                            onClick={() => {
                                                if (dialog.onConfirm) dialog.onConfirm();
                                                else setDialog(null);
                                            }}
                                            className={`px-5 py-2.5 text-sm font-bold text-white rounded-xl shadow-sm transition-all focus:ring-4 focus:outline-none ${
                                                dialog.type === 'confirm'
                                                 ? 'bg-red-500 hover:bg-red-600 focus:ring-red-100'
                                                 : 'bg-blue-600 hover:bg-blue-700 focus:ring-blue-100'
                                            }`}
                                        >
                                            確定
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 放大預覽 Modal */}
                        {previewPage && (
                            <div
                                ref={modalRef}
                                className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 backdrop-blur-sm p-4 sm:p-8 select-none transition-opacity"
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                onClick={handleBackdropClick}
                                title="滑鼠滾輪可縮放，按住滑鼠左鍵可拖曳圖片"
                            >
                                {/* 右上角獨立關閉按鈕 */}
                                <button
                                    type="button"
                                    onClick={closePreview}
                                    className="absolute top-6 right-6 bg-black/60 hover:bg-red-600 hover:scale-105 active:scale-95 text-white pl-5 pr-6 py-3.5 rounded-full shadow-2xl transition-all z-[110] border border-white/20 flex items-center gap-2 text-sm font-bold"
                                    title="關閉預覽 (ESC)"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path>
                                    </svg>
                                    關閉預覽 (ESC)
                                </button>

                                {/* 底部控制器 */}
                                <div
                                    className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-black/90 px-6 py-3 rounded-full flex items-center gap-4 text-white z-[110] shadow-2xl border border-white/15"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <button
                                        type="button"
                                        onClick={closePreview}
                                        className="bg-red-600 hover:bg-red-500 active:scale-95 text-white px-4 py-2 rounded-full text-sm font-bold transition-all flex items-center gap-1.5 shadow-md"
                                        title="關閉預覽 (亦可點擊背景或按 ESC 鍵)"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path>
                                        </svg>
                                        關閉
                                    </button>
                                    
                                    <div className="h-5 w-px bg-white/20"></div>

                                    <button
                                        type="button"
                                        onClick={() => setPreviewScale(p => Math.max(p / 1.15, 0.5))}
                                        className="hover:bg-white/15 p-2 rounded-lg transition"
                                        title="縮小"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 12H4"></path></svg>
                                    </button>
                                    <span className="text-sm font-semibold select-none min-w-[3.5rem] text-center">
                                        {Math.round(previewScale * 100)}%
                                    </span>
                                    <button
                                        type="button"
                                        onClick={() => setPreviewScale(p => Math.min(p * 1.15, 8.0))}
                                        className="hover:bg-white/15 p-2 rounded-lg transition"
                                        title="放大"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                    </button>
                                    
                                    <div className="h-5 w-px bg-white/20"></div>
                                    
                                    <button
                                        type="button"
                                        onClick={() => { setPreviewScale(1); setPanOffset({ x: 0, y: 0 }); }}
                                        className="text-xs hover:bg-white/15 px-3 py-2 rounded-full transition font-semibold"
                                        title="還原原始大小並置中"
                                    >
                                        重設
                                    </button>
                                </div>

                                {/* 圖片顯示區域 */}
                                <div
                                    className="relative flex-1 w-full flex items-center justify-center min-h-0 pointer-events-auto"
                                    onClick={(e) => e.stopPropagation()}
                                    onMouseDown={handleMouseDown}
                                >
                                    {/* 載入高清之前的模糊預覽縮圖 */}
                                    {!highResPreviewUrl && (
                                        <img
                                            src={previewPage.thumbnail}
                                            className="h-full w-full object-contain rounded shadow-2xl bg-white blur-md opacity-60 pointer-events-none select-none"
                                            style={transformStyle}
                                        />
                                    )}

                                    {/* 高畫質原尺寸高清圖 */}
                                    {highResPreviewUrl && (
                                        <img
                                            src={highResPreviewUrl}
                                            alt={`第 ${previewPage.originalPageNum + 1} 頁放大預覽`}
                                            className="h-full w-full object-contain rounded shadow-2xl bg-white select-none pointer-events-none"
                                            style={transformStyle}
                                        />
                                    )}

                                    {/* 載入高清動畫 */}
                                    {isPreviewLoading && (
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                            <div className="bg-black/75 p-4 rounded-xl flex flex-col items-center shadow-lg">
                                                <svg className="animate-spin h-8 w-8 text-white mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                <span className="text-white text-sm font-medium tracking-wide">正在載入高清原圖...</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-4 text-white text-xs sm:text-sm font-medium drop-shadow-md flex-none bg-black/40 px-3 py-1 rounded-full pointer-events-none select-none">
                                    {previewPage.filename} - 第 {previewPage.originalPageNum + 1} 頁 (滾輪縮放 · 滑鼠拖曳 · ESC關閉)
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
