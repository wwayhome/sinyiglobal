        let pendingDeleteDecision = null;

        function openDeleteDependencyModal(removedTask, dependentTasks, reconnectCandidate) {
            pendingDeleteDecision = {
                taskId: removedTask.id,
                reconnectTaskId: reconnectCandidate ? reconnectCandidate.id : null
            };

            const modal = document.getElementById('delete-dependency-modal');
            const message = document.getElementById('delete-dependency-message');
            const reconnectBtn = document.getElementById('btn-delete-reconnect');
            message.textContent = `「${removedTask.name}」是 ${dependentTasks.length} 個後續任務的前置任務。要將後續任務銜接到「${reconnectCandidate.name}」，還是清除前置關聯並維持在原地？`;
            reconnectBtn.textContent = `銜接到「${reconnectCandidate.name}」`;
            reconnectBtn.title = `銜接到「${reconnectCandidate.name}」`;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('delete-dependency-modal-content').classList.remove('scale-95');
            }, 10);
        }

        function closeDeleteDependencyModal() {
            const modal = document.getElementById('delete-dependency-modal');
            modal.classList.add('opacity-0');
            document.getElementById('delete-dependency-modal-content').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
            pendingDeleteDecision = null;
        }

        window.removeTask = function(id) {
            const removedTask = tasks.find(t => t.id === id);
            if (!removedTask) return;

            const dependentTasks = getDependentTasks(id);
            const reconnectCandidate = findReconnectCandidate(removedTask);
            if (dependentTasks.length > 0 && reconnectCandidate) {
                openDeleteDependencyModal(removedTask, dependentTasks, reconnectCandidate);
                return;
            }

            deleteTaskWithDependencyMode(id, 'clear');
        };

        document.getElementById('btn-delete-cancel').addEventListener('click', closeDeleteDependencyModal);
        document.getElementById('btn-delete-keep').addEventListener('click', () => {
            if (!pendingDeleteDecision) return;
            const taskId = pendingDeleteDecision.taskId;
            closeDeleteDependencyModal();
            deleteTaskWithDependencyMode(taskId, 'clear');
        });
        document.getElementById('btn-delete-reconnect').addEventListener('click', () => {
            if (!pendingDeleteDecision) return;
            const { taskId, reconnectTaskId } = pendingDeleteDecision;
            closeDeleteDependencyModal();
            deleteTaskWithDependencyMode(taskId, 'reconnect', reconnectTaskId);
        });
        
        window.openEditModal = function(id) {
            const task = tasks.find(t => t.id === id);
            document.getElementById('edit-task-id').value = task.id;
            document.getElementById('edit-task-name').value = task.name;
            document.getElementById('edit-task-category').value = task.category;
            
            if (appMode === 'simple') {
                document.querySelectorAll('.edit-simple-fields').forEach(el => el.classList.remove('hidden'));
                document.querySelectorAll('.edit-advanced-fields').forEach(el => el.classList.add('hidden'));
                document.getElementById('edit-task-start').value = task.startDate;
                document.getElementById('edit-task-end').value = task.endDate;
                ensureEndNotBeforeStart('edit-task-start', 'edit-task-end');
            } else {
                document.querySelectorAll('.edit-simple-fields').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.edit-advanced-fields').forEach(el => el.classList.remove('hidden'));
                updatePredecessorOptions(task.id);
                
                document.getElementById('edit-task-duration').value = task.duration || diffDays(task.startDate, task.endDate);
                if (task.predecessor && task.predecessor.taskId) {
                    document.getElementById('edit-task-predecessor').value = task.predecessor.taskId;
                    document.getElementById('edit-task-lag').value = task.predecessor.lag || 0;
                    document.getElementById('edit-advanced-start-wrapper').classList.add('hidden');
                } else {
                    document.getElementById('edit-task-predecessor').value = "";
                    document.getElementById('edit-task-lag').value = 0;
                    document.getElementById('edit-advanced-start-wrapper').classList.remove('hidden');
                    document.getElementById('edit-task-adv-start').value = task.startDate;
                }
            }

            document.getElementById('edit-modal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('edit-modal').classList.remove('opacity-0'); document.getElementById('edit-modal-content').classList.remove('scale-95'); }, 10);
        };
        
        window.closeEditModal = function() {
            document.getElementById('edit-modal').classList.add('opacity-0');
            document.getElementById('edit-modal-content').classList.add('scale-95');
            setTimeout(() => document.getElementById('edit-modal').classList.add('hidden'), 200);
        };
        
        document.getElementById('edit-task-predecessor').addEventListener('change', (e) => {
            if(e.target.value) {
                document.getElementById('edit-advanced-start-wrapper').classList.add('hidden');
            } else {
                document.getElementById('edit-advanced-start-wrapper').classList.remove('hidden');
            }
        });

        document.getElementById('edit-task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('edit-task-id').value);
            const taskIndex = tasks.findIndex(t => t.id === id);
            const task = tasks[taskIndex];
            
            const nextCategory = document.getElementById('edit-task-category').value;
            const nextName = document.getElementById('edit-task-name').value || '未命名';
            const nextPredId = appMode === 'advanced' ? document.getElementById('edit-task-predecessor').value : '';
            if (nextPredId && wouldCreateDependencyCycle(id, nextPredId)) {
                showMessage("無法設定前置任務：這會形成循環依賴");
                return;
            }

            task.category = nextCategory;
            task.name = nextName;

            if (appMode === 'simple') {
                task.startDate = document.getElementById('edit-task-start').value || task.startDate;
                task.endDate = normalizeDateRange(task.startDate, document.getElementById('edit-task-end').value || task.endDate, 'edit-task-end');
                task.duration = diffDays(task.startDate, task.endDate);
            } else {
                task.duration = parseInt(document.getElementById('edit-task-duration').value || 1);
                const predId = nextPredId;
                if (predId) {
                    task.predecessor = {
                        taskId: parseInt(predId),
                        lag: parseInt(document.getElementById('edit-task-lag').value || 0)
                    };
                } else {
                    task.predecessor = null;
                    task.startDate = document.getElementById('edit-task-adv-start').value || task.startDate;
                    task.endDate = addDaysToDateString(task.startDate, task.duration - 1);
                }
            }
            
            updatePredecessorOptions();
            renderGantt(); 
            recordHistory();
            closeEditModal();
        });

        document.getElementById('add-task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('task-name').value || '新項目';
            const cat = document.getElementById('task-category').value;
            
            let start, end, duration, predecessor = null;
            
            if (appMode === 'simple') {
                if (inputMode === 'absolute') { 
                    start = document.getElementById('task-start').value || todayStr; 
                    end = document.getElementById('task-end').value || start; 
                    end = normalizeDateRange(start, end, 'task-end');
                    duration = diffDays(start, end);
                } else { 
                    const projStart = document.getElementById('proj-start-date').value || todayStr; 
                    start = addDaysToDateString(projStart, parseInt(document.getElementById('task-offset').value || 1)-1); 
                    duration = parseInt(document.getElementById('task-duration').value || 1);
                    end = addDaysToDateString(start, duration-1); 
                }
            } else {
                duration = parseInt(document.getElementById('task-adv-duration').value || 1);
                const predId = document.getElementById('task-predecessor').value;
                if (predId) {
                    predecessor = {
                        taskId: parseInt(predId),
                        lag: parseInt(document.getElementById('task-adv-lag').value || 0)
                    };
                    start = end = todayStr; // 會在 recalculateDates 時被修正
                } else {
                    start = document.getElementById('task-adv-start').value || todayStr;
                    end = addDaysToDateString(start, duration - 1);
                }
            }

            tasks.push({ id: Date.now(), category: cat, name: name, startDate: start, endDate: end, duration: duration, predecessor: predecessor });
            
            document.getElementById('task-name').value = '';
            updatePredecessorOptions();
            renderGantt();
            recordHistory();
        });

        document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', (e) => {
            if (viewMode === e.target.dataset.mode) return;
            viewMode = e.target.dataset.mode;
            applyViewModeUi();
            renderGantt();
            recordHistory();
        }));
        
        document.getElementById('btn-sort').addEventListener('click', () => { 
            const catKeys = Object.keys(categories);
            tasks.sort((a,b) => {
                const indexA = catKeys.indexOf(a.category);
                const indexB = catKeys.indexOf(b.category);
                if (indexA !== indexB) return indexA - indexB;
                return a.startDate.localeCompare(b.startDate);
            }); 
            updatePredecessorOptions();
            renderGantt(); 
            recordHistory();
            showMessage("已依自訂類別順序與日期重新排序");
        });
        
        document.getElementById('btn-export').addEventListener('click', async () => { 
            const chartArea = document.getElementById('chart-export-area');
            const scrollContainer = chartArea.querySelector('.chart-scroll-container');
            const contentWrapper = chartArea.querySelector('.chart-content-wrapper');
            const btnLoading = document.getElementById('export-loading');

            if (!scrollContainer || !contentWrapper) return;
            if (btnLoading) btnLoading.classList.remove('hidden');
            
            try {
                const fullWidth = contentWrapper.scrollWidth;
                const fullHeight = chartArea.scrollHeight;
                const originalAreaStyle = chartArea.getAttribute('style') || '';
                const originalContainerClass = scrollContainer.className;
                const originalAreaClass = chartArea.className;
                
                chartArea.style.width = `${fullWidth}px`;
                chartArea.style.height = `${fullHeight}px`;
                chartArea.style.maxWidth = 'none';
                chartArea.classList.remove('overflow-hidden');
                scrollContainer.className = scrollContainer.className.replace('overflow-x-auto', 'overflow-visible');
                
                await new Promise(resolve => setTimeout(resolve, 150));
                const dataUrl = await window.htmlToImage.toPng(chartArea, { backgroundColor: '#ffffff', pixelRatio: 2, width: fullWidth, height: fullHeight, style: { margin: 0, transform: 'none' } }); 
                const link = document.createElement('a'); link.download = `專案甘特圖_${new Date().toISOString().slice(0,10)}.png`; link.href = dataUrl; link.click();
                
                chartArea.setAttribute('style', originalAreaStyle);
                chartArea.className = originalAreaClass;
                scrollContainer.className = originalContainerClass;
                showMessage("圖表已成功匯出！");
            } catch (error) { showMessage("匯出圖片失敗，請重試。"); } finally {
                if (btnLoading) btnLoading.classList.add('hidden');
            }
        });
        
        let pendingTemplateValue = '';
        document.getElementById('template-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (!val) return;
            pendingTemplateValue = val;
            
            const currentProjStart = document.getElementById('proj-start-date').value || todayStr;
            document.getElementById('modal-start-date').value = currentProjStart;

            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('confirm-modal-content').classList.remove('scale-95'); }, 10);
            e.target.value = '';
        });

        document.getElementById('btn-confirm-cancel').addEventListener('click', () => { closeConfirmModal(); pendingTemplateValue = ''; });

        document.getElementById('btn-confirm-ok').addEventListener('click', () => {
            if (pendingTemplateValue) {
                const tplData = getTemplates()[appMode][pendingTemplateValue];
                if (tplData) {
                    categories = JSON.parse(JSON.stringify(tplData.categories));
                    const userChosenStartDate = document.getElementById('modal-start-date').value || todayStr;
                    document.getElementById('proj-start-date').value = userChosenStartDate;
                    document.getElementById('task-adv-start').value = userChosenStartDate;

                    // 關鍵修復點：確保在解析資料時不管模式為何，都不會讓 startDate 變成 NaN
                    tasks = tplData.tasks.map(t => {
                        let newTask = JSON.parse(JSON.stringify(t));
                        
                        // 確保至少有 startDate
                        newTask.startDate = newTask.startDate || userChosenStartDate;
                        
                        // 相容舊版 offset 寫法
                        if (newTask.offset !== undefined && newTask.duration !== undefined) {
                            newTask.startDate = addDaysToDateString(userChosenStartDate, newTask.offset - 1);
                            newTask.endDate = addDaysToDateString(userChosenStartDate, newTask.offset - 1 + newTask.duration - 1);
                        } 
                        
                        // 如果有工期卻沒有結束日，自動補上計算後的結束日
                        if (newTask.duration !== undefined && !newTask.endDate) {
                            newTask.endDate = addDaysToDateString(newTask.startDate, newTask.duration - 1);
                        }
                        
                        // 強制防呆，防止遺失 endDate 導致程式崩潰
                        if (!newTask.endDate) {
                            newTask.endDate = newTask.startDate;
                            newTask.duration = 1;
                        }

                        return newTask;
                    });

                    // 移除了自動切換模式的邏輯，保持在當前模式
                    
                    // --- 修正處：重新渲染類別 UI，這樣介面上的自訂類別才會跟著範本變更 ---
                    renderCategories('task-category');
                    renderCategories('edit-task-category');
                    
                    // --- 新增修正：重新渲染前置任務下拉選單 ---
                    updatePredecessorOptions();
                     
                    renderGantt();
                    recordHistory();
                    showMessage("範本載入成功！");
                }
                pendingTemplateValue = '';
            }
            closeConfirmModal();
        });

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('opacity-0');
            document.getElementById('confirm-modal-content').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        document.getElementById('btn-save').addEventListener('click', () => {
            const projectData = { categories: categories, tasks: tasks, projStartDate: document.getElementById('proj-start-date').value };
            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = `專案備份_${new Date().toISOString().slice(0,10)}.json`; link.click();
            URL.revokeObjectURL(url);
            showMessage("專案已成功儲存！");
        });

        document.getElementById('btn-undo').addEventListener('click', () => {
            if (undoStack.length <= 1) return;
            const currentState = undoStack.pop();
            redoStack.push(cloneData(currentState));
            restoreProjectState(undoStack[undoStack.length - 1]);
            showMessage("已回復上一步");
        });

        document.getElementById('btn-redo').addEventListener('click', () => {
            if (redoStack.length === 0) return;
            const nextState = redoStack.pop();
            undoStack.push(cloneData(nextState));
            restoreProjectState(nextState);
            showMessage("已前進到下一步");
        });

        document.getElementById('proj-start-date').addEventListener('change', recordHistory);

        document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());

        document.getElementById('file-import').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.categories && data.tasks) {
                        categories = data.categories; tasks = data.tasks;
                        if (data.projStartDate) document.getElementById('proj-start-date').value = data.projStartDate;
                        updatePredecessorOptions();
                        renderCategories('task-category'); renderCategories('edit-task-category'); renderGantt();
                        recordHistory();
                        showMessage("專案讀取成功！");
                    } else showMessage("檔案格式不符，無法讀取。");
                } catch (error) { showMessage("檔案解析失敗，請確定為有效的專案檔。"); }
                e.target.value = '';
            };
            reader.readAsText(file, 'UTF-8');
        });

        // 拖曳互動與 Tooltip 邏輯
        let dragAction = null; let activeTaskId = null; let startX = 0;
        let initialStartDate = null; let initialEndDate = null;
        let activeTaskBarEl = null; let initialWidthPx = 0; let initialLeftPx = 0; let pixelsPerDay = 0;

        const dragTooltip = document.getElementById('drag-tooltip');
        function updateDragTooltip(x, y, text) {
            dragTooltip.style.left = x + 'px';
            dragTooltip.style.top = (y - 15) + 'px';
            dragTooltip.innerHTML = text;
        }

        document.addEventListener('mousedown', (e) => {
            const resizeHandle = e.target.closest('.resize-handle');
            const taskBar = e.target.closest('.task-bar-element');
            const dragHandle = e.target.closest('.drag-handle');

            if (resizeHandle) {
                e.stopPropagation(); e.preventDefault(); 
                dragAction = 'resize'; activeTaskId = parseInt(resizeHandle.dataset.taskId);
                activeTaskBarEl = resizeHandle.closest('.task-bar-element'); startX = e.pageX;
                const task = tasks.find(t => t.id === activeTaskId);
                initialStartDate = task.startDate; initialEndDate = task.endDate;
                initialWidthPx = activeTaskBarEl.getBoundingClientRect().width;
                const { totalDays } = computeTimeline();
                pixelsPerDay = activeTaskBarEl.parentElement.clientWidth / totalDays;
                document.body.style.cursor = 'ew-resize';
                
                dragTooltip.classList.remove('hidden');
                const diffD = diffDays(initialStartDate, initialEndDate);
                updateDragTooltip(e.clientX, e.clientY, `結束日: ${initialEndDate} (共 ${diffD} 天)`);
            } else if (taskBar) {
                if (e.button !== 0) return;
                const task = tasks.find(t => t.id === parseInt(taskBar.dataset.taskId));
                
                if (appMode === 'advanced' && task.predecessor && task.predecessor.taskId) {
                    showMessage("進階關模式中，受依賴的任務無法手動平移日期");
                    return; 
                }

                e.stopPropagation(); e.preventDefault(); 
                dragAction = 'move'; activeTaskId = task.id;
                activeTaskBarEl = taskBar; startX = e.pageX;
                initialStartDate = task.startDate; initialEndDate = task.endDate;
                const containerRect = activeTaskBarEl.parentElement.getBoundingClientRect();
                const barRect = activeTaskBarEl.getBoundingClientRect();
                initialLeftPx = barRect.left - containerRect.left;
                const { totalDays } = computeTimeline();
                pixelsPerDay = containerRect.width / totalDays;
                document.body.style.cursor = 'grabbing'; activeTaskBarEl.style.cursor = 'grabbing';
                
                dragTooltip.classList.remove('hidden');
                updateDragTooltip(e.clientX, e.clientY, `${initialStartDate} ~ ${initialEndDate}`);
            } else if (dragHandle) {
                const row = dragHandle.closest('.task-row');
                if (row) {
                    row.setAttribute('draggable', 'true');
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!dragAction) return;
            e.preventDefault();
            const deltaX = e.pageX - startX;
            let deltaDays = Math.round(deltaX / pixelsPerDay);
            if (dragAction === 'resize') {
                let tempEndDate = addDaysToDateString(initialEndDate, deltaDays);
                if (new Date(tempEndDate) < new Date(initialStartDate)) {
                    deltaDays = diffDays(initialEndDate, initialStartDate) - 1; 
                    tempEndDate = initialStartDate;
                }
                const newWidthPx = Math.max(initialWidthPx + (deltaDays * pixelsPerDay), 10);
                activeTaskBarEl.style.width = `${newWidthPx}px`;
                
                const diffD = diffDays(initialStartDate, tempEndDate);
                updateDragTooltip(e.clientX, e.clientY, `結束日: ${tempEndDate} (共 ${diffD} 天)`);
            } else if (dragAction === 'move') {
                const newLeftPx = initialLeftPx + deltaX;
                activeTaskBarEl.style.left = `${newLeftPx}px`;
                
                let tempStart = addDaysToDateString(initialStartDate, deltaDays);
                let tempEnd = addDaysToDateString(initialEndDate, deltaDays);
                updateDragTooltip(e.clientX, e.clientY, `${tempStart} ~ ${tempEnd}`);
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!dragAction) return;
            const deltaX = e.pageX - startX; let deltaDays = Math.round(deltaX / pixelsPerDay);
            const task = tasks.find(t => t.id === activeTaskId);
            if (dragAction === 'resize') {
                let finalEndDate = addDaysToDateString(initialEndDate, deltaDays);
                if (new Date(finalEndDate) < new Date(initialStartDate)) finalEndDate = initialStartDate;
                if (task && task.endDate !== finalEndDate) {
                    task.endDate = finalEndDate;
                    task.duration = diffDays(task.startDate, task.endDate);
                } else {
                    activeTaskBarEl.style.width = `${initialWidthPx}px`;
                }
            } else if (dragAction === 'move') {
                if (deltaDays !== 0) {
                    task.startDate = addDaysToDateString(initialStartDate, deltaDays);
                    task.endDate = addDaysToDateString(initialEndDate, deltaDays);
                }
            }
            dragAction = null; document.body.style.cursor = '';
            if (activeTaskBarEl) activeTaskBarEl.style.cursor = '';
            document.querySelectorAll('.task-row[draggable="true"]').forEach(row => row.removeAttribute('draggable'));
            dragTooltip.classList.add('hidden');
            
            renderGantt(); 
            recordHistory();
        });

        // --- 優化的拖曳與插入邏輯 ---
        function bindDragEvents() {
            const list = document.getElementById('tasks-list');
            
            list.addEventListener('dragstart', (e) => { 
                const row = e.target.closest('.task-row');
                if (!row) return;
                e.dataTransfer.setData('text/plain', row.dataset.id); 
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => row.style.opacity = '0.3', 0);
            });
            
            list.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const targetRow = e.target.closest('.task-row');
                if (!targetRow) return;

                // 判斷滑鼠是在目標列的上半部還是下半部
                const bounding = targetRow.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                
                // 動態添加拖曳插入的藍色指示線樣式
                if (e.clientY - offset > 0) {
                    targetRow.classList.add('drag-over-bottom');
                    targetRow.classList.remove('drag-over-top');
                } else {
                    targetRow.classList.add('drag-over-top');
                    targetRow.classList.remove('drag-over-bottom');
                }
            });

            list.addEventListener('dragleave', (e) => {
                const targetRow = e.target.closest('.task-row');
                if (targetRow) {
                    targetRow.classList.remove('drag-over-top', 'drag-over-bottom');
                }
            });

            list.addEventListener('drop', (e) => {
                e.preventDefault();
                const targetRow = e.target.closest('.task-row');
                
                // 清除指示線
                if (targetRow) {
                    targetRow.classList.remove('drag-over-top', 'drag-over-bottom');
                }

                if (!targetRow) return;
                const srcId = e.dataTransfer.getData('text/plain');
                if (!srcId) return;

                const srcIndex = tasks.findIndex(t => t.id == srcId);
                let targetIndex = tasks.findIndex(t => t.id == targetRow.dataset.id);

                if (srcIndex > -1 && targetIndex > -1 && srcIndex !== targetIndex) {
                    // 根據放置在上半部或下半部來決定插入位置
                    const bounding = targetRow.getBoundingClientRect();
                    const offset = bounding.y + (bounding.height / 2);
                    if (e.clientY - offset > 0) {
                        targetIndex++; // 放在下方，索引加1
                    }

                    // 取出來源任務
                    const [movedTask] = tasks.splice(srcIndex, 1);
                    
                    // 若來源任務原本在目標上方，因取出後陣列位移，需修正目標索引
                    if (srcIndex < targetIndex) {
                        targetIndex--;
                    }

                    // 插入任務
                    tasks.splice(targetIndex, 0, movedTask);
                    renderGantt();
                    recordHistory();
                }
            });

            list.addEventListener('dragend', (e) => {
                const row = e.target.closest('.task-row');
                if (row) { 
                    row.style.opacity = '1'; 
                    row.removeAttribute('draggable'); 
                }
                // 清理可能殘留的指示線樣式
                document.querySelectorAll('.task-row').forEach(r => {
                    r.classList.remove('drag-over-top', 'drag-over-bottom');
                });
            });
        }
        
        // 初始載入
        bindDateGuard('task-start', 'task-end');
        bindDateGuard('edit-task-start', 'edit-task-end');
        renderTemplateOptions();
        updatePredecessorOptions();
        renderCategories('task-category'); renderCategories('edit-task-category'); renderGantt();
        recordHistory();
    </script>
</body>
</html>
