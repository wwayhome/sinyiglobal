<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式心智圖工具</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-5YQY4RT9H2');
    </script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel 轉換 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 html2pdf.js 用於匯出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .node-input {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 100%;
            font-size: inherit;
            font-weight: inherit;
            color: inherit;
            cursor: text;
        }
        .canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        /* 隱藏捲軸 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 產生唯一 ID
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // 預設主題配色表
        const THEMES = [
            { id: 'default', root: 'bg-blue-600 text-white', child: 'bg-white border-slate-200 text-slate-800', line: '#94a3b8', inputRoot: 'text-white', inputChild: 'text-slate-800' },
            { id: 'forest', root: 'bg-emerald-600 text-white', child: 'bg-emerald-50 border-emerald-300 text-emerald-900', line: '#34d399', inputRoot: 'text-white', inputChild: 'text-emerald-900' },
            { id: 'sunset', root: 'bg-orange-500 text-white', child: 'bg-orange-50 border-orange-300 text-orange-900', line: '#fb923c', inputRoot: 'text-white', inputChild: 'text-orange-900' },
            { id: 'purple', root: 'bg-violet-600 text-white', child: 'bg-violet-50 border-violet-300 text-violet-900', line: '#a78bfa', inputRoot: 'text-white', inputChild: 'text-violet-900' },
            { id: 'rose', root: 'bg-rose-500 text-white', child: 'bg-rose-50 border-rose-300 text-rose-900', line: '#fb7185', inputRoot: 'text-white', inputChild: 'text-rose-900' },
            { id: 'midnight', root: 'bg-slate-800 text-white', child: 'bg-slate-100 border-slate-400 text-slate-800', line: '#64748b', inputRoot: 'text-white', inputChild: 'text-slate-800' },
            { id: 'ocean', root: 'bg-cyan-600 text-white', child: 'bg-cyan-50 border-cyan-300 text-cyan-900', line: '#22d3ee', inputRoot: 'text-white', inputChild: 'text-cyan-900' }
        ];

        // 預設初始資料
        const initialNodes = [
            { id: 'root', text: '中心主題', x: window.innerWidth / 2, y: window.innerHeight / 2, parentId: null }
        ];

        const Node = ({ node, isSelected, isDropTarget, isEditing, isDragging, onSelect, onDoubleClick, onChange, onDragStart, theme }) => {
            const nodeRef = useRef(null);
            
            useEffect(() => {
                if (isEditing && nodeRef.current) {
                    nodeRef.current.focus();
                    // 將游標移到最後
                    const val = nodeRef.current.value;
                    nodeRef.current.value = '';
                    nodeRef.current.value = val;
                }
            }, [isEditing]);

            const handlePointerDown = (e) => {
                e.stopPropagation(); // 防止觸發畫布拖曳
                if (!isEditing) {
                    onSelect(node.id);
                    onDragStart(e, node.id);
                }
            };

            const isRoot = node.parentId === null;

            return (
                <div
                    className={`absolute rounded-xl shadow-lg flex items-center justify-center transition-all duration-200
                        ${isDropTarget ? 'ring-4 ring-emerald-500 ring-opacity-80 scale-110 z-30 shadow-2xl' : isSelected ? 'ring-4 ring-blue-400 ring-opacity-50 z-20' : 'z-10 hover:shadow-xl'}
                        ${isDragging ? 'opacity-60 scale-105 ring-2 ring-dashed ring-slate-500 z-40 shadow-2xl' : ''}
                        ${isRoot ? `${theme.root} px-6 py-3 font-bold text-lg` : `${theme.child} border-2 px-4 py-2 font-medium`}
                    `}
                    style={{
                        left: node.x,
                        top: node.y,
                        transform: 'translate(-50%, -50%)',
                        minWidth: '100px',
                        cursor: isEditing ? 'text' : 'pointer',
                        touchAction: 'none'
                    }}
                    onPointerDown={handlePointerDown}
                    onDoubleClick={(e) => {
                        e.stopPropagation();
                        onDoubleClick(node.id);
                    }}
                >
                    {isEditing ? (
                        <input
                            ref={nodeRef}
                            className={`node-input ${isRoot ? theme.inputRoot : theme.inputChild}`}
                            value={node.text}
                            onChange={(e) => onChange(node.id, e.target.value)}
                            onBlur={() => onDoubleClick(null)} // 取消編輯狀態
                            onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    onDoubleClick(null); // 結束編輯
                                }
                            }}
                        />
                    ) : (
                        <div className="select-none text-center whitespace-pre-wrap w-full">
                            {node.text || ' '}
                        </div>
                    )}
                </div>
            );
        };

        const MindMapApp = () => {
            const [nodes, setNodes] = useState(initialNodes);
            const [selectedId, setSelectedId] = useState('root');
            const [editingId, setEditingId] = useState(null);
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const [currentTheme, setCurrentTheme] = useState(THEMES[0]);
            const [dropTargetId, setDropTargetId] = useState(null);
            const [layoutMode, setLayoutMode] = useState('right'); // 預設改為右側排列
            
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);

            // 使用 Ref 追蹤最新狀態，避免事件監聽器拿到舊資料
            const nodesRef = useRef(nodes);
            useEffect(() => { nodesRef.current = nodes; }, [nodes]);
            
            const transformRef = useRef(transform);
            useEffect(() => { transformRef.current = transform; }, [transform]);

            const layoutModeRef = useRef(layoutMode);
            useEffect(() => { layoutModeRef.current = layoutMode; }, [layoutMode]);
            
            const dropTargetIdRef = useRef(null);

            // 拖曳狀態
            const dragState = useRef({
                isDraggingCanvas: false,
                isDraggingNode: false,
                nodeId: null,
                startX: 0,
                startY: 0,
                initialTransform: { x: 0, y: 0 },
                initialNodePos: { x: 0, y: 0 }
            });

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3000);
            };

            const handlePointerDown = (e) => {
                if (editingId) setEditingId(null);
                
                dragState.current = {
                    isDraggingCanvas: true,
                    isDraggingNode: false,
                    nodeId: null,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialTransform: { ...transform },
                    initialNodePos: null
                };
                setSelectedId(null);
            };

            const handleNodeDragStart = (e, id) => {
                const node = nodes.find(n => n.id === id);
                if (!node) return;

                setDraggingNodeId(id);

                dragState.current = {
                    isDraggingCanvas: false,
                    isDraggingNode: true,
                    nodeId: id,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialTransform: null,
                    initialNodePos: { x: node.x, y: node.y }
                };
            };

            // 檢查節點階層 (避免循環依賴)
            const isDescendant = (childId, ancestorId) => {
                if (childId === ancestorId) return true;
                const node = nodesRef.current.find(n => n.id === childId);
                if (!node || node.parentId === null) return false;
                return isDescendant(node.parentId, ancestorId);
            };

            const handlePointerMove = (e) => {
                if (dragState.current.isDraggingCanvas) {
                    const dx = e.clientX - dragState.current.startX;
                    const dy = e.clientY - dragState.current.startY;
                    setTransform(prev => ({
                        ...prev,
                        x: dragState.current.initialTransform.x + dx,
                        y: dragState.current.initialTransform.y + dy
                    }));
                } else if (dragState.current.isDraggingNode) {
                    const currentTransform = transformRef.current;
                    const dx = (e.clientX - dragState.current.startX) / currentTransform.scale;
                    const dy = (e.clientY - dragState.current.startY) / currentTransform.scale;
                    
                    setNodes(prevNodes => prevNodes.map(node => 
                        node.id === dragState.current.nodeId
                            ? { ...node, x: dragState.current.initialNodePos.x + dx, y: dragState.current.initialNodePos.y + dy }
                            : node
                    ));

                    // 計算拖曳時是否靠近其他節點
                    const draggedId = dragState.current.nodeId;
                    const pointerCanvasX = (e.clientX - currentTransform.x) / currentTransform.scale;
                    const pointerCanvasY = (e.clientY - currentTransform.y) / currentTransform.scale;

                    let closestId = null;
                    let minDistance = 80;

                    nodesRef.current.forEach(n => {
                        if (n.id !== draggedId && !isDescendant(n.id, draggedId)) {
                            const dist = Math.sqrt(Math.pow(n.x - pointerCanvasX, 2) + Math.pow(n.y - pointerCanvasY, 2));
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestId = n.id;
                            }
                        }
                    });

                    if (dropTargetIdRef.current !== closestId) {
                        dropTargetIdRef.current = closestId;
                        setDropTargetId(closestId);
                    }
                }
            };

            const handlePointerUp = () => {
                if (dragState.current.isDraggingNode && dropTargetIdRef.current) {
                    const draggedId = dragState.current.nodeId;
                    const newParentId = dropTargetIdRef.current;
                    
                    const draggedNode = nodesRef.current.find(n => n.id === draggedId);
                    const newParent = nodesRef.current.find(n => n.id === newParentId);
                    
                    if (draggedNode && draggedNode.parentId !== null && newParent) {
                        // 1. 決定子節點方向
                        let direction = 1;
                        if (layoutModeRef.current === 'right') {
                            direction = 1; // 永遠向右
                        } else {
                            if (newParent.parentId === null) {
                                direction = draggedNode.x > newParent.x ? 1 : -1;
                            } else {
                                const rootNode = nodesRef.current.find(n => n.parentId === null);
                                direction = newParent.x >= (rootNode?.x || 0) ? 1 : -1;
                            }
                        }

                        // 2. 尋找目標父節點目前有多少子節點，計算新位置避免遮蓋
                        const siblings = nodesRef.current.filter(n => n.parentId === newParentId && n.id !== draggedId);
                        const VERTICAL_SPACING = 80;
                        const HORIZONTAL_SPACING = 280;
                        
                        const newX = newParent.x + (HORIZONTAL_SPACING * direction);
                        let newY = newParent.y;
                        if (siblings.length > 0) {
                            const maxSiblingY = Math.max(...siblings.map(s => s.y));
                            newY = maxSiblingY + VERTICAL_SPACING;
                        }

                        // 計算平移差值
                        const dx = newX - draggedNode.x;
                        const dy = newY - draggedNode.y;

                        // 3. 找出所有子孫節點一起平移
                        const getDescendants = (id, currentNodes) => {
                             const children = currentNodes.filter(n => n.parentId === id);
                             let desc = [...children];
                             children.forEach(c => {
                                 desc = [...desc, ...getDescendants(c.id, currentNodes)];
                             });
                             return desc;
                        };
                        const descendants = getDescendants(draggedId, nodesRef.current);
                        const descendantIds = descendants.map(d => d.id);

                        setNodes(prevNodes => prevNodes.map(n => {
                            if (n.id === draggedId) {
                                return { ...n, parentId: newParentId, x: newX, y: newY };
                            }
                            if (descendantIds.includes(n.id)) {
                                return { ...n, x: n.x + dx, y: n.y + dy };
                            }
                            return n;
                        }));
                        showToast('已更新心智圖架構', 'success');
                    }
                }

                dragState.current.isDraggingCanvas = false;
                dragState.current.isDraggingNode = false;
                dragState.current.nodeId = null;
                
                setDraggingNodeId(null);
                dropTargetIdRef.current = null;
                setDropTargetId(null);
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const zoomSensitivity = 0.001;
                const delta = -e.deltaY * zoomSensitivity;
                let newScale = transform.scale * (1 + delta);
                newScale = Math.max(0.2, Math.min(newScale, 3));
                setTransform(prev => ({ ...prev, scale: newScale }));
            };

            useEffect(() => {
                const container = containerRef.current;
                if (container) {
                    container.addEventListener('wheel', handleWheel, { passive: false });
                }
                window.addEventListener('pointermove', handlePointerMove);
                window.addEventListener('pointerup', handlePointerUp);
                
                return () => {
                    if (container) {
                        container.removeEventListener('wheel', handleWheel);
                    }
                    window.removeEventListener('pointermove', handlePointerMove);
                    window.removeEventListener('pointerup', handlePointerUp);
                };
            }, [transform.scale]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (editingId) return;
                    if (!selectedId) return;

                    if (e.key === 'Tab') {
                        e.preventDefault();
                        addChildNode(selectedId);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        addSiblingNode(selectedId);
                    } else if (e.key === 'Delete' || e.key === 'Backspace') {
                        e.preventDefault();
                        deleteNode(selectedId);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedId, editingId, nodes, layoutMode]);

            const addChildNode = (parentId) => {
                const parent = nodes.find(n => n.id === parentId);
                if (!parent) return;

                const newId = generateId();
                const childrenCount = nodes.filter(n => n.parentId === parentId).length;
                
                let direction = 1; // 預設向右
                if (layoutMode === 'both') {
                    const rootNode = nodes.find(n => n.parentId === null);
                    if (parent.parentId === null) {
                        direction = childrenCount % 2 === 0 ? 1 : -1; // 左右交錯
                    } else {
                        direction = parent.x >= (rootNode?.x || 0) ? 1 : -1; // 繼承方向
                    }
                }
                
                const newNode = {
                    id: newId,
                    text: '新節點',
                    x: parent.x + (280 * direction),
                    y: parent.y + (childrenCount * 80),
                    parentId: parentId
                };

                setNodes(prev => [...prev, newNode]);
                setSelectedId(newId);
                setEditingId(newId);
            };

            const addSiblingNode = (nodeId) => {
                const node = nodes.find(n => n.id === nodeId);
                if (!node || node.parentId === null) {
                    if (node && node.parentId === null) addChildNode(nodeId);
                    return;
                }

                const siblingCount = nodes.filter(n => n.parentId === node.parentId).length;
                const newId = generateId();
                const newNode = {
                    id: newId,
                    text: '新節點',
                    x: node.x,
                    y: node.y + 80,
                    parentId: node.parentId
                };

                setNodes(prev => [...prev, newNode]);
                setSelectedId(newId);
                setEditingId(newId);
            };

            const deleteNode = (nodeId) => {
                const nodeToDelete = nodes.find(n => n.id === nodeId);
                if (!nodeToDelete || nodeToDelete.parentId === null) {
                    showToast('無法刪除中心主題', 'error');
                    return;
                }

                const getChildrenIds = (id) => {
                    const children = nodes.filter(n => n.parentId === id).map(n => n.id);
                    let allChildren = [...children];
                    children.forEach(childId => {
                        allChildren = [...allChildren, ...getChildrenIds(childId)];
                    });
                    return allChildren;
                };

                const idsToDelete = [nodeId, ...getChildrenIds(nodeId)];
                setNodes(prev => prev.filter(n => !idsToDelete.includes(n.id)));
                setSelectedId(nodeToDelete.parentId);
            };

            const handleNodeTextChange = (id, newText) => {
                setNodes(prev => prev.map(n => n.id === id ? { ...n, text: newText } : n));
            };

            const handleSave = () => {
                const data = JSON.stringify(nodes, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mindmap-${new Date().getTime()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('心智圖已儲存為 JSON 檔案', 'success');
            };

            const handleLoad = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedNodes = JSON.parse(event.target.result);
                        if (Array.isArray(parsedNodes) && parsedNodes.length > 0 && parsedNodes[0].id === 'root') {
                            setNodes(parsedNodes);
                            setTransform({ x: 0, y: 0, scale: 1 });
                            showToast('成功讀取心智圖', 'success');
                        } else {
                            throw new Error('格式不正確');
                        }
                    } catch (error) {
                        showToast('讀取失敗，檔案格式錯誤', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // 修復版 PDF 匯出功能
            const handleExportPDF = () => {
                showToast('正在準備匯出 PDF...', 'info');
                const element = document.getElementById('export-container');
                
                const originalSelectedId = selectedId;
                const originalTransform = transform;
                setSelectedId(null);
                setEditingId(null);
                
                // 計算整張圖的真實邊界
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodesRef.current.forEach(n => {
                    if (n.x < minX) minX = n.x;
                    if (n.y < minY) minY = n.y;
                    if (n.x > maxX) maxX = n.x;
                    if (n.y > maxY) maxY = n.y;
                });
                
                const padding = 100;
                const width = maxX - minX + padding * 2;
                const height = maxY - minY + padding * 2;
                
                // 為了截圖，強迫將畫布平移到視窗左上角(0,0) 並取消縮放
                setTransform({
                    x: -minX + padding,
                    y: -minY + padding,
                    scale: 1
                });

                // 給 React 一點時間重新渲染 DOM
                setTimeout(() => {
                    const opt = {
                        margin:       10,
                        filename:     `mindmap-${new Date().getTime()}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { 
                            scale: 2, 
                            useCORS: true, 
                            logging: false,
                            width: width,
                            height: height,
                            windowWidth: width,
                            windowHeight: height
                        },
                        jsPDF:        { unit: 'px', format: [width + 20, height + 20], orientation: width > height ? 'landscape' : 'portrait' }
                    };

                    html2pdf().set(opt).from(element).save().then(() => {
                        setTransform(originalTransform);
                        setSelectedId(originalSelectedId);
                        showToast('匯出 PDF 完成', 'success');
                    }).catch(err => {
                        console.error(err);
                        setTransform(originalTransform);
                        setSelectedId(originalSelectedId);
                        showToast('匯出 PDF 失敗', 'error');
                    });
                }, 800);
            };

            const resetView = () => {
                const rootNode = nodes.find(n => n.parentId === null);
                if (rootNode) {
                    setTransform({
                        x: window.innerWidth / 2 - rootNode.x,
                        y: window.innerHeight / 2 - rootNode.y,
                        scale: 1
                    });
                } else {
                    setTransform({ x: 0, y: 0, scale: 1 });
                }
            };

            const handleRandomTheme = () => {
                const availableThemes = THEMES.filter(t => t.id !== currentTheme.id);
                const randomTheme = availableThemes[Math.floor(Math.random() * availableThemes.length)];
                setCurrentTheme(randomTheme);
            };

            const toggleLayoutMode = () => {
                const newMode = layoutMode === 'right' ? 'both' : 'right';
                setLayoutMode(newMode);
                handleAutoLayout(newMode);
                showToast(`已切換為${newMode === 'right' ? '右側' : '左右'}排列`, 'success');
            };

            // 雙模式自動排列演算法
            const handleAutoLayout = (forceMode) => {
                const activeMode = typeof forceMode === 'string' ? forceMode : layoutMode;

                setNodes(prevNodes => {
                    const newNodes = prevNodes.map(n => ({ ...n }));
                    const childrenMap = {};
                    
                    newNodes.forEach(n => {
                        if (n.parentId) {
                            if (!childrenMap[n.parentId]) childrenMap[n.parentId] = [];
                            childrenMap[n.parentId].push(n.id);
                        }
                    });

                    const rootNode = newNodes.find(n => n.parentId === null);
                    if (!rootNode) return prevNodes;

                    const HORIZONTAL_SPACING = 280;
                    const VERTICAL_SPACING = 80;

                    const rootChildren = childrenMap[rootNode.id] || [];
                    
                    const rightChildren = activeMode === 'right'
                        ? rootChildren
                        : rootChildren.filter((_, index) => index % 2 === 0);
                        
                    const leftChildren = activeMode === 'right'
                        ? []
                        : rootChildren.filter((_, index) => index % 2 === 1);

                    const calculateSubtreeHeight = (nodeId) => {
                        const children = childrenMap[nodeId] || [];
                        if (children.length === 0) return VERTICAL_SPACING;
                        return children.reduce((sum, childId) => sum + calculateSubtreeHeight(childId), 0);
                    };

                    const positionSubtree = (nodeId, startX, startY, direction) => {
                        const node = newNodes.find(n => n.id === nodeId);
                        if (!node) return 0;

                        const children = childrenMap[nodeId] || [];
                        const subtreeHeight = calculateSubtreeHeight(nodeId);
                        
                        node.x = startX;
                        node.y = startY + subtreeHeight / 2;

                        let currentChildStartY = startY;
                        const nextX = startX + (HORIZONTAL_SPACING * direction);
                        
                        children.forEach(childId => {
                            const childHeight = calculateSubtreeHeight(childId);
                            positionSubtree(childId, nextX, currentChildStartY, direction);
                            currentChildStartY += childHeight;
                        });

                        return subtreeHeight;
                    };

                    let rightTotalHeight = rightChildren.reduce((sum, id) => sum + calculateSubtreeHeight(id), 0);
                    let currentRightY = rootNode.y - rightTotalHeight / 2;
                    rightChildren.forEach(childId => {
                        const h = calculateSubtreeHeight(childId);
                        positionSubtree(childId, rootNode.x + HORIZONTAL_SPACING, currentRightY, 1);
                        currentRightY += h;
                    });

                    let leftTotalHeight = leftChildren.reduce((sum, id) => sum + calculateSubtreeHeight(id), 0);
                    let currentLeftY = rootNode.y - leftTotalHeight / 2;
                    leftChildren.forEach(childId => {
                        const h = calculateSubtreeHeight(childId);
                        positionSubtree(childId, rootNode.x - HORIZONTAL_SPACING, currentLeftY, -1);
                        currentLeftY += h;
                    });

                    return newNodes;
                });
                if(typeof forceMode !== 'string') showToast('已重新整齊排列節點', 'success');
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const renderConnections = () => {
                const lines = nodes.map(node => {
                    if (node.parentId === null) return null;
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (!parent) return null;

                    const isDraggedNode = node.id === draggingNodeId;
                    if (isDraggedNode && dropTargetId) return null;

                    const dx = node.x - parent.x;
                    const path = `M ${parent.x} ${parent.y} 
                                  C ${parent.x + dx/2} ${parent.y}, 
                                    ${node.x - dx/2} ${node.y}, 
                                    ${node.x} ${node.y}`;

                    return (
                        <path
                            key={`line-${node.id}`}
                            d={path}
                            fill="none"
                            stroke={currentTheme.line}
                            strokeWidth="3"
                            opacity={isDraggedNode ? 0.2 : 1}
                            strokeDasharray={isDraggedNode ? "5,5" : "none"}
                            className="transition-all duration-200"
                        />
                    );
                });

                // 拖曳預覽線
                if (draggingNodeId && dropTargetId) {
                    const target = nodes.find(n => n.id === dropTargetId);
                    const dragged = nodes.find(n => n.id === draggingNodeId);
                    if (target && dragged) {
                        const dx = dragged.x - target.x;
                        const path = `M ${target.x} ${target.y} 
                                      C ${target.x + dx/2} ${target.y}, 
                                        ${dragged.x - dx/2} ${dragged.y}, 
                                        ${dragged.x} ${dragged.y}`;
                        
                        lines.push(
                            <path
                                key="preview-line"
                                d={path}
                                fill="none"
                                stroke={currentTheme.line}
                                strokeWidth="4"
                                strokeDasharray="8,8"
                                opacity="0.6"
                                className="animate-pulse"
                            />
                        );
                    }
                }

                return lines;
            };

            return (
                <div className="relative w-screen h-screen overflow-hidden bg-slate-50 font-sans">
                    {/* 工具列 */}
                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm shadow-md px-6 py-3 rounded-full flex gap-4 z-50 items-center border border-slate-200">
                        <button onClick={handleSave} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors" title="儲存為 JSON">
                            <i data-lucide="save" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">儲存</span>
                        </button>
                        
                        <div className="w-px h-5 bg-slate-300"></div>
                        
                        <label className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors cursor-pointer" title="讀取 JSON">
                            <i data-lucide="folder-open" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">讀取</span>
                            <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleLoad} />
                        </label>
                        
                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={handleExportPDF} className="flex items-center gap-2 text-slate-700 hover:text-red-600 transition-colors" title="匯出為 PDF">
                            <i data-lucide="file-down" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">PDF匯出</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={handleRandomTheme} className="flex items-center gap-2 text-slate-700 hover:text-purple-600 transition-colors" title="隨機配色">
                            <i data-lucide="palette" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">隨機配色</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={toggleLayoutMode} className="flex items-center gap-2 text-slate-700 hover:text-orange-600 transition-colors" title="切換排列模式">
                            <i data-lucide={layoutMode === 'right' ? 'align-left' : 'align-center'} className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">{layoutMode === 'right' ? '右側排列' : '左右排列'}</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={() => handleAutoLayout()} className="flex items-center gap-2 text-slate-700 hover:text-emerald-600 transition-colors" title="一鍵排列">
                            <i data-lucide="network" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">自動排列</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={resetView} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors" title="重置視角">
                            <i data-lucide="maximize" className="w-5 h-5"></i>
                        </button>
                    </div>

                    {/* 操作提示 */}
                    <div className="absolute bottom-4 left-4 bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow border border-slate-200 z-50 text-xs text-slate-600 space-y-1 pointer-events-none">
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">雙擊</kbd> 編輯文字</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Tab</kbd> 新增子節點</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Enter</kbd> 新增同層節點</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Del</kbd> 刪除節點與分支</p>
                        <p>💡 拖曳節點可轉移連接。右側或左右交錯排列可於上方切換。</p>
                    </div>

                    {/* 提示訊息 */}
                    {toast.show && (
                        <div className={`absolute top-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-lg z-50 text-sm font-medium text-white transition-all duration-300 ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            {toast.message}
                        </div>
                    )}

                    {/* 畫布區域 */}
                    <div 
                        className="canvas-container"
                        ref={containerRef}
                        onPointerDown={handlePointerDown}
                        style={{
                            backgroundSize: '40px 40px',
                            backgroundImage: 'radial-gradient(circle, #cbd5e1 1px, transparent 1px)',
                            backgroundPosition: `${transform.x}px ${transform.y}px`
                        }}
                    >
                        <div 
                            id="export-container"
                            style={{
                                transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`,
                                transformOrigin: '0 0',
                                width: '100%',
                                height: '100%',
                                position: 'absolute',
                                top: 0,
                                left: 0
                            }}
                        >
                            {/* SVG 連線層 */}
                            <svg className="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none">
                                {renderConnections()}
                            </svg>

                            {/* 節點層 */}
                            {nodes.map(node => (
                                <Node
                                    key={node.id}
                                    node={node}
                                    isSelected={selectedId === node.id}
                                    isDropTarget={dropTargetId === node.id}
                                    isEditing={editingId === node.id}
                                    isDragging={draggingNodeId === node.id}
                                    onSelect={setSelectedId}
                                    onDoubleClick={(id) => setEditingId(id)}
                                    onChange={handleNodeTextChange}
                                    onDragStart={handleNodeDragStart}
                                    theme={currentTheme}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MindMapApp />);

        // 初始化圖示
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
