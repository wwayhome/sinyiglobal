<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建物清冊系統</title>
    <!-- Google Fonts: Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: { primary: '#2563eb', secondary: '#475569' }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { background-color: #f8fafc; }
        
        /* 隱藏欄位用的 class */
        .hide-col { display: none !important; }
        
        /* 編輯區表格樣式 (優化捲動與框線) */
        .table-container { max-height: calc(100vh - 450px); overflow: auto; }
        .pub-table-container { overflow-x: auto; }
        
        #inputTable, #pubTable, .pub-table { border-collapse: separate; border-spacing: 0; }
        #inputTable th, #pubTable th, .pub-table th { 
            position: sticky; top: 0; 
            background: rgba(241, 245, 249, 0.95); 
            backdrop-filter: blur(4px);
            z-index: 10; 
            border-bottom: 2px solid #cbd5e1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        #inputTable td, #pubTable td, .pub-table td { border-bottom: 1px solid #e2e8f0; }
        #inputTable tbody tr:hover { background-color: #f1f5f9; }
        
        /* 主檔選擇狀態 (Active Row) */
        .active-row { background-color: #eff6ff !important; }
        .active-row td { border-top: 1px solid #bfdbfe; border-bottom: 1px solid #bfdbfe; }
        .active-indicator { width: 4px; height: 100%; background-color: #3b82f6; position: absolute; left: 0; top: 0; display: none; }
        .active-row .active-indicator { display: block; }
        
        .drag-handle { cursor: grab; transition: color 0.2s; }
        .drag-handle:hover { color: #64748b; }
        .drag-handle:active { cursor: grabbing; }

        /* 輸入框通用樣式 (精緻化) */
        .input-cell {
            width: 100%; border: 1px solid transparent; padding: 6px 8px; border-radius: 6px; 
            transition: all 0.2s ease; background-color: #fef9c3; height: 36px;
            font-size: 0.875rem; color: #334155;
        }
        .input-cell:focus {
            border-color: #eab308; outline: none; background-color: white; 
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15);
        }
        .input-cell:hover:not(:focus) { border-color: #fde047; background-color: #fffbeb; }
        .attached-detail-grid .input-cell {
            height: 30px;
            padding: 4px 6px;
            font-size: 0.8125rem;
        }
        .attached-detail-grid .attached-type-input,
        .attached-detail-grid .attached-area-input {
            width: 92px;
        }
        
        /* 錯誤警示框 */
        .input-error { 
            border-color: #ef4444 !important; background-color: #fef2f2 !important; 
            color: #b91c1c !important;
        }
        .input-error:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important; }
        .readonly-text { font-variant-numeric: tabular-nums; }

        /* 輸出區純文字表格美化樣式 (高質感列印風格) */
        .output-table {
            width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; 
            margin-bottom: 24px; color: #1e293b;
            border: 2px solid #cbd5e1;
        }
        .output-table th, .output-table td {
            border: 1px solid #cbd5e1; padding: 10px 12px;
        }
        .output-table th { 
            background-color: #f8fafc; color: #0f172a; font-weight: 700; 
            border-bottom: 2px solid #cbd5e1;
        }
        .output-table tr:nth-child(even) td { background-color: #fbfcfd; }
        .output-table .text-right { text-align: right; }
        .output-table .text-left { text-align: left; }
        .output-table .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 隱藏特定數字輸入框的上下微調箭頭 */
        .hide-spin::-webkit-outer-spin-button,
        .hide-spin::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .hide-spin {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- 頂部導覽與工具列 -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 flex-shrink-0 border-b border-slate-200" id="main-header">
        <div class="max-w-[1600px] mx-auto px-6 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 text-primary p-2 rounded-lg">
                    <i class="ph-fill ph-buildings text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">建物清冊系統</h1>
            </div>

            <!-- 工具按鈕區 -->
            <div class="flex items-center gap-2 text-sm flex-wrap">
                <button onclick="exportJSON()" class="flex items-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3.5 py-2 rounded-lg font-medium transition active:scale-95">
                    <i class="ph ph-floppy-disk text-lg"></i> 儲存專案
                </button>
                <label class="flex items-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3.5 py-2 rounded-lg font-medium transition cursor-pointer active:scale-95">
                    <i class="ph ph-folder-open text-lg"></i> 讀取專案
                    <input type="file" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
                <div class="h-6 w-px bg-slate-300 mx-1 hidden sm:block"></div>
                <button onclick="clearAllData()" class="flex items-center gap-1.5 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3.5 py-2 rounded-lg font-medium transition active:scale-95">
                    <i class="ph ph-trash text-lg"></i> 清空
                </button>
            </div>
        </div>

        <!-- 第二層：顯示設定列 -->
        <div class="max-w-[1600px] mx-auto px-6 py-2.5 bg-slate-50 border-t border-slate-200 flex flex-wrap gap-4 text-sm items-center">
            <!-- 顯示欄位控制 -->
            <div class="flex items-center bg-slate-200/50 p-1.5 rounded-lg border border-slate-200 shadow-inner overflow-x-auto w-full sm:w-auto">
                <span class="font-semibold text-slate-600 text-sm px-3 flex items-center gap-1.5 whitespace-nowrap"><i class="ph-fill ph-columns text-slate-400 text-base"></i> 顯示欄位：</span>
                <div class="flex items-center gap-1.5 whitespace-nowrap">
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('district', this.checked)" class="accent-primary w-4 h-4 rounded"> 行政區
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('doorplate', this.checked)" checked class="accent-primary w-4 h-4 rounded"> 門牌
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('section', this.checked)" class="accent-primary w-4 h-4 rounded"> 地段
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('useType', this.checked)" class="accent-primary w-4 h-4 rounded"> 主要用途
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('owner', this.checked)" class="accent-primary w-4 h-4 rounded"> 所有權人
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('privateShare', this.checked)" class="accent-primary w-4 h-4 rounded"> 專有持分
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                        <input type="checkbox" onchange="toggleColumn('remarks', this.checked)" class="accent-primary w-4 h-4 rounded"> 備註
                    </label>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-6 max-w-[1600px] mx-auto w-full flex flex-col gap-6" id="main-content">
        <!-- 上半部：主建物輸入區塊 -->
        <section class="flex flex-col gap-2">
            <div class="flex items-center gap-2 mb-1">
                <i class="ph-fill ph-pencil-simple text-2xl text-slate-400"></i>
                <h2 class="text-xl font-bold text-slate-800">1. 建物主檔編輯區</h2>
                <span class="text-sm text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full ml-2">黃色底色為可輸入欄位，點擊列可於下方編輯公設</span>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="table-container relative">
                    <table class="w-full text-left whitespace-nowrap" id="inputTable">
                        <thead class="text-sm text-slate-600 tracking-wide">
                            <tr>
                                <th class="py-3 px-3 w-10 text-center"></th>
                                <th class="py-3 px-3 w-12 text-center">項次</th>
                                <th class="py-3 px-3 w-28 col-district">行政區</th>
                                <th class="py-3 px-3 w-44 col-doorplate">門牌</th>
                                <th class="py-3 px-3 w-36 cursor-pointer hover:bg-slate-200/60 transition select-none group col-section" onclick="sortTable('section')" title="點擊依段排序">
                                    <div class="flex items-center gap-1">段 <i id="sort-icon-section" class="ph-fill ph-caret-up text-slate-300 group-hover:text-slate-400 transition"></i></div>
                                </th>
                                <th class="py-3 px-3 w-36 cursor-pointer hover:bg-slate-200/60 transition select-none group" onclick="sortTable('buildNo')" title="點擊依建號排序">
                                    <div class="flex items-center gap-1 text-primary font-bold">主建號 <i id="sort-icon-buildNo" class="ph-fill ph-caret-up text-blue-300 group-hover:text-blue-500 transition"></i></div>
                                </th>
                                <th class="py-3 px-3 w-32 col-useType">主要用途</th>
                                <th class="py-3 px-3 w-32 text-right">主建物面積(㎡)</th>
                                <th class="py-3 px-3 w-56 text-left">附屬建物明細(㎡)</th>
                                <th class="py-3 px-3 w-32 text-right">附屬總面積(㎡)</th>
                                <th class="py-3 px-3 w-36 col-owner">所有權人</th>
                                <th class="py-3 px-3 text-center col-privateShare" colspan="3" title="指專有部分之持分">專有持分</th>
                                <th class="py-3 px-3 w-32 text-right">公設面積(㎡)</th>
                                <th class="py-3 px-3 w-32 text-right">總面積(㎡)</th>
                                <th class="py-3 px-3 w-48 col-remarks">備註</th>
                                <th class="py-3 px-2 text-center action-col" style="width:56px; min-width:56px; max-width:56px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="input-table-body" class="text-sm text-slate-700">
                            <!-- 輸入列由 JS 動態生成 -->
                        </tbody>
                        <tfoot id="input-table-foot" class="bg-indigo-50/95 border-t-[3px] border-indigo-200 text-indigo-900 font-bold sticky bottom-0 z-20 backdrop-blur-md shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]"></tfoot>
                    </table>
                </div>
            </div>

            <div class="flex gap-3 mt-1">
                <button onclick="duplicateLastRow()" class="flex items-center gap-1.5 bg-white hover:bg-indigo-50 text-indigo-600 px-5 py-2.5 rounded-lg shadow-sm border border-slate-200 transition font-medium active:scale-95" title="複製最後一筆資料">
                    <i class="ph ph-copy text-lg"></i> 複製最後一筆
                </button>
                <button onclick="addNewRow()" class="flex items-center gap-1.5 bg-primary hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg shadow-md transition font-medium active:scale-95">
                    <i class="ph ph-plus text-lg text-white"></i> 新增主建物
                </button>
            </div>
        </section>

        <!-- 中間部：公設明細編輯區 (Master-Detail 聯動區) -->
        <section class="flex flex-col gap-2 bg-slate-100 rounded-xl p-4 border border-slate-300 shadow-inner relative overflow-hidden" id="pub-facility-section">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-circles-three-plus text-2xl text-blue-600"></i>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        2. 公設明細編輯區 
                    </h2>
                </div>
            </div>

            <div id="pub-groups-wrapper" class="flex flex-col gap-4">
                <!-- 每筆主建物的公設明細由 JS 動態生成 -->
            </div>
        </section>

        <!-- 下半部：美觀成果輸出區塊 -->
        <section class="flex flex-col gap-3 border-t border-slate-200 pt-8 mt-4">
            <div class="flex flex-wrap items-center justify-between mb-4 gap-4">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-printer text-2xl text-primary"></i>
                    <h2 class="text-xl font-bold text-slate-800">3. 報表輸出區</h2>
                    <span class="text-sm text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full ml-2 hidden sm:inline-block">點選各報表右上角進行獨立輸出</span>
                </div>
                
                <div class="flex flex-wrap items-center gap-3">
                    <!-- 產出單位 -->
                    <div class="flex items-center bg-slate-200/50 p-1.5 rounded-lg border border-slate-200 shadow-inner">
                        <span class="font-semibold text-slate-600 text-sm px-3 flex items-center gap-1.5"><i class="ph-fill ph-ruler text-slate-400 text-base"></i> 產出單位：</span>
                        <div class="flex items-center gap-1.5">
                            <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                                <input type="radio" name="areaMode" value="sqm" checked onchange="changeAreaMode(this.value)" class="accent-primary w-4 h-4"> 平方公尺
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-slate-700 font-medium">
                                <input type="radio" name="areaMode" value="ping" onchange="changeAreaMode(this.value)" class="accent-primary w-4 h-4"> 坪
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-md shadow-sm border border-slate-200 hover:border-primary hover:text-primary transition text-primary font-bold">
                                <input type="radio" name="areaMode" value="both" onchange="changeAreaMode(this.value)" class="accent-primary w-4 h-4"> 兩者並列
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 這個容器是各表包裹的框架 -->
            <div id="output-tables-wrapper" class="flex flex-col gap-8">
                <!-- 獨立的美觀表格（含對應操作按鈕）將由 JS 動態生成 -->
            </div>
        </section>
    </main>

    <script>
        // --- Custom Alert & Confirm ---
        window.customAlert = function(msg) {
            const toastId = 'toast-' + Date.now();
            const toast = document.createElement('div');
            toast.id = toastId;
            toast.className = 'fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-lg shadow-xl z-[100] transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-3 font-medium';
            toast.innerHTML = `<i class="ph-fill ph-info text-blue-400 text-xl"></i> ${msg}`;
            document.body.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.customConfirm = function(msg, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] opacity-0 transition-opacity duration-300';
            
            const box = document.createElement('div');
            box.className = 'bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300';
            box.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
                        <i class="ph-fill ph-warning-circle text-red-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">確認操作</h3>
                </div>
                <p class="mb-8 text-slate-600 leading-relaxed">${msg}</p>
                <div class="flex justify-end gap-3">
                    <button class="btn-cancel px-5 py-2.5 bg-slate-100 rounded-lg text-slate-700 hover:bg-slate-200 transition font-medium">取消</button>
                    <button class="btn-confirm px-5 py-2.5 bg-primary rounded-lg text-white hover:bg-blue-700 transition font-medium shadow-md shadow-blue-500/20">確定執行</button>
                </div>
            `;
            overlay.appendChild(box);
            document.body.appendChild(overlay);

            requestAnimationFrame(() => { overlay.classList.remove('opacity-0'); box.classList.remove('scale-95'); });

            const close = () => {
                overlay.classList.add('opacity-0'); box.classList.add('scale-95');
                setTimeout(() => overlay.remove(), 300);
            };

            box.querySelector('.btn-cancel').onclick = close;
            box.querySelector('.btn-confirm').onclick = () => { close(); setTimeout(onConfirm, 100); };
        };

        // --- 核心狀態管理 ---
        let state = {
            data: [], 
            activeRowId: null, // 用於記錄目前在下方編輯公設的列
            areaMode: 'sqm', 
            hiddenCols: new Set(['district', 'section', 'useType', 'remarks', 'owner', 'privateShare']), // 預設隱藏
            sortKey: null, 
            sortAsc: true  
        };

        const PING_RATIO = 0.3025;

        // 防呆輔助：全形轉半形
        function toHalfWidth(str) {
            if (str == null) return '';
            return String(str).replace(/[\uff01-\uff5e]/g, function(ch) {
                return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
            }).replace(/\u3000/g, ' ');
        }

        function init() {
            if (state.data.length === 0) addNewRow(); 
            updateSortIcons();
            renderInputTable();
            renderPubFacilityTable();
            renderOutputTables();
            initSortable();
            setupBeforeUnload();
        }

        // --- 排序功能 ---
        function sortTable(key) {
            if (state.sortKey === key) { state.sortAsc = !state.sortAsc; } 
            else { state.sortKey = key; state.sortAsc = true; }

            state.data.sort((a, b) => {
                let valA = (a[key] || '').toString();
                let valB = (b[key] || '').toString();
                let comparison = valA.localeCompare(valB, 'zh-TW', { numeric: true });
                return state.sortAsc ? comparison : -comparison;
            });

            updateSortIcons();
            triggerUpdate();
        }

        function updateSortIcons() {
            const keys = ['section', 'buildNo'];
            keys.forEach(k => {
                const iconEl = document.getElementById(`sort-icon-${k}`);
                if (iconEl) {
                    if (state.sortKey === k) iconEl.className = state.sortAsc ? 'ph-fill ph-caret-up text-primary drop-shadow-sm' : 'ph-fill ph-caret-down text-primary drop-shadow-sm';
                    else iconEl.className = 'ph-fill ph-caret-up text-slate-300 group-hover:text-slate-400 transition';
                }
            });
        }

        // --- 資料操作邏輯 ---
        function generateId() { return Date.now().toString() + Math.random().toString(36).substr(2, 5); }

        function createEmptyRow() {
            return {
                id: generateId(), district: '', doorplate: '', section: '', buildNo: '', useType: '', 
                mainArea: '', attachedArea: '', attachedType1: '', attachedArea1: '', attachedType2: '', attachedArea2: '',
                owner: '', numerator: 1, denominator: 1, remarks: '',
                publicFacilities: [] // 公設清單
            };
        }

        function createEmptyPubFacility() {
            return { id: generateId(), pubBuildNo: '', pubUseType: '', totalArea: '', numerator: 1, denominator: 1 };
        }

        function setActiveRow(id) {
            if (state.activeRowId === id) return;
            state.activeRowId = id;
            
            // UI 更新標記
            document.querySelectorAll('#input-table-body tr').forEach(tr => {
                if(tr.dataset.id === id) tr.classList.add('active-row');
                else tr.classList.remove('active-row');
            });

            renderPubFacilityTable();
        }

        function addNewRow() {
            const newRow = createEmptyRow();
            state.data.push(newRow);
            setActiveRow(newRow.id); // 自動選中新增的列
            triggerUpdate();
            
            setTimeout(() => { 
                const tr = document.querySelector(`tr[data-id="${newRow.id}"]`);
                if(tr) tr.querySelector('input[data-field="buildNo"]')?.focus();
            }, 50);
        }

        function duplicateLastRow() {
            if (state.data.length === 0) { addNewRow(); return; }
            const prevRow = state.data[state.data.length - 1];
            const newRow = createEmptyRow();
            
            Object.keys(prevRow).forEach(key => {
                if(key !== 'id' && key !== 'publicFacilities') newRow[key] = prevRow[key];
            });
            newRow.buildNo = '';
            newRow.publicFacilities = prevRow.publicFacilities.map(pub => ({...pub, id: generateId()}));
            
            state.data.push(newRow);
            setActiveRow(newRow.id);
            triggerUpdate();
            
            setTimeout(() => { 
                const tr = document.querySelector('#input-table-body tr:last-child');
                if(tr) tr.querySelector('input[data-field="buildNo"]')?.focus(); 
            }, 50);
        }

        function deleteRow(id) {
            state.data = state.data.filter(row => row.id !== id);
            if (state.activeRowId === id) {
                state.activeRowId = state.data.length > 0 ? state.data[0].id : null;
            }
            if (state.data.length === 0) addNewRow();
            triggerUpdate();
        }

        function clearAllData() {
            customConfirm("確定要清空所有資料嗎？此動作無法復原。", () => {
                state.data = [];
                state.activeRowId = null;
                addNewRow();
                triggerUpdate();
            });
        }

        // --- 公設操作邏輯 ---
        function addPubFacility(rowId) {
            const row = state.data.find(r => r.id === rowId);
            if(row) {
                row.publicFacilities.push(createEmptyPubFacility());
                renderPubFacilityTable();
                updateInputCalculationsAndUI();
                renderOutputTables();
                
                setTimeout(() => { 
                    const inputs = document.querySelectorAll(`.pub-build-group[data-row-id="${rowId}"] tbody tr:last-child input`);
                    if(inputs.length > 0) inputs[0].focus();
                }, 50);
            }
        }

        function deletePubFacility(rowId, pubId) {
            const row = state.data.find(r => r.id === rowId);
            if(row) {
                row.publicFacilities = row.publicFacilities.filter(p => p.id !== pubId);
                renderPubFacilityTable();
                updateInputCalculationsAndUI();
                renderOutputTables();
            }
        }

        // --- 集中更新處理 ---
        function triggerUpdate() {
            renderInputTable();
            renderPubFacilityTable();
            renderOutputTables();
        }

        // 主表輸入事件監聽
        document.getElementById('input-table-body').addEventListener('input', (e) => {
            if(e.target.tagName !== 'INPUT') return;
            const tr = e.target.closest('tr');
            if (!tr) return;
            
            const id = tr.dataset.id;
            const field = e.target.dataset.field;
            const row = state.data.find(r => r.id === id);
            
            if (row && field) {
                let value = e.target.value;

                if (['doorplate', 'buildNo', 'mainArea', 'attachedArea', 'attachedType1', 'attachedArea1', 'attachedType2', 'attachedArea2', 'numerator', 'denominator'].includes(field)) {
                    value = toHalfWidth(value).trim();
                    if (e.target.value !== value && value !== '') e.target.value = value;
                }

                if (field === 'section') {
                    value = value.replace(/段$/, '');
                    if (e.target.value !== value) e.target.value = value;
                }

                if (['mainArea', 'attachedArea', 'attachedArea1', 'attachedArea2', 'numerator', 'denominator'].includes(field)) {
                    let numVal = Number(value);
                    if (numVal < 0) {
                        numVal = Math.abs(numVal);
                        e.target.value = numVal;
                        value = numVal;
                    }
                    value = value === '' ? '' : numVal;
                }
                row[field] = value;
                
                // 如果修改建號或門牌，同步更新下方公設區的標題
                if(field === 'buildNo' || field === 'doorplate') {
                    const group = document.querySelector(`.pub-build-group[data-row-id="${id}"]`);
                    if (group) {
                        const buildLabel = group.querySelector('.pub-group-build-no');
                        const doorLabel = group.querySelector('.pub-group-doorplate');
                        if (buildLabel) buildLabel.textContent = row.buildNo || '未填寫';
                        if (doorLabel) doorLabel.textContent = row.doorplate || '未填門牌';
                    }
                }

                updateInputCalculationsAndUI(); 
                renderOutputTables();
            }
        });

        // 點擊列即選取為 active row
        document.getElementById('input-table-body').addEventListener('click', (e) => {
            const tr = e.target.closest('tr');
            if (!tr) return;
            // 避免點擊刪除按鈕或輸入框時產生問題，只要點擊這列就觸發
            if(e.target.closest('button')) return; // 點按鈕不觸發 (按鈕自己有邏輯)
            setActiveRow(tr.dataset.id);
        });

        // Focus 輸入框時也自動選取
        document.getElementById('input-table-body').addEventListener('focusin', (e) => {
            const tr = e.target.closest('tr');
            if (tr && tr.dataset.id !== state.activeRowId) {
                setActiveRow(tr.dataset.id);
            }
        });

        // 公設表輸入事件監聽
        document.getElementById('pub-groups-wrapper').addEventListener('input', (e) => {
            if(e.target.tagName !== 'INPUT') return;
            const tr = e.target.closest('tr');
            const group = e.target.closest('.pub-build-group');
            if (!tr || !group) return;
            
            const rowId = group.dataset.rowId;
            const pubId = tr.dataset.pubid;
            const field = e.target.dataset.field;
            const row = state.data.find(r => r.id === rowId);
            
            if (row) {
                const pub = row.publicFacilities.find(p => p.id === pubId);
                if(pub && field) {
                    let value = e.target.value;
                    if (['pubBuildNo', 'pubUseType', 'totalArea', 'numerator', 'denominator'].includes(field)) {
                        value = toHalfWidth(value).trim();
                        if (e.target.value !== value && value !== '') e.target.value = value;
                    }
                    if (['totalArea', 'numerator', 'denominator'].includes(field)) {
                        let numVal = Number(value);
                        if (numVal < 0) { numVal = Math.abs(numVal); e.target.value = numVal; value = numVal; }
                        value = value === '' ? '' : numVal;
                    }
                    pub[field] = value;
                    
                    // 只局部更新數值，不重新渲染整張表，避免失去焦點
                    const pTotal = Number(pub.totalArea) || 0;
                    const pNum = Number(pub.numerator) || 0;
                    const pDen = Number(pub.denominator) || 1;
                    const pShareArea = pDen === 0 ? 0 : pTotal * (pNum / pDen);
                    
                    const shareAreaCell = tr.querySelector('.pub-share-area');
                    if (shareAreaCell) shareAreaCell.textContent = formatNumber(pShareArea);

                    const denInput = tr.querySelector('input[data-field="denominator"]');
                    if (denInput) {
                        pDen === 0 ? denInput.classList.add('input-error') : denInput.classList.remove('input-error');
                    }
                    
                    updateInputCalculationsAndUI(); // 更新主表總面積
                    renderOutputTables();
                }
            }
        });

        function formatSection(sec) {
            if (!sec || String(sec).trim() === '') return '';
            let s = String(sec).trim();
            return s.endsWith('段') ? s : s + '段';
        }

        function formatNumber(num) {
            if (num === '' || isNaN(num)) return '0.00';
            return (Math.round(num * 100) / 100).toFixed(2);
        }

        function getAttachedArea1(row) {
            return row.attachedArea1 !== undefined ? row.attachedArea1 : (row.attachedArea || '');
        }

        function getAttachedArea2(row) {
            return row.attachedArea2 || '';
        }

        function getAttachedAreaSum(row) {
            return (Number(getAttachedArea1(row)) || 0) + (Number(getAttachedArea2(row)) || 0);
        }

        function calculateRowAreas(row) {
            const mArea = Number(row.mainArea) || 0;
            const aArea = getAttachedAreaSum(row);
            const num = Number(row.numerator) || 0;
            const den = Number(row.denominator) || 1;
            
            const privateArea = mArea + aArea;
            const privateShareArea = den === 0 ? 0 : privateArea * (num / den);
            
            let pubShareAreaSum = 0;
            if(row.publicFacilities && row.publicFacilities.length > 0) {
                pubShareAreaSum = row.publicFacilities.reduce((sum, pub) => {
                    const pTotal = Number(pub.totalArea) || 0;
                    const pNum = Number(pub.numerator) || 0;
                    const pDen = Number(pub.denominator) || 1;
                    return sum + (pDen === 0 ? 0 : pTotal * (pNum / pDen));
                }, 0);
            }
            
            return {
                privateShareArea,
                attachedAreaSum: aArea,
                pubShareAreaSum,
                totalShareArea: privateShareArea + pubShareAreaSum,
                denZero: den === 0,
                numGtDen: num > den && den !== 0
            };
        }

        function calculateInputTotals() {
            return state.data.reduce((totals, row) => {
                const calcs = calculateRowAreas(row);
                totals.totalPublic += calcs.pubShareAreaSum;
                totals.totalAll += calcs.totalShareArea;
                return totals;
            }, { totalPublic: 0, totalAll: 0 });
        }

        function renderInputSummary(totals = calculateInputTotals()) {
            const tfoot = document.getElementById('input-table-foot');
            if (!tfoot) return;

            let leadingColspan = 6; // 拖曳、項次、建號、主建物、附屬明細、附屬總面積
            if (!state.hiddenCols.has('district')) leadingColspan++;
            if (!state.hiddenCols.has('doorplate')) leadingColspan++;
            if (!state.hiddenCols.has('section')) leadingColspan++;
            if (!state.hiddenCols.has('useType')) leadingColspan++;
            if (!state.hiddenCols.has('owner')) leadingColspan++;
            if (!state.hiddenCols.has('privateShare')) leadingColspan += 3;

            tfoot.innerHTML = `
                <tr>
                    <td class="py-3 px-3 text-right" colspan="${leadingColspan}">所有建物面積累加：</td>
                    <td class="py-3 px-3 text-right font-mono text-lg text-slate-700" id="input-total-public-area">${formatNumber(totals.totalPublic)}</td>
                    <td class="py-3 px-3 text-right font-mono text-lg text-primary" id="input-total-share-area">${formatNumber(totals.totalAll)}</td>
                    ${!state.hiddenCols.has('remarks') ? '<td class="py-3 px-3"></td>' : ''}
                    <td class="py-3 px-2" style="width:56px; min-width:56px; max-width:56px;"></td>
                </tr>
            `;
        }

        function renderInputTable() {
            const tbody = document.getElementById('input-table-body');
            tbody.innerHTML = '';
            
            let totalPublic = 0;
            let totalAll = 0;

            state.data.forEach((row, index) => {
                const calcs = calculateRowAreas(row);
                totalPublic += calcs.pubShareAreaSum;
                totalAll += calcs.totalShareArea;

                const denClass = calcs.denZero ? 'input-error' : '';
                const numClass = calcs.numGtDen ? 'input-error font-bold' : '';
                const displaySection = (row.section || '').replace(/段$/, '');
                const attachedArea1 = getAttachedArea1(row);
                const attachedArea2 = getAttachedArea2(row);
                
                const activeClass = row.id === state.activeRowId ? 'active-row' : '';

                const tr = document.createElement('tr');

                tr.innerHTML = `

                    </td>
                    <td class="py-2 px-2 text-center text-slate-400 font-mono text-sm">${index + 1}</td>

                        <div class="flex items-center relative">
                            <input type="text" data-field="section" value="${displaySection}" class="input-cell pr-6" placeholder="例: 中正">

                        </div>
                    </td>
                    <td class="py-2 px-2">
                        <input type="text" data-field="buildNo" value="${row.buildNo}" class="input-cell font-mono font-medium text-blue-700" placeholder="00000-000">
                    </td>
                    <td class="py-2 px-2 col-useType"><input type="text" data-field="useType" value="${row.useType}" class="input-cell" placeholder="例: 住家用"></td>
                    <td class="py-2 px-2"><input type="number" step="any" data-field="mainArea" value="${row.mainArea}" class="input-cell text-right font-mono hide-spin" placeholder="0.00"></td>
                    <td class="py-2 px-2 min-w-[230px]">
                        <div class="attached-detail-grid grid grid-cols-[36px_92px_92px] gap-1.5 items-center">
                            <span class="text-[11px] text-slate-400 font-semibold">面積</span>
                            <input type="number" step="any" data-field="attachedArea1" value="${attachedArea1}" class="input-cell attached-area-input text-right font-mono hide-spin" placeholder="0.00">
                            <input type="number" step="any" data-field="attachedArea2" value="${attachedArea2}" class="input-cell attached-area-input text-right font-mono hide-spin" placeholder="0.00">
                            <span class="text-[11px] text-slate-400 font-semibold">類型</span>
                            <input type="text" data-field="attachedType1" value="${row.attachedType1 || ''}" class="input-cell attached-type-input" placeholder="附屬1">
                            <input type="text" data-field="attachedType2" value="${row.attachedType2 || ''}" class="input-cell attached-type-input" placeholder="附屬2">
                        </div>
                    </td>
                    <td class="py-2 px-3 text-right">
                        <div class="font-semibold text-slate-700 font-mono text-base attached-total-area" data-val="${calcs.attachedAreaSum}">${formatNumber(calcs.attachedAreaSum)}</div>
                    </td>
                    
                    <td class="py-2 px-2 col-owner">
                        <input type="text" data-field="owner" value="${row.owner}" class="input-cell" placeholder="姓名">
                    </td>
                    <td class="py-2 px-0 w-14 text-right col-privateShare">
                        <input type="number" data-field="numerator" value="${row.numerator}" class="input-cell text-center font-mono px-1 ${numClass}" title="${calcs.numGtDen ? '分子不應大於分母' : ''}">
                    </td>
                    <td class="py-2 px-1 w-4 text-center text-slate-300 font-bold text-lg col-privateShare">/</td>
                    <td class="py-2 px-0 w-14 text-left col-privateShare">
                        <input type="number" data-field="denominator" value="${row.denominator}" class="input-cell text-center font-mono px-1 ${denClass}">
                    </td>
                    
                    <td class="py-2 px-3 text-right">
                        <div class="font-semibold text-slate-700 font-mono text-base public-share-area" data-val="${calcs.pubShareAreaSum}">${formatNumber(calcs.pubShareAreaSum)}</div>
                    </td>
                    <td class="py-2 px-3 text-right">
                        <div class="font-semibold text-primary font-mono text-base total-share-area" data-val="${calcs.totalShareArea}" title="專有面積 ${formatNumber(calcs.privateShareArea)} + 公設面積 ${formatNumber(calcs.pubShareAreaSum)}">${formatNumber(calcs.totalShareArea)}</div>
                    </td>
                    <td class="py-2 px-2 col-remarks"><input type="text" data-field="remarks" value="${row.remarks}" class="input-cell" placeholder="備註..."></td>
                    <td class="py-2 px-1 text-center action-col whitespace-nowrap" style="width:56px; min-width:56px; max-width:56px;">
                        <button onclick="deleteRow('${row.id}')" class="inline-flex items-center justify-center w-8 h-8 bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 rounded border border-red-100 font-medium transition shadow-sm active:scale-95" title="刪除此筆資料">
                            <i class="ph-fill ph-trash text-lg"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            applyColumnVisibility();
            renderInputSummary({ totalPublic, totalAll });
        }

        // 渲染下半部的公設編輯表
        function renderPubFacilityTable() {
            const wrapper = document.getElementById('pub-groups-wrapper');
            if (!wrapper) return;
            wrapper.innerHTML = '';

            if (state.data.length === 0) {
                wrapper.innerHTML = `<div class="py-8 text-center text-slate-400 italic bg-white rounded-lg border border-dashed border-slate-300">尚無主建物資料。</div>`;
                return;
            }

            state.data.forEach((row, rowIndex) => {
                const buildNo = row.buildNo || '未填寫';
                const doorplate = row.doorplate || '未填門牌';
                const publicFacilities = row.publicFacilities || [];
                let rowsHtml = '';

                if (publicFacilities.length === 0) {

                } else {

                                <td class="py-2 px-3"><input type="text" data-field="pubUseType" value="${pub.pubUseType || ''}" class="input-cell" placeholder="停車場、大公、當層梯間"></td>

                                <i class="ph ph-plus text-lg text-white"></i> 新增一筆公設
                            </button>

        function updateInputCalculationsAndUI() {
            let totalPublic = 0;
            let totalAll = 0;
            state.data.forEach(row => {
                const calcs = calculateRowAreas(row);
                totalPublic += calcs.pubShareAreaSum;
                totalAll += calcs.totalShareArea;

                const tr = document.querySelector(`#input-table-body tr[data-id="${row.id}"]`);
                if (!tr) return;

                const denInput = tr.querySelector('input[data-field="denominator"]');
                const numInput = tr.querySelector('input[data-field="numerator"]');
                if(denInput) calcs.denZero ? denInput.classList.add('input-error') : denInput.classList.remove('input-error');
                if(numInput) {
                    calcs.numGtDen ? numInput.classList.add('input-error', 'font-bold') : numInput.classList.remove('input-error', 'font-bold');
                    numInput.title = calcs.numGtDen ? "分子不應大於分母" : "";
                }

                const attachedCell = tr.querySelector('.attached-total-area');
                const publicCell = tr.querySelector('.public-share-area');
                const totalCell = tr.querySelector('.total-share-area');
                
                if (attachedCell && attachedCell.dataset.val !== String(calcs.attachedAreaSum)) {
                    attachedCell.innerHTML = formatNumber(calcs.attachedAreaSum);
                    attachedCell.dataset.val = calcs.attachedAreaSum;
                }

                if (publicCell && publicCell.dataset.val !== String(calcs.pubShareAreaSum)) {
                    publicCell.innerHTML = formatNumber(calcs.pubShareAreaSum);
                    publicCell.dataset.val = calcs.pubShareAreaSum;
                }

                if (totalCell && totalCell.dataset.val !== String(calcs.totalShareArea)) {
                    totalCell.innerHTML = formatNumber(calcs.totalShareArea);
                    totalCell.dataset.val = calcs.totalShareArea;
                }

                if (totalCell) {
                    totalCell.title = `專有面積 ${formatNumber(calcs.privateShareArea)} + 公設面積 ${formatNumber(calcs.pubShareAreaSum)}`;
                }
            });

            renderInputSummary({ totalPublic, totalAll });
        }

        function renderOutputTables() {
            const wrapper = document.getElementById('output-tables-wrapper');
            wrapper.innerHTML = '';

            if (state.areaMode === 'sqm' || state.areaMode === 'both') wrapper.appendChild(createOutputTableHTML('sqm'));
            if (state.areaMode === 'ping' || state.areaMode === 'both') wrapper.appendChild(createOutputTableHTML('ping'));
        }

        function createOutputTableHTML(unitMode) {
            const isPing = (unitMode === 'ping');
            const unitLabel = isPing ? '坪' : '平方公尺';
            const unitStr = isPing ? '(坪)' : '(㎡)'; 
            const ratio = isPing ? PING_RATIO : 1;

            const container = document.createElement('div');
            container.className = 'flex flex-col mb-4';

            const actionBarHtml = `
                <div class="flex justify-end gap-2 mb-3">
                    <button onclick="copyToClipboard('${unitMode}')" class="flex items-center gap-1.5 bg-white hover:bg-slate-100 text-slate-700 px-3.5 py-2 rounded-lg text-sm font-medium transition active:scale-95 shadow-sm border border-slate-200">
                        <i class="ph ph-copy text-lg"></i> 複製此表
                    </button>
                    <button onclick="exportCSV('${unitMode}')" class="flex items-center gap-1.5 bg-white hover:bg-slate-100 text-slate-700 px-3.5 py-2 rounded-lg text-sm font-medium transition active:scale-95 shadow-sm border border-slate-200">
                        <i class="ph ph-file-csv text-lg"></i> 匯出此表 CSV
                    </button>
                    <button id="btn-screenshot-${unitMode}" onclick="exportImage('${unitMode}')" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-lg text-sm font-medium transition active:scale-95 shadow-sm">
                        <i class="ph ph-camera text-lg text-white"></i> 截圖此表
                    </button>
                </div>
            `;

            const headerHtml = `
                <div class="flex justify-start items-end border-b-[3px] border-slate-800 pb-3 mb-2">
                    <h3 class="text-3xl font-bold text-slate-900 tracking-widest">建物清冊 <span class="text-xl text-slate-600 font-normal">(${unitLabel})</span></h3>
                </div>
            `;

            let thHtml = `<th style="width:40px;">項次</th>`;
            if (!state.hiddenCols.has('district')) thHtml += `<th>行政區</th>`;
            if (!state.hiddenCols.has('doorplate')) thHtml += `<th>門牌</th>`;
            if (!state.hiddenCols.has('section')) thHtml += `<th class="text-center">段</th>`;
            thHtml += `<th class="text-center">建號</th>`;
            if (!state.hiddenCols.has('useType')) thHtml += `<th>主要用途</th>`;
            thHtml += `<th class="text-center">主建物${unitStr}</th>`;
            thHtml += `<th class="text-center">附屬${unitStr}</th>`;
            if (!state.hiddenCols.has('owner')) thHtml += `<th class="text-center">所有權人</th>`;
            if (!state.hiddenCols.has('privateShare')) thHtml += `<th>專有持分</th>`;
            thHtml += `<th class="text-center">專有面積${unitStr}</th>`;
            thHtml += `<th class="text-center">公設面積${unitStr}</th>`;
            thHtml += `<th class="text-center">總面積${unitStr}</th>`;
            if (!state.hiddenCols.has('remarks')) thHtml += `<th>備註</th>`;

            let trsHtml = '';
            let grandTotalMain = 0, grandTotalAttached = 0, grandTotalPrivateShare = 0, grandTotalPubShare = 0, grandTotalAll = 0;

            state.data.forEach((row, index) => {
                const calcs = calculateRowAreas(row);
                
                const dMain = (Number(row.mainArea)||0) * ratio;
                const dAttached = calcs.attachedAreaSum * ratio;
                const dPrivShare = calcs.privateShareArea * ratio;
                const dPubShare = calcs.pubShareAreaSum * ratio;
                const dTotal = calcs.totalShareArea * ratio;

                grandTotalMain += dMain;
                grandTotalAttached += dAttached;
                grandTotalPrivateShare += dPrivShare;
                grandTotalPubShare += dPubShare;
                grandTotalAll += dTotal;

                trsHtml += `<tr><td class="text-slate-500 text-center">${index + 1}</td>`;
                if (!state.hiddenCols.has('district')) trsHtml += `<td class="text-left">${row.district || ''}</td>`;
                if (!state.hiddenCols.has('doorplate')) trsHtml += `<td class="text-left">${row.doorplate || ''}</td>`;
                if (!state.hiddenCols.has('section')) trsHtml += `<td class="text-center">${formatSection(row.section)}</td>`;
                trsHtml += `<td class="text-center font-mono font-medium">${row.buildNo || ''}</td>`;
                if (!state.hiddenCols.has('useType')) trsHtml += `<td class="text-left">${row.useType || ''}</td>`;
                
                trsHtml += `<td class="text-right font-mono text-slate-600">${formatNumber(dMain)}</td>`;
                trsHtml += `<td class="text-right font-mono text-slate-600">${formatNumber(dAttached)}</td>`;
                
                if (!state.hiddenCols.has('owner')) trsHtml += `<td class="text-center font-medium text-slate-800">${row.owner || ''}</td>`;
                if (!state.hiddenCols.has('privateShare')) trsHtml += `<td class="xl-text font-mono text-slate-600 text-center" style="mso-number-format:'\\@';">${row.numerator} / ${row.denominator}</td>`;
                
                trsHtml += `<td class="text-right font-mono text-slate-700">${formatNumber(dPrivShare)}</td>`;
                trsHtml += `<td class="text-right font-mono text-slate-700">${formatNumber(dPubShare)}</td>`;
                trsHtml += `<td class="text-right font-mono font-bold text-slate-900">${formatNumber(dTotal)}</td>`;
                
                if (!state.hiddenCols.has('remarks')) trsHtml += `<td class="text-left text-slate-500">${row.remarks || ''}</td>`;
                trsHtml += `</tr>`;
            });

            // 計算合計列跨欄
            let beforeColspan = 4; // 項次, 段, 建號, 專有持分 (位置不對，持分在右邊，所以我們依序計算)
            // 項次(1)
            let sumColspan = 1;
            if (!state.hiddenCols.has('district')) sumColspan++;
            if (!state.hiddenCols.has('doorplate')) sumColspan++;
            if (!state.hiddenCols.has('section')) sumColspan++;
            sumColspan++; // 建號
            if (!state.hiddenCols.has('useType')) sumColspan++;

            const tfootHtml = `
                <tfoot class="bg-indigo-50/50 border-t-[3px] border-slate-400 font-bold text-slate-900">
                    <tr>
                        <td colspan="${sumColspan}" class="text-right py-3 text-lg tracking-wider">合計：</td>
                        <td class="text-right font-mono text-indigo-700">${formatNumber(grandTotalMain)}</td>
                        <td class="text-right font-mono text-indigo-700">${formatNumber(grandTotalAttached)}</td>
                        ${!state.hiddenCols.has('owner') ? '<td></td>' : ''}
                        ${!state.hiddenCols.has('privateShare') ? '<td></td>' : ''}
                        <td class="text-right font-mono text-indigo-700">${formatNumber(grandTotalPrivateShare)}</td>
                        <td class="text-right font-mono text-indigo-700">${formatNumber(grandTotalPubShare)}</td>
                        <td class="text-right font-mono text-lg text-indigo-800">${formatNumber(grandTotalAll)}</td>
                        ${!state.hiddenCols.has('remarks') ? '<td></td>' : ''}
                    </tr>
                </tfoot>
            `;

            container.innerHTML = `
                ${actionBarHtml}
                <div id="report-content-${unitMode}" class="bg-white rounded-xl shadow-sm border border-slate-200 p-10 flex flex-col gap-4">
                    ${headerHtml}
                    <table class="output-table !mb-0">
                        <thead><tr>${thHtml}</tr></thead>
                        <tbody>${trsHtml}</tbody>
                        ${tfootHtml}
                    </table>
                </div>
            `;
            return container;
        }

        function changeAreaMode(mode) {
            state.areaMode = mode;
            renderOutputTables();
        }

        function toggleColumn(colName, isVisible) {
            if (isVisible) state.hiddenCols.delete(colName);
            else state.hiddenCols.add(colName);
            
            applyColumnVisibility();
            renderInputSummary();
            renderOutputTables();
        }

        function applyColumnVisibility() {
            const allCols = ['district', 'doorplate', 'section', 'useType', 'owner', 'privateShare', 'remarks'];
            allCols.forEach(col => {
                const elements = document.querySelectorAll(`.col-${col}`);
                elements.forEach(el => {
                    if (state.hiddenCols.has(col)) el.classList.add('hide-col');
                    else el.classList.remove('hide-col');
                });
            });
        }

        function initSortable() {
            const inputBody = document.getElementById('input-table-body');
            if (!inputBody) return;
            if (typeof Sortable === 'undefined') {
                console.warn('SortableJS 未載入，拖曳排序暫停。');
                return;
            }

            new Sortable(inputBody, {
                handle: '.drag-handle',
                animation: 200,
                ghostClass: 'bg-indigo-50',
                onEnd: function (evt) {
                    const item = state.data.splice(evt.oldIndex, 1)[0];
                    state.data.splice(evt.newIndex, 0, item);
                    state.sortKey = null;
                    updateSortIcons();
                    triggerUpdate();
                }
            });
        }

        function setupBeforeUnload() {
            window.addEventListener('beforeunload', (e) => {
                if (state.data.length > 1 || (state.data.length === 1 && state.data[0].buildNo !== '')) {
                    e.preventDefault(); e.returnValue = '';
                }
            });
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `建物清冊專案_${new Date().toISOString().split('T')[0]}.json`;
            a.click(); URL.revokeObjectURL(url);
            customAlert("專案儲存成功！");
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) { 
                        state.data = data; 
                        state.activeRowId = data.length > 0 ? data[0].id : null;
                        triggerUpdate(); 
                        customAlert("專案讀取成功！"); 
                    } else customAlert("檔案格式錯誤！請確定匯入正確的專案檔。");
                } catch (err) { customAlert("讀取失敗：檔案損毀或不支援的格式。"); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function exportCSV(unitMode) {
            const isPing = unitMode === 'ping';
            const ratio = isPing ? PING_RATIO : 1;
            const unitStr = isPing ? '(坪)' : '(㎡)';

            let csv = "\uFEFF"; 
            
            const headers = ["項次"];
            if (!state.hiddenCols.has('district')) headers.push("行政區");
            if (!state.hiddenCols.has('doorplate')) headers.push("門牌");
            if (!state.hiddenCols.has('section')) headers.push("段");
            headers.push("建號");
            if (!state.hiddenCols.has('useType')) headers.push("主要用途");
            headers.push(`主建面積${unitStr}`);
            headers.push(`附屬面積${unitStr}`);
            if (!state.hiddenCols.has('owner')) headers.push("所有權人");
            if (!state.hiddenCols.has('privateShare')) headers.push("專有持分");
            headers.push(`專有持分面積${unitStr}`);
            headers.push(`公設持分面積${unitStr}`);
            headers.push(`總持分面積${unitStr}`);
            if (!state.hiddenCols.has('remarks')) headers.push("備註");

            csv += headers.join(",") + "\n";

            state.data.forEach((row, idx) => {
                const calcs = calculateRowAreas(row);
                
                const rowData = [idx + 1];
                if (!state.hiddenCols.has('district')) rowData.push(`"${row.district || ''}"`);
                if (!state.hiddenCols.has('doorplate')) rowData.push(`"${row.doorplate || ''}"`);
                if (!state.hiddenCols.has('section')) rowData.push(`"${formatSection(row.section)}"`);
                rowData.push(`="${row.buildNo || ''}"`);
                if (!state.hiddenCols.has('useType')) rowData.push(`"${row.useType || ''}"`);
                
                rowData.push(((Number(row.mainArea)||0) * ratio).toFixed(2));
                rowData.push((calcs.attachedAreaSum * ratio).toFixed(2));
                
                if (!state.hiddenCols.has('owner')) rowData.push(`"${row.owner || ''}"`);
                if (!state.hiddenCols.has('privateShare')) rowData.push(`="${row.numerator}/${row.denominator}"`);
                
                rowData.push((calcs.privateShareArea * ratio).toFixed(2));
                rowData.push((calcs.pubShareAreaSum * ratio).toFixed(2));
                rowData.push((calcs.totalShareArea * ratio).toFixed(2));
                
                if (!state.hiddenCols.has('remarks')) rowData.push(`"${row.remarks || ''}"`);
                
                csv += rowData.join(",") + "\n";
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; 
            a.download = `建物清冊_${isPing ? '坪' : '平方公尺'}_${new Date().toISOString().split('T')[0]}.csv`; 
            a.click();
            customAlert(`CSV 檔案 (${isPing ? '坪' : '平方公尺'}) 下載完成！`);
        }

        function getReportPlainText(wrapper) {
            const title = wrapper.querySelector('h3')?.innerText.trim() || '建物清冊';
            const tableText = Array.from(wrapper.querySelectorAll('table tr')).map(tr => {
                return Array.from(tr.children).map(cell => cell.innerText.trim()).join('\t');
            }).join('\n');
            return `${title}\n${tableText}`;
        }

        function fallbackCopyReport(html, plainText) {
            const copyHandler = function(e) {
                e.clipboardData.setData('text/html', html);
                e.clipboardData.setData('text/plain', plainText);
                e.preventDefault();
            };
            document.addEventListener('copy', copyHandler);
            const copied = document.execCommand('copy');
            document.removeEventListener('copy', copyHandler);
            return copied;
        }

        async function copyToClipboard(unitMode) {
            const wrapper = document.getElementById(`report-content-${unitMode}`);
            if (!wrapper) {
                customAlert("找不到可複製的報表。");
                return;
            }

            let html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><style>table{border-collapse:collapse;} td,th{border:1px solid #000; padding:4px;} .xl-text{mso-number-format:"\\@";}</style></head><body>';
            html += wrapper.innerHTML; 
            html += '</body></html>';
            const plainText = getReportPlainText(wrapper);

            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            'text/html': new Blob([html], { type: 'text/html' }),
                            'text/plain': new Blob([plainText], { type: 'text/plain' })
                        })
                    ]);
                } else if (!fallbackCopyReport(html, plainText)) {
                    throw new Error('execCommand copy failed');
                }
                customAlert("報表已複製！您現在可以在 Excel 或 Word 中貼上。");
            } catch (err) {
                if (fallbackCopyReport(html, plainText)) {
                    customAlert("報表已複製！您現在可以在 Excel 或 Word 中貼上。");
                    return;
                }
                console.error('複製錯誤:', err);
                customAlert("複製失敗，請稍後再試。");
            }
        }

        function renderReportTableToPng(element, options = {}) {
            return new Promise((resolve, reject) => {
                const table = element.querySelector('table');
                if (!table) {
                    reject(new Error('找不到報表表格'));
                    return;
                }

                const pixelRatio = options.pixelRatio || 2;
                const backgroundColor = options.backgroundColor || '#ffffff';
                const title = element.querySelector('h3')?.innerText.trim() || '建物清冊';
                const measureCanvas = document.createElement('canvas');
                const measureCtx = measureCanvas.getContext('2d');
                measureCtx.font = '14px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif';

                const tableRows = Array.from(table.querySelectorAll('tr')).map(tr => {
                    const section = tr.closest('thead') ? 'head' : tr.closest('tfoot') ? 'foot' : 'body';
                    return {
                        section,
                        cells: Array.from(tr.children).map(cell => ({
                            text: cell.innerText.trim().replace(/\s+/g, ' '),
                            colSpan: cell.colSpan || 1,
                            align: cell.classList.contains('text-right') ? 'right' : cell.classList.contains('text-left') ? 'left' : 'center'
                        }))
                    };
                });

                const columnCount = Math.max(...tableRows.map(row => row.cells.reduce((sum, cell) => sum + cell.colSpan, 0)));
                const columnWidths = Array.from({ length: columnCount }, (_, index) => index === 0 ? 54 : 86);
                tableRows.forEach(row => {
                    let colIndex = 0;
                    row.cells.forEach(cell => {
                        if (cell.colSpan === 1) {
                            const measured = Math.ceil(measureCtx.measureText(cell.text).width) + 28;
                            columnWidths[colIndex] = Math.min(Math.max(columnWidths[colIndex], measured), 220);
                        }
                        colIndex += cell.colSpan;
                    });
                });

                const margin = 36;
                const titleHeight = 64;
                const rowHeight = 38;
                const tableWidth = columnWidths.reduce((sum, width) => sum + width, 0);
                const width = tableWidth + margin * 2;
                const height = titleHeight + tableRows.length * rowHeight + margin * 2;

                const canvas = document.createElement('canvas');
                canvas.width = width * pixelRatio;
                canvas.height = height * pixelRatio;
                const ctx = canvas.getContext('2d');
                ctx.scale(pixelRatio, pixelRatio);
                ctx.fillStyle = backgroundColor;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = '#0f172a';
                ctx.font = '700 30px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText(title, margin, margin + 24);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(margin, margin + titleHeight - 10);
                ctx.lineTo(margin + tableWidth, margin + titleHeight - 10);
                ctx.stroke();

                let y = margin + titleHeight;
                tableRows.forEach(row => {
                    let x = margin;
                    let colIndex = 0;
                    row.cells.forEach(cell => {
                        const cellWidth = columnWidths.slice(colIndex, colIndex + cell.colSpan).reduce((sum, width) => sum + width, 0);
                        ctx.fillStyle = row.section === 'head' ? '#f8fafc' : row.section === 'foot' ? '#eef2ff' : '#ffffff';
                        ctx.fillRect(x, y, cellWidth, rowHeight);
                        ctx.strokeStyle = '#cbd5e1';
                        ctx.lineWidth = row.section === 'head' ? 1.5 : 1;
                        ctx.strokeRect(x, y, cellWidth, rowHeight);

                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(x + 4, y + 2, cellWidth - 8, rowHeight - 4);
                        ctx.clip();
                        ctx.fillStyle = row.section === 'foot' ? '#1e40af' : '#1e293b';
                        ctx.font = `${row.section === 'head' || row.section === 'foot' ? '700' : '500'} 14px "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif`;
                        ctx.textBaseline = 'middle';
                        ctx.textAlign = cell.align;
                        const textX = cell.align === 'right' ? x + cellWidth - 12 : cell.align === 'left' ? x + 12 : x + cellWidth / 2;
                        ctx.fillText(cell.text, textX, y + rowHeight / 2);
                        ctx.restore();

                        x += cellWidth;
                        colIndex += cell.colSpan;
                    });
                    y += rowHeight;
                });

                resolve(canvas.toDataURL('image/png'));
            });
        }

        function inlineComputedStyles(source, clone) {
            const sourceNodes = [source, ...source.querySelectorAll('*')];
            const cloneNodes = [clone, ...clone.querySelectorAll('*')];
            sourceNodes.forEach((sourceNode, index) => {
                const cloneNode = cloneNodes[index];
                if (!cloneNode || sourceNode.nodeType !== 1) return;
                const computed = window.getComputedStyle(sourceNode);
                let styleText = '';
                for (let i = 0; i < computed.length; i++) {
                    const property = computed[i];
                    styleText += `${property}:${computed.getPropertyValue(property)};`;
                }
                cloneNode.setAttribute('style', styleText);
            });
        }

        function fallbackElementToPng(element, options = {}) {
            return new Promise((resolve, reject) => {
                const backgroundColor = options.backgroundColor || '#ffffff';
                const pixelRatio = options.pixelRatio || 2;
                const rect = element.getBoundingClientRect();
                const width = Math.ceil(element.scrollWidth || rect.width);
                const height = Math.ceil(element.scrollHeight || rect.height);
                const clone = element.cloneNode(true);

                inlineComputedStyles(element, clone);
                clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
                clone.style.width = `${width}px`;
                clone.style.minHeight = `${height}px`;
                clone.style.backgroundColor = backgroundColor;

                const serialized = new XMLSerializer().serializeToString(clone);
                const svg = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
                        <foreignObject width="100%" height="100%">${serialized}</foreignObject>
                    </svg>
                `;
                const svgUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
                const image = new Image();
                image.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = width * pixelRatio;
                        canvas.height = height * pixelRatio;
                        const ctx = canvas.getContext('2d');
                        ctx.scale(pixelRatio, pixelRatio);
                        ctx.fillStyle = backgroundColor;
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(image, 0, 0);
                        URL.revokeObjectURL(svgUrl);
                        resolve(canvas.toDataURL('image/png'));
                    } catch (err) {
                        URL.revokeObjectURL(svgUrl);
                        reject(err);
                    }
                };
                image.onerror = () => {
                    URL.revokeObjectURL(svgUrl);
                    reject(new Error('SVG 截圖轉換失敗'));
                };
                image.src = svgUrl;
            });
        }

        function exportImage(unitMode) {
            const container = document.getElementById(`report-content-${unitMode}`);
            const btn = document.getElementById(`btn-screenshot-${unitMode}`);
            const btnOriginalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg text-white"></i> 處理中...`;

            setTimeout(() => {
                const renderOptions = {
                    backgroundColor: '#ffffff',
                    pixelRatio: 2
                };
                const renderPng = renderReportTableToPng(container, renderOptions).catch(() => {
                    return fallbackElementToPng(container, renderOptions);
                });

                renderPng.then(dataUrl => {
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = `建物清冊報表_${unitMode === 'ping' ? '坪' : '平方公尺'}_${new Date().toISOString().split('T')[0]}.png`;
                    a.click();
                    btn.innerHTML = btnOriginalText;
                    customAlert("報表圖片下載完成！");
                }).catch(err => {
                    console.error('截圖錯誤:', err);
                    btn.innerHTML = btnOriginalText;
                    customAlert("截圖失敗，請稍後再試。");
                });
            }, 100); 
        }

        window.onload = init;
    </script>
