<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式心智圖工具</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-5YQY4RT9H2');
    </script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel 轉換 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PDF 匯出使用瀏覽器 Canvas 與原生 PDF 編碼，不依賴外部截圖套件。 -->
    
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .node-input {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 100%;
            font-size: inherit;
            font-weight: inherit;
            color: inherit;
            cursor: text;
        }
        .node-input::placeholder {
            color: inherit;
            opacity: 0.5;
        }
        .canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        /* 隱藏捲軸 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 產生唯一 ID
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // 預設主題配色表
        const THEMES = [
            { id: 'default', root: 'bg-blue-600 text-white', child: 'bg-white border-slate-200 text-slate-800', line: '#94a3b8', inputRoot: 'text-white', inputChild: 'text-slate-800' },
            { id: 'forest', root: 'bg-emerald-600 text-white', child: 'bg-emerald-50 border-emerald-300 text-emerald-900', line: '#34d399', inputRoot: 'text-white', inputChild: 'text-emerald-900' },
            { id: 'sunset', root: 'bg-orange-500 text-white', child: 'bg-orange-50 border-orange-300 text-orange-900', line: '#fb923c', inputRoot: 'text-white', inputChild: 'text-orange-900' },
            { id: 'purple', root: 'bg-violet-600 text-white', child: 'bg-violet-50 border-violet-300 text-violet-900', line: '#a78bfa', inputRoot: 'text-white', inputChild: 'text-violet-900' },
            { id: 'rose', root: 'bg-rose-500 text-white', child: 'bg-rose-50 border-rose-300 text-rose-900', line: '#fb7185', inputRoot: 'text-white', inputChild: 'text-rose-900' },
            { id: 'midnight', root: 'bg-slate-800 text-white', child: 'bg-slate-100 border-slate-400 text-slate-800', line: '#64748b', inputRoot: 'text-white', inputChild: 'text-slate-800' },
            { id: 'ocean', root: 'bg-cyan-600 text-white', child: 'bg-cyan-50 border-cyan-300 text-cyan-900', line: '#22d3ee', inputRoot: 'text-white', inputChild: 'text-cyan-900' }
        ];

        // 預設初始資料
        const initialNodes = [
            { id: 'root', text: '中心主題', x: window.innerWidth / 2, y: window.innerHeight / 2, parentId: null }
        ];

        // 中心主題為第一層；第三層與更深層採相同寬度上限。
        const NODE_FONT_FAMILY = 'Arial, "Microsoft JhengHei", "PingFang TC", sans-serif';
        const NODE_HORIZONTAL_GAP = 60;
        const NODE_VERTICAL_GAP = 32;
        const getNodeLevel = (id, nodeMap) => {
            let level = 1;
            let node = nodeMap.get(id);
            const visited = new Set([id]);
            while (node && node.parentId !== null && nodeMap.has(node.parentId)) {
                if (visited.has(node.parentId)) break;
                visited.add(node.parentId);
                level++;
                node = nodeMap.get(node.parentId);
            }
            return level;
        };
        const getNodeConfig = level => ({
            minWidth: level === 1 ? 160 : 140,
            maxWidth: level === 1 ? 240 : level === 2 ? 280 : 320,
            fontSize: level === 1 ? 20 : level === 2 ? 18 : 16,
            fontWeight: level === 1 ? 700 : 500,
            lineHeight: level === 1 ? 30 : level === 2 ? 27 : 24,
            paddingX: level === 1 ? 24 : 16,
            paddingY: level === 1 ? 12 : 8,
            borderWidth: level === 1 ? 0 : 2
        });
        const nodeMetricCache = new Map();
        let nodeMeasureCanvas;
        const measureNode = (node, level) => {
            const config = getNodeConfig(level);
            const text = String(node.text || ' ');
            const key = JSON.stringify([Math.min(level, 3), text]);
            if (nodeMetricCache.has(key)) return nodeMetricCache.get(key);
            if (!nodeMeasureCanvas) nodeMeasureCanvas = document.createElement('canvas');
            const context = nodeMeasureCanvas.getContext('2d');
            context.font = `${config.fontWeight} ${config.fontSize}px ${NODE_FONT_FAMILY}`;
            const textWidth = Math.max(...text.split('\n').map(line => context.measureText(line).width));
            const width = Math.ceil(Math.min(config.maxWidth, Math.max(config.minWidth,
                textWidth + 2 * (config.paddingX + config.borderWidth) + 2)));
            // 使用與節點相同的排版規則量測多行高度，包含中英文斷行。
            const measure = document.createElement('div');
            Object.assign(measure.style, {
                position: 'absolute', left: '-100000px', top: '0', visibility: 'hidden',
                boxSizing: 'border-box', width: `${width}px`,
                fontFamily: NODE_FONT_FAMILY, fontSize: `${config.fontSize}px`,
                fontWeight: String(config.fontWeight), lineHeight: `${config.lineHeight}px`,
                padding: `${config.paddingY}px ${config.paddingX}px`,
                border: `${config.borderWidth}px solid transparent`,
                whiteSpace: 'pre-wrap', overflowWrap: 'break-word', wordBreak: 'normal'
            });
            measure.textContent = text;
            document.body.appendChild(measure);
            const height = Math.max(measure.offsetHeight, config.lineHeight + 2 * (config.paddingY + config.borderWidth));
            measure.remove();
            const metrics = { ...config, width, height };
            if (nodeMetricCache.size > 1000) nodeMetricCache.clear();
            nodeMetricCache.set(key, metrics);
            return metrics;
        };
        const getNodeMetrics = nodeList => {
            const map = new Map(nodeList.map(n => [n.id, n]));
            return new Map(nodeList.map(n => [n.id, measureNode(n, getNodeLevel(n.id, map))]));
        };
        // order 僅表示同一父節點下的順序；舊 JSON 依原陣列順序補齊。
        const orderedChildren = (nodeList, parentId) => nodeList
            .map((node, index) => ({ node, index }))
            .filter(item => item.node.parentId === parentId)
            .sort((a, b) => (Number.isFinite(a.node.order) ? a.node.order : a.index)
                - (Number.isFinite(b.node.order) ? b.node.order : b.index) || a.index - b.index)
            .map(item => item.node);
        const normalizeOrders = nodeList => {
            const orders = new Map();
            const parents = new Set(nodeList.map(n => n.parentId));
            parents.forEach(parent => orderedChildren(nodeList, parent).forEach((n, index) => orders.set(n.id, index)));
            return nodeList.map(n => {
                const { fillColor, ...node } = n;
                return { ...node, order: orders.get(n.id) };
            });
        };
        const isInBranch = (id, ancestorId, nodeList) => {
            const map = new Map(nodeList.map(n => [n.id, n]));
            const visited = new Set();
            while (map.has(id) && !visited.has(id)) {
                if (id === ancestorId) return true;
                visited.add(id);
                id = map.get(id).parentId;
            }
            return false;
        };
        const moveOrderedNode = (nodeList, id, parentId, referenceId = null, placement = 'after') => {
            const normalized = normalizeOrders(nodeList);
            const node = normalized.find(n => n.id === id);
            if (!node || node.parentId === null || !normalized.some(n => n.id === parentId)
                || isInBranch(parentId, id, normalized)) return normalized;
            const siblings = orderedChildren(normalized, parentId).filter(n => n.id !== id);
            let index = siblings.length;
            if (referenceId !== null) {
                const referenceIndex = siblings.findIndex(n => n.id === referenceId);
                if (referenceIndex < 0) return normalized;
                index = referenceIndex + (placement === 'before' ? 0 : 1);
            }
            siblings.splice(index, 0, { ...node, parentId });
            const newOrders = new Map(siblings.map((n, i) => [n.id, i]));
            return normalizeOrders(normalized.map(n => n.id === id
                ? { ...n, parentId, order: newOrders.get(id) }
                : n.parentId === parentId ? { ...n, order: newOrders.get(n.id) } : n));
        };
        const findDropIntent = (nodeList, metrics, draggedId, x, y) => {
            const dragged = nodeList.find(n => n.id === draggedId);
            if (!dragged || dragged.parentId === null) return null;
            let best = null;
            let distance = Infinity;
            for (const target of nodeList) {
                if (isInBranch(target.id, draggedId, nodeList)) continue;
                const size = metrics.get(target.id);
                const dx = Math.abs(x - target.x);
                const dy = y - target.y;
                if (dx > size.width / 2 + 12 || Math.abs(dy) > size.height / 2 + 18) continue;
                const score = Math.hypot(dx / size.width, dy / size.height);
                if (score >= distance) continue;
                const edge = Math.min(14, size.height / 4);
                const type = target.parentId !== null && dy < -size.height / 2 + edge ? 'before'
                    : target.parentId !== null && dy > size.height / 2 - edge ? 'after' : 'child';
                const parentId = type === 'child' ? target.id : target.parentId;
                if (isInBranch(parentId, draggedId, nodeList)) continue;
                best = { targetId: target.id, parentId, type };
                distance = score;
            }
            return best;
        };

        const arrangeNodes = (nodeList, mode, metrics) => {
            const result = normalizeOrders(nodeList);
            const byId = new Map(result.map(n => [n.id, n]));
            const root = result.find(n => n.parentId === null);
            if (!root) return nodeList;
            const children = new Map(result.map(n => [n.id, []]));
            result.forEach(n => { if (children.has(n.parentId)) children.get(n.parentId).push(n.id); });
            children.forEach(ids => ids.sort((a, b) => byId.get(a).order - byId.get(b).order));
            const rootChildren = children.get(root.id);
            const right = mode === 'right' ? rootChildren : rootChildren.filter((_, i) => i % 2 === 0);
            const left = mode === 'right' ? [] : rootChildren.filter((_, i) => i % 2 === 1);
            const placeSide = (branches, direction) => {
                if (!branches.length) return;
                // 每側按層級對齊，採該層最大節點寬度，避免不同分支交錯重疊。
                const widths = [metrics.get(root.id).width];
                const depths = new Map();
                const collect = (id, depth) => {
                    if (depths.has(id)) return;
                    depths.set(id, depth);
                    widths[depth] = Math.max(widths[depth] || 0, metrics.get(id).width);
                    children.get(id).forEach(child => collect(child, depth + 1));
                };
                branches.forEach(id => collect(id, 1));
                const positions = [root.x];
                for (let depth = 1; depth < widths.length; depth++) {
                    positions[depth] = positions[depth - 1] + direction *
                        (widths[depth - 1] / 2 + widths[depth] / 2 + NODE_HORIZONTAL_GAP);
                }
                const heights = new Map();
                const subtreeHeight = id => {
                    if (heights.has(id)) return heights.get(id);
                    const childIds = children.get(id);
                    const childrenHeight = childIds.reduce((sum, child) => sum + subtreeHeight(child), 0)
                        + Math.max(0, childIds.length - 1) * NODE_VERTICAL_GAP;
                    const height = Math.max(metrics.get(id).height, childrenHeight);
                    heights.set(id, height);
                    return height;
                };
                const place = (id, top) => {
                    const height = subtreeHeight(id);
                    const node = byId.get(id);
                    node.x = positions[depths.get(id)];
                    node.y = top + height / 2;
                    const childIds = children.get(id);
                    const childrenHeight = childIds.reduce((sum, child) => sum + subtreeHeight(child), 0)
                        + Math.max(0, childIds.length - 1) * NODE_VERTICAL_GAP;
                    let childTop = top + (height - childrenHeight) / 2;
                    childIds.forEach(child => {
                        place(child, childTop);
                        childTop += subtreeHeight(child) + NODE_VERTICAL_GAP;
                    });
                };
                const totalHeight = branches.reduce((sum, id) => sum + subtreeHeight(id), 0)
                    + (branches.length - 1) * NODE_VERTICAL_GAP;
                let top = root.y - totalHeight / 2;
                branches.forEach(id => { place(id, top); top += subtreeHeight(id) + NODE_VERTICAL_GAP; });
            };
            placeSide(right, 1);
            placeSide(left, -1);
            return result;
        };

        const Node = ({ node, metrics, isSelected, isDropTarget, isEditing, isDragging, onSelect, onDoubleClick, onChange, onDragStart, theme }) => {
            const nodeRef = useRef(null);
            
            useEffect(() => {
                if (isEditing && nodeRef.current) {
                    nodeRef.current.focus();
                    // 將游標移到最後
                    const val = nodeRef.current.value;
                    nodeRef.current.value = '';
                    nodeRef.current.value = val;
                }
            }, [isEditing]);

            const handlePointerDown = (e) => {
                e.stopPropagation(); // 防止觸發畫布拖曳
                if (!isEditing) {
                    onSelect(node.id);
                    onDragStart(e, node.id);
                }
            };

            const isRoot = node.parentId === null;

            return (
                <div
                    className={`absolute rounded-xl shadow-lg flex items-center justify-center transition-all duration-200
                        ${isDropTarget ? 'ring-4 ring-emerald-500 ring-opacity-80 scale-110 z-30 shadow-2xl' : isSelected ? 'ring-4 ring-blue-400 ring-opacity-50 z-20' : 'z-10 hover:shadow-xl'}
                        ${isDragging ? 'opacity-60 scale-105 ring-2 ring-dashed ring-slate-500 z-40 shadow-2xl' : ''}
                        ${isRoot ? theme.root : `${theme.child} border-2`}
                    `}
                    style={{
                        left: node.x,
                        top: node.y,
                        transform: 'translate(-50%, -50%)',
                        boxSizing: 'border-box',
                        width: metrics.width,
                        height: metrics.height,
                        minWidth: metrics.minWidth,
                        maxWidth: metrics.maxWidth,
                        padding: `${metrics.paddingY}px ${metrics.paddingX}px`,
                        fontFamily: NODE_FONT_FAMILY,
                        fontSize: metrics.fontSize,
                        fontWeight: metrics.fontWeight,
                        lineHeight: `${metrics.lineHeight}px`,
                        cursor: isEditing ? 'text' : 'pointer',
                        touchAction: 'none'
                    }}
                    data-node-id={node.id}
                    onPointerDown={handlePointerDown}
                    onDoubleClick={(e) => {
                        e.stopPropagation();
                        onDoubleClick(node.id);
                    }}
                >
                    {isEditing ? (
                        <textarea
                            ref={nodeRef}
                            rows={1}
                            style={{ resize: 'none', display: 'block', padding: 0, height: metrics.height - 2 * (metrics.paddingY + metrics.borderWidth), lineHeight: 'inherit', color: 'inherit', overflow: 'hidden' }}
                            className="node-input"
                            placeholder="輸入內容…"
                            aria-label="節點內容"
                            value={node.text}
                            onChange={(e) => onChange(node.id, e.target.value)}
                            onBlur={() => onDoubleClick(null)} // 取消編輯狀態
                            onKeyDown={(e) => {
                                if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
                                    e.preventDefault();
                                    onDoubleClick(null); // 結束編輯
                                }
                            }}
                        />
                    ) : (
                        // 新增：break-words 允許長單字換行
                        <div className="select-none text-center whitespace-pre-wrap break-words w-full">
                            {node.text || ' '}
                        </div>
                    )}
                </div>
            );
        };

        // 歷史快照只保存文件內容；平移、縮放及選取不列入復原步驟。
        const cloneDocument = document => ({
            nodes: document.nodes.map(node => ({ ...node })),
            themeId: document.themeId, layoutMode: document.layoutMode
        });
        const sameDocument = (a, b) => JSON.stringify(a) === JSON.stringify(b);
        const pushHistory = (history, before, after) => {
            if (sameDocument(before, after)) return false;
            history.past.push(cloneDocument(before));
            if (history.past.length > 100) history.past.shift();
            history.future = [];
            return true;
        };
        const stepHistory = (history, current, direction) => {
            const source = direction === 'undo' ? history.past : history.future;
            const destination = direction === 'undo' ? history.future : history.past;
            if (!source.length) return null;
            destination.push(cloneDocument(current));
            return cloneDocument(source.pop());
        };

        const MindMapApp = () => {
            const [nodes, setNodesState] = useState(() => normalizeOrders(initialNodes));
            const [selectedId, setSelectedId] = useState('root');
            const [editingId, setEditingIdState] = useState(null);
            const [draggingNodeId, setDraggingNodeId] = useState(null);
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const [currentTheme, setCurrentThemeState] = useState(THEMES[0]);
            const [dropTargetId, setDropTargetId] = useState(null);
            const [dropIntent, setDropIntent] = useState(null);
            const [isExporting, setIsExporting] = useState(false);
            const exportingRef = useRef(false);
            const [layoutMode, setLayoutModeState] = useState('right'); // 預設改為右側排列
            
            const nodeMetrics = getNodeMetrics(nodes);
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);

            // 使用 Ref 追蹤最新狀態，避免事件監聽器拿到舊資料
            const nodesRef = useRef(nodes);
            useEffect(() => { nodesRef.current = nodes; }, [nodes]);
            
            const transformRef = useRef(transform);
            useEffect(() => { transformRef.current = transform; }, [transform]);

            const layoutModeRef = useRef(layoutMode);
            useEffect(() => { layoutModeRef.current = layoutMode; }, [layoutMode]);
            
            const dropTargetIdRef = useRef(null);
            const dropIntentRef = useRef(null);

            const currentThemeRef = useRef(currentTheme);
            const editingIdRef = useRef(editingId);
            const historyRef = useRef({ past: [], future: [] });
            const historyGroupRef = useRef(null);
            const [historyAvailable, setHistoryAvailable] = useState({ undo: false, redo: false });
            const captureDocument = () => cloneDocument({
                nodes: nodesRef.current, themeId: currentThemeRef.current.id,
                layoutMode: layoutModeRef.current
            });
            const refreshHistory = () => {
                const pending = historyGroupRef.current && !sameDocument(historyGroupRef.current.before, captureDocument());
                setHistoryAvailable({
                    undo: !!pending || historyRef.current.past.length > 0,
                    redo: !pending && historyRef.current.future.length > 0
                });
            };
            const finishHistoryGroup = () => {
                const group = historyGroupRef.current;
                if (group) {
                    historyGroupRef.current = null;
                    pushHistory(historyRef.current, group.before, captureDocument());
                }
                refreshHistory();
            };
            const beginHistoryGroup = kind => {
                if (historyGroupRef.current?.kind === kind) return;
                finishHistoryGroup();
                historyGroupRef.current = { kind, before: captureDocument() };
            };
            const recordDocumentChange = before => {
                if (!historyGroupRef.current) pushHistory(historyRef.current, before, captureDocument());
                refreshHistory();
            };
            // 在事件中同步更新 ref，避免 React 批次渲染造成漏記或重複記錄。
            const setNodes = update => {
                const before = captureDocument();
                const next = typeof update === 'function' ? update(nodesRef.current) : update;
                nodesRef.current = next;
                setNodesState(next);
                recordDocumentChange(before);
            };
            const setCurrentTheme = theme => {
                const before = captureDocument();
                currentThemeRef.current = theme;
                setCurrentThemeState(theme);
                recordDocumentChange(before);
            };
            const setLayoutMode = mode => {
                const before = captureDocument();
                layoutModeRef.current = mode;
                setLayoutModeState(mode);
                recordDocumentChange(before);
            };
            const setEditingId = id => {
                if (editingIdRef.current === id) return;
                if (editingIdRef.current !== null) finishHistoryGroup();
                if (id !== null) beginHistoryGroup('edit');
                editingIdRef.current = id;
                setEditingIdState(id);
            };
            const restoreDocument = snapshot => {
                nodesRef.current = snapshot.nodes;
                currentThemeRef.current = THEMES.find(theme => theme.id === snapshot.themeId) || THEMES[0];
                layoutModeRef.current = snapshot.layoutMode;
                setNodesState(snapshot.nodes);
                setCurrentThemeState(currentThemeRef.current);
                setLayoutModeState(snapshot.layoutMode);
                setSelectedId(id => snapshot.nodes.some(node => node.id === id) ? id : 'root');
            };
            const handleHistoryStep = direction => {
                setEditingId(null);
                finishHistoryGroup();
                const snapshot = stepHistory(historyRef.current, captureDocument(), direction);
                if (!snapshot) return;
                restoreDocument(snapshot);
                refreshHistory();
            };

            // 拖曳狀態
            const dragState = useRef({
                isDraggingCanvas: false,
                isDraggingNode: false,
                nodeId: null,
                startX: 0,
                startY: 0,
                initialTransform: { x: 0, y: 0 },
                initialNodePos: { x: 0, y: 0 }
            });

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3000);
            };

            const handlePointerDown = (e) => {
                if (editingId) setEditingId(null);
                
                dragState.current = {
                    isDraggingCanvas: true,
                    isDraggingNode: false,
                    nodeId: null,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialTransform: { ...transform },
                    initialNodePos: null
                };
                setSelectedId(null);
            };

            const handleNodeDragStart = (e, id) => {
                const node = nodes.find(n => n.id === id);
                if (!node) return;

                setEditingId(null);
                dropIntentRef.current = null;
                dropTargetIdRef.current = null;
                setDropIntent(null);
                setDropTargetId(null);

                dragState.current = {
                    isDraggingCanvas: false,
                    isDraggingNode: true,
                    nodeId: id,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialTransform: null,
                    initialNodePos: { x: node.x, y: node.y },
                    originalNodes: nodes.map(n => ({ ...n })),
                    hasMoved: false
                };
            };

            const handlePointerMove = (e) => {
                if (dragState.current.isDraggingCanvas) {
                    const dx = e.clientX - dragState.current.startX;
                    const dy = e.clientY - dragState.current.startY;
                    setTransform(prev => ({ ...prev,
                        x: dragState.current.initialTransform.x + dx,
                        y: dragState.current.initialTransform.y + dy }));
                } else if (dragState.current.isDraggingNode) {
                    const drag = dragState.current;
                    if (!drag.hasMoved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 4) return;
                    if (!drag.hasMoved) {
                        setEditingId(null);
                        beginHistoryGroup('drag');
                    }
                    drag.hasMoved = true;
                    setDraggingNodeId(drag.nodeId);
                    const currentTransform = transformRef.current;
                    const dx = (e.clientX - drag.startX) / currentTransform.scale;
                    const dy = (e.clientY - drag.startY) / currentTransform.scale;
                    const originalById = new Map(drag.originalNodes.map(n => [n.id, n]));
                    // 自由拖曳時整個分支一起移動，不改變兄弟節點順序。
                    setNodes(previous => previous.map(node => {
                        if (!isInBranch(node.id, drag.nodeId, drag.originalNodes)) return node;
                        const original = originalById.get(node.id);
                        return { ...node, x: original.x + dx, y: original.y + dy };
                    }));
                    const rect = containerRef.current.getBoundingClientRect();
                    const x = (e.clientX - rect.left - currentTransform.x) / currentTransform.scale;
                    const y = (e.clientY - rect.top - currentTransform.y) / currentTransform.scale;
                    const intent = findDropIntent(nodesRef.current, getNodeMetrics(nodesRef.current), drag.nodeId, x, y);
                    dropIntentRef.current = intent;
                    dropTargetIdRef.current = intent ? intent.targetId : null;
                    setDropIntent(intent);
                    setDropTargetId(intent ? intent.targetId : null);
                }
            };

            const handlePointerUp = () => {
                const drag = dragState.current;
                const intent = dropIntentRef.current;
                if (drag.isDraggingNode && drag.hasMoved && intent) {
                    const id = drag.nodeId;
                    setNodes(previous => {
                        const moved = moveOrderedNode(previous, id, intent.parentId,
                            intent.type === 'child' ? null : intent.targetId, intent.type);
                        return arrangeNodes(moved, layoutModeRef.current, getNodeMetrics(moved));
                    });
                    showToast(intent.type === 'child' ? '已移至新父節點，排在子節點最後' : '已更新同層節點順序', 'success');
                }
                if (drag.isDraggingNode && drag.hasMoved) finishHistoryGroup();
                dragState.current.isDraggingCanvas = false;
                dragState.current.isDraggingNode = false;
                dragState.current.nodeId = null;
                setDraggingNodeId(null);
                dropIntentRef.current = null;
                dropTargetIdRef.current = null;
                setDropIntent(null);
                setDropTargetId(null);
            };

            const handlePointerCancel = () => {
                const originals = dragState.current.originalNodes;
                if (dragState.current.isDraggingNode && originals) {
                    const positions = new Map(originals.map(n => [n.id, n]));
                    setNodes(previous => previous.map(n => positions.has(n.id)
                        ? { ...n, x: positions.get(n.id).x, y: positions.get(n.id).y } : n));
                }
                dropIntentRef.current = null;
                handlePointerUp();
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const zoomSensitivity = 0.001;
                const delta = -e.deltaY * zoomSensitivity;
                let newScale = transform.scale * (1 + delta);
                newScale = Math.max(0.2, Math.min(newScale, 3));
                setTransform(prev => ({ ...prev, scale: newScale }));
            };

            useEffect(() => {
                const container = containerRef.current;
                if (container) {
                    container.addEventListener('wheel', handleWheel, { passive: false });
                }
                window.addEventListener('pointermove', handlePointerMove);
                window.addEventListener('pointerup', handlePointerUp);
                window.addEventListener('pointercancel', handlePointerCancel);
                
                return () => {
                    if (container) {
                        container.removeEventListener('wheel', handleWheel);
                    }
                    window.removeEventListener('pointermove', handlePointerMove);
                    window.removeEventListener('pointerup', handlePointerUp);
                    window.removeEventListener('pointercancel', handlePointerCancel);
                };
            }, [transform.scale]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (editingId) return;
                    if (!selectedId) return;

                    if (e.key === 'Tab') {
                        e.preventDefault();
                        addChildNode(selectedId);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        addSiblingNode(selectedId);
                    } else if (e.key === 'Delete' || e.key === 'Backspace') {
                        e.preventDefault();
                        deleteNode(selectedId);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedId, editingId, nodes, layoutMode]);

            const addChildNode = (parentId) => {
                const parent = nodes.find(n => n.id === parentId);
                if (!parent) return;

                const newId = generateId();
                const childrenCount = nodes.filter(n => n.parentId === parentId).length;
                const newMetrics = measureNode({ text: '' }, getNodeLevel(parentId, new Map(nodes.map(n => [n.id, n]))) + 1);
                
                let direction = 1; // 預設向右
                if (layoutMode === 'both') {
                    const rootNode = nodes.find(n => n.parentId === null);
                    if (parent.parentId === null) {
                        direction = childrenCount % 2 === 0 ? 1 : -1; // 左右交錯
                    } else {
                        direction = parent.x >= (rootNode?.x || 0) ? 1 : -1; // 繼承方向
                    }
                }
                
                const newNode = {
                    id: newId,
                    text: '',
                    x: parent.x + ((nodeMetrics.get(parent.id).width / 2 + newMetrics.width / 2 + NODE_HORIZONTAL_GAP) * direction),
                    y: childrenCount ? Math.max(...nodes.filter(n => n.parentId === parentId).map(n => n.y + nodeMetrics.get(n.id).height / 2)) + newMetrics.height / 2 + NODE_VERTICAL_GAP : parent.y,
                    parentId: parentId,
                    order: childrenCount
                };

                setNodes(prev => normalizeOrders([...prev, newNode]));
                setSelectedId(newId);
                setEditingId(newId);
            };

            const addSiblingNode = (nodeId) => {
                const node = nodes.find(n => n.id === nodeId);
                if (!node || node.parentId === null) {
                    if (node && node.parentId === null) addChildNode(nodeId);
                    return;
                }

                const siblings = nodes.filter(n => n.parentId === node.parentId);
                const newMetrics = measureNode({ text: '' }, getNodeLevel(nodeId, new Map(nodes.map(n => [n.id, n]))));
                const newId = generateId();
                const newNode = {
                    id: newId,
                    text: '',
                    x: node.x,
                    y: Math.max(...siblings.map(n => n.y + nodeMetrics.get(n.id).height / 2)) + newMetrics.height / 2 + NODE_VERTICAL_GAP,
                    parentId: node.parentId,
                    order: siblings.length
                };

                setNodes(prev => {
                    const added = moveOrderedNode([...prev, newNode], newId, node.parentId, nodeId, 'after');
                    return arrangeNodes(added, layoutModeRef.current, getNodeMetrics(added));
                });
                setSelectedId(newId);
                setEditingId(newId);
            };

            const selectedNode = nodes.find(n => n.id === selectedId);
            const selectedSiblings = selectedNode ? orderedChildren(nodes, selectedNode.parentId) : [];
            const selectedIndex = selectedSiblings.findIndex(n => n.id === selectedId);
            const canMoveUp = !!selectedNode && selectedNode.parentId !== null && selectedIndex > 0;
            const canMoveDown = !!selectedNode && selectedNode.parentId !== null && selectedIndex < selectedSiblings.length - 1;
            const moveSelected = direction => {
                if (editingId) setEditingId(null);
                setNodes(previous => {
                    const selected = previous.find(n => n.id === selectedId);
                    if (!selected || selected.parentId === null) return previous;
                    const siblings = orderedChildren(previous, selected.parentId);
                    const index = siblings.findIndex(n => n.id === selectedId);
                    const reference = siblings[index + direction];
                    if (!reference) return previous;
                    const moved = moveOrderedNode(previous, selectedId, selected.parentId, reference.id,
                        direction < 0 ? 'before' : 'after');
                    return arrangeNodes(moved, layoutModeRef.current, getNodeMetrics(moved));
                });
            };

            const deleteNode = (nodeId) => {
                const nodeToDelete = nodes.find(n => n.id === nodeId);
                if (!nodeToDelete || nodeToDelete.parentId === null) {
                    showToast('無法刪除中心主題', 'error');
                    return;
                }

                const getChildrenIds = (id) => {
                    const children = nodes.filter(n => n.parentId === id).map(n => n.id);
                    let allChildren = [...children];
                    children.forEach(childId => {
                        allChildren = [...allChildren, ...getChildrenIds(childId)];
                    });
                    return allChildren;
                };

                const idsToDelete = [nodeId, ...getChildrenIds(nodeId)];
                setNodes(prev => prev.filter(n => !idsToDelete.includes(n.id)));
                setSelectedId(nodeToDelete.parentId);
            };

            const handleNodeTextChange = (id, newText) => {
                setNodes(prev => prev.map(n => n.id === id ? { ...n, text: newText } : n));
            };

            const handleSave = () => {
                const data = JSON.stringify(normalizeOrders(nodes), null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mindmap-${new Date().getTime()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('心智圖已儲存為 JSON 檔案', 'success');
            };

            const handleLoad = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedNodes = JSON.parse(event.target.result);
                        if (Array.isArray(parsedNodes) && parsedNodes.length > 0 && parsedNodes[0].id === 'root') {
                            setEditingId(null);
                            setNodes(normalizeOrders(parsedNodes));
                            setSelectedId('root');
                            setEditingId(null);
                            setTransform({ x: 0, y: 0, scale: 1 });
                            showToast('成功讀取心智圖', 'success');
                        } else {
                            throw new Error('格式不正確');
                        }
                    } catch (error) {
                        showToast('讀取失敗，檔案格式錯誤', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // 以實際節點尺寸繪製獨立畫布，匯出不受視窗平移、縮放或裁切影響。
            const handleExportPDF = async () => {
                if (exportingRef.current) return;
                exportingRef.current = true;
                setIsExporting(true);
                showToast('正在準備匯出 PDF...', 'info');
                let canvas;
                let downloadUrl;
                let link;
                try {
                    setEditingId(null);
                    // 等待編輯文字提交及字型載入，避免輸出舊值。
                    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                    if (document.fonts) await document.fonts.ready;
                    const source = document.getElementById('export-container');
                    if (!source) throw new Error('找不到心智圖畫布');
                    const elements = new Map(Array.from(source.querySelectorAll('[data-node-id]'))
                        .map(element => [element.dataset.nodeId, element]));
                    const snapshot = nodesRef.current.map(node => {
                        const element = elements.get(String(node.id));
                        if (!element || !Number.isFinite(node.x) || !Number.isFinite(node.y)) {
                            throw new Error('節點位置或尺寸不正確，請重新讀取心智圖');
                        }
                        const style = getComputedStyle(element);
                        return { ...node, width: element.offsetWidth, height: element.offsetHeight,
                            background: style.backgroundColor, color: style.color,
                            border: style.borderColor, borderWidth: parseFloat(style.borderTopWidth) || 0,
                            radius: parseFloat(style.borderTopLeftRadius) || 12,
                            font: `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`,
                            lineHeight: parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.5,
                            padding: (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0) };
                    });
                    if (!snapshot.length) throw new Error('心智圖沒有可匯出的節點');
                    const padding = 40;
                    const minX = Math.min(...snapshot.map(n => n.x - n.width / 2)) - padding;
                    const minY = Math.min(...snapshot.map(n => n.y - n.height / 2)) - padding;
                    const width = Math.ceil(Math.max(...snapshot.map(n => n.x + n.width / 2)) - minX + padding);
                    const height = Math.ceil(Math.max(...snapshot.map(n => n.y + n.height / 2)) - minY + padding);
                    // 限制像素總量與最長邊，避免大型心智圖超過瀏覽器 Canvas 上限。
                    const scale = Math.min(2, 8192 / width, 8192 / height, Math.sqrt(16000000 / width / height));
                    canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.ceil(width * scale));
                    canvas.height = Math.max(1, Math.ceil(height * scale));
                    const context = canvas.getContext('2d');
                    if (!context) throw new Error('瀏覽器無法建立匯出畫布');
                    context.fillStyle = '#f8fafc';
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.scale(scale, scale);
                    context.translate(-minX, -minY);
                    const byId = new Map(snapshot.map(n => [n.id, n]));
                    context.strokeStyle = currentTheme.line;
                    context.lineWidth = 3;
                    for (const node of snapshot) {
                        const parent = byId.get(node.parentId);
                        if (!parent) continue;
                        const middleX = (parent.x + node.x) / 2;
                        context.beginPath();
                        context.moveTo(parent.x, parent.y);
                        context.bezierCurveTo(middleX, parent.y, middleX, node.y, node.x, node.y);
                        context.stroke();
                    }
                    for (const node of snapshot) {
                        const x = node.x - node.width / 2;
                        const y = node.y - node.height / 2;
                        const radius = Math.min(node.radius, node.width / 2, node.height / 2);
                        context.beginPath();
                        context.moveTo(x + radius, y);
                        context.arcTo(x + node.width, y, x + node.width, y + node.height, radius);
                        context.arcTo(x + node.width, y + node.height, x, y + node.height, radius);
                        context.arcTo(x, y + node.height, x, y, radius);
                        context.arcTo(x, y, x + node.width, y, radius);
                        context.closePath();
                        context.fillStyle = node.background;
                        context.fill();
                        if (node.borderWidth) {
                            context.strokeStyle = node.border;
                            context.lineWidth = node.borderWidth;
                            context.stroke();
                        }
                        context.font = node.font;
                        context.fillStyle = node.color;
                        context.textAlign = 'center';
                        context.textBaseline = 'middle';
                        const lines = [];
                        const maxTextWidth = node.width - node.padding - node.borderWidth * 2;
                        for (const paragraph of String(node.text || ' ').split('\n')) {
                            let line = '';
                            for (const character of Array.from(paragraph)) {
                                if (line && context.measureText(line + character).width > maxTextWidth) {
                                    lines.push(line);
                                    line = character;
                                } else line += character;
                            }
                            lines.push(line);
                        }
                        const startY = node.y - (lines.length - 1) * node.lineHeight / 2;
                        lines.forEach((line, index) => context.fillText(line, node.x, startY + index * node.lineHeight));
                    }
                    const jpeg = await new Promise((resolve, reject) => canvas.toBlob(
                        blob => blob ? resolve(blob) : reject(new Error('無法產生心智圖影像')), 'image/jpeg', 0.98));
                    const imageBytes = new Uint8Array(await jpeg.arrayBuffer());
                    // 單頁 PDF：JPEG 以二進位嵌入，位移以位元組計算，中文由 Canvas 保留。
                    const encoder = new TextEncoder();
                    const parts = [];
                    let byteLength = 0;
                    const offsets = [0];
                    const append = value => {
                        const bytes = typeof value === 'string' ? encoder.encode(value) : value;
                        parts.push(bytes);
                        byteLength += bytes.length;
                    };
                    const object = (id, content) => {
                        offsets[id] = byteLength;
                        append(`${id} 0 obj\n${content}\nendobj\n`);
                    };
                    // 頁面最長邊不超過 14400 pt，維持完整比例及單頁輸出。
                    const pageScale = Math.min(0.75, 14400 / Math.max(width, height));
                    const pageWidth = (width * pageScale).toFixed(3);
                    const pageHeight = (height * pageScale).toFixed(3);
                    append('%PDF-1.4\n');
                    object(1, '<< /Type /Catalog /Pages 2 0 R >>');
                    object(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
                    object(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
                    offsets[4] = byteLength;
                    append(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imageBytes.length} >>\nstream\n`);
                    append(imageBytes);
                    append('\nendstream\nendobj\n');
                    const commands = `q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Im0 Do\nQ\n`;
                    object(5, `<< /Length ${encoder.encode(commands).length} >>\nstream\n${commands}endstream`);
                    const xrefOffset = byteLength;
                    append('xref\n0 6\n0000000000 65535 f \n');
                    for (let id = 1; id <= 5; id++) append(`${String(offsets[id]).padStart(10, '0')} 00000 n \n`);
                    append(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);
                    downloadUrl = URL.createObjectURL(new Blob(parts, { type: 'application/pdf' }));
                    link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = `mindmap-${Date.now()}.pdf`;
                    document.body.appendChild(link);
                    link.click();
                    showToast('PDF 已產生，請查看下載檔案', 'success');
                } catch (error) {
                    console.error('PDF 匯出錯誤:', error);
                    showToast(`匯出失敗：${error.message || '請稍後重試'}`, 'error');
                } finally {
                    if (link) link.remove();
                    if (downloadUrl) setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
                    if (canvas) { canvas.width = 0; canvas.height = 0; }
                    exportingRef.current = false;
                    setIsExporting(false);
                }
            };

            const resetView = () => {
                const rootNode = nodes.find(n => n.parentId === null);
                if (rootNode) {
                    setTransform({
                        x: window.innerWidth / 2 - rootNode.x,
                        y: window.innerHeight / 2 - rootNode.y,
                        scale: 1
                    });
                } else {
                    setTransform({ x: 0, y: 0, scale: 1 });
                }
            };

            const handleRandomTheme = () => {
                setEditingId(null);
                const availableThemes = THEMES.filter(t => t.id !== currentTheme.id);
                const randomTheme = availableThemes[Math.floor(Math.random() * availableThemes.length)];
                setCurrentTheme(randomTheme);
            };

            const toggleLayoutMode = () => {
                setEditingId(null);
                beginHistoryGroup('layout');
                const newMode = layoutModeRef.current === 'right' ? 'both' : 'right';
                setLayoutMode(newMode);
                handleAutoLayout(newMode);
                finishHistoryGroup();
                showToast(`已切換為${newMode === 'right' ? '右側' : '左右'}排列`, 'success');
            };

            // 自動排列以實際文字尺寸計算每層距離與分支高度。
            const handleAutoLayout = (forceMode) => {
                setEditingId(null);
                const activeMode = typeof forceMode === 'string' ? forceMode : layoutMode;
                setNodes(previous => arrangeNodes(previous, activeMode, getNodeMetrics(previous)));
                if (typeof forceMode !== 'string') showToast('已依文字尺寸整齊排列節點', 'success');
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const renderConnections = () => {
                const lines = nodes.map(node => {
                    if (node.parentId === null) return null;
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (!parent) return null;

                    const isDraggedNode = node.id === draggingNodeId;
                    if (isDraggedNode && dropTargetId) return null;

                    const dx = node.x - parent.x;
                    const path = `M ${parent.x} ${parent.y} 
                                  C ${parent.x + dx/2} ${parent.y}, 
                                    ${node.x - dx/2} ${node.y}, 
                                    ${node.x} ${node.y}`;

                    return (
                        <path
                            key={`line-${node.id}`}
                            d={path}
                            fill="none"
                            stroke={currentTheme.line}
                            strokeWidth="3"
                            opacity={isDraggedNode ? 0.2 : 1}
                            strokeDasharray={isDraggedNode ? "5,5" : "none"}
                            className="transition-all duration-200"
                        />
                    );
                });

                // 拖曳預覽線
                if (draggingNodeId && dropTargetId) {
                    const target = nodes.find(n => n.id === (dropIntent?.parentId || dropTargetId));
                    const dragged = nodes.find(n => n.id === draggingNodeId);
                    if (target && dragged) {
                        const dx = dragged.x - target.x;
                        const path = `M ${target.x} ${target.y} 
                                      C ${target.x + dx/2} ${target.y}, 
                                        ${dragged.x - dx/2} ${dragged.y}, 
                                        ${dragged.x} ${dragged.y}`;
                        
                        lines.push(
                            <path
                                key="preview-line"
                                d={path}
                                fill="none"
                                stroke={currentTheme.line}
                                strokeWidth="4"
                                strokeDasharray="8,8"
                                opacity="0.6"
                                className="animate-pulse"
                            />
                        );
                    }
                }

                return lines;
            };

            return (
                <div className="relative w-screen h-screen overflow-hidden bg-slate-50 font-sans">
                    {/* 工具列 */}
                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm shadow-md px-6 py-3 rounded-2xl flex flex-wrap justify-center gap-3 z-50 items-center border border-slate-200" style={{ maxWidth: 'calc(100vw - 32px)', width: 'max-content' }}>
                        <button onClick={handleSave} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors" title="儲存為 JSON">
                            <i data-lucide="save" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">儲存</span>
                        </button>
                        
                        <div className="w-px h-5 bg-slate-300"></div>
                        
                        <label className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors cursor-pointer" title="讀取 JSON">
                            <i data-lucide="folder-open" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">讀取</span>
                            <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleLoad} />
                        </label>
                        
                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={handleExportPDF} disabled={isExporting} aria-busy={isExporting} className="flex items-center gap-2 text-slate-700 hover:text-red-600 transition-colors" title="匯出為 PDF">
                            <i data-lucide="file-down" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">{isExporting ? '匯出中…' : 'PDF匯出'}</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={handleRandomTheme} className="flex items-center gap-2 text-slate-700 hover:text-purple-600 transition-colors" title="隨機配色">
                            <i data-lucide="palette" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">隨機配色</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={toggleLayoutMode} className="flex items-center gap-2 text-slate-700 hover:text-orange-600 transition-colors" title="切換排列模式">
                            <i data-lucide={layoutMode === 'right' ? 'align-left' : 'align-center'} className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">{layoutMode === 'right' ? '右側排列' : '左右排列'}</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={() => handleAutoLayout()} className="flex items-center gap-2 text-slate-700 hover:text-emerald-600 transition-colors" title="一鍵排列">
                            <i data-lucide="network" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">自動排列</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={() => handleHistoryStep('undo')} disabled={!historyAvailable.undo || !!draggingNodeId}
                            className="flex items-center gap-2 text-slate-700 hover:text-blue-600 disabled:opacity-30 disabled:cursor-not-allowed" title="復原上一個操作">
                            <i data-lucide="undo-2" className="w-5 h-5"></i><span className="text-sm font-medium">上一步</span>
                        </button>
                        <button onClick={() => handleHistoryStep('redo')} disabled={!historyAvailable.redo || !!draggingNodeId}
                            className="flex items-center gap-2 text-slate-700 hover:text-blue-600 disabled:opacity-30 disabled:cursor-not-allowed" title="重做已復原的操作">
                            <i data-lucide="redo-2" className="w-5 h-5"></i><span className="text-sm font-medium">下一步</span>
                        </button>
                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={() => moveSelected(-1)} disabled={!canMoveUp} aria-label="選取節點上移"
                            className="flex items-center gap-2 text-slate-700 hover:text-blue-600 disabled:opacity-30 disabled:cursor-not-allowed" title="選取節點上移">
                            <i data-lucide="arrow-up" className="w-5 h-5"></i><span className="hidden sm:inline text-sm font-medium">上移</span>
                        </button>
                        <button onClick={() => moveSelected(1)} disabled={!canMoveDown} aria-label="選取節點下移"
                            className="flex items-center gap-2 text-slate-700 hover:text-blue-600 disabled:opacity-30 disabled:cursor-not-allowed" title="選取節點下移">
                            <i data-lucide="arrow-down" className="w-5 h-5"></i><span className="hidden sm:inline text-sm font-medium">下移</span>
                        </button>
                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={resetView} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors" title="重置視角">
                            <i data-lucide="maximize" className="w-5 h-5"></i>
                        </button>
                    </div>

                    {/* 操作提示 */}
                    <div className="absolute bottom-4 left-4 bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow border border-slate-200 z-50 text-xs text-slate-600 space-y-1 pointer-events-none">
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">雙擊</kbd> 編輯文字</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Tab</kbd> 新增子節點</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Enter</kbd> 新增同層節點</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Del</kbd> 刪除節點與分支</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Shift＋Enter</kbd> 編輯時換行</p>
                        <p>拖到節點中央：成為子節點；拖到上／下緣：插入之前／之後。</p>
                        <p>上方工具列可上移／下移，或用上一步／下一步復原及重做。</p>
                    </div>

                    {/* 提示訊息 */}
                    {toast.show && (
                        <div className={`absolute top-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-lg z-50 text-sm font-medium text-white transition-all duration-300 ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            {toast.message}
                        </div>
                    )}

                    {/* 畫布區域 */}
                    <div 
                        className="canvas-container"
                        ref={containerRef}
                        onPointerDown={handlePointerDown}
                        style={{
                            backgroundSize: '40px 40px',
                            backgroundImage: 'radial-gradient(circle, #cbd5e1 1px, transparent 1px)',
                            backgroundPosition: `${transform.x}px ${transform.y}px`
                        }}
                    >
                        <div 
                            id="export-container"
                            style={{
                                transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`,
                                transformOrigin: '0 0',
                                width: '100%',
                                height: '100%',
                                position: 'absolute',
                                top: 0,
                                left: 0
                            }}
                        >
                            {/* SVG 連線層 */}
                            <svg className="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none">
                                {renderConnections()}
                            </svg>

                            {dropIntent && dropIntent.type !== 'child' && (() => {
                                const target = nodes.find(n => n.id === dropIntent.targetId);
                                if (!target) return null;
                                const size = nodeMetrics.get(target.id);
                                const y = target.y + (dropIntent.type === 'before' ? -size.height / 2 - 8 : size.height / 2 + 8);
                                return <div role="status" aria-label={dropIntent.type === 'before' ? '插入此節點之前' : '插入此節點之後'}
                                    className="absolute bg-blue-500 rounded-full pointer-events-none z-50"
                                    style={{ left: target.x - size.width / 2 - 8, top: y - 2, width: size.width + 16, height: 4 }} />;
                            })()}

                            {/* 節點層 */}
                            {nodes.map(node => (
                                <Node
                                    key={node.id}
                                    node={node}
                                    metrics={nodeMetrics.get(node.id)}
                                    isSelected={selectedId === node.id}
                                    isDropTarget={dropTargetId === node.id && dropIntent?.type === 'child'}
                                    isEditing={editingId === node.id}
                                    isDragging={draggingNodeId === node.id}
                                    onSelect={setSelectedId}
                                    onDoubleClick={(id) => setEditingId(id)}
                                    onChange={handleNodeTextChange}
                                    onDragStart={handleNodeDragStart}
                                    theme={currentTheme}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MindMapApp />);

        // 初始化圖示
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
