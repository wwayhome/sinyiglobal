<html lang="zh-TW">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不動產定位與競品分析展示圖 (Leaflet 版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- 引入 SortableJS 實現拖曳功能 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- 引入 html-to-image 替換原本的 html2canvas，完美解決排版偏移問題 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    
    <style>
        /* 設定平滑捲動與移除多餘的 scrollbar */
        html { scroll-behavior: smooth; }
        .scrollable-panel::-webkit-scrollbar { width: 4px; }
        .scrollable-panel::-webkit-scrollbar-track { background: transparent; }
        .scrollable-panel::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* Leaflet 客製化圖標樣式 */
        .custom-div-icon { background: transparent; border: none; }
        
        /* 本案標記 (紅色) */
        .marker-main {
            background-color: #dc2626;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            width: 32px !important;
            height: 32px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        /* 本案懸浮文字 */
        .marker-main::after {
            content: attr(data-label);
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 6px;
            border: 2px solid #dc2626;
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        /* 案例標記 (藍色) */
        .marker-comp {
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 50%;
            width: 32px !important;
            height: 32px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .leaflet-popup-content-wrapper { border-radius: 0.5rem; }
        .leaflet-popup-content { margin: 12px; font-family: inherit; }
        
        /* 拖曳時的卡片視覺樣式 (半透明幽靈狀態) */
        .sortable-ghost { opacity: 0.4; }
        
        /* 準備對調時，目標卡片的高亮提示樣式 */
        .sortable-swap-highlight {  
            outline: 4px dashed #3b82f6 !important;
            outline-offset: -4px;
            background-color: #eff6ff !important;
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* 拖曳中指標 */
        .cursor-grab { cursor: -webkit-grab; cursor: grab; }
        .cursor-grab:active { cursor: -webkit-grabbing; cursor: grabbing; }
        
        /* 強制狀態覆蓋 */
        .cursor-col-resize-force { cursor: col-resize !important; }
        .select-none-force { user-select: none !important; }
        
        /* 標籤輸入框隱藏原生箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>

<body class="font-sans text-slate-800 bg-slate-400 overflow-x-hidden min-h-screen m-0 p-0">
    <div class="mx-auto min-h-screen flex flex-col shadow-2xl relative overflow-hidden bg-slate-50 w-full" style="max-width: 1600px;">
        
        <header class="bg-white shadow-md px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center sticky top-0 z-[2000] w-full gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-wide">不動產定位與競品分析展示圖</h1>
                <p class="text-sm text-slate-500 mt-1">在上方輸入資料，點擊按鈕即可於下方地圖呈現結果。</p>
            </div>
            <div class="flex items-center w-full md:w-auto justify-between md:justify-end gap-3">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>

                <button onclick="generatePresentation()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-all inline-flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    更新圖表

            </div>
        </header>

        <section class="w-full p-6 lg:p-8 shrink-0">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                <h2 class="text-xl font-bold text-slate-700 border-l-4 border-blue-500 pl-3">1. 設定各案資料</h2>
                <div class="flex flex-wrap gap-2">
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
                    <button onclick="exportCSV()" class="text-sm bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-1.5 px-3 rounded shadow-sm transition-colors flex items-center gap-1" title="匯出目前的資料作為範本">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        匯出範本/資料
                    </button>
                    <button onclick="triggerImport()" class="text-sm bg-blue-50 border border-blue-300 hover:bg-blue-100 text-blue-700 font-bold py-1.5 px-3 rounded shadow-sm transition-colors flex items-center gap-1" title="匯入已填寫的 CSV 檔案">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>

                </div>
            </div>
            
            <div id="input-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JS 動態產生 6 組輸入表單 -->
            </div>
        </section>

        <div class="w-full flex justify-center py-6 bg-slate-200 shadow-inner">
            <button onclick="generatePresentation()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-10 rounded-full shadow-lg transition-all flex items-center gap-2 text-lg transform hover:scale-105">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                載入資料並更新下方圖表
            </button>
        </div>

        <section id="map-section" class="w-full bg-slate-100 p-4 lg:p-8 flex-1 border-t border-slate-200">
            <div class="w-full mx-auto flex flex-col items-center">
                
                <div class="flex flex-col xl:flex-row justify-between items-center mb-4 w-full relative gap-4">
                    <h2 class="text-xl font-bold text-slate-800 border-l-4 border-blue-500 pl-3 self-start xl:self-auto w-full xl:w-auto">2. 成果展示儀表板</h2>
                    
                    <!-- 地圖風格切換按鈕 -->
                    <div class="xl:absolute xl:left-1/2 xl:transform xl:-translate-x-1/2 flex bg-white p-1 rounded-lg shadow-sm border border-slate-200 z-10 w-full md:w-auto justify-center">
                        <button onclick="changeMapStyle('nlsc', this)" class="map-style-btn flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded text-slate-600 hover:bg-slate-100 transition-colors">通用</button>
                        <button onclick="changeMapStyle('nlsc_photo', this)" class="map-style-btn flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded text-slate-600 hover:bg-slate-100 transition-colors">航照</button>
                        <button onclick="changeMapStyle('voyager', this)" class="map-style-btn flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded bg-slate-800 text-white transition-colors">簡約</button>
                        <button onclick="changeMapStyle('osm', this)" class="map-style-btn flex-1 md:flex-none px-4 py-1.5 text-sm font-bold rounded text-slate-600 hover:bg-slate-100 transition-colors">詳細</button>
                    </div>

                    <div class="flex items-center gap-4 self-end xl:self-auto w-full xl:w-auto justify-end">
                        <span class="text-sm font-bold text-slate-500 hidden md:block px-3 py-1 bg-slate-200 rounded-full">💡 可拖曳右側拉桿自訂儀表板寬度</span>
                        <button id="screenshot-btn" onclick="takeScreenshot()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-5 rounded-lg shadow-md flex items-center gap-2 text-sm transition-all whitespace-nowrap">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            一鍵截圖下載
                        </button>
                    </div>
                </div>
                
                <div class="w-full flex justify-center relative">
                    <div id="board-container" class="relative w-full" style="max-width: 100%;">
                        <div id="presentation-board" class="flex flex-col md:flex-row gap-3 lg:gap-4 w-full relative bg-slate-100 p-2 rounded-xl">
                            
                            <div id="left-panel" class="w-full md:w-[264px] lg:w-[312px] xl:w-[336px] flex flex-col gap-3 lg:gap-4 md:pr-1 shrink-0">
                                <!-- JS 動態生成純文字卡片 -->
                            </div>

                            <div class="flex-1 bg-white rounded-2xl shadow-lg overflow-hidden relative flex flex-col min-h-[400px] border border-slate-300">
                                <div id="map" class="absolute inset-0 z-10 bg-slate-100 transition-colors duration-500"></div>
                                
                                <div id="loading-overlay" class="hidden absolute inset-0 bg-white/90 z-[1000] flex flex-col items-center justify-center">
                                    <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <p class="text-slate-800 font-bold text-lg">正在解析地址並定位...</p>

                            <div id="right-panel" class="w-full md:w-[264px] lg:w-[312px] xl:w-[336px] flex flex-col gap-3 lg:gap-4 md:pl-1 shrink-0">

                            </div>
                        </div>
                        
                        <div id="resizer-handle" class="hidden md:flex absolute top-1/2 -right-4 transform -translate-y-1/2 w-6 h-20 bg-white border-2 border-slate-300 hover:border-blue-500 hover:bg-blue-50 cursor-col-resize flex flex-col gap-1.5 items-center justify-center rounded-md shadow-[0_0_10px_rgba(0,0,0,0.1)] z-[2000] transition-colors" title="左右拖曳調整寬度">
                            <div class="w-1 h-1.5 bg-slate-400 rounded-full pointer-events-none"></div>
                            <div class="w-1 h-1.5 bg-slate-400 rounded-full pointer-events-none"></div>
                            <div class="w-1 h-1.5 bg-slate-400 rounded-full pointer-events-none"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div> 

    <!-- Toast 容器 (取代 alert) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- 自訂確認視窗 Modal (取代 confirm 防呆) -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/50 z-[3000] flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all">
            <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                確認恢復預設值？
            </h3>
            <p class="text-sm text-slate-500 mb-6">這將會清除您目前輸入的「所有資料」並恢復成初始狀態，此動作無法復原。建議您先匯出資料備份。</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeConfirmModal()" class="px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">取消</button>
                <button onclick="executeRestoreDefaults()" class="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow-sm">確定恢復</button>
            </div>
        </div>
    </div>

    <!-- 引入 Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const propertyData = [
            { id: 0, type: 'main', title: '本案', label: '本案位置', name: '信義首席', address: '台北市信義區市府路1號', area_name: '面積', area: '55 坪', zoning_name: '分區', zoning: '商三', price_name: '總價', price: '1.2 億', c1_name: '單價', c1_val: '218 萬/坪', c2_name: '年月', c2_val: '112/05', c3_name: '買方', c3_val: '法人' },
            { id: 1, type: 'comp', title: '案例 1', label: '1', name: '松高苑', address: '台北市信義區松高路11號', area_name: '面積', area: '48 坪', zoning_name: '分區', zoning: '住三', price_name: '總價', price: '9,800 萬', c1_name: '單價', c1_val: '204 萬/坪', c2_name: '年月', c2_val: '111/08', c3_name: '買方', c3_val: '自然人' },
            { id: 2, type: 'comp', title: '案例 2', label: '2', name: '信義之星', address: '台北市信義區松智路17號', area_name: '面積', area: '60 坪', zoning_name: '分區', zoning: '商二', price_name: '總價', price: '1.5 億', c1_name: '單價', c1_val: '250 萬/坪', c2_name: '年月', c2_val: '112/11', c3_name: '買方', c3_val: '外資' },
            { id: 3, type: 'comp', title: '案例 3', label: '3', name: '', address: '', area_name: '面積', area: '', zoning_name: '分區', zoning: '', price_name: '總價', price: '', c1_name: '單價', c1_val: '', c2_name: '年月', c2_val: '', c3_name: '買方', c3_val: '' },
            { id: 4, type: 'comp', title: '案例 4', label: '4', name: '', address: '', area_name: '面積', area: '', zoning_name: '分區', zoning: '', price_name: '總價', price: '', c1_name: '單價', c1_val: '', c2_name: '年月', c2_val: '', c3_name: '買方', c3_val: '' },
            { id: 5, type: 'comp', title: '案例 5', label: '5', name: '', address: '', area_name: '面積', area: '', zoning_name: '分區', zoning: '', price_name: '總價', price: '', c1_name: '單價', c1_val: '', c2_name: '年月', c2_val: '', c3_name: '買方', c3_val: '' },
        ];

        // 備份初始狀態，用於恢復預設值
        const initialDataBackup = JSON.parse(JSON.stringify(propertyData));

        let map = null;
        let markerLayerGroup = null;
        let currentTileLayer = null; 

        // 紀錄各欄位的全域顯示狀態
        let fieldVisibility = { area: true, zoning: true, price: true, c1: true, c2: true, c3: true };
        let hiddenEmptyCards = new Set(); // 紀錄被單獨隱藏的預留區卡片 ID

        const mapStyles = {
            voyager: {
                url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                attr: '&copy; OSM contributors',
                className: ''
            },
            osm: {
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                attr: '&copy; OSM contributors',
                className: ''
            },
            nlsc: {
                url: 'https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',
                attr: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">內政部國土測繪中心</a>',
                className: ''
            },
            nlsc_photo: {
                url: 'https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}',
                attr: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">內政部國土測繪中心</a>',
                className: ''
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            renderInputForm();
            renderDisplayCards();
            initMap();
            updateMapMarkers(); 
            initResizer(); 
        });

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded shadow-lg text-white font-bold text-sm transition-all duration-300 transform translate-y-10 opacity-0 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerText = message;
            container.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    toast.classList.remove('translate-y-10', 'opacity-0');
                });
            });

            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 新增：恢復預設值相關邏輯
        function promptRestoreDefaults() {
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function executeRestoreDefaults() {
            closeConfirmModal();
            // 深拷貝還原資料
            const backup = JSON.parse(JSON.stringify(initialDataBackup));
            backup.forEach((defItem, i) => {
                Object.assign(propertyData[i], defItem);
            });
            // 還原欄位顯示狀態 (將所有隱藏的欄位打開)
            fieldVisibility = { area: true, zoning: true, price: true, c1: true, c2: true, c3: true };
            hiddenEmptyCards.clear(); // 清除已隱藏的空卡片紀錄
            
            // 重新渲染並更新圖表
            renderInputForm();
            generatePresentation();
            showToast('已成功清除資料並恢復預設值！');
            // 將畫面自動捲動到最上方方便填寫
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToMap() {
            document.getElementById('map-section').scrollIntoView({ behavior: 'smooth' });
        }

        function renderInputForm() {
            const grid = document.getElementById('input-grid');
            grid.innerHTML = '';
            
            propertyData.forEach(data => {
                const isMain = data.type === 'main';
                const headerColor = isMain ? 'bg-red-50 border-red-200 text-red-800' : 'bg-white border-slate-200 text-slate-800';
                const badgeColor = isMain ? 'bg-red-600' : 'bg-blue-600';

        let leftSortable, rightSortable;
        function initDragAndDrop() {
            const leftPanel = document.getElementById('left-panel');
            const rightPanel = document.getElementById('right-panel');

            if (leftSortable) leftSortable.destroy();
            if (rightSortable) rightSortable.destroy();

            const sortableOptions = {
                group: 'sharedCards',
                animation: 150,
                swap: true, 
                swapClass: 'sortable-swap-highlight', 
                ghostClass: 'sortable-ghost',
                filter: '.is-hidden-card', // 禁止拖曳已變成透明留白的卡片
                delay: 50,
                delayOnTouchOnly: true,
                onEnd: function () {
                    // 拖曳結束後，也檢查是否有面板被清空
                    checkPanelsEmpty();
                }
            };

            leftSortable = new Sortable(leftPanel, sortableOptions);
            rightSortable = new Sortable(rightPanel, sortableOptions);
        }

        // 新增：隱藏卡片 (改為透明留白) 並檢查面板是否全空
        function hideCard(id) {
            hiddenEmptyCards.add(id);
            const card = document.getElementById(`empty-card-${id}`);
            if (card) {
                card.classList.add('is-hidden-card');
                card.classList.remove('cursor-grab');
                card.style.visibility = 'hidden'; 
                card.style.pointerEvents = 'none'; // 讓它在該位置保留留白空間，但無法互動
                checkPanelsEmpty();
            }
        }

        // 新增：檢查左右面板是否已經沒有可見卡片，若無則隱藏整個面板使地圖延展
        function checkPanelsEmpty() {
            ['left-panel', 'right-panel'].forEach(panelId => {
                const panel = document.getElementById(panelId);
                if (!panel) return;
                
                // 檢查是否還有可見的子元素 (非拖曳殘影 且 非隱藏的留白卡片)
                const hasVisible = Array.from(panel.children).some(child => 
                    child.style.display !== 'none' && 
                    !child.classList.contains('sortable-ghost') && 
                    !child.classList.contains('sortable-drag') &&
                    !child.classList.contains('is-hidden-card')
                );
                
                if (!hasVisible && panel.children.length > 0) {
                    panel.style.display = 'none'; // 如果全部卡片都隱藏了，才將整個面板收合
                } else {
                    panel.style.display = ''; // 只要有一張可見，就維持面板顯示 (隱藏的卡片會變透明留白)
                }
            });
            
            // 面板消失後，觸發地圖重繪以完美填滿新空間
            if (map) {
                setTimeout(() => map.invalidateSize(), 150);
            }
        }

        function formatCoordinateString(input) {
            if (!input) return input;
            const parts = input.split(',');
            if (parts.length === 2) {
                const lat = parseFloat(parts[0].trim());
                const lng = parseFloat(parts[1].trim());
                if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                    const formatNum = (num) => Number(num.toFixed(6));
                    return `${formatNum(lat)}, ${formatNum(lng)}`;
                }
            }
            return input;
        }

        function exportCSV() {
            updateDataFromInputs(); 

            // 將地圖標籤加在 C 欄 (標題之後，案名之前)
            const headers = ['ID', '標題', '地圖標籤', '案名', '地址或座標', '面積標題', '面積內容', '分區標題', '分區內容', '總價標題', '總價內容', '自訂1標題', '自訂1內容', '自訂2標題', '自訂2內容', '自訂3標題', '自訂3內容'];
            const rows = propertyData.map(d => [
                d.id, d.title, d.label, d.name, d.address, d.area_name, d.area, d.zoning_name, d.zoning, d.price_name, d.price, d.c1_name, d.c1_val, d.c2_name, d.c2_val, d.c3_name, d.c3_val
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(val => `"${(val !== null && val !== undefined ? val : '').toString().replace(/"/g, '""')}"`).join(','))
            ].join('\n');

            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '不動產競品資料範本.csv';
            link.click();
            URL.revokeObjectURL(url);
            showToast('CSV 匯出成功！已完整備份所有資料（包含目前隱藏的欄位）。');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                
                // 檢查是否出現 UTF-8 解析失敗常見的亂碼字元 (Unicode replacement character)
                // 若有，表示很可能是 Excel 存檔時使用了本機的 Big5 編碼
                if (text.includes('')) {
                    const readerBig5 = new FileReader();
                    readerBig5.onload = function(eBig5) {
                        parseCSVAndFill(eBig5.target.result);
                        event.target.value = '';
                    };
                    readerBig5.readAsText(file, 'Big5');
                } else {
                    parseCSVAndFill(text);
                    event.target.value = ''; 
                }
            };
            reader.readAsText(file, 'UTF-8'); 
        }

        function parseCSVAndFill(csvText) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                if (inQuotes) {
                    if (char === '"') {
                        if (csvText[i + 1] === '"') {
                            currentCell += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentCell += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        currentRow.push(currentCell);
                        currentCell = '';
                    } else if (char === '\n' || char === '\r') {
                        currentRow.push(currentCell);
                        rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                        if (char === '\r' && csvText[i + 1] === '\n') i++; 
                    } else {
                        currentCell += char;
                    }
                }
            }
            if (currentCell || csvText[csvText.length - 1] === ',' || csvText[csvText.length - 1] === '"') { 
                currentRow.push(currentCell);
            }
            if (currentRow.length > 0) rows.push(currentRow);

            if (rows.length < 2) {
                showToast('找不到有效的資料，請確認 CSV 格式是否正確。', true);
                return;
            }

            // 動態解析標題欄位索引，完美相容新舊版與欄位變動
            const hRow = rows[0];
            const getIdx = (name, defaultIdx) => hRow.indexOf(name) !== -1 ? hRow.indexOf(name) : defaultIdx;
            
            const iTitle = getIdx('標題', 1);
            const iLabel = getIdx('地圖標籤', -1); // 新版在索引 2，舊版可能在 16 或沒有
            const iName = getIdx('案名', 2);
            const iAddr = getIdx('地址或座標', 3);
            const iAreaN = getIdx('面積標題', 4);
            const iAreaV = getIdx('面積內容', 5);
            const iZonN = getIdx('分區標題', 6);
            const iZonV = getIdx('分區內容', 7);
            const iPriceN = getIdx('總價標題', 8);
            const iPriceV = getIdx('總價內容', 9);
            const iC1N = getIdx('自訂1標題', 10);
            const iC1V = getIdx('自訂1內容', 11);
            const iC2N = getIdx('自訂2標題', 12);
            const iC2V = getIdx('自訂2內容', 13);
            const iC3N = getIdx('自訂3標題', 14);
            const iC3V = getIdx('自訂3內容', 15);

            let updatedCount = 0;
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                // 只要有基本ID和標題就處理，避免 Excel 裁掉後方空白欄位導致錯誤
                if (row.length < 3) continue; 
                
                let id = parseInt(row[0]);
                // 處理舊版匯出時 0 變成空字串的問題，若為空且標題為本案則視為 0
                if (isNaN(id) && row[iTitle] === '本案') {
                    id = 0;
                }
                if (isNaN(id) || id < 0 || id > 5) continue; 

                document.getElementById(`in-name-${id}`).value = row[iName] || '';
                document.getElementById(`in-address-${id}`).value = row[iAddr] || '';
                document.getElementById(`in-area-name-${id}`).value = row[iAreaN] || '';
                document.getElementById(`in-area-${id}`).value = row[iAreaV] || '';
                document.getElementById(`in-zoning-name-${id}`).value = row[iZonN] || '';
                document.getElementById(`in-zoning-${id}`).value = row[iZonV] || '';
                document.getElementById(`in-price-name-${id}`).value = row[iPriceN] || '';
                document.getElementById(`in-price-${id}`).value = row[iPriceV] || '';
                document.getElementById(`in-c1name-${id}`).value = row[iC1N] || '';
                document.getElementById(`in-c1val-${id}`).value = row[iC1V] || '';
                document.getElementById(`in-c2name-${id}`).value = row[iC2N] || '';
                document.getElementById(`in-c2val-${id}`).value = row[iC2V] || '';
                document.getElementById(`in-c3name-${id}`).value = row[iC3N] || '';
                document.getElementById(`in-c3val-${id}`).value = row[iC3V] || '';
                
                // 載入自訂地圖標籤 (若無則保持預設值不覆寫)
                if (iLabel !== -1 && row[iLabel] !== undefined && row[iLabel] !== '') {
                    document.getElementById(`in-label-${id}`).value = row[iLabel];
                }

                updatedCount++;
            }

            if (updatedCount > 0) {
                showToast('CSV 匯入成功！正在為您自動更新圖表...');
                generatePresentation(); 
            } else {
                showToast('找不到有效的資料，請確認 CSV 格式是否正確。', true);
            }
        }

        async function generatePresentation() {
            updateDataFromInputs();
            renderDisplayCards();
            document.getElementById('loading-overlay').classList.remove('hidden');
            scrollToMap();

            setTimeout(async () => {
                await updateMapMarkers();
                document.getElementById('loading-overlay').classList.add('hidden');
            }, 100);
        }

        async function takeScreenshot() {
            const btn = document.getElementById('screenshot-btn');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = '<svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 擷取中...';
            btn.disabled = true;

            const targetElement = document.getElementById('presentation-board');
            
            try {
                const dataUrl = await htmlToImage.toPng(targetElement, {
                    backgroundColor: '#f1f5f9',
                    pixelRatio: 2
                });

                const link = document.createElement('a');
                link.download = '不動產定位與競品展示圖.png';
                link.href = dataUrl;
                link.click();
            } catch (error) {
                console.error("截圖發生錯誤:", error);
                showToast("截圖失敗，請確保網路連線正常或稍後再試。", true);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        function initResizer() {
            const resizerHandle = document.getElementById('resizer-handle');
            const boardContainer = document.getElementById('board-container');
            let isResizing = false;

            if (resizerHandle) {
                resizerHandle.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    document.body.classList.add('cursor-col-resize-force', 'select-none-force');
                    e.preventDefault();
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;
                    
                    const parentRect = boardContainer.parentElement.getBoundingClientRect();
                    const parentCenter = parentRect.left + (parentRect.width / 2);
                    
                    let halfWidth = e.clientX - parentCenter;
                    let newWidth = halfWidth * 2;
                    
                    if (newWidth < 800) newWidth = 800;
                    if (newWidth > parentRect.width) newWidth = parentRect.width;

                    boardContainer.style.width = newWidth + 'px';
                    
                    if (map) {
                        map.invalidateSize();
                    }
                });

                window.addEventListener('mouseup', () => {
                    if (isResizing) {
                        isResizing = false;
                        document.body.classList.remove('cursor-col-resize-force', 'select-none-force');
                        if (map) map.invalidateSize();
                    }
                });
            }
        }

        function initMap() {
            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([25.033964, 121.564468], 14);

            currentTileLayer = L.tileLayer(mapStyles.voyager.url, {
                attribution: mapStyles.voyager.attr,
                subdomains: 'abcd',
                maxZoom: 20,
                maxNativeZoom: 19,
                crossOrigin: true
            }).addTo(map);

            markerLayerGroup = L.featureGroup().addTo(map);
            
            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function changeMapStyle(styleKey, btn) {
            document.querySelectorAll('.map-style-btn').forEach(el => {
                el.classList.remove('bg-slate-800', 'text-white');
                el.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            
            btn.classList.add('bg-slate-800', 'text-white');
            btn.classList.remove('text-slate-600', 'hover:bg-slate-100');

            document.getElementById('map').style.backgroundColor = '#f1f5f9';

            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            
            currentTileLayer = L.tileLayer(mapStyles[styleKey].url, {
                attribution: mapStyles[styleKey].attr,
                subdomains: 'abcd',
                maxZoom: 20,
                maxNativeZoom: 19,
                crossOrigin: true,
                className: mapStyles[styleKey].className || ''
            }).addTo(map);
        }

        function parseLatLng(input) {
            const parts = input.split(',');
            if (parts.length === 2) {
                const lat = parseFloat(parts[0].trim());
                const lng = parseFloat(parts[1].trim());
                if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                    return [lat, lng];
                }
            }
            return null;
        }

        async function geocodeAddress(address) {
            if (!address || address === '-') return null;
            
            const latLng = parseLatLng(address);
            if (latLng) return latLng;
            
            try {
                const url = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&singleLine=${encodeURIComponent(address)}&maxLocations=1`;
                const response = await fetch(url);
                if (!response.ok) return null;
                const data = await response.json();
                
                if (data && data.candidates && data.candidates.length > 0) {
                    return [parseFloat(data.candidates[0].location.y), parseFloat(data.candidates[0].location.x)];
                }
                return null;
            } catch (error) {
                console.error("Geocoding 發生錯誤:", error);
                return null;
            }
        }

        async function updateMapMarkers() {
            markerLayerGroup.clearLayers();
            let validPointsCount = 0;

            for (const data of propertyData) {
                if (!data.address.trim() || data.address === '-') continue;

                const location = await geocodeAddress(data.address);
                
                if (location) {
                    const isMain = data.type === 'main';
                    
                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="${isMain ? 'marker-main' : 'marker-comp'}" data-label="${data.label}">${isMain ? '★' : data.label}</div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16],
                        popupAnchor: [0, -16]
                    });

                    const marker = L.marker(location, { icon: customIcon });
                    const popupContent = `<div class="font-bold p-1 ${isMain ? 'text-red-700' : 'text-blue-700'} text-base">${isMain ? '★ ' : ''}${data.name || data.title}</div><div class="text-xs text-gray-500 px-1 pb-1 truncate" title="${data.address}">${data.address}</div>`;
                    marker.bindPopup(popupContent);

                    markerLayerGroup.addLayer(marker);
                    validPointsCount++;

                    await new Promise(resolve => setTimeout(resolve, 200));
                }
            }

            if (validPointsCount > 0) {
                const bounds = markerLayerGroup.getBounds();
                if (validPointsCount > 1) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                } else {
                    map.setView(bounds.getCenter(), 16);
                }
            }
        }
    </script>
