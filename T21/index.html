<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map 互動定位點測試工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 設定地圖容器的高度 */
        #map {
            height: 500px;
            width: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="bg-white rounded-lg shadow p-6 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2">Google Map 互動定位工具</h1>
                <p class="text-gray-600">點擊地圖上的任意位置即可新增定位點標記。</p>
            </div>
            <button onclick="clearMarkers()" class="mt-4 md:mt-0 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow transition duration-200">
                清除所有標記
            </button>
        </header>

        <!-- 地圖將會渲染在這個 div 裡面 -->
        <div id="map" class="bg-gray-200 flex items-center justify-center relative">
            <p class="text-gray-500">正在載入地圖...</p>
        </div>
        
        <div class="mt-4 bg-blue-50 border-l-4 border-blue-400 p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-blue-700">
                        <strong>目前使用的金鑰：</strong> <code>AIzaSyA61ryvj5cZVBn1q8E9iJoIncJYSLHrvT8</code><br>
                        <span class="text-xs text-gray-500">如果畫面顯示「API 金鑰網域限制」錯誤，請依照錯誤畫面上的指示，至 Google Cloud Console 將當前網域加入白名單。</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Google Maps API 邏輯 -->
    <script>
        let map;
        let markersArray = []; // 用來儲存所有標記的陣列

        // 捕捉 API 金鑰驗證錯誤 (例如 Referer 限制問題)
        window.gm_authFailure = function() {
            const mapDiv = document.getElementById("map");
            const currentHost = window.location.hostname;
            mapDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full w-full p-6 text-center bg-red-50 border-2 border-red-200 rounded-lg absolute inset-0 z-10">
                    <svg class="w-12 h-12 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-red-600 font-bold mb-2 text-lg">地圖載入失敗：API 金鑰網域限制</p>
                    <div class="text-gray-700 text-sm max-w-lg text-left bg-white p-4 rounded shadow">
                        <p class="mb-2">您的 API 金鑰設定了「HTTP 參照網址」限制，拒絕了來自當前預覽環境的請求。</p>
                        <p class="mb-2 font-bold text-gray-900">🛠️ 解決步驟：</p>
                        <ol class="list-decimal list-inside space-y-1 mb-3">
                            <li>前往 <a href="https://console.cloud.google.com/" target="_blank" class="text-blue-600 underline">Google Cloud Console</a>。</li>
                            <li>找到您的 API 金鑰並點擊編輯。</li>
                            <li>在「網站限制」中新增以下通用網址：</li>
                        </ol>
                        <code class="block bg-gray-100 text-red-600 p-3 rounded mt-2 font-mono text-sm select-all text-center border border-gray-200">https://*.scf.usercontent.goog/*</code>
                    </div>
                </div>
            `;
        };

        // 初始化地圖的函數
        function initMap() {
            // 設定中心點座標 (台北 101)
            const centerLocation = { lat: 25.033964, lng: 121.564468 };

            // 建立地圖實例
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 14,
                center: centerLocation,
                mapTypeId: "roadmap",
                streetViewControl: false, // 隱藏街景小人以保持介面簡潔
            });

            // 加上預設中心點標記
            addMarker(centerLocation, "台北 101 (預設點)");

            // 監聽地圖點擊事件，動態加入新標記
            map.addListener("click", (event) => {
                const clickedLocation = event.latLng;
                addMarker(clickedLocation, "自訂定位點");
            });
        }

        // 獨立出一個新增標記的函數
        function addMarker(location, titlePrefix) {
            // 由於 location 可能是經緯度物件或是 google.maps.LatLng 實例，這裡做個統一處理取得經緯度文字
            const lat = typeof location.lat === 'function' ? location.lat() : location.lat;
            const lng = typeof location.lng === 'function' ? location.lng() : location.lng;
            
            const marker = new google.maps.Marker({
                position: location,
                map: map,
                title: titlePrefix,
                animation: google.maps.Animation.DROP
            });

            // 設定點擊標記時跳出的資訊視窗
            const infoWindow = new google.maps.InfoWindow({
                content: `
                    <div class='p-2 min-w-[150px]'>
                        <h3 class='font-bold text-gray-800 text-base mb-1'>${titlePrefix}</h3>
                        <p class='text-xs text-gray-600 mb-1'><strong>緯度:</strong> ${lat.toFixed(5)}</p>
                        <p class='text-xs text-gray-600'><strong>經度:</strong> ${lng.toFixed(5)}</p>
                    </div>
                `
            });

            marker.addListener("click", () => {
                infoWindow.open(map, marker);
            });

            // 將標記存入陣列，以便後續清除
            markersArray.push(marker);
        }

        // 清除所有地圖上的標記
        function clearMarkers() {
            for (let i = 0; i < markersArray.length; i++) {
                markersArray[i].setMap(null); // 將標記從地圖上移除
            }
            markersArray = []; // 清空陣列
        }
    </script>

    <!-- 載入 Google Maps JavaScript API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA61ryvj5cZVBn1q8E9iJoIncJYSLHrvT8&callback=initMap">
    </script>
</body>
</html>
