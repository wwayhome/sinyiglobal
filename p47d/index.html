    <style>
        :root {
            --bg-main: #f1f5f9;
            --bg-canvas: #ffffff;
            --bg-card: #f8fafc;
            --bg-card-hover: #f1f5f9;
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --accent-text: #1d4ed8;
            --badge-car-bg: #dcfce7;
            --badge-car-text: #15803d;
            --badge-warn-bg: #fef3c7;
            --badge-warn-text: #b45309;
            --heat-low: #eff6ff;
            --heat-mid: #3b82f6;
            --heat-high: #1e40af;
            --heat-text-high: #ffffff;
        }

        [data-theme="dark"] {
            --bg-main: #020617;
            --bg-canvas: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
            --accent: #38bdf8;
            --accent-light: rgba(56, 189, 248, 0.15);
            --accent-text: #7dd3fc;
            --badge-car-bg: rgba(34, 197, 94, 0.2);
            --badge-car-text: #4ade80;
            --badge-warn-bg: rgba(245, 158, 11, 0.2);
            --badge-warn-text: #fbbf24;
            --heat-low: #1e293b;
            --heat-mid: #0284c7;
            --heat-high: #38bdf8;
            --heat-text-high: #0f172a;
        }

        [data-theme="gold"] {
            --bg-main: #ece8e1;
            --bg-canvas: #faf8f5;
            --bg-card: #f3efe6;
            --bg-card-hover: #e8e2d5;
            --text-main: #292524;
            --text-sub: #57534e;
            --text-muted: #a8a29e;
            --border-color: #dcd6c8;
            --accent: #b45309;
            --accent-light: #fef3c7;
            --accent-text: #92400e;
            --badge-car-bg: #e0e7ff;
            --badge-car-text: #3730a3;
            --badge-warn-bg: #fee2e2;
            --badge-warn-text: #991b1b;
            --heat-low: #f5f5f4;
            --heat-mid: #d97706;
            --heat-high: #78350f;
            --heat-text-high: #ffffff;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.2s, color 0.2s;
        }

        .ppt-canvas {
            background-color: var(--bg-canvas);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
            transition: all 0.25s ease;
        }

        .ppt-canvas.ratio-16-9 {
            max-width: 1600px;
            min-height: 900px;
        }

        .ppt-canvas.ratio-4-3 {
            max-width: 1280px;
            min-height: 960px;
        }

        .theme-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .theme-border {
            border-color: var(--border-color);
        }

        .theme-text-sub {
            color: var(--text-sub);
        }

        .theme-text-muted {
            color: var(--text-muted);
        }

        .theme-accent-bg {
            background-color: var(--accent);
            color: #fff;
        }

        .theme-accent-light {
            background-color: var(--accent-light);
            color: var(--accent-text);
        }

        .export-btn {
            opacity: 0.25;
            transition: opacity 0.2s;
        }
        .theme-card:hover .export-btn,
        .ppt-canvas:hover .export-btn {
            opacity: 1;
        }
    header.sticky {background:#dfeaf5;color:#193550;padding:14px 18px;border-color:#acbfd4}
header.sticky [class*="bg-slate-8"],header.sticky input[type=number],.year-controls select {background:#fff;color:#193550;border-color:#a4b7c9}
header.sticky [class*="text-slate-"],header.sticky #buildingTitleInput {color:#284661}
header.sticky .text-xs,header.sticky select,header.sticky input {font-size:14px}
header.sticky button,header.sticky select {min-height:36px}
.year-controls {display:flex;align-items:center;gap:8px;font-weight:600}
.year-controls select {border:1px solid #a4b7c9;padding:4px;border-radius:6px}
#bubbleChartContainer {display:block}
#bubbleChartContainer svg {display:block;width:100%;height:auto}
.price-key {display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.price-key div {border-left:3px solid var(--accent);padding:4px 8px;background:var(--bg-canvas)}
.price-key strong,.price-key span {display:block}
.price-key strong {color:var(--accent-text);font-size:18px}
.price-key small,.price-key span {font-size:12px;color:var(--text-sub)}
[data-theme="dark"] {--text-muted:#b7c9dd;--border-color:#516880;--heat-mid:#075985;--accent-light:#173957}
[data-theme="dark"] .theme-accent-bg {color:#082638}
[data-theme="dark"] .trade-card {background:#172b42;color:#f1f5f9}
.controls {background:#f5f8fb;color:#223950;border-bottom:1px solid #b8c8d6;padding:0 clamp(12px,3vw,48px)}
.control-row {max-width:1500px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.control-row+.control-row {border-top:1px solid #d1dce4}
.controls input:not([type=checkbox]),.controls select,.controls button,.upload-action {font:inherit;border-radius:6px}
.controls select,.controls input:not([type=checkbox]),#toggleLabelsBtn {background:white;color:#253c50;border:1px solid #b3c4d1;padding:6px 9px}
.controls .title-control {display:flex;align-items:center;gap:10px;flex:1;min-width:220px;font-weight:600}
.title-control input {min-width:0;flex:1}
.upload-action,.save-action {padding:8px 15px;cursor:pointer;font-weight:700;background:#155873;color:white}
.controls .save-action {background:#173b54}
.settings {font-size:14px;gap:12px 20px}
.settings>div {display:flex;align-items:center;gap:6px}
.settings #carPriceInput {width:65px}
.settings .ratio-btn {padding:6px 8px;color:#243f52;background:#e4ebf1}
.settings [data-ratio].bg-blue-600 {color:white;background:#255f7a}
.settings .ratio-btn:first-child {border-radius:5px}
.bubble-tip {position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-100%);padding:6px 9px;border-radius:6px;background:#102d42;color:white;font-size:13px;white-space:nowrap}
#module2 {align-self:start}
#bubbleChartContainer {position:relative;height:360px;min-height:0;flex:none}
#bubbleChartContainer.split {height:auto}
.band-chart:empty {display:grid;place-items:center;color:var(--text-sub)}
.band-chart:empty::after {content:"此組無成交紀錄"}
#bubbleChartContainer svg {position:absolute;inset:0;width:100%;height:100%}
.annual-control {align-self:flex-start;font-size:14px;font-weight:600;margin:6px 0}
#module2.annual .theme-text-sub:has(.rounded-full) {display:none}
.floor-more {width:100%;font-size:13px;color:var(--accent-text)}
.floor-more summary {cursor:pointer;padding:4px}
.floor-more[open] .closed-label,.floor-more:not([open]) .open-label {display:none}
.band-chart {position:relative;height:280px;width:100%}
#bubbleChartContainer > strong {display:block;margin:8px 0 2px;color:var(--accent-text)}
#module4.hide-building .building-detail {display:none}
.floor-mean {font-size:18px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.door-label {display:inline-block;border:1px solid currentColor;border-radius:5px;padding:1px 5px;font-size:14px;font-weight:700;color:var(--text-main)}
#doorFilters {display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:13px}
#doorFilters button {padding:3px 9px;border:1px solid var(--border-color);border-radius:7px;color:var(--text-main)}
#doorFilters button[aria-pressed=true] {background:var(--accent-text);color:var(--bg-canvas)}
#module3 .floor-mean {font-size:17px;line-height:1.15;margin:4px 0 2px}
#module3 .trade-card {min-width:min(100%,285px);overflow-x:auto}
.trade-lines {white-space:nowrap}
.trade-head {display:flex;align-items:center;gap:6px;font-size:12px}
.trade-head strong {font-size:20px}
.trade-head small,.trade-facts {font-size:11px}
.trade-head .door-label {font-size:11px;padding:0 4px}
/* Keep the report at a readable print width, independent of the toolbar. */
main:has(#pptCanvas) {display:block;overflow-x:auto;padding:20px}
#pptCanvas {min-width:1220px;margin-inline:auto;container-type:inline-size;padding:24px;gap:18px;transition:none;font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-variant-numeric:tabular-nums;line-height:1.45}
#pptCanvas.ratio-16-9 {width:1600px}
#pptCanvas.ratio-4-3 {width:1280px}
#pptCanvas:not(.ratio-16-9):not(.ratio-4-3) {max-width:1760px}
#module1 > div:first-child > div {display:grid;gap:9px;width:100%}
#displayBuildingTitle {font-size:28px;line-height:1.3;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
#buildingProfileBadges {gap:6px}
#buildingProfileBadges span {line-height:1.55}
#kpiGrid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
#kpiGrid > div {padding:14px 16px;gap:5px;border-radius:10px}
#kpiGrid .text-3xl {font-size:clamp(22px,1.85cqw,30px);line-height:1.15;white-space:nowrap}
#kpiGrid > div > div:last-child {flex-wrap:wrap;column-gap:8px;row-gap:3px}
#kpiGrid > div > div:last-child span {white-space:nowrap}
#pptCanvas > .grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
#module2,#module3 {grid-column:auto}
#pptCanvas :is(#module2,#module3,#module4) {padding:16px;min-width:0;border-radius:12px}
#pptCanvas h2 {font-size:17px;line-height:1.4}
#module2 > div:first-child,#module3 > div:first-child {align-items:flex-start;flex-wrap:wrap;gap:6px 12px}
#pptCanvas .annual-control {margin:5px 0}
#doorFilters {gap:5px;margin:8px 0 12px}
#doorFilters button,#module4 button,.settings label,.settings button {white-space:nowrap}
#stackingPlanContainer {gap:8px;justify-content:flex-start}
#stackingPlanContainer > div {padding:6px;gap:8px}
#stackingPlanContainer > div > div:first-child {width:82px}
#module3 .trade-card {flex:1 1 242px;min-width:min(100%,242px);padding:7px 9px}
.trade-head {gap:6px}
.trade-facts {line-height:1.55}
#module4 > div:first-child {gap:8px 16px}
#module4 table {font-size:12px;line-height:1.5}
#module4 th,#module4 td {padding:8px 5px;vertical-align:middle}
#module4 th {font-size:11px;letter-spacing:0;background:var(--bg-canvas);color:var(--text-sub)}
#module4 td {border-bottom:1px solid var(--border-color)}
#module4 tr:last-child td {border-bottom:none}
#module4 td:nth-child(2) {max-width:15em;overflow-wrap:anywhere}
#module4 td:nth-child(4) span {display:block;width:fit-content;white-space:nowrap}
#module4 td:nth-child(5),#module4 td:nth-child(6),#module4 td:nth-child(7) {font-variant-numeric:tabular-nums}
[data-theme="dark"] #pptCanvas {--text-muted:#b7c5d6}
.control-row {gap:10px 16px}
.controls .settings {row-gap:7px}
.controls .settings input[type=checkbox],.annual-control input {accent-color:#1f6383}
#module4 table {font-size:14px}
#module4 th {font-size:13px}
#module4 tbody td {font-size:14px}
#module4 tbody td [class*="text-[1"], #module4 tbody td.building-detail {font-size:12px}
#module4 > div:first-child > div {flex-wrap:wrap}
.detail-switch {font-size:14px;white-space:nowrap;margin-right:8px}
.full-actions {display:flex;gap:6px;flex-wrap:wrap}.full-actions button {white-space:nowrap}
#copyDialog {position:fixed;inset:0;margin:auto;padding:24px;width:min(340px,90vw);border:1px solid #9bb1c5;border-radius:14px;color:#19344b;background:white;box-shadow:0 14px 54px #13273a40}
#copyDialog::backdrop {background:#142b414f}
#copyHeading {font-size:19px}
#copyStage {margin:8px 0 14px}
#copyProgress {width:100%;accent-color:#16749b}
#copyProgress {appearance:none;border:0;border-radius:8px;overflow:hidden;height:9px;background:#dce6ed;color:#16749b}
#copyProgress::-webkit-progress-bar {background:#dce6ed}
#copyProgress::-webkit-progress-value {background:repeating-linear-gradient(110deg,#197caa 0 9px,#3399be 9px 18px);background-size:38px 100%;animation:copy-moving 1s linear infinite}
#copyProgress::-moz-progress-bar {background:#197caa}
@keyframes copy-moving {to {background-position:38px 0}}
#copyDialog[data-state="success"] strong {color:#147245}
#copyDialog[data-state="success"] progress::-webkit-progress-value {background:#198754;animation:none}
#copyDialog[data-state="success"] progress::-moz-progress-bar {background:#198754}
@media(prefers-reduced-motion:reduce){#copyProgress::-webkit-progress-value{animation:none}}
</style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部控制列 -->
    <header class="controls">
      <div class="control-row">
        <label class="upload-action">匯入 Excel<input type="file" id="excelUpload" accept=".xls,.xlsx" hidden></label>
        <label class="title-control">簡報標題<input id="buildingTitleInput" value="中央商業｜松山區復興北路１８１號｜實價登錄行情分析"></label>
        <div class="full-actions"><button class="save-action" onclick="exportElement('pptCanvas','實價登錄簡報圖表')">匯出全頁 PNG</button> <button type="button" class="save-action" onclick="copyImage('pptCanvas')" title="複製全頁圖片">複製全頁圖片</button></div>
      </div>
      <div class="control-row settings">

        // 樓層解析：支援 "12", "08,09", "05,B01", "05", "14" 或中文樓層
        function parseFloorInfo(floorStr) {
            const raw = String(floorStr ?? '').trim();
            const floors = [];
            const digits = '零一二三四五六七八九';
            for (const part of raw.normalize('NFKC').split(/[,、/]/)) {
                const match = part.trim().match(/^(B|地下)?(\d+|[一二三四五六七八九]?十[一二三四五六七八九]?|[一二三四五六七八九])(?:樓|層|F)?$/i);
                if (!match) continue;
                const token = match[2];
                let n = Number(token);
                if (Number.isNaN(n)) {
                    const [tens, units] = token.split('十');
                    n = units === undefined ? digits.indexOf(token)
                        : (tens ? digits.indexOf(tens) : 1) * 10 + (units ? digits.indexOf(units) : 0);
                }
                const floor = match[1] ? -n : n;
                if (!floors.includes(floor)) floors.push(floor);
            }
            return {num: floors[0] ?? null, floors, raw,
                label: floors.map(n => n < 0 ? 'B' + -n : n + 'F').join('、') || '樓層未明'};
        }

        // 解析民國日期 "1141114" -> { year: 114, month: 11, day: 14, display: "114/11/14", short: "114/11", sortVal: 1141114 }
        function parseRocDate(dateVal) {
            const s = String(dateVal || '').replace(/[^0-9]/g, '').trim();
            if (s.length === 7) {
                const y = parseInt(s.slice(0, 3), 10);
                const m = parseInt(s.slice(3, 5), 10);
                const d = parseInt(s.slice(5, 7), 10);
                return {
                    year: y,
                    month: m,
                    day: d,
                    display: `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`,
                    short: `${y}/${String(m).padStart(2, '0')}`,
                    sortVal: parseInt(s, 10),
                    numericYear: y + (m - 0.5) / 12
                };
            }
            if (s.length === 6) {
                const y = parseInt(s.slice(0, 2), 10);
                const m = parseInt(s.slice(2, 4), 10);
                const d = parseInt(s.slice(4, 6), 10);
                return {
                    year: y,
                    month: m,
                    day: d,
                    display: `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`,
                    short: `${y}/${String(m).padStart(2, '0')}`,
                    sortVal: parseInt(s, 10),
                    numericYear: y + (m - 0.5) / 12
                };
            }
            return { year: 110, month: 1, day: 1, display: String(dateVal || '-'), short: '-', sortVal: 0, numericYear: 110 };
        }

        function processAllData(raw) {
            // 依序號建立土地、建物、車位索引
            const landBySeq = {};
            (raw.lands || []).forEach(l => {

            (raw.cars || []).forEach(c => {

                    areaByUse.set(use, (areaByUse.get(use) || 0) + Number(b.areaPing || 0));

                    pubAreaPing += Number(b.pubAreaPing || 0);

                const totalAreaPing = Number(item.totalAreaPing || bldgTotalArea || 0);
                const carAreaPing = Number(item.carAreaPing || cars.reduce((s, c) => s + Number(c.areaPing || 0), 0));
                // 主建物坪數 = 總建坪 - 陽台 - 公設(含車位)
                const mainAreaPing = Math.max(0, totalAreaPing - subAreaPing - pubAreaPing);

                // 車位統計

                const carType = cars.length > 0 ? cars[0].type : (item.carCountDesc && item.carCountDesc !== '0個' ? item.carCountDesc : '');
                const carFloors = [...new Set(cars.map(c => c.floor).filter(Boolean))].join('、');
                const recordedCarPriceWan = Number(item.carPriceWan || cars.reduce((s, c) => s + Number(c.priceWan || 0), 0));

                // 單價計算：預設採用表格內的單價 (萬/坪)
                let finalUnitPriceWan = Number(item.unitPriceWan || 0);
                let isCarAdjusted = false;
                let effectiveCarPriceWan = recordedCarPriceWan;

                // 若勾選「車位價格未拆且面積大於零時重算單價」，且該筆有車位但車位價為0
                if (state.deductCarWhenZero && state.defaultCarPriceWan > 0 && carCount > 0 && carAreaPing > 0 && recordedCarPriceWan === 0) {
                    effectiveCarPriceWan = state.defaultCarPriceWan * carCount;
                    const netPriceWan = Math.max(0, Number(item.totalPriceWan) - effectiveCarPriceWan);
                    const netAreaPing = Math.max(1, totalAreaPing - carAreaPing);
                    finalUnitPriceWan = netPriceWan / netAreaPing;
                    isCarAdjusted = true;
                }

                // 土地持分統計
                const landAreaPing = Number(item.landAreaPing || lands.reduce((s, l) => s + Number(l.areaPing || 0), 0));

                return {

                    landCount: lands.length,
                    landZone,
                    bldgCount: item.buildingCount ?? bldgs.length,
                    bldgUse: item.primaryUse || '用途未提供',
                    bldgMaterial: bldgs[0]?.material || '鋼骨鋼筋混凝土造',
                    carCount,
                    carType,
                    carFloors,
                    cars,
                    reportedParkingTotal: Number(item.carPriceWan || 0),
                    recordedCarPriceWan,
                    effectiveCarPriceWan,
                    isCarAdjusted,
                    note: item.note || ''
                };
            });
        }

        // =========================================================================
        // 3. 視覺渲染函數 (KPI 卡、氣泡圖、垂直剖面圖、關聯明細表)
        // =========================================================================
        const fromYear = document.getElementById('fromYear');
        const toYear = document.getElementById('toYear');
        const excludeFirstFloor = document.getElementById('excludeFirstFloor');
        excludeFirstFloor.addEventListener('change', renderAll);
        const fromFloor = document.getElementById('fromFloor');
        const toFloor = document.getElementById('toFloor');
        function resetYears(raw) {
            selectedDoors.clear();
            const years = [...new Set(raw.main.map(row => parseRocDate(row.date))
                .filter(date => date.sortVal > 0).map(date => date.year))].sort((a,b) => a-b);
            for (const select of [fromYear, toYear]) {
                select.replaceChildren(...years.map(year => new Option(year + ' 年', year)));
                select.disabled = !years.length;
            }
            const floors = [...new Set(raw.main.flatMap(row => parseFloorInfo(row.floorStr).floors || []))].sort((a,b) => a-b);
            for (const select of [fromFloor,toFloor]) {
                select.replaceChildren(new Option('不限',''), ...floors.map(n => new Option(n < 0 ? 'B' + -n : n + ' 樓', n)));
            }
            toYear.selectedIndex = years.length - 1;
        }
        for (const [low, high] of [[fromYear,toYear],[fromFloor,toFloor]]) {
            for (const select of [low, high]) {
                select.addEventListener('change', () => {
                    if (low.value && high.value && +low.value > +high.value) {
                        (select === low ? high : low).value = select.value;
                    }
                    renderAll();
                });
            }
        }

        function renderAll() {
            processedRecords = processAllData(currentRawData).filter(r => !fromYear.value || (r.dateInfo.year >= +fromYear.value && r.dateInfo.year <= +toYear.value));
            if (excludeFirstFloor.checked) {
                processedRecords = processedRecords.filter(r => !r.floorInfo.floors.includes(1));
            }
            if (fromFloor.value || toFloor.value) {
                const low = fromFloor.value ? Number(fromFloor.value) : -Infinity;
                const high = toFloor.value ? Number(toFloor.value) : Infinity;
                processedRecords = processedRecords.filter(r => r.floorInfo.floors?.some(n => n >= low && n <= high));
            }
            if (!processedRecords.length) {
                for (const id of ['buildingProfileBadges','bubbleChartContainer','doorFilters','stackingPlanContainer','transactionTableBody']) document.getElementById(id).replaceChildren();
                document.getElementById('kpiGrid').textContent = '所選年份與樓層沒有成交紀錄';
                return;
            }

            renderBuildingBadges();
            renderKPICards();
            renderBubbleChart();
            renderStackingPlan();
            renderTable();
        }

        function renderBuildingBadges() {
            const r0 = processedRecords[0];
            // 計算屋齡 (民國115年 - 建築完成087年 = 28年)
            let ageStr = '完工年月未提供';
            const completeRec = processedRecords.find(r => r.completeDate && r.completeDate.length >= 6);
            if (completeRec) {
                const cy = parseInt(completeRec.completeDate.slice(0, 3), 10);
                if (!isNaN(cy)) ageStr = `屋齡約 ${new Date().getFullYear() - 1911 - cy} 年 (${cy}年完工)`;
            }

            const container = document.getElementById('buildingProfileBadges');
            container.innerHTML = `
                <span class="px-2.5 py-1 rounded-full theme-accent-light"><i class="fa-solid fa-location-dot mr-1"></i>${r0.address.match(/^.*?(?:區|鄉|鎮)/)?.[0] || '行政區未提供'}</span>
                <span class="px-2.5 py-1 rounded-full theme-card">總樓高 ${r0.totalFloors}F</span>
                <span class="px-2.5 py-1 rounded-full theme-card">${ageStr}</span>
                <span class="px-2.5 py-1 rounded-full theme-card">${r0.landZone}</span>
                <span class="px-2.5 py-1 rounded-full theme-card">${r0.bldgMaterial}｜<span data-primary-use></span></span>
            `;
            container.querySelector('[data-primary-use]').textContent = r0.bldgUse;
        }

        function renderKPICards() {
            const prices = processedRecords.map(r => r.unitPriceWan);
            const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
            const minRec = processedRecords.reduce((prev, curr) => curr.unitPriceWan < prev.unitPriceWan ? curr : prev, processedRecords[0]);
            const maxRec = processedRecords.reduce((prev, curr) => curr.unitPriceWan > prev.unitPriceWan ? curr : prev, processedRecords[0]);
            const latestRec = [...processedRecords].sort((a, b) => b.dateInfo.sortVal - a.dateInfo.sortVal)[0];

            const parkingStats = new Map();
            for (const record of processedRecords) {
                const oneType = new Set(record.cars.map(car => car.type)).size === 1;
                const useTotal = oneType && record.recordedCarPriceWan > 0
                    && record.cars.some(car => !car.priceWan)
                    && record.reportedParkingTotal > 0;
                for (const car of record.cars) {
                    const type = car.type;
                    if (!parkingStats.has(type)) parkingStats.set(type, {count:0, priced:0, sum:0});
                    const stats = parkingStats.get(type);
                    stats.count++;
                    const price = useTotal ? record.recordedCarPriceWan / record.carCount : car.priceWan;
                    if (price > 0) {
                        stats.sum += price;
                        stats.priced++;
                    }
                }
            }
            const withCarRecs = processedRecords.filter(r => r.carCount > 0);
            const pricesWan = processedRecords.map(r => r.totalPriceWan);
            const areas = processedRecords.map(r => r.totalAreaPing);
            const years = processedRecords.filter(r => r.dateInfo.sortVal).map(r => r.dateInfo.year);
            const priceText = wan => wan >= 10000 ? (wan / 10000).toFixed(2) + '億' : wan.toLocaleString('zh-TW') + '萬';
            const totalCars = processedRecords.reduce((s, r) => s + r.carCount, 0);

            document.getElementById('kpiGrid').innerHTML = `
                <div class="theme-card rounded-xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-xs font-bold theme-text-sub">
                        <span>平均成交單價</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] theme-accent-light">全案 ${processedRecords.length} 筆均價</span>
                    </div>
                    <div class="my-1 flex items-baseline gap-1.5">
                        <span class="text-3xl font-black tracking-tight" style="color: var(--accent)">${avgPrice.toFixed(2)}</span>
                        <span class="text-xs font-bold theme-text-sub">萬/坪</span>
                    </div>
                    <div class="text-[11px] theme-text-sub flex justify-between pt-1.5 border-t theme-border">
                        <span>最低：${minRec.unitPriceWan.toFixed(2)} 萬 (${minRec.floorInfo.label})</span>
                        <span>最高：${maxRec.unitPriceWan.toFixed(2)} 萬 (${maxRec.floorInfo.label})</span>
                    </div>
                </div>

                <div class="theme-card rounded-xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-xs font-bold theme-text-sub">
                        <span>最新成交紀錄（最高單價）</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-500/15 text-emerald-600">序號 #${latestRec.seq}｜${latestRec.dateInfo.display}</span>
                    </div>
                    <div class="my-1 flex items-baseline gap-1.5">
                        <span class="text-3xl font-black tracking-tight">${latestRec.unitPriceWan.toFixed(2)}</span>
                        <span class="text-xs font-bold theme-text-sub">萬/坪</span>
                        <span class="ml-auto text-sm font-extrabold px-2 py-0.5 rounded theme-accent-light">${latestRec.floorInfo.label}</span>
                    </div>
                    <div class="text-[11px] theme-text-sub flex justify-between pt-1.5 border-t theme-border">
                        <span>總價：${(latestRec.totalPriceWan / 10000).toFixed(2)} 億 (${latestRec.totalPriceWan.toLocaleString()}萬)</span>
                        <span>建坪：${latestRec.totalAreaPing.toFixed(2)} 坪</span>
                    </div>
                </div>

                <div class="theme-card rounded-xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-xs font-bold theme-text-sub">
                        <span>交易總額與坪數規模</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] theme-card">${years.length ? Math.min(...years) + '年 ~ ' + Math.max(...years) + '年' : '年份未列'}</span>
                    </div>
                    <div class="my-1 flex items-baseline gap-1.5">
                        <span class="text-3xl font-black tracking-tight">${Math.min(...areas).toFixed(2)} ~ ${Math.max(...areas).toFixed(2)}</span>
                        <span class="text-xs font-bold theme-text-sub">坪/筆</span>
                    </div>
                    <div class="text-[11px] theme-text-sub flex justify-between pt-1.5 border-t theme-border">
                        <span>總價區間：${priceText(Math.min(...pricesWan))} ~ ${priceText(Math.max(...pricesWan))}</span>
                        <span>累計面積：${processedRecords.reduce((s, r) => s + r.totalAreaPing, 0).toFixed(2)} 坪</span>
                    </div>
                </div>

                <div class="theme-card rounded-xl p-3.5 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-xs font-bold theme-text-sub">
                        <span>車位明細統計</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px]" style="background:var(--badge-car-bg); color:var(--badge-car-text);">共 ${totalCars} 個車位</span>
                    </div>
                    <div class="my-1 flex items-baseline gap-1.5">
                        <span class="text-2xl font-black tracking-tight">${withCarRecs.length} 筆含車位</span>
                        <span class="text-xs font-bold theme-text-sub">/ 共 ${processedRecords.length} 筆</span>
                    </div>
                    <div id="parkingStats" class="text-[11px] theme-text-sub flex flex-col gap-1 pt-1.5 border-t theme-border">
                        ${Array.from(parkingStats, ([type, stats]) => {
                            const name = type.replace('坡道平面','坡平').replace('坡道機械','坡機').replace(/&/g,'&amp;').replace(/</g,'&lt;');
                            const average = stats.priced ? `均 ${Math.round(stats.sum / stats.priced)} 萬／個，${stats.priced} 個有價` : '無登錄價格';
                            return `<span>${name} ${stats.count} 個（${average}）</span>`;
                        }).join('') || '無車位'}
                    </div>
                </div>
            `;
        }

        // 模組 2：歷年價格走勢與面積氣泡圖
        const bandColors = {'低樓層':'#14b8a6','中樓層':'#0ea5e9','高樓層':'#2563eb','樓層未明':'#64748b'};
        function floorBand(r) {
            const height = Number(r.totalFloors);
            if (!(height > 0) || r.floorInfo.num == null) return '樓層未明';
            const floor = r.floorInfo.num;
            if (floor <= height / 3) return '低樓層';
            if (floor <= height * 2 / 3) return '中樓層';
            return '高樓層';
        }
        function renderBubbleChart() {
            if (!processedRecords.length) return;
            const container = document.getElementById('bubbleChartContainer');
            const annual = document.getElementById('annualAverage').checked;
            const split = document.getElementById('splitBands').checked;
            document.getElementById('module2').classList.toggle('annual', annual);
            container.classList.toggle('split', split);
            container.replaceChildren();
            if (!split) {
                drawPriceChart(container, processedRecords, annual, '');
                return;
            }
            const heights = [...new Set(processedRecords.map(r => Number(r.totalFloors)).filter(h => h > 0))].sort((a,b) => a-b);
            function definition(band, height) {
                const low = Math.floor(height / 3);
                const mid = Math.floor(2 * height / 3);
                const [start,end] = band === '低樓層' ? [1,low] : band === '中樓層' ? [low+1,mid] : [mid+1,height];
                let range = start > end ? '' : start === end ? start + ' 樓' : start + '～' + end + ' 樓';
                if (band === '低樓層') range = range ? range + '（含地下樓層）' : '地下樓層';
                return height + ' 層大樓：' + (range || '無對應樓層');
            }
            for (const band of ['高樓層','中樓層','低樓層','樓層未明']) {
                const records = processedRecords.filter(r => floorBand(r) === band);
                if (!records.length && band === '樓層未明') continue;
                const heading = document.createElement('strong');
                heading.textContent = band + '（' + records.length + ' 筆）';
                const ranges = band === '樓層未明' ? '成交樓層或總樓層未提供' : heights.map(h => definition(band,h)).join('；');
                if (ranges) heading.append('｜' + ranges);
                container.append(heading);
                const panel = document.createElement('div');
                panel.className = 'band-chart';
                container.append(panel);
                if (records.length) drawPriceChart(panel, records, annual, band);
            }
        }

        function drawPriceChart(container, records, annual, band) {
            const w = Math.max(220, container.clientWidth), h = Math.max(180, container.clientHeight);
            const pad = { top: 28, right: 45, bottom: 38, left: 52 };
            const plotW = w - pad.left - pad.right;
            const plotH = h - pad.top - pad.bottom;

            let sorted = [...records].sort((a, b) => a.dateInfo.sortVal - b.dateInfo.sortVal);
            if (annual) {
                const groups = new Map();
                for (const r of sorted) {
                    const year = r.dateInfo.year;
                    if (!groups.has(year)) groups.set(year, {dateInfo:{year,numericYear:year}, count:0, unitPriceWan:0, totalAreaPing:0});
                    const group = groups.get(year);
                    group.count++;
                    group.unitPriceWan += r.unitPriceWan;
                    group.totalAreaPing += r.totalAreaPing;
                }
                sorted = Array.from(groups.values(), group => ({...group, unitPriceWan:group.unitPriceWan/group.count}));
            }
            function pointDetail(r) {
                const label = annual ? `民國${r.dateInfo.year}年 · ${r.count}筆平均` : `#${r.seq} · ${r.floorInfo.label} · ${r.dateInfo.display}`;
                return `${label} · ${r.unitPriceWan.toFixed(2)} 萬／坪`;
            }
            const years = processedRecords.map(r => annual ? r.dateInfo.year : r.dateInfo.numericYear);
            const minX = Math.floor(Math.min(...years) - 0.5);
            const maxX = Math.ceil(Math.max(...years) + 0.5);

            const prices = processedRecords.map(r => r.unitPriceWan);
            const minY = Math.floor(Math.min(...prices) / 5) * 5 - 5;
            const maxY = Math.ceil(Math.max(...prices) / 5) * 5 + 8;

            const scaleX = (val) => pad.left + ((val - minX) / Math.max(1, maxX - minX)) * plotW;
            const scaleY = (val) => pad.top + plotH - ((val - minY) / Math.max(1, maxY - minY)) * plotH;

            // 網格線
            let gridHtml = '';
            const yStep = Math.ceil((maxY - minY) / 4 / 5) * 5 || 10;
            for (let y = minY; y <= maxY; y += yStep) {
                const py = scaleY(y);
                gridHtml += `
                    <line x1="${pad.left}" y1="${py}" x2="${w - pad.right}" y2="${py}" stroke="var(--border-color)" stroke-dasharray="3,3" />
                    <text x="${pad.left - 8}" y="${py + 4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--text-sub)">${y}</text>
                `;
            }

            const yearStep = Math.max(1, Math.round((maxX - minX) / 5));
            for (let yr = minX; yr <= maxX; yr += yearStep) {
                const px = scaleX(yr);
                gridHtml += `
                    <line x1="${px}" y1="${pad.top}" x2="${px}" y2="${h - pad.bottom}" stroke="var(--border-color)" stroke-dasharray="2,4" />
                    <text x="${px}" y="${h - pad.bottom + 18}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-sub)">${yr}年</text>
                `;
            }

            // 趨勢連線
            const pathPts = sorted.map(r => `${scaleX(r.dateInfo.numericYear)},${scaleY(r.unitPriceWan)}`).join(' ');
            const trendLineHtml = `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5,4" points="${pathPts}" opacity="0.65" />`;

            // 氣泡與標籤
            const labels = [];
            const points = sorted.map(r => ({x:scaleX(r.dateInfo.numericYear), y:scaleY(r.unitPriceWan), radius:Math.max(9,Math.min(24,Math.sqrt(r.totalAreaPing)*0.85))}));
            let bubblesHtml = '';
            sorted.forEach((r, idx) => {
                const cx = scaleX(r.dateInfo.numericYear);
                const cy = scaleY(r.unitPriceWan);
                const radius = Math.max(9, Math.min(24, Math.sqrt(r.totalAreaPing) * 0.85));

                const color = band ? bandColors[band] : annual ? '#2873be' : bandColors[floorBand(r)];

                const price = r.unitPriceWan.toFixed(2);
                const half = price.length * 4.8 + 3;
                let best, bestCost = Infinity;
                for (let y = pad.top; y < h-pad.bottom; y += 12) {
                    for (let x = pad.left+half; x < w-half; x += 12) {
                        const overlaps = labels.some(box => Math.abs(box.x-x)<box.half+half && Math.abs(box.y-y)<18);
                        const hitsPoint = points.some(pt => Math.hypot(Math.max(0,Math.abs(pt.x-x)-half),Math.max(0,Math.abs(pt.y-y)-9)) < pt.radius+2);
                        const cost = Math.hypot(x-cx,y-cy) + (overlaps ? 10000 : 0) + (hitsPoint ? 1000 : 0);
                        if (cost < bestCost) { bestCost = cost; best = {x,y,half}; }
                    }
                }
                labels.push(best);
                bubblesHtml += `
                    <g class="cursor-pointer bubble-point" tabindex="0" data-index="${idx}" aria-label="${pointDetail(r)}">
                        <circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}" fill-opacity="0.78" stroke="#fff" stroke-width="2">
                            <title>${pointDetail(r)}</title>
                        </circle>
                        ${state.showStaticLabels ? `<line x1="${cx}" y1="${cy}" x2="${best.x}" y2="${best.y}" stroke="${color}" />
                        <text x="${best.x}" y="${best.y}" dy=".35em" text-anchor="middle" font-size="16" font-weight="800" fill="var(--text-main)" stroke="var(--bg-card)" stroke-width="5" paint-order="stroke">${price}</text>` : ''}
                    </g>
                `;
            });

            container.innerHTML = `
                <svg viewBox="0 0 ${w} ${h}" class="w-full h-full overflow-visible">
                    <text x="${pad.left - 10}" y="${pad.top - 10}" font-size="10" font-weight="700" fill="var(--text-sub)">萬/坪</text>
                    ${gridHtml}
                    ${trendLineHtml}
                    ${bubblesHtml}
                </svg>
                <div class="bubble-tip" hidden></div>
            `;
            const tip = container.querySelector('.bubble-tip');
            for (const point of container.querySelectorAll('.bubble-point')) {
                const show = () => {
                    const r = sorted[Number(point.dataset.index)];
                    tip.textContent = pointDetail(r);
                    tip.hidden = false;
                    const rect = point.querySelector('circle').getBoundingClientRect();
                    const chart = container.getBoundingClientRect();
                    tip.style.left = Math.max(tip.offsetWidth/2, Math.min(chart.width-tip.offsetWidth/2, rect.left-chart.left+rect.width/2)) + 'px';
                    tip.style.top = Math.max(tip.offsetHeight, rect.top-chart.top-5) + 'px';
                };
                for (const event of ['pointerenter','focus','click']) point.addEventListener(event, show);
                for (const event of ['pointerleave','blur']) point.addEventListener(event, () => tip.hidden = true);
            }
        }

        document.getElementById('annualAverage').addEventListener('change', renderBubbleChart);
        document.getElementById('splitBands').addEventListener('change', renderBubbleChart);
        new ResizeObserver(() => {
            if (processedRecords.length) renderBubbleChart();
        }).observe(document.getElementById('bubbleChartContainer'));

        // 模組 3：垂直樓層行情剖面圖 (只顯示有交易紀錄的樓層)
        const selectedDoors = new Set();
        function doorParts(address) {
            const text = String(address || '').normalize('NFKC').replace(/\s+/g, '').replace(/臺/g, '台');
            const key = text.match(/^.*?號(?:之[0-9一二三四五六七八九十]+)?/)?.[0] || text || '門牌未列';
            const match = key.match(/^(.*(?:路|街|大道)(?:[一二三四五六七八九十0-9]+段)?)(.+號.*)$/);
            if (!match) return {key, street:'', short:key};
            const street = match[1].replace(/^.*?[區鄉鎮]/, '').replace(/^.{1,4}?[里村](?=.+(?:路|街|大道))/, '');
            const canonicalStreet = street.replace(/([一二三四五六七八九十\d]+)段$/, (_, n) => {
                const digits = '〇一二三四五六七八九';
                const [tens, units] = n.split('十');
                const value = /^\d+$/.test(n) ? Number(n) : units === undefined ? digits.indexOf(n)
                    : (tens ? digits.indexOf(tens) : 1) * 10 + (units ? digits.indexOf(units) : 0);
                return (value > 0 ? value : n) + '段';
            });
            return {key:canonicalStreet + match[2], street:canonicalStreet, short:match[2]};
        }
        function renderStackingPlan() {
            const container = document.getElementById('stackingPlanContainer');

            const doors = new Map();
            for (const r of processedRecords) {
                const door = doorParts(r.address);
                doors.set(door.key, door);
            }
            for (const key of selectedDoors) if (!doors.has(key)) selectedDoors.delete(key);
            const streets = new Set([...doors.values()].map(d => d.street));
            const short = d => streets.size === 1 ? d.short : d.key;
            const filters = document.getElementById('doorFilters');
            filters.replaceChildren();
            function addButton(label, key) {
                const button = document.createElement('button');
                button.textContent = label;
                button.title = key || '顯示所有門牌';
                button.setAttribute('aria-pressed', key ? selectedDoors.has(key) : !selectedDoors.size);
                button.onclick = () => {
                    if (!key) selectedDoors.clear();
                    else if (selectedDoors.has(key)) selectedDoors.delete(key);
                    else selectedDoors.add(key);
                    if (selectedDoors.size === doors.size) selectedDoors.clear();
                    renderStackingPlan();
                };
                filters.append(button);
            }

            addButton('全選', '');
            for (const d of [...doors.values()].sort((a,b)=>a.key.localeCompare(b.key,'zh-TW',{numeric:true}))) addButton(short(d),d.key);
            const records = processedRecords.filter(r => !selectedDoors.size || selectedDoors.has(doorParts(r.address).key));
            const groups = {};
            records.forEach(r => {
                const key = r.floorInfo.label;
                if (!groups[key]) {
                    groups[key] = {
                        label: key,
                        sortFloor: r.floorInfo.num,
                        records: []
                    };
                }
                groups[key].records.push(r);
            });

            // 由高樓層往低樓層排列
            const sortedFloors = Object.values(groups).sort((a, b) => b.sortFloor - a.sortFloor);

            const allPrices = processedRecords.map(r => r.unitPriceWan);
            const minP = Math.min(...allPrices);
            const maxP = Math.max(...allPrices);

        function updateParkingSuggestion(raw) {
            let total = 0;
            let count = 0;
            const bySeq = new Map();
            for (const car of raw.cars) {
                if (!bySeq.has(car.seq)) bySeq.set(car.seq, []);
                bySeq.get(car.seq).push(car);
            }
            for (const sale of raw.main) {
                const spaces = bySeq.get(sale.seq) || [];
                if (sale.carPriceWan > 0 && spaces.length) {
                    total += sale.carPriceWan;
                    count += spaces.length;
                } else {
                    for (const car of spaces) {
                        if (car.priceWan > 0) {
                            total += car.priceWan;
                            count++;
                        }
                    }
                }
            }
            state.defaultCarPriceWan = count ? Math.round(total / count) : 0;
            document.getElementById('carPriceInput').value = count ? state.defaultCarPriceWan : '';
        }

        function parseUploadedWorkbook(workbook) {
            const result = { main: [], lands: [], buildings: [], cars: [] };

            // 輔助函數：在任意二維陣列中尋找包含「序號」的表頭列與其起始欄位偏移量
            function extractTableBySeq(rows, requiredKeywords, isMain = false) {
                let headerRowIdx = -1;
                let seqColIdx = -1;
                let colMap = {};

                for (let r = 0; r < rows.length; r++) {
                    const row = rows[r] || [];
                    const cellStrings = row.map(c => String(c || '').trim());
                    const foundSeqIdx = cellStrings.includes('序號') ? cellStrings.indexOf('序號') : (isMain ? cellStrings.indexOf('編號') : -1);
                    const matchKeyword = requiredKeywords.some(kw => cellStrings.some(v => v.includes(kw)));

                    if (foundSeqIdx !== -1 && matchKeyword) {
                        headerRowIdx = r;
                        seqColIdx = foundSeqIdx;
                        cellStrings.forEach((colName, cIdx) => {
                            if (colName) {
                                colMap[colName] = cIdx;
                            }
                        });
                        break;
                    }
                }

                if (headerRowIdx === -1) return [];

                const records = [];
                for (let r = headerRowIdx + 1; r < rows.length; r++) {
                    const row = rows[r] || [];
                    const id = String(row[seqColIdx] ?? '').trim();
                    if (!(isMain ? /^\d+$/ : /^\d+(?:-\d+)?$/).test(id)) continue;
                    const seqVal = Number(id.split('-')[0]);

                    const obj = { seq: seqVal };
                    Object.entries(colMap).forEach(([k, idx]) => {
                        obj[k] = row[idx];
                    });
                    records.push(obj);
                }
                return records;
            }

            function numberOf(value) {
                const clean = String(value ?? '').normalize('NFKC').replace(/,/g, '').trim();
                return Number.parseFloat(clean) || 0;
            }

            function parkingPriceWan(row) {
                if (row['車位價格(萬)'] != null) return numberOf(row['車位價格(萬)']);
                const value = String(row['車位價格'] ?? '');
                return numberOf(value) / (value.includes('萬') ? 1 : 10000);
            }

            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                if (sheetName.includes('買賣') || sheetName.includes('案件列表') || sheetName === workbook.SheetNames[0]) {
                    const mainRows = extractTableBySeq(rows, ['門牌', '單價', '總價'], true);
                    mainRows.forEach(r => {
                        const [floor, height] = String(r['樓別/樓高'] || '').split('/');
                        const count = String(r['交易筆棟數'] || '').match(/建物\s*[:：]\s*(\d+)/);
                        result.main.push({
                            seq: r.seq,
                            primaryUse: String(r['主要用途'] || '').trim(),
                            community: String(r['社區簡稱'] || '').trim(),
                            address: String(r['土地區段位置或建物區門牌'] || r['建物區門牌'] || r['地段位置或門牌'] || ''),
                            date: String(r['交易年月日'] || r['交易日期'] || ''),
                            completeDate: String(r['建築完成年月'] || r['建築完成日期'] || '-'),
                            floorStr: String(r['移轉層次'] || floor || ''),
                            totalFloors: String(r['總樓層數'] || (height ? (parseFloorInfo(height).num ?? '') : '')),
                            buildingCount: count ? Number(count[1]) : null,
                            mainAreaShare: r['主建物佔比'] === undefined ? undefined : String(r['主建物佔比']),
                            totalPriceWan: numberOf(r['總價(萬)'] || r['總價(萬元)'] || r['總價'] || 0),
                            unitPriceWan: numberOf(r['單價(萬/坪)'] || r['單價(萬元/坪)'] || r['單價'] || 0),
                            totalAreaPing: numberOf(r['建坪'] || r['總面積(坪)'] || r['建物移轉面積(坪)'] || r['建物移轉面積'] || 0),
                            landAreaPing: numberOf(r['地坪'] || 0),
                            carCountDesc: String(r['車位數量'] || ''),
                            carAreaPing: numberOf(r['車位面積(坪)'] || r['車位面積'] || 0),
                            carPriceWan: numberOf(r['車位總價(萬)'] || r['車位總價(萬元)'] || 0),
                            note: String(r['備註'] || ''),
                            code: String(r['編號'] || '')
                        });
                    });
                }

                if (sheetName.includes('土地')) {
                    const landRows = extractTableBySeq(rows, ['土地區段位置', '使用分區', '權利移轉']);
                    landRows.forEach(r => {
                        result.lands.push({
                            seq: r.seq,
                            parcel: String(r['土地區段位置'] || r['土地位置'] || ''),
                            areaPing: numberOf(r['土地移轉面積(坪)'] || r['土地移轉面積'] || 0),
                            ratio: String(r['權利移轉範圍'] || ''),
                            zone: String(r['使用分區或編定'] || '').replace(/^都市：(?:其他:)?/, '')
                        });
                    });
                }

                if (sheetName.includes('建物')) {
                    const bldgRows = extractTableBySeq(rows, ['主要用途', '主要建材', '附屬建物']);
                    bldgRows.forEach(r => {
                        result.buildings.push({
                            seq: r.seq,
                            age: r['屋齡'] || null,
                            areaPing: numberOf(r['建物移轉面積(坪)'] || r['建物移轉面積'] || 0),
                            use: String(r['主要用途'] || '').trim(),
                            material: String(r['主要建材'] || ''),
                            buildDate: String(r['建築完成年月'] || r['建築完成日期'] || ''),
                            totalFloors: String(r['總層數'] || ''),
                            floor: String(r['建物層次'] || r['建物分層'] || ''),
                            subUse: String(r['附屬建物用途'] || ''),
                            subAreaPing: numberOf(r['附屬建物面積(坪)'] || 0),
                            pubAreaPing: numberOf(r['共有部分面積(坪)'] || 0)
                        });
                    });
                }

                if (sheetName.includes('車位')) {
                    const carRows = extractTableBySeq(rows, ['車位類別', '車位價格', '車位所在樓層']);
                    carRows.forEach(r => {
                        result.cars.push({
                            seq: r.seq,
                            type: String(r['車位類別'] || '類別未列').trim() || '類別未列',
                            priceWan: parkingPriceWan(r),
                            areaPing: numberOf(r['車位面積(坪)'] || r['車位面積'] || 0),
                            floor: String(r['車位所在樓層'] || r['所在樓層'] || '')
                        });
                    });
                }
            });

            return result;
        }

        async function imageOptions() {
                await document.fonts.ready;
                return {
                    pixelRatio: 2,
                    filter: node => !node.classList?.contains("export-btn") && !node.classList?.contains("bubble-tip"),
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-canvas').trim()

        let lastPng;
        document.fonts.addEventListener('loadingdone', () => { lastPng = null; });
        async function reportPng(elementId, onSection) {
            await document.fonts.ready;
            const el = document.getElementById(elementId);
            const key = JSON.stringify([el.outerHTML, el.offsetWidth, el.offsetHeight,
                innerWidth, devicePixelRatio, document.documentElement.dataset.theme,
                Array.from(el.querySelectorAll('input'), input => [input.checked,input.value])]);
            if (lastPng?.key === key) return lastPng.blob;
            const blob = await renderReportPng(elementId, onSection);
            if (!blob) throw new Error('PNG 編碼失敗');
            lastPng = {key, blob};
            return blob;
        }

        async function renderReportPng(elementId, onSection) {
            const options = await imageOptions();
            const el = document.getElementById(elementId);
            if (elementId !== 'pptCanvas') return htmlToImage.toBlob(el, options);
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            const bounds = el.getBoundingClientRect();
            const parts = Array.from(el.querySelectorAll('section'), node => ({node, rect:node.getBoundingClientRect()}));
            const width = Math.ceil(Math.max(bounds.width, el.scrollWidth));
            const height = Math.ceil(Math.max(bounds.height, el.scrollHeight));
            const scale = Math.min(2, 16384 / Math.max(width,height), Math.sqrt(32000000 / (width*height)));
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(width * scale);
            canvas.height = Math.ceil(height * scale);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = getComputedStyle(el).backgroundColor;
            ctx.fillRect(0,0,canvas.width,canvas.height);
            options.fontEmbedCSS = (await htmlToImage.getFontEmbedCSS(el)) || ' ';
            let completed = 0;
            for (const {node,rect} of parts) {
                const image = await htmlToImage.toCanvas(node, {
                    ...options, width:rect.width, height:rect.height, pixelRatio:scale,
                    style:{margin:'0',position:'relative',top:'0',left:'0',transform:'none',
                        boxSizing:'border-box',width:rect.width+'px',height:rect.height+'px'}
                });
                ctx.drawImage(image, Math.round((rect.left-bounds.left)*scale),
                    Math.round((rect.top-bounds.top)*scale), Math.round(rect.width*scale), Math.round(rect.height*scale));
                image.width = image.height = 0;
                onSection?.(++completed, parts.length);
            }
            return new Promise((resolve,reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 編碼失敗')), 'image/png'));
        }

        async function copyImage(elementId) {
            const dialog = document.getElementById('copyDialog');
            if (dialog.open) return;
            if (!navigator.clipboard?.write || !window.ClipboardItem) {
                showToast('此環境無法複製圖片，請使用旁邊的 PNG 下載按鈕。');
                return;
            }
            try {
                const stage = document.getElementById('copyStage');
                const bar = document.getElementById('copyProgress');
                stage.textContent = elementId === 'pptCanvas' ? '正在準備全頁報表…' : '正在產生圖表圖片…';
                dialog.dataset.state = 'working';
                document.getElementById('copyHeading').textContent = '正在複製圖片';
                bar.max = 100;
                bar.value = 12;
                dialog.oncancel = event => event.preventDefault();
                dialog.showModal();
                const png = new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))
                    .then(() => reportPng(elementId, (done,total) => {
                        stage.textContent = done === total ? '正在編碼 PNG…' : `已產生 ${done}／${total} 個區塊`;
                        bar.value = 12 + 75 * done / total;
                    })).then(blob => {
                        stage.textContent = '正在寫入剪貼簿…';
                        bar.value = 94;
                        return blob;
                    });
                await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
                bar.value = 100;
                dialog.dataset.state = 'success';
                document.getElementById('copyHeading').textContent = '圖片已複製';
                stage.textContent = '可以貼到 PowerPoint 了。';
                await new Promise(resolve => setTimeout(resolve, 1400));
            } catch (error) {
                showToast('複製失敗，請確認瀏覽器剪貼簿權限，或下載 PNG。');
            } finally {
                dialog.close();
            }
        }

        async function exportElement(elementId, fileName) {
            const el = document.getElementById(elementId);
            if (!el) return;
            showToast('正在產出高清簡報圖表 PNG...');
            try {
                const png = URL.createObjectURL(await reportPng(elementId));
                const link = document.createElement('a');
                link.download = `${fileName}.png`;
                link.href = png;
                link.click();
                setTimeout(() => URL.revokeObjectURL(png), 1000);
            } catch (e) {
                console.error(e);
                showToast("PNG 匯出失敗，請再試一次。", true);
            }
        }

        window.onload = function () {
            resetYears(currentRawData);
            updateParkingSuggestion(currentRawData);
            renderAll();
        };
    </script>
</body>
</html>
