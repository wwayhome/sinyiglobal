<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純地端 PDF 處理工具</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5YQY4RT9H2');
    </script>
    
    <!-- 抑制 Tailwind CDN 開發警告 (選擇性加入，為了畫面乾淨) -->
    <script>
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
            originalWarn.apply(console, args);
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets['env']],
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.js"></script>

    <style>
        body { background-color: #f3f4f6; }
        .page-card { transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
        .page-card:hover {
            transform: translateY(-6px) scale(1.045);
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18), 0 18px 28px -10px rgba(37, 99, 235, 0.35);
            z-index: 25;
        }
        .page-card.is-selected:hover {
            transform: translateY(-6px) scale(1.055);
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.28), 0 20px 32px -10px rgba(37, 99, 235, 0.45);
        }
        .page-card.is-dragging:hover {
            transform: scale(0.95);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const { useState, useRef, useEffect } = React;
        const { PDFDocument, PDFName, PDFNumber, PDFRawStream, PDFArray, degrees } = PDFLib;

        const makeId = () => `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;

        const SMART_DEFAULT_PRESET = { label: '均衡', maxDimension: 1500, quality: 0.72 };

        const SMART_TARGET_LADDER = [
            { label: '高畫質', maxDimension: 1800, quality: 0.80 },
            { label: '均衡', maxDimension: 1350, quality: 0.68 },
            { label: '高壓縮', maxDimension: 950, quality: 0.52 }
        ];

        const EXTREME_TARGET_LADDER = [
            { label: '高清晰', scale: 1.8, quality: 0.78 },
            { label: '清晰', scale: 1.5, quality: 0.68 },
            { label: '均衡', scale: 1.25, quality: 0.58 },
            { label: '緊湊', scale: 1.05, quality: 0.48 },
            { label: '極致', scale: 0.9, quality: 0.40 },
            { label: '最低可讀', scale: 0.75, quality: 0.34 }
        ];

        const TARGET_MB_QUICK_VALUES = [2, 5, 10];

        const naturalNameCollator = new Intl.Collator('zh-Hant', { numeric: true, sensitivity: 'base' });

        const sortPendingFiles = (items, mode) => {
            const list = [...items];
            list.sort((a, b) => {
                const nameDiff = naturalNameCollator.compare(a.file.name, b.file.name);
                const timeDiff = (a.file.lastModified || 0) - (b.file.lastModified || 0);

                if (mode === 'name-asc') return nameDiff !== 0 ? nameDiff : timeDiff;
                if (mode === 'name-desc') return nameDiff !== 0 ? -nameDiff : -timeDiff;
                if (mode === 'time-asc') return timeDiff !== 0 ? timeDiff : nameDiff;
                if (mode === 'time-desc') return timeDiff !== 0 ? -timeDiff : nameDiff;
                return 0;
            });
            return list;
        };

        const reorderPendingFiles = (items, dragId, targetId, position) => {
            if (!dragId || !targetId || dragId === targetId) return items;
            const draggedItem = items.find(item => item.id === dragId);
            if (!draggedItem) return items;

            const remaining = items.filter(item => item.id !== dragId);
            const targetIndex = remaining.findIndex(item => item.id === targetId);
            if (targetIndex === -1) return items;

            const insertIndex = position === 'bottom' ? targetIndex + 1 : targetIndex;
            const result = [...remaining];
            result.splice(insertIndex, 0, draggedItem);
            return result;
        };

        const formatFileSize = (bytes) => {
            if (!Number.isFinite(bytes) || bytes < 0) return '—';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        };

        const formatFileDate = (timestamp) => {
            if (!timestamp) return '—';
            const d = new Date(timestamp);
            if (Number.isNaN(d.getTime())) return '—';
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const canvasToJpegBytes = async (canvas, quality) => {
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
            if (!blob) throw new Error('無法將圖片轉為 JPEG 格式。');
            const buffer = await blob.arrayBuffer();
            return new Uint8Array(buffer);
        };

        const loadImageFromBytes = (bytes, mimeType) => {
            return new Promise((resolve, reject) => {
                const blob = new Blob([bytes], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = (err) => {
                    URL.revokeObjectURL(url);
                    reject(err);
                };
                img.src = url;
            });
        };

        const inflateBytes = async (compressedBytes) => {
            if (typeof DecompressionStream === 'undefined') return null;
            for (const format of ['deflate', 'deflate-raw']) {
                try {
                    const ds = new DecompressionStream(format);
                    const writer = ds.writable.getWriter();
                    writer.write(compressedBytes);
                    writer.close();
                    const buffer = await new Response(ds.readable).arrayBuffer();
                    return new Uint8Array(buffer);
                } catch (_) {}
            }
            return null;
        };

        const getPdfNumberValue = (val) => {
            if (!val) return null;
            if (typeof val.asNumber === 'function') return val.asNumber();
            const n = Number(val);
            return Number.isFinite(n) ? n : null;
        };

        const getSingleFilterName = (dict) => {
            const filterObj = dict.lookup(PDFName.of('Filter'));
            if (!filterObj) return '';
            if (filterObj instanceof PDFName) return filterObj.asString();
            if (filterObj instanceof PDFArray && filterObj.size() === 1) {
                const first = filterObj.lookup(0);
                return first instanceof PDFName ? first.asString() : '';
            }
            return '';
        };

        const getColorSpaceInfo = (dict) => {
            const csObj = dict.lookup(PDFName.of('ColorSpace'));
            if (!csObj) return { name: '', channels: 0, isCmyk: false };
            if (csObj instanceof PDFName) {
                const name = csObj.asString();
                if (name === '/DeviceRGB') return { name, channels: 3, isCmyk: false };
                if (name === '/DeviceGray') return { name, channels: 1, isCmyk: false };
                if (name === '/DeviceCMYK') return { name, channels: 4, isCmyk: true };
                return { name, channels: 0, isCmyk: false };
            }
            if (csObj instanceof PDFArray && csObj.size() > 0) {
                const first = csObj.lookup(0);
                const name = first instanceof PDFName ? first.asString() : '';
                if (name === '/ICCBased' && csObj.size() >= 2) {
                    const profileStream = csObj.lookup(1);
                    const nVal = profileStream?.dict ? getPdfNumberValue(profileStream.dict.lookup(PDFName.of('N'))) : null;
                    if (nVal === 3) return { name, channels: 3, isCmyk: false };
                    if (nVal === 1) return { name, channels: 1, isCmyk: false };
                    if (nVal === 4) return { name, channels: 4, isCmyk: true };
                }
                if (name === '/CalRGB') return { name, channels: 3, isCmyk: false };
                if (name === '/CalGray') return { name, channels: 1, isCmyk: false };
                return { name, channels: 0, isCmyk: false };
            }
            return { name: '', channels: 0, isCmyk: false };
        };

        const getDecodeParmsDict = (dict) => {
            const parms = dict.lookup(PDFName.of('DecodeParms'));
            if (!parms) return null;
            if (parms instanceof PDFArray) {
                return parms.size() === 1 ? parms.lookup(0) : null;
            }
            return typeof parms.lookup === 'function' ? parms : null;
        };

        const paethPredictor = (a, b, c) => {
            const p = a + b - c;
            const pa = Math.abs(p - a);
            const pb = Math.abs(p - b);
            const pc = Math.abs(p - c);
            if (pa <= pb && pa <= pc) return a;
            if (pb <= pc) return b;
            return c;
        };

        const unfilterPixels = (rawBytes, width, height, channels, predictor) => {
            const rowBytes = width * channels;
            const bpp = channels;

            if (!predictor || predictor === 1) {
                return rawBytes.length >= rowBytes * height ? rawBytes : null;
            }

            // TIFF Predictor 2 (水平差分)
            if (predictor === 2) {
                if (rawBytes.length < rowBytes * height) return null;
                const out = new Uint8Array(rowBytes * height);
                for (let row = 0; row < height; row++) {
                    const offset = row * rowBytes;
                    for (let i = 0; i < rowBytes; i++) {
                        const left = i >= bpp ? out[offset + i - bpp] : 0;
                        out[offset + i] = (rawBytes[offset + i] + left) & 0xff;
                    }
                }
                return out;
            }

            // PNG Predictors (10-15：每列開頭帶 1 byte filter type)
            if (predictor >= 10 && predictor <= 15) {
                const stride = rowBytes + 1;
                if (rawBytes.length < stride * height) return null;
                const out = new Uint8Array(rowBytes * height);
                for (let row = 0; row < height; row++) {
                    const inOffset = row * stride;
                    const outOffset = row * rowBytes;
                    const filterType = rawBytes[inOffset];
                    for (let i = 0; i < rowBytes; i++) {
                        const x = rawBytes[inOffset + 1 + i];
                        const a = i >= bpp ? out[outOffset + i - bpp] : 0;
                        const b = row > 0 ? out[outOffset - rowBytes + i] : 0;
                        const c = (row > 0 && i >= bpp) ? out[outOffset - rowBytes + i - bpp] : 0;
                        if (filterType === 0) {
                            out[outOffset + i] = x;
                        } else if (filterType === 1) {
                            out[outOffset + i] = (x + a) & 0xff;
                        } else if (filterType === 2) {
                            out[outOffset + i] = (x + b) & 0xff;
                        } else if (filterType === 3) {
                            out[outOffset + i] = (x + ((a + b) >> 1)) & 0xff;
                        } else if (filterType === 4) {
                            out[outOffset + i] = (x + paethPredictor(a, b, c)) & 0xff;
                        } else {
                            return null;
                        }
                    }
                }
                return out;
            }

            return null;
        };

        const computeScaledSize = (width, height, maxDimension) => {
            const longest = Math.max(width, height);
            if (longest <= maxDimension) return { width, height };
            const ratio = maxDimension / longest;
            return {
                width: Math.max(1, Math.round(width * ratio)),
                height: Math.max(1, Math.round(height * ratio))
            };
        };

        const recompressEmbeddedImages = async (pdfDoc, preset, onProgress) => {
            // 順手清理冗餘的 XMP Metadata 與內嵌頁面縮圖
            try {
                pdfDoc.catalog.delete(PDFName.of('Metadata'));
                pdfDoc.getPages().forEach(page => {
                    page.node.delete(PDFName.of('Thumb'));
                });
            } catch (_) {}

            const candidates = [];
            for (const [ref, obj] of pdfDoc.context.enumerateIndirectObjects()) {
                if (!(obj instanceof PDFRawStream)) continue;
                const dict = obj.dict;
                if (!dict) continue;
                if (dict.lookup(PDFName.of('Subtype')) !== PDFName.of('Image')) continue;
                candidates.push({ ref, obj, dict });
            }

            let optimizedCount = 0;
            let skippedCount = 0;
            const totalImages = candidates.length;

            for (let i = 0; i < totalImages; i++) {
                if (onProgress) onProgress(i + 1, totalImages);
                await new Promise(resolve => setTimeout(resolve, 10));

                const { ref, obj, dict } = candidates[i];
                try {
                    // 安全防呆：跳過帶透明遮罩或 1-bit 遮罩的圖片，避免透明底變黑
                    if (dict.get(PDFName.of('SMask')) || dict.get(PDFName.of('Mask')) || dict.get(PDFName.of('ImageMask'))) {
                        skippedCount++;
                        continue;
                    }

                    const csInfo = getColorSpaceInfo(dict);
                    // 跳過 CMYK 印刷色彩空間，避免瀏覽器轉色跑掉
                    if (csInfo.isCmyk) {
                        skippedCount++;
                        continue;
                    }

                    const origBytes = obj.contents;
                    // 小於 4KB 的微小圖片略過
                    if (!origBytes || origBytes.length < 4096) {
                        skippedCount++;
                        continue;
                    }

                    const filterName = getSingleFilterName(dict);
                    let targetW = 0;
                    let targetH = 0;
                    let newBytes = null;

                    if (filterName === '/DCTDecode') {
                        const img = await loadImageFromBytes(origBytes, 'image/jpeg');
                        const srcW = img.naturalWidth || img.width;
                        const srcH = img.naturalHeight || img.height;
                        if (!srcW || !srcH) {
                            skippedCount++;
                            continue;
                        }

                        const scaled = computeScaledSize(srcW, srcH, preset.maxDimension);
                        targetW = scaled.width;
                        targetH = scaled.height;

                        const canvas = document.createElement('canvas');
                        canvas.width = targetW;
                        canvas.height = targetH;
                        const ctx = canvas.getContext('2d');
                        if (!ctx) {
                            skippedCount++;
                            continue;
                        }

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, targetW, targetH);
                        ctx.drawImage(img, 0, 0, targetW, targetH);

                        newBytes = await canvasToJpegBytes(canvas, preset.quality);
                        canvas.width = 0;
                        canvas.height = 0;
                    } else if (filterName === '/FlateDecode') {
                        // 支援 8-bit DeviceRGB / DeviceGray / ICCBased (RGB 或灰階) / CalRGB / CalGray 及 PNG/TIFF Predictor
                        const bpc = getPdfNumberValue(dict.lookup(PDFName.of('BitsPerComponent')));
                        if (bpc !== 8 || (csInfo.channels !== 3 && csInfo.channels !== 1)) {
                            skippedCount++;
                            continue;
                        }

                        const srcW = getPdfNumberValue(dict.lookup(PDFName.of('Width')));
                        const srcH = getPdfNumberValue(dict.lookup(PDFName.of('Height')));
                        if (!srcW || !srcH || srcW <= 0 || srcH <= 0 || srcW * srcH > 30000000) {
                            skippedCount++;
                            continue;
                        }

                        const parmsDict = getDecodeParmsDict(dict);
                        const predictor = parmsDict ? (getPdfNumberValue(parmsDict.lookup(PDFName.of('Predictor'))) || 1) : 1;
                        const parmsCols = parmsDict ? getPdfNumberValue(parmsDict.lookup(PDFName.of('Columns'))) : null;
                        const parmsColors = parmsDict ? getPdfNumberValue(parmsDict.lookup(PDFName.of('Colors'))) : null;
                        if ((parmsCols && parmsCols !== srcW) || (parmsColors && parmsColors !== csInfo.channels)) {
                            skippedCount++;
                            continue;
                        }

                        const inflated = await inflateBytes(origBytes);
                        if (!inflated) {
                            skippedCount++;
                            continue;
                        }

                        const rawPixels = unfilterPixels(inflated, srcW, srcH, csInfo.channels, predictor);
                        if (!rawPixels) {
                            skippedCount++;
                            continue;
                        }

                        const srcCanvas = document.createElement('canvas');
                        srcCanvas.width = srcW;
                        srcCanvas.height = srcH;
                        const srcCtx = srcCanvas.getContext('2d');
                        if (!srcCtx) {
                            skippedCount++;
                            continue;
                        }

                        const imageData = srcCtx.createImageData(srcW, srcH);
                        const rgba = imageData.data;
                        const totalPixels = srcW * srcH;

                        if (csInfo.channels === 3) {
                            for (let p = 0, q = 0; p < totalPixels; p++, q += 4) {
                                const idx = p * 3;
                                rgba[q] = rawPixels[idx];
                                rgba[q + 1] = rawPixels[idx + 1];
                                rgba[q + 2] = rawPixels[idx + 2];
                                rgba[q + 3] = 255;
                            }
                        } else {
                            for (let p = 0, q = 0; p < totalPixels; p++, q += 4) {
                                const g = rawPixels[p];
                                rgba[q] = g;
                                rgba[q + 1] = g;
                                rgba[q + 2] = g;
                                rgba[q + 3] = 255;
                            }
                        }
                        srcCtx.putImageData(imageData, 0, 0);

                        const scaled = computeScaledSize(srcW, srcH, preset.maxDimension);
                        targetW = scaled.width;
                        targetH = scaled.height;

                        const dstCanvas = document.createElement('canvas');
                        dstCanvas.width = targetW;
                        dstCanvas.height = targetH;
                        const dstCtx = dstCanvas.getContext('2d');
                        if (!dstCtx) {
                            srcCanvas.width = 0;
                            srcCanvas.height = 0;
                            skippedCount++;
                            continue;
                        }

                        dstCtx.fillStyle = '#ffffff';
                        dstCtx.fillRect(0, 0, targetW, targetH);
                        dstCtx.drawImage(srcCanvas, 0, 0, targetW, targetH);

                        newBytes = await canvasToJpegBytes(dstCanvas, preset.quality);
                        srcCanvas.width = 0;
                        srcCanvas.height = 0;
                        dstCanvas.width = 0;
                        dstCanvas.height = 0;
                    } else {
                        skippedCount++;
                        continue;
                    }

                    // 只有壓縮後確定縮小至少 5% 才替換，避免越壓越大
                    if (newBytes && newBytes.length < origBytes.length * 0.95) {
                        dict.set(PDFName.of('Width'), PDFNumber.of(targetW));
                        dict.set(PDFName.of('Height'), PDFNumber.of(targetH));
                        dict.set(PDFName.of('Length'), PDFNumber.of(newBytes.length));
                        dict.set(PDFName.of('Filter'), PDFName.of('DCTDecode'));
                        dict.set(PDFName.of('ColorSpace'), PDFName.of('DeviceRGB'));
                        dict.set(PDFName.of('BitsPerComponent'), PDFNumber.of(8));
                        dict.delete(PDFName.of('DecodeParms'));

                        const updatedStream = PDFRawStream.of(dict, newBytes);
                        pdfDoc.context.assign(ref, updatedStream);
                        optimizedCount++;
                    } else {
                        skippedCount++;
                    }
                } catch (imgErr) {
                    // 單張圖片若格式特殊無法重壓，安全跳過保留原圖
                    console.warn('略過無法重壓的內嵌圖片:', imgErr);
                    skippedCount++;
                }
            }

            return { optimizedCount, skippedCount, totalImages };
        };

        const estimateOriginalExportSize = (pagesToExport, filesMap) => {
            if (!pagesToExport || pagesToExport.length === 0) return { bytes: 0, isExact: false };
            const uniqueFileIds = new Set(pagesToExport.map(p => p.fileId));
            if (uniqueFileIds.size === 1) {
                const first = pagesToExport[0];
                const record = filesMap[first.fileId];
                if (record && pagesToExport.length === first.sourcePageCount) {
                    return { bytes: record.size || record.bytes.length, isExact: true };
                }
            }

            let estimated = 0;
            pagesToExport.forEach(p => {
                const record = filesMap[p.fileId];
                if (record && p.sourcePageCount > 0) {
                    estimated += (record.size || record.bytes.length) / p.sourcePageCount;
                }
            });
            return { bytes: Math.round(estimated), isExact: false };
        };

        const toUint8ArrayCopy = (input) => {
            if (input instanceof Uint8Array) return new Uint8Array(input);
            if (input instanceof ArrayBuffer) return new Uint8Array(input.slice(0));
            if (ArrayBuffer.isView(input)) {
                return new Uint8Array(input.buffer.slice(input.byteOffset, input.byteOffset + input.byteLength));
            }
            throw new Error('無法複製 PDF 二進位資料。');
        };

        const toArrayBufferCopy = (input) => {
            const bytes = toUint8ArrayCopy(input);
            return bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        };

        const normalizeRotation = (angle) => {
            const value = Number(angle);
            const safeAngle = Number.isFinite(value) ? value : 0;
            return ((safeAngle % 360) + 360) % 360;
        };

        const validateRange = (startValue, endValue, totalPages) => {
            const start = parseInt(startValue, 10);
            const end = parseInt(endValue, 10);

            if (Number.isNaN(start) || Number.isNaN(end)) {
                return { ok: false, message: '請輸入起始頁與結束頁。' };
            }
            if (totalPages <= 0) {
                return { ok: false, message: '目前沒有可處理的頁面。' };
            }
            if (start < 1 || end > totalPages || start > end) {
                return { ok: false, message: `請輸入有效的頁碼範圍：1 到 ${totalPages}，且起始頁不能大於結束頁。` };
            }
            return { ok: true, start, end };
        };

        const movePagesToTarget = (allPages, dragIds, targetPageId, position) => {
            if (!Array.isArray(allPages) || !Array.isArray(dragIds) || dragIds.length === 0) return allPages;
            if (dragIds.includes(targetPageId)) return allPages;

            const dragIdSet = new Set(dragIds);
            const draggedPages = allPages.filter(page => dragIdSet.has(page.id));
            const remainingPages = allPages.filter(page => !dragIdSet.has(page.id));
            const targetIndexInRemaining = remainingPages.findIndex(page => page.id === targetPageId);

            if (draggedPages.length === 0 || targetIndexInRemaining === -1) return allPages;

            let insertIndex = targetIndexInRemaining;
            if (position === 'right') insertIndex += 1;

            const result = [...remainingPages];
            result.splice(insertIndex, 0, ...draggedPages);
            return result;
        };

        const validateExportPage = (pageState, filesMap, exportIndex) => {
            const pageNumberForMessage = exportIndex + 1;

            if (!pageState || typeof pageState !== 'object') {
                return { ok: false, message: `第 ${pageNumberForMessage} 個匯出項目不是有效頁面。` };
            }
            if (!pageState.id) {
                return { ok: false, message: `第 ${pageNumberForMessage} 頁缺少頁面識別碼。` };
            }
            if (!pageState.fileId) {
                return { ok: false, message: `第 ${pageNumberForMessage} 頁缺少來源檔識別碼。` };
            }
            if (!filesMap || !filesMap[pageState.fileId]) {
                return { ok: false, message: `第 ${pageNumberForMessage} 頁找不到來源 PDF。請重新載入檔案後再匯出。` };
            }
            if (!(filesMap[pageState.fileId].bytes instanceof Uint8Array)) {
                return { ok: false, message: `第 ${pageNumberForMessage} 頁的來源 PDF 二進位資料格式不正確。` };
            }
            if (!Number.isInteger(pageState.originalPageNum) || pageState.originalPageNum < 0) {
                return { ok: false, message: `第 ${pageNumberForMessage} 頁的來源頁碼不正確。` };
            }
            if (Number.isInteger(pageState.sourcePageCount) && pageState.originalPageNum >= pageState.sourcePageCount) {
                return { ok: false, message: `第 ${pageNumberForMessage} 頁超出來源 PDF 頁數。` };
            }

            return { ok: true };
        };

        const assertExportPagesAreValid = (pagesToExport, filesMap) => {
            if (!Array.isArray(pagesToExport) || pagesToExport.length === 0) {
                throw new Error('沒有可以匯出的頁面。');
            }

            pagesToExport.forEach((pageState, index) => {
                const result = validateExportPage(pageState, filesMap, index);
                if (!result.ok) throw new Error(result.message);
            });
        };

        const getReadableError = (error) => {
            if (!error) return '未知錯誤。';
            if (typeof error === 'string') return error;
            if (error.message) return error.message;
            try { return JSON.stringify(error); } catch (_) { return String(error); }
        };

        function App() {
            const [pages, setPages] = useState([]);
            const [sourceFiles, setSourceFiles] = useState({});
            const [isLoading, setIsLoading] = useState(false);
            const [extractStart, setExtractStart] = useState('');
            const [extractEnd, setExtractEnd] = useState('');
            const [exportMode, setExportMode] = useState('all');
            const [draggedPageId, setDraggedPageId] = useState(null);
            const [dropIndicator, setDropIndicator] = useState(null);
            const [isMultiSelectMode, setIsMultiSelectMode] = useState(false);
            const [selectedPageIds, setSelectedPageIds] = useState([]);
            const [lastSelectedPageId, setLastSelectedPageId] = useState(null);
            const [selectionRangeStart, setSelectionRangeStart] = useState('');
            const [selectionRangeEnd, setSelectionRangeEnd] = useState('');
            const [lastError, setLastError] = useState('');
            const [exportNotice, setExportNotice] = useState(null);
            const [dialog, setDialog] = useState(null);

            // 多檔匯入順序確認視窗相關狀態
            const [pendingFiles, setPendingFiles] = useState([]);
            const [pendingSortMode, setPendingSortMode] = useState('name-asc');
            const [draggedPendingId, setDraggedPendingId] = useState(null);
            const [pendingDropIndicator, setPendingDropIndicator] = useState(null);
            
            // 壓縮與進度相關狀態
            const [compressionLevel, setCompressionLevel] = useState('none');
            const [targetSizeMB, setTargetSizeMB] = useState('5');
            const [targetGrayscale, setTargetGrayscale] = useState(false);
            const [exportProgress, setExportProgress] = useState('');

            // 放大預覽相關狀態
            const [previewPage, setPreviewPage] = useState(null);
            const [highResPreviewUrl, setHighResPreviewUrl] = useState(null);
            const [isPreviewLoading, setIsPreviewLoading] = useState(false);
            const previewRequestRef = useRef(0);

            // 預覽視窗滑動與縮放狀態
            const [previewScale, setPreviewScale] = useState(1);
            const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const dragStart = useRef({ x: 0, y: 0 });
            const totalDragMovement = useRef(0);
            const modalRef = useRef(null);
            
            const fileInputRef = useRef(null);

            const loadPdfFiles = async (files) => {
                if (!files || files.length === 0) return;

                setIsLoading(true);
                setLastError('');

                try {
                    const nextSourceFiles = {};
                    const nextPages = [];

                    for (const file of files) {
                        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                            throw new Error(`「${file.name}」不是 PDF 檔案。`);
                        }

                        const fileId = makeId();
                        const rawBuffer = await file.arrayBuffer();
                        const previewData = toUint8ArrayCopy(rawBuffer);
                        const exportBytes = toUint8ArrayCopy(rawBuffer);

                        nextSourceFiles[fileId] = {
                            bytes: exportBytes,
                            name: file.name,
                            size: file.size,
                            type: file.type || 'application/pdf'
                        };

                        let pdf;
                        try {
                            const loadingTask = pdfjsLib.getDocument({ data: previewData });
                            pdf = await loadingTask.promise;
                        } catch (loadError) {
                            if (loadError.name === 'PasswordException') {
                                throw new Error(`「${file.name}」受到密碼保護，本工具目前不支援處理加密檔案，請解密後再試。`);
                            }
                            throw loadError;
                        }

                        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                            const page = await pdf.getPage(pageNum);
                            const scale = 0.5; // 工作區的縮圖維持小比例，節省記憶體
                            const viewport = page.getViewport({ scale });
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');

                            if (!context) throw new Error('瀏覽器無法建立 Canvas 預覽。');

                            canvas.height = viewport.height;
                            canvas.width = viewport.width;

                            await page.render({ canvasContext: context, viewport }).promise;

                            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                            const objectUrl = URL.createObjectURL(blob);

                            canvas.width = 0;
                            canvas.height = 0;

                            nextPages.push({
                                id: makeId(),
                                fileId,
                                originalPageNum: pageNum - 1,
                                sourcePageCount: pdf.numPages,
                                rotation: 0,
                                thumbnail: objectUrl,
                                filename: file.name
                            });
                        }

                        await pdf.destroy();
                    }

                    setSourceFiles(prev => ({ ...prev, ...nextSourceFiles }));
                    setPages(prev => [...prev, ...nextPages]);
                } catch (error) {
                    console.error('載入 PDF 發生錯誤:', error);
                    const message = getReadableError(error) || '載入 PDF 失敗，請確認檔案格式是否正確。';
                    setLastError(message);
                    setDialog({ type: 'alert', message });
                } finally {
                    setIsLoading(false);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const handleFileUpload = async (event) => {
                const files = Array.from(event.target.files || []);
                if (fileInputRef.current) fileInputRef.current.value = '';
                if (files.length === 0) return;

                const invalidFile = files.find(
                    file => file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')
                );
                if (invalidFile) {
                    const message = `「${invalidFile.name}」不是 PDF 檔案。`;
                    setLastError(message);
                    setDialog({ type: 'alert', message });
                    return;
                }

                // 單檔直接載入，不打擾日常操作
                if (files.length === 1) {
                    await loadPdfFiles(files);
                    return;
                }

                // 多檔先以檔名自然排序，並彈出順序確認視窗
                const wrapped = files.map(file => ({ id: makeId(), file }));
                setPendingFiles(sortPendingFiles(wrapped, 'name-asc'));
                setPendingSortMode('name-asc');
                setDraggedPendingId(null);
                setPendingDropIndicator(null);
            };

            const applyPendingSort = (mode) => {
                setPendingFiles(prev => sortPendingFiles(prev, mode));
                setPendingSortMode(mode);
            };

            const movePendingFile = (index, direction) => {
                setPendingFiles(prev => {
                    const targetIndex = index + direction;
                    if (targetIndex < 0 || targetIndex >= prev.length) return prev;
                    const next = [...prev];
                    const temp = next[index];
                    next[index] = next[targetIndex];
                    next[targetIndex] = temp;
                    return next;
                });
                setPendingSortMode('custom');
            };

            const removePendingFile = (id) => {
                setPendingFiles(prev => prev.filter(item => item.id !== id));
            };

            const handlePendingDragStart = (e, id) => {
                setDraggedPendingId(id);
                e.dataTransfer.setData('text/plain', id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handlePendingDragOver = (e, targetId) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (!draggedPendingId || draggedPendingId === targetId) {
                    setPendingDropIndicator(null);
                    return;
                }
                const rect = e.currentTarget.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const position = y < rect.height / 2 ? 'top' : 'bottom';
                setPendingDropIndicator(prev => {
                    if (prev?.targetId === targetId && prev?.position === position) return prev;
                    return { targetId, position };
                });
            };

            const handlePendingDrop = (e, targetId) => {
                e.preventDefault();
                if (!draggedPendingId || !pendingDropIndicator) {
                    setDraggedPendingId(null);
                    setPendingDropIndicator(null);
                    return;
                }
                setPendingFiles(prev => reorderPendingFiles(prev, draggedPendingId, targetId, pendingDropIndicator.position));
                setPendingSortMode('custom');
                setDraggedPendingId(null);
                setPendingDropIndicator(null);
            };

            const handlePendingDragEnd = () => {
                setDraggedPendingId(null);
                setPendingDropIndicator(null);
            };

            const cancelPendingImport = () => {
                setPendingFiles([]);
                setDraggedPendingId(null);
                setPendingDropIndicator(null);
            };

            const confirmPendingImport = async () => {
                const filesToLoad = pendingFiles.map(item => item.file);
                setPendingFiles([]);
                setDraggedPendingId(null);
                setPendingDropIndicator(null);
                if (filesToLoad.length > 0) {
                    await loadPdfFiles(filesToLoad);
                }
            };

            // 即時產出該頁的高畫質大圖
            const openPreview = async (page) => {
                setPreviewPage(page);
                setHighResPreviewUrl(null);
                setIsPreviewLoading(true);
                setPreviewScale(1);
                setPanOffset({ x: 0, y: 0 });

                const currentRequestId = ++previewRequestRef.current;

                try {
                    const sourceRecord = sourceFiles[page.fileId];
                    if (!sourceRecord) throw new Error('找不到來源檔案');

                    const loadingTask = pdfjsLib.getDocument({ data: toUint8ArrayCopy(sourceRecord.bytes) });
                    const pdf = await loadingTask.promise;
                    const pdfPage = await pdf.getPage(page.originalPageNum + 1);

                    // 計算適合螢幕高度的縮放比例，確保放大時依舊清晰 (考慮 Retina 等高 DPI 螢幕)
                    const unscaledViewport = pdfPage.getViewport({ scale: 1.0 });
                    const targetHeight = window.innerHeight * (window.devicePixelRatio || 1);
                    let optimalScale = targetHeight / unscaledViewport.height;
                    
                    // 限制縮放比例在 1.5 倍到 5 倍之間，避免過度消耗記憶體
                    optimalScale = Math.min(Math.max(optimalScale, 1.5), 5.0);

                    const viewport = pdfPage.getViewport({ scale: optimalScale });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // 填滿白色背景，避免 PDF 透明底色渲染成黑色
                    context.fillStyle = 'white';
                    context.fillRect(0, 0, canvas.width, canvas.height);

                    await pdfPage.render({ canvasContext: context, viewport }).promise;

                    // 使用 JPEG 格式以節省記憶體並加快產生速度
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
                    const objectUrl = URL.createObjectURL(blob);
                    
                    canvas.width = 0;
                    canvas.height = 0;
                    await pdf.destroy(); // 釋放文件記憶體

                    // 確保沒有在載入過程中被使用者關閉
                    if (previewRequestRef.current === currentRequestId) {
                        setHighResPreviewUrl(objectUrl);
                    } else {
                        URL.revokeObjectURL(objectUrl);
                    }
                } catch (err) {
                    console.error("高畫質預覽生成失敗", err);
                    if (previewRequestRef.current === currentRequestId) {
                        setHighResPreviewUrl(page.thumbnail); // 失敗則回退使用低畫質縮圖
                    }
                } finally {
                    if (previewRequestRef.current === currentRequestId) {
                        setIsPreviewLoading(false);
                    }
                }
            };

            const closePreview = () => {
                previewRequestRef.current++; // 取消目前任何進行中的渲染請求
                if (highResPreviewUrl && highResPreviewUrl !== previewPage?.thumbnail) {
                    URL.revokeObjectURL(highResPreviewUrl);
                }
                setPreviewPage(null);
                setHighResPreviewUrl(null);
                setIsPreviewLoading(false);
                setPreviewScale(1);
                setPanOffset({ x: 0, y: 0 });
                setIsDragging(false);
            };

            // 按下 ESC 鍵時自動關閉放大預覽或匯入排序視窗
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        if (previewPage) {
                            closePreview();
                        } else if (pendingFiles.length > 0) {
                            cancelPendingImport();
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [previewPage, highResPreviewUrl, pendingFiles.length]);

            // 滑動/拖曳預覽大圖邏輯
            const handleMouseDown = (e) => {
                if (e.button !== 0) return; // 只允許滑動滑鼠左鍵
                e.preventDefault();
                setIsDragging(true);
                totalDragMovement.current = 0;
                dragStart.current = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const nextX = e.clientX - dragStart.current.x;
                const nextY = e.clientY - dragStart.current.y;
                
                const distanceMoved = Math.abs(nextX - panOffset.x) + Math.abs(nextY - panOffset.y);
                totalDragMovement.current += distanceMoved;
                
                setPanOffset({ x: nextX, y: nextY });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            // 滾輪縮放監聽 (由於 Chrome/Safari 對於非 Passive 事件的限制，故使用標準 Effect 處理以預防視窗背景跟著滾動)
            useEffect(() => {
                const modalEl = modalRef.current;
                if (!modalEl) return;

                const handleWheelRaw = (e) => {
                    e.preventDefault();
                    const factor = 1.15;
                    setPreviewScale(prev => {
                        const newScale = e.deltaY < 0 ? prev * factor : prev / factor;
                        return Math.min(Math.max(newScale, 0.5), 8.0); // 縮放限制：50% - 800%
                    });
                };

                modalEl.addEventListener('wheel', handleWheelRaw, { passive: false });
                return () => {
                    modalEl.removeEventListener('wheel', handleWheelRaw);
                };
            }, [previewPage]);

            // 點擊背景判定：只有「非拖曳行程（點擊）」且「點擊落在 backdrop 本身」才關閉視窗
            const handleBackdropClick = (e) => {
                if (e.target === e.currentTarget && totalDragMovement.current < 6) {
                    closePreview();
                }
            };

            const performDelete = (idsToDelete) => {
                withViewTransition(() => {
                    setPages(prev => {
                        const idsSet = new Set(idsToDelete);
                        const pagesToDelete = prev.filter(p => idsSet.has(p.id));
                        
                        pagesToDelete.forEach(p => {
                            if (p.thumbnail) URL.revokeObjectURL(p.thumbnail);
                        });
                        
                        const newPages = prev.filter(p => !idsSet.has(p.id));
                        
                        setSourceFiles(currentFiles => {
                            const updatedFiles = { ...currentFiles };
                            let hasChanges = false;
                            
                            pagesToDelete.forEach(page => {
                                const fileId = page.fileId;
                                const isFileIdStillUsed = newPages.some(p => p.fileId === fileId);
                                if (!isFileIdStillUsed && updatedFiles[fileId]) {
                                    delete updatedFiles[fileId];
                                    hasChanges = true;
                                }
                            });
                            
                            return hasChanges ? updatedFiles : currentFiles;
                        });
                        
                        return newPages;
                    });
                    setSelectedPageIds(prev => prev.filter(pageId => !idsToDelete.includes(pageId)));
                });
            };

            const deleteSelectedPages = () => {
                if (selectedPageIds.length === 0) return;
                setDialog({
                    type: 'confirm',
                    message: `確定要刪除選取的 ${selectedPageIds.length} 個頁面嗎？`,
                    onConfirm: () => {
                        performDelete(selectedPageIds);
                        setDialog(null);
                    }
                });
            };

            const deletePage = (id) => {
                if (isMultiSelectMode && selectedPageIds.includes(id) && selectedPageIds.length > 1) {
                    deleteSelectedPages();
                } else {
                    performDelete([id]);
                }
            };

            const toggleMultiSelectMode = () => {
                setIsMultiSelectMode(prev => !prev);
                setSelectedPageIds([]);
                setLastSelectedPageId(null);
                setSelectionRangeStart('');
                setSelectionRangeEnd('');
            };

            const togglePageSelection = (id, event) => {
                if (!isMultiSelectMode) return;

                const isShiftPressed = Boolean(event?.shiftKey || event?.nativeEvent?.shiftKey);

                if (isShiftPressed && lastSelectedPageId !== null) {
                    const lastIndex = pages.findIndex(p => p.id === lastSelectedPageId);
                    const currentIndex = pages.findIndex(p => p.id === id);

                    if (lastIndex !== -1 && currentIndex !== -1) {
                        const start = Math.min(lastIndex, currentIndex);
                        const end = Math.max(lastIndex, currentIndex);
                        const rangeIds = pages.slice(start, end + 1).map(page => page.id);
                        setSelectedPageIds(prev => Array.from(new Set([...prev, ...rangeIds])));
                        setLastSelectedPageId(id);
                        return;
                    }
                }

                setSelectedPageIds(prev => prev.includes(id) ? prev.filter(pageId => pageId !== id) : [...prev, id]);
                setLastSelectedPageId(id);
            };

            const selectAllPages = () => {
                setSelectedPageIds(pages.map(page => page.id));
                setLastSelectedPageId(pages.length > 0 ? pages[pages.length - 1].id : null);
            };

            const clearPageSelection = () => {
                setSelectedPageIds([]);
                setLastSelectedPageId(null);
                setSelectionRangeStart('');
                setSelectionRangeEnd('');
            };

            const addRangeSelection = () => {
                const result = validateRange(selectionRangeStart, selectionRangeEnd, pages.length);
                if (!result.ok) return setDialog({ type: 'alert', message: result.message });

                const rangeIds = pages.slice(result.start - 1, result.end).map(page => page.id);
                setSelectedPageIds(prev => Array.from(new Set([...prev, ...rangeIds])));
                setLastSelectedPageId(rangeIds[rangeIds.length - 1] || null);
            };

            const rotatePage = (id) => {
                setPages(prev => prev.map(p => p.id === id ? { ...p, rotation: normalizeRotation(p.rotation + 90) } : p));
            };

            const withViewTransition = (callback) => {
                if (document.startViewTransition && typeof ReactDOM !== 'undefined' && ReactDOM.flushSync) {
                    document.startViewTransition(() => {
                        ReactDOM.flushSync(callback);
                    });
                } else {
                    callback();
                }
            };

            const movePage = (index, direction) => {
                withViewTransition(() => {
                    setPages(prev => {
                        if ((direction === -1 && index === 0) || (direction === 1 && index === prev.length - 1)) return prev;
                        const newPages = [...prev];
                        const temp = newPages[index];
                        newPages[index] = newPages[index + direction];
                        newPages[index + direction] = temp;
                        return newPages;
                    });
                });
            };

            const handleDragStart = (e, pageId) => {
                const draggingSelectedGroup = isMultiSelectMode && selectedPageIds.includes(pageId) && selectedPageIds.length > 0;
                const dragIds = draggingSelectedGroup ? selectedPageIds : [pageId];

                setDraggedPageId(pageId);
                e.dataTransfer.setData('application/json', JSON.stringify({ dragIds }));
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragEnter = (e) => e.preventDefault();

            const handleDragOver = (e, targetPageId) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';

                const draggingSelectedGroup = isMultiSelectMode && draggedPageId && selectedPageIds.includes(draggedPageId) && selectedPageIds.length > 0;

                if (draggedPageId === targetPageId || (draggingSelectedGroup && selectedPageIds.includes(targetPageId))) {
                    setDropIndicator(null);
                    return;
                }

                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const position = x < rect.width / 2 ? 'left' : 'right';

                setDropIndicator(prev => {
                    if (prev?.targetPageId === targetPageId && prev?.position === position) return prev;
                    return { targetPageId, position };
                });
            };

            const getDropLineClass = (pageId, position) => {
                if (dropIndicator?.targetPageId !== pageId || dropIndicator?.position !== position) return 'hidden';
                return 'block';
            };

            const handleDrop = (e, targetPageId) => {
                e.preventDefault();
                if (!draggedPageId || !dropIndicator) {
                    setDropIndicator(null);
                    setDraggedPageId(null);
                    return;
                }

                const draggingSelectedGroup = isMultiSelectMode && selectedPageIds.includes(draggedPageId) && selectedPageIds.length > 0;
                const dragIds = draggingSelectedGroup ? selectedPageIds : [draggedPageId];
                
                withViewTransition(() => {
                    const newPages = movePagesToTarget(pages, dragIds, targetPageId, dropIndicator.position);
                    setPages(newPages);
                    setDraggedPageId(null);
                    setDropIndicator(null);
                });
            };

            const handleDragEnd = () => {
                setDraggedPageId(null);
                setDropIndicator(null);
            };

            const renderRasterPageToJpeg = async (pdfPage, scale, quality, grayscale) => {
                const unscaledViewport = pdfPage.getViewport({ scale: 1.0 });
                const renderViewport = pdfPage.getViewport({ scale });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                if (!context) throw new Error('瀏覽器無法建立 Canvas 畫布。');

                canvas.width = Math.max(1, Math.round(renderViewport.width));
                canvas.height = Math.max(1, Math.round(renderViewport.height));

                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);

                await pdfPage.render({ canvasContext: context, viewport: renderViewport }).promise;

                if (grayscale) {
                    const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    for (let p = 0; p < data.length; p += 4) {
                        const lum = Math.round(0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2]);
                        data[p] = lum;
                        data[p + 1] = lum;
                        data[p + 2] = lum;
                    }
                    context.putImageData(imgData, 0, 0);
                }

                const jpgBytes = await canvasToJpegBytes(canvas, quality);
                canvas.width = 0;
                canvas.height = 0;

                return {
                    jpgBytes,
                    pageWidth: unscaledViewport.width,
                    pageHeight: unscaledViewport.height
                };
            };

            const buildRasterizedPdfWithCache = async (pagesToExport, parsedPdfDocs, preset, grayscale, progressPrefix) => {
                let mergedPdf;
                try {
                    mergedPdf = await PDFDocument.create();
                } catch (createError) {
                    throw new Error(`建立新 PDF 文件失敗：${getReadableError(createError)}`);
                }

                for (let i = 0; i < pagesToExport.length; i++) {
                    setExportProgress(`${progressPrefix}第 ${i + 1} / ${pagesToExport.length} 頁（${preset.label}${grayscale ? '・灰階' : ''}）...`);
                    await new Promise(resolve => setTimeout(resolve, 12));

                    const pageState = pagesToExport[i];
                    const { fileId, originalPageNum, rotation } = pageState;
                    const sourceRecord = sourceFiles[fileId];

                    try {
                        if (!parsedPdfDocs[fileId]) {
                            const loadingTask = pdfjsLib.getDocument({ data: toUint8ArrayCopy(sourceRecord.bytes) });
                            parsedPdfDocs[fileId] = await loadingTask.promise;
                        }

                        const pdfPage = await parsedPdfDocs[fileId].getPage(originalPageNum + 1);
                        const { jpgBytes, pageWidth, pageHeight } = await renderRasterPageToJpeg(
                            pdfPage,
                            preset.scale,
                            preset.quality,
                            grayscale
                        );

                        const jpgImage = await mergedPdf.embedJpg(jpgBytes);
                        const page = mergedPdf.addPage([pageWidth, pageHeight]);

                        page.drawImage(jpgImage, {
                            x: 0,
                            y: 0,
                            width: pageWidth,
                            height: pageHeight
                        });

                        page.setRotation(degrees(normalizeRotation(rotation)));
                    } catch (pageError) {
                        console.error('轉圖片壓縮單頁失敗:', { exportIndex: i, pageState, pageError });
                        throw new Error(`壓縮第 ${i + 1} 頁時失敗：${getReadableError(pageError)}`);
                    }
                }

                return mergedPdf;
            };

            const compressToTargetSize = async (pagesToExport, targetMB, grayscale) => {
                const targetBytes = targetMB * 1024 * 1024;
                const safeTargetBytes = targetBytes * 0.97; // 預留 3% 緩衝，確保最終小於上限

                setExportProgress('正在檢查原始檔案大小...');
                await new Promise(resolve => setTimeout(resolve, 15));

                const baseDoc = await buildMergedPdf(pagesToExport);
                const baseBytes = await baseDoc.save({ useObjectStreams: true, addDefaultPage: false });

                // 若原檔本來就低於目標上限，直接保留原畫質
                if (baseBytes.length <= safeTargetBytes) {
                    return {
                        pdfBytes: baseBytes,
                        method: 'original',
                        metTarget: true,
                        smartStats: null
                    };
                }

                let bestResult = {
                    pdfBytes: baseBytes,
                    method: 'original',
                    metTarget: false,
                    smartStats: null
                };

                // 第一階段：優先嘗試智慧壓縮（保留文字與向量）
                for (let step = 0; step < SMART_TARGET_LADDER.length; step++) {
                    const preset = SMART_TARGET_LADDER[step];
                    setExportProgress(`智慧壓縮試壓（第 ${step + 1} 輪・${preset.label}，目標 ≤ ${targetMB} MB）...`);
                    await new Promise(resolve => setTimeout(resolve, 15));

                    const smartDoc = await buildMergedPdf(pagesToExport);
                    const stats = await recompressEmbeddedImages(smartDoc, preset, (current, total) => {
                        setExportProgress(`智慧壓縮第 ${step + 1} 輪：最佳化圖片 ${current} / ${total}（目標 ≤ ${targetMB} MB）...`);
                    });

                    const candidateBytes = await smartDoc.save({ useObjectStreams: true, addDefaultPage: false });
                    if (candidateBytes.length < bestResult.pdfBytes.length) {
                        bestResult = {
                            pdfBytes: candidateBytes,
                            method: 'smart',
                            metTarget: candidateBytes.length <= targetBytes,
                            smartStats: stats
                        };
                    }

                    if (candidateBytes.length <= safeTargetBytes) {
                        return {
                            pdfBytes: candidateBytes,
                            method: 'smart',
                            metTarget: true,
                            smartStats: stats
                        };
                    }

                    // 若本檔無任何可縮減的內嵌圖片，直接跳往第二階段（全頁轉圖）
                    if (stats.totalImages === 0 || (step === 0 && stats.optimizedCount === 0)) {
                        break;
                    }
                }

                // 第二階段：智慧壓縮未達標，自動接力改用全頁轉圖片壓縮
                const parsedPdfDocs = {};
                try {
                    // 抽樣最多 3 頁代表頁，快速估算最適起始檔位
                    setExportProgress(`智慧壓縮仍超過 ${targetMB} MB，正在估算最佳轉圖參數...`);
                    await new Promise(resolve => setTimeout(resolve, 15));

                    const n = pagesToExport.length;
                    const sampleIndices = Array.from(new Set([0, Math.floor(n / 2), n - 1]));
                    const baseRasterPreset = EXTREME_TARGET_LADDER[2]; // scale 1.25 / quality 0.58
                    let sampleBytesSum = 0;

                    for (const sIdx of sampleIndices) {
                        const pageState = pagesToExport[sIdx];
                        const sourceRecord = sourceFiles[pageState.fileId];
                        if (!parsedPdfDocs[pageState.fileId]) {
                            const loadingTask = pdfjsLib.getDocument({ data: toUint8ArrayCopy(sourceRecord.bytes) });
                            parsedPdfDocs[pageState.fileId] = await loadingTask.promise;
                        }
                        const pdfPage = await parsedPdfDocs[pageState.fileId].getPage(pageState.originalPageNum + 1);
                        const { jpgBytes } = await renderRasterPageToJpeg(
                            pdfPage,
                            baseRasterPreset.scale,
                            baseRasterPreset.quality,
                            grayscale
                        );
                        sampleBytesSum += jpgBytes.length;
                    }

                    const estimatedTotalAtBase = (sampleBytesSum / sampleIndices.length) * n * 1.04;
                    const ratio = safeTargetBytes / Math.max(estimatedTotalAtBase, 1);

                    let ladderIdx = 2;
                    if (ratio >= 1.8) ladderIdx = 0;
                    else if (ratio >= 1.25) ladderIdx = 1;
                    else if (ratio >= 0.92) ladderIdx = 2;
                    else if (ratio >= 0.65) ladderIdx = 3;
                    else if (ratio >= 0.45) ladderIdx = 4;
                    else ladderIdx = 5;

                    let round = 0;
                    const maxRounds = 3;
                    const triedIndices = new Set();

                    while (round < maxRounds && ladderIdx < EXTREME_TARGET_LADDER.length && !triedIndices.has(ladderIdx)) {
                        triedIndices.add(ladderIdx);
                        round++;
                        const preset = EXTREME_TARGET_LADDER[ladderIdx];

                        const rasterDoc = await buildRasterizedPdfWithCache(
                            pagesToExport,
                            parsedPdfDocs,
                            preset,
                            grayscale,
                            `轉圖片壓縮第 ${round} 輪（目標 ≤ ${targetMB} MB）：`
                        );

                        setExportProgress('正在打包檢查檔案大小...');
                        await new Promise(resolve => setTimeout(resolve, 15));
                        const candidateBytes = await rasterDoc.save({ useObjectStreams: true, addDefaultPage: false });

                        if (candidateBytes.length < bestResult.pdfBytes.length) {
                            bestResult = {
                                pdfBytes: candidateBytes,
                                method: 'raster',
                                metTarget: candidateBytes.length <= targetBytes,
                                smartStats: null
                            };
                        }

                        if (candidateBytes.length <= safeTargetBytes) {
                            return {
                                pdfBytes: candidateBytes,
                                method: 'raster',
                                metTarget: true,
                                smartStats: null
                            };
                        }

                        if (ladderIdx >= EXTREME_TARGET_LADDER.length - 1) break;

                        const overshoot = candidateBytes.length / safeTargetBytes;
                        ladderIdx = Math.min(
                            EXTREME_TARGET_LADDER.length - 1,
                            ladderIdx + (overshoot > 1.45 ? 2 : 1)
                        );
                    }
                } finally {
                    await Promise.all(
                        Object.values(parsedPdfDocs).map(doc => doc.destroy().catch(() => {}))
                    );
                }

                return bestResult;
            };

            const buildMergedPdf = async (pagesToExport) => {
                assertExportPagesAreValid(pagesToExport, sourceFiles);

                let mergedPdf;
                try {
                    mergedPdf = await PDFDocument.create();
                } catch (createError) {
                    throw new Error(`建立新 PDF 文件失敗：${getReadableError(createError)}`);
                }

                // 依來源檔分組，一次批次 copyPages 讓共用字型與圖片資源自動去重，避免檔案膨脹
                const groupedByFile = new Map();
                pagesToExport.forEach((pageState, exportIndex) => {
                    if (!groupedByFile.has(pageState.fileId)) {
                        groupedByFile.set(pageState.fileId, []);
                    }
                    groupedByFile.get(pageState.fileId).push({ exportIndex, pageState });
                });

                const copiedPagesByExportIndex = new Array(pagesToExport.length);

                for (const [fileId, entries] of groupedByFile.entries()) {
                    const sourceRecord = sourceFiles[fileId];
                    const firstFilename = entries[0]?.pageState?.filename || fileId;

                    let sourcePdf;
                    try {
                        const sourceBytes = toUint8ArrayCopy(sourceRecord.bytes);
                        sourcePdf = await PDFDocument.load(sourceBytes, {
                            ignoreEncryption: true,
                            updateMetadata: false
                        });
                    } catch (loadError) {
                        throw new Error(`讀取來源檔「${firstFilename}」失敗：${getReadableError(loadError)}`);
                    }

                    const sourcePageCount = sourcePdf.getPageCount();
                    const pageIndices = entries.map(({ exportIndex, pageState }) => {
                        if (pageState.originalPageNum < 0 || pageState.originalPageNum >= sourcePageCount) {
                            throw new Error(`匯出第 ${exportIndex + 1} 頁時失敗：來源檔「${pageState.filename || fileId}」沒有第 ${pageState.originalPageNum + 1} 頁。`);
                        }
                        return pageState.originalPageNum;
                    });

                    try {
                        const copiedPages = await mergedPdf.copyPages(sourcePdf, pageIndices);
                        entries.forEach(({ exportIndex, pageState }, idx) => {
                            const copiedPage = copiedPages[idx];
                            const currentRotation = copiedPage.getRotation().angle || 0;
                            copiedPage.setRotation(degrees(normalizeRotation(currentRotation + pageState.rotation)));
                            copiedPagesByExportIndex[exportIndex] = copiedPage;
                        });
                    } catch (copyError) {
                        console.error('批次複製頁面失敗:', { fileId, pageIndices, copyError });
                        throw new Error(`複製來源檔「${firstFilename}」頁面時失敗：${getReadableError(copyError)}`);
                    }
                }

                // 嚴格依照使用者排好的頁面順序加入新 PDF
                for (let i = 0; i < copiedPagesByExportIndex.length; i++) {
                    mergedPdf.addPage(copiedPagesByExportIndex[i]);
                }

                return mergedPdf;
            };

            const downloadBytes = (bytes, filename) => {
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const processAndDownloadPDF = async (pagesToExport, filenamePrefix) => {
                let parsedTargetMB = null;
                if (compressionLevel === 'target') {
                    parsedTargetMB = parseFloat(targetSizeMB);
                    if (!Number.isFinite(parsedTargetMB) || parsedTargetMB < 0.2) {
                        setDialog({ type: 'alert', message: '請輸入有效的目標檔案大小上限（至少 0.2 MB）。' });
                        return;
                    }
                }

                setIsLoading(true);
                setExportProgress('準備處理...');
                setLastError('');
                setExportNotice(null);

                try {
                    let pdfBytes;
                    let smartStats = null;
                    let targetResult = null;

                    if (compressionLevel === 'target') {
                        targetResult = await compressToTargetSize(pagesToExport, parsedTargetMB, targetGrayscale);
                        pdfBytes = targetResult.pdfBytes;
                        smartStats = targetResult.smartStats;
                    } else {
                        setExportProgress('正在組合頁面...');
                        await new Promise(resolve => setTimeout(resolve, 15));
                        const mergedPdf = await buildMergedPdf(pagesToExport);

                        if (compressionLevel === 'smart') {
                            smartStats = await recompressEmbeddedImages(mergedPdf, SMART_DEFAULT_PRESET, (current, total) => {
                                setExportProgress(`正在智慧最佳化內嵌圖片 ${current} / ${total}...`);
                            });
                        }

                        setExportProgress('正在打包產生檔案...');
                        await new Promise(resolve => setTimeout(resolve, 20));

                        try {
                            pdfBytes = await mergedPdf.save({
                                useObjectStreams: true,
                                addDefaultPage: false
                            });
                        } catch (saveError) {
                            throw new Error(`儲存合併後 PDF 失敗：${getReadableError(saveError)}`);
                        }
                    }

                    if (!pdfBytes || pdfBytes.length === 0) {
                        throw new Error('產生的 PDF 是空檔案。');
                    }

                    downloadBytes(pdfBytes, `${filenamePrefix}_${new Date().getTime()}.pdf`);

                    // 計算並顯示壓縮前後檔案大小比較
                    const outputBytes = pdfBytes.length;
                    const originalEstimate = estimateOriginalExportSize(pagesToExport, sourceFiles);
                    const detailParts = [];

                    if (targetResult) {
                        if (targetResult.metTarget) {
                            if (targetResult.method === 'original') {
                                detailParts.push(`原本即低於 ${parsedTargetMB} MB 上限，已保留原畫質與文字`);
                            } else if (targetResult.method === 'smart') {
                                detailParts.push(`已壓至 ${parsedTargetMB} MB 以下，保留文字與向量`);
                            } else {
                                detailParts.push(`已自動轉為圖片以符合 ${parsedTargetMB} MB 上限`);
                            }
                        } else {
                            detailParts.push(`已達最低可讀畫質極限，仍高於目標 ${parsedTargetMB} MB，建議調高上限或分批匯出`);
                        }
                    }

                    if (originalEstimate.bytes > 0) {
                        const savedRatio = (1 - outputBytes / originalEstimate.bytes) * 100;
                        const origLabel = originalEstimate.isExact ? '原檔' : '原檔估算約';
                        if (savedRatio >= 1) {
                            detailParts.push(`${origLabel} ${formatFileSize(originalEstimate.bytes)}，減少 ${Math.round(savedRatio)}%`);
                        } else {
                            detailParts.push(`${origLabel} ${formatFileSize(originalEstimate.bytes)}`);
                        }
                    }

                    if (smartStats && (!targetResult || targetResult.method === 'smart')) {
                        if (smartStats.totalImages === 0) {
                            detailParts.push('未偵測到內嵌圖片，已保留原始文字與向量');
                        } else if (smartStats.optimizedCount > 0) {
                            detailParts.push(`偵測到 ${smartStats.totalImages} 張圖片，成功壓縮 ${smartStats.optimizedCount} 張，略過 ${smartStats.skippedCount} 張`);
                        } else {
                            detailParts.push(`偵測到 ${smartStats.totalImages} 張圖片，皆略過（已達最佳化、帶透明遮罩或為特殊格式）`);
                        }
                    }

                    const suffix = detailParts.length > 0 ? `（${detailParts.join('；')}）` : '';
                    const isWarning = Boolean(targetResult && !targetResult.metTarget);
                    const prefix = isWarning ? '已匯出最小版本！' : '匯出完成！';
                    setExportNotice({
                        type: isWarning ? 'warning' : 'success',
                        text: `${prefix}輸出檔案大小：${formatFileSize(outputBytes)}${suffix}`
                    });
                } catch (error) {
                    console.error('匯出發生錯誤:', error);
                    const message = getReadableError(error) || '匯出 PDF 時發生錯誤。';
                    setLastError(message);
                    setDialog({ type: 'alert', message });
                } finally {
                    setIsLoading(false);
                    setExportProgress('');
                }
            };

            const handleExport = () => {
                if (pages.length === 0) return setDialog({ type: 'alert', message: '沒有可以匯出的頁面！' });

                if (exportMode === 'all') {
                    processAndDownloadPDF(pages, 'exported');
                    return;
                }

                const result = validateRange(extractStart, extractEnd, pages.length);
                if (!result.ok) return setDialog({ type: 'alert', message: result.message });

                const subset = pages.slice(result.start - 1, result.end);
                processAndDownloadPDF(subset, `extracted_${result.start}_to_${result.end}`);
            };

            const getExportSummary = () => {
                if (pages.length === 0) return '尚未載入 PDF';
                if (exportMode === 'all') return `將匯出全部 ${pages.length} 頁`;

                const result = validateRange(extractStart, extractEnd, pages.length);
                if (!result.ok) return result.message;
                return `將匯出第 ${result.start} - ${result.end} 頁，共 ${result.end - result.start + 1} 頁`;
            };

            const clearAll = () => {
                setDialog({
                    type: 'confirm',
                    message: '確定要清除所有頁面嗎？',
                    onConfirm: () => {
                        pages.forEach(page => {
                            if (page.thumbnail) URL.revokeObjectURL(page.thumbnail);
                        });
                        setPages([]);
                        setSourceFiles({});
                        setExtractStart('');
                        setExtractEnd('');
                        setSelectedPageIds([]);
                        setLastSelectedPageId(null);
                        setSelectionRangeStart('');
                        setSelectionRangeEnd('');
                        setIsMultiSelectMode(false);
                        setLastError('');
                        setExportNotice(null);
                        setDialog(null);
                    }
                });
            };

            // 預覽圖片與位置 CSS
            const transformStyle = previewPage ? {
                transform: `translate(${panOffset.x}px, ${panOffset.y}px) scale(${previewScale}) rotate(${previewPage.rotation}deg)`,
                transition: isDragging ? 'none' : 'transform 0.15s cubic-bezier(0.16, 1, 0.3, 1)',
                cursor: isDragging ? 'grabbing' : previewScale > 1 ? 'grab' : 'zoom-in',
            } : {};

            return (
                <div className="min-h-screen p-8 font-sans relative">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-8 text-center">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">📄 地端 PDF 處理工具</h1>
                            <p className="text-gray-500">所有的處理都在您的瀏覽器中進行，檔案不會上傳至任何伺服器，確保隱私。</p>
                        </header>

                        <div className="bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-100">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                                <section className="rounded-xl border border-gray-100 bg-gray-50 p-4">
                                    <div className="flex items-center gap-2 mb-3">
                                        <span className="flex h-7 w-7 items-center justify-center rounded-full bg-blue-100 text-blue-700 text-sm font-bold">1</span>
                                        <div>
                                            <h2 className="font-bold text-gray-800">檔案管理</h2>
                                            <p className="text-xs text-gray-500">先載入或附加 PDF 檔案（多檔可先調整順序）</p>
                                        </div>
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg shadow-sm transition font-medium flex items-center justify-center">
                                            <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                            載入 / 附加 PDF
                                            <input type="file" accept="application/pdf" multiple className="hidden" onChange={handleFileUpload} ref={fileInputRef}/>
                                        </label>
                                        {pages.length > 0 && (
                                            <button type="button" onClick={clearAll} className="border border-red-200 bg-white hover:bg-red-50 text-red-600 px-4 py-2.5 rounded-lg transition font-medium">
                                                清除全部
                                            </button>
