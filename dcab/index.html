<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公空間需求計算器 (beta版)</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5YQY4RT9H2');
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* CAD Styling */
        .cad-wall { fill: none; stroke: #0f172a; stroke-width: 2.5; stroke-linecap: square; }
        .cad-furniture { fill: #f1f5f9; stroke: #475569; stroke-width: 1.2; }
        .cad-chair { fill: #e2e8f0; stroke: #334155; stroke-width: 1.2; }
        .cad-dim-line { stroke: #64748b; stroke-width: 0.8; }
        .cad-dim-text { font-family: monospace; font-size: 9px; fill: #475569; font-weight: bold; }
        .cad-door-swing { fill: none; stroke: #64748b; stroke-width: 1; stroke-dasharray: 3,3; }

        /* Loader */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        /* Input styling */
        input[type=number] {
            color: #0f172a;
            font-weight: 700;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Print Container Handling */
        #print-staging-area {
            position: fixed;
            left: -9999px;
            top: 0;
            z-index: -100;
        }

        /* A4 specific width for the staging pages */
        .a4-page {
            width: 794px; /* A4 width at 96 DPI */
            min-height: 1123px; /* A4 height */
            padding: 40px;
            background: white;
            box-sizing: border-box;
            position: relative;
        }

        .area-rect { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useMemo } = React;

        // --- Component: Smart Control Input ---
        const SmartControl = ({ value, onChange, min = 0, step = 1, unit = "", large = false }) => {
            const handleDecrement = () => {
                const current = value === '' ? 0 : parseFloat(value);
                const next = Math.max(min, current - step);
                onChange(parseFloat(next.toFixed(2)));
            };
            const handleIncrement = () => {
                const current = value === '' ? 0 : parseFloat(value);
                const next = current + step;
                onChange(parseFloat(next.toFixed(2)));
            };
            const handleInputChange = (e) => {
                const val = e.target.value;
                if (val === '') { onChange(''); return; }
                if (!isNaN(val)) { onChange(val); }
            };
            const handleBlur = () => {
                if (value === '' || value === '.') { onChange(min); } 
                else { onChange(parseFloat(value)); }
            };

            return (
                <div className={`flex items-center border border-slate-300 rounded-lg overflow-hidden bg-white shadow-sm ${large ? 'h-12 max-w-[160px]' : 'h-10 max-w-[120px]'} w-full`}>
                    <button onClick={handleDecrement} className={`${large ? 'w-12' : 'w-10'} h-full flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-600 border-r border-slate-200 active:bg-slate-300 transition-colors touch-manipulation`} type="button"><i className="fas fa-minus text-sm"></i></button>
                    <div className="flex-grow relative h-full min-w-[30px]">
                        <input type="number" inputMode="decimal" value={value} onChange={handleInputChange} onBlur={handleBlur} className={`w-full h-full text-center font-bold text-slate-800 outline-none bg-white px-0 ${large ? 'text-lg' : 'text-base'}`} placeholder="0"/>
                        {unit && <span className="absolute right-0 top-1/2 transform -translate-y-1/2 text-xs font-medium text-slate-400 pointer-events-none bg-white pr-2">{unit}</span>}
                    </div>
                    <button onClick={handleIncrement} className={`${large ? 'w-12' : 'w-10'} h-full flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-600 border-l border-slate-200 active:bg-slate-300 transition-colors touch-manipulation`} type="button"><i className="fas fa-plus text-sm"></i></button>
                </div>
            );
        };

        // --- Component: Stacked Bar Chart ---
        const SpaceUsageBar = ({ data, total }) => {
            if (!total || total === 0) return null;
            return (
                <div className="w-full mb-6">
                    <div className="flex h-10 w-full rounded-xl overflow-hidden border border-slate-300 shadow-sm mb-4 bg-white">
                        {data.map((item, idx) => (
                            <div key={idx} className="h-full transition-all duration-500 relative group border-r border-white/20 last:border-0" style={{ width: `${(item.value / total) * 100}%`, backgroundColor: item.color }}></div>
                        ))}
                    </div>
                    <div className="flex flex-col gap-y-3">
                        {data.map((item, idx) => (
                            <div key={idx} className="flex justify-between items-center text-sm border-b border-dashed border-slate-200 pb-2">
                                <div className="flex items-center">
                                    <div className="w-4 h-4 rounded-full mr-3 shadow-sm flex-shrink-0" style={{ backgroundColor: item.color }}></div>
                                    <span className="text-slate-700 font-bold">{item.label}</span>
                                </div>
                                <div className="text-slate-900 font-bold font-mono text-base">
                                    {item.value?.toFixed(0)} <span className="text-xs font-normal text-slate-500">m²</span>
                                    <span className="ml-3 text-sm text-slate-600 font-bold w-12 inline-block text-right">{((item.value/total)*100).toFixed(0)}%</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Component: Hierarchy Area Treemap ---
        const AreaTreemap = ({ results, containerClass, svgClass }) => {
            if (!results.rentableArea || results.rentableArea <= 0) return null;
            const w = 400; const h = 220; 
            const loadRatio = (results.rentableArea - results.usableArea) / results.rentableArea;
            const loadW = w * loadRatio; const usableW = w - loadW;
            const circRatio = results.usableArea > 0 ? (results.usableArea - results.netArea) / results.usableArea : 0;
            const circH = h * circRatio; const netH = h - circH;
            const netArea = results.netArea > 0 ? results.netArea : 1;
            const deskRatio = results.areaDesk / netArea; const roomRatio = results.areaRooms / netArea; const supportRatio = results.areaSupport / netArea;
            const deskW = usableW * deskRatio; const roomW = usableW * roomRatio; const supportW = usableW * supportRatio;
            
            const cLoad = "#64748b"; const cCirc = "#8b5cf6"; const cDesk = "#3b82f6"; const cRoom = "#10b981"; const cSupp = "#f59e0b"; 

            const finalContainerClass = containerClass || "w-full select-none mt-6 pt-4 border-t border-slate-200";
            const finalSvgClass = svgClass || "w-full h-auto rounded-xl shadow-sm border border-slate-300 bg-white";

            return (
                <div className={finalContainerClass}>
                    <h4 className="text-sm font-bold text-slate-600 uppercase tracking-wider mb-3">面積結構分佈 (Structure)</h4>
                    <svg viewBox={`0 0 ${w} ${h}`} className={finalSvgClass}>
                        <rect x={usableW} y={0} width={loadW} height={h} fill={cLoad} className="area-rect stroke-white stroke-[2px]" />
                        <text x={usableW + loadW/2} y={h/2} textAnchor="middle" fill="white" fontSize="12" fontWeight="bold" transform={`rotate(90, ${usableW + loadW/2}, ${h/2})`} style={{textShadow: '0px 1px 2px rgba(0,0,0,0.3)'}}>公設 {Math.max(0, results.rentableArea - results.usableArea).toFixed(0)}m²</text>

                        <rect x={0} y={netH} width={usableW} height={circH} fill={cCirc} className="area-rect stroke-white stroke-[2px]" />
                        <text x={usableW/2} y={netH + circH/2 + 4} textAnchor="middle" fill="white" fontSize="12" fontWeight="bold" style={{textShadow: '0px 1px 2px rgba(0,0,0,0.3)'}}>走道{Math.max(0, results.usableArea - results.netArea).toFixed(0)}m²</text>

                        <rect x={0} y={0} width={deskW} height={netH} fill={cDesk} className="area-rect stroke-white stroke-[2px]" />
                        {deskW > 45 && (<text x={deskW/2} y={netH/2} textAnchor="middle" fill="white" fontSize="12" fontWeight="bold" style={{textShadow: '0px 1px 2px rgba(0,0,0,0.3)'}}><tspan x={deskW/2} dy="-0.6em">座位</tspan><tspan x={deskW/2} dy="1.4em" fontSize="11">{results.areaDesk.toFixed(0)}m²</tspan></text>)}
                        
                        <rect x={deskW} y={0} width={roomW} height={netH} fill={cRoom} className="area-rect stroke-white stroke-[2px]" />
                        {roomW > 45 && (<text x={deskW + roomW/2} y={netH/2} textAnchor="middle" fill="white" fontSize="12" fontWeight="bold" style={{textShadow: '0px 1px 2px rgba(0,0,0,0.3)'}}><tspan x={deskW + roomW/2} dy="-0.6em">房間</tspan><tspan x={deskW + roomW/2} dy="1.4em" fontSize="11">{results.areaRooms.toFixed(0)}m²</tspan></text>)}
                        
                        <rect x={deskW + roomW} y={0} width={usableW - deskW - roomW} height={netH} fill={cSupp} className="area-rect stroke-white stroke-[2px]" />
                        {(usableW - deskW - roomW) > 45 && (<text x={deskW + roomW + (usableW - deskW - roomW)/2} y={netH/2} textAnchor="middle" fill="white" fontSize="12" fontWeight="bold" style={{textShadow: '0px 1px 2px rgba(0,0,0,0.3)'}}><tspan x={deskW + roomW + (usableW - deskW - roomW)/2} dy="-0.6em">支援</tspan><tspan x={deskW + roomW + (usableW - deskW - roomW)/2} dy="1.4em" fontSize="11">{results.areaSupport.toFixed(0)}m²</tspan></text>)}
                    </svg>
                </div>
            );
        };

        // --- CAD SVG Components ---
        const SvgDefs = () => (<defs><marker id="arrow-start" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M6,0 L0,3 L6,6" fill="none" stroke="#64748b" strokeWidth="1" /></marker><marker id="arrow-end" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#64748b" strokeWidth="1" /></marker></defs>);
        const Chair = ({ x, y, r = 0, scale = 1 }) => (<g transform={`translate(${x},${y}) rotate(${r}) scale(${scale})`}><rect x="-7" y="-7" width="14" height="14" rx="2" className="cad-chair" /><path d="M-7 -4 Q0 -8 7 -4" fill="none" stroke="#334155" /><line x="-8" y1="0" x2="-8" y2="6" stroke="#334155" strokeWidth="1" /><line x1="8" y1="0" x2="8" y2="6" stroke="#334155" strokeWidth="1" /></g>);
        const Dimension = ({ x1, y1, x2, y2, text, offset = 10, vertical = false }) => { if (vertical) return (<g><line x1={x1-offset} y1={y1} x2={x1-offset} y2={y2} className="cad-dim-line" markerStart="url(#arrow-start)" markerEnd="url(#arrow-end)" /><text x={x1-offset-4} y={(y1+y2)/2} className="cad-dim-text" transform={`rotate(-90 ${x1-offset-4} ${(y1+y2)/2})`} textAnchor="middle">{text}</text></g>); return (<g><line x1={x1} y1={y1+offset} x2={x2} y2={y2+offset} className="cad-dim-line" markerStart="url(#arrow-start)" markerEnd="url(#arrow-end)" /><text x={(x1+x2)/2} y={y1+offset+8} className="cad-dim-text" textAnchor="middle">{text}</text></g>); };

        const SvgDesk = ({ type }) => {
            return (
                <svg viewBox="0 0 160 120" className="w-full h-full bg-white" preserveAspectRatio="xMidYMid meet"><SvgDefs />
                    {type === 'small' && (<g transform="translate(20,20)"><rect x="0" y="20" width="120" height="40" className="cad-furniture" /><line x1="0" y1="40" x2="120" y2="40" stroke="#94a3b8" strokeDasharray="2,2" /><line x1="60" y1="20" x2="60" y2="60" stroke="#94a3b8" /><Chair x={30} y={10} r={180} /> <Chair x={90} y={10} r={180} /><Chair x={30} y={70} r={0} /> <Chair x={90} y={70} r={0} /><Dimension x1={0} y1={60} x2={60} y2={60} text="120" offset={15} /><Dimension x1={125} y1={20} x2={125} y2={60} text="140" offset={-5} vertical={true} /></g>)}
                    {type === 'medium' && (<g transform="translate(30,20)"><path d="M0 0 H60 V60 H0 Z" fill="none" stroke="#94a3b8" strokeDasharray="2,2" /><path d="M60 0 H120 V60 H60 Z" fill="none" stroke="#94a3b8" strokeDasharray="2,2" /><path d="M2 2 H58 V58 H38 V22 H2 Z" className="cad-furniture" /><Chair x={30} y={40} r={0} /><path d="M62 2 H118 V58 H98 V22 H62 Z" className="cad-furniture" /><Chair x={90} y={40} r={0} /><Dimension x1={0} y1={60} x2={60} y2={60} text="150" offset={10} /><Dimension x1={125} y1={0} x2={125} y2={60} text="150" offset={-5} vertical={true} /></g>)}
                    {type === 'large' && (<g transform="translate(30,25)"><rect x="0" y="0" width="100" height="15" className="cad-furniture" /><rect x="10" y="35" width="80" height="35" className="cad-furniture" /><rect x="70" y="35" width="20" height="50" className="cad-furniture" /><Chair x={50} y={25} r={180} /><Dimension x1={10} y1={70} x2={90} y2={70} text="180" offset={10} /></g>)}
                </svg>
            );
        };

        const SvgRoom = ({ type }) => {
            return (
                <svg viewBox="0 0 200 160" className="w-full h-full bg-white border border-slate-300" preserveAspectRatio="xMidYMid meet"><SvgDefs />
                    {type === 'standard' && (<g transform="translate(40,30)"><rect x="0" y="0" width="120" height="90" className="cad-wall" /><path d="M0 70 A 20 20 0 0 1 20 90" className="cad-door-swing" /><line x1="0" y1="70" x2="0" y2="90" stroke="white" strokeWidth="4" /><line x1="0" y1="90" x2="20" y2="75" stroke="#1f2937" strokeWidth="1.5" /><rect x="20" y="10" width="60" height="25" className="cad-furniture" /><Chair x={50} y={45} r={180} /><circle cx="90" cy="60" r="15" className="cad-furniture" /><Chair x={90} y={40} r={180} /> <Chair x={75} y={70} r={300} /> <Chair x={105} y={70} r={60} /><Dimension x1={0} y1={90} x2={120} y2={90} text="400" offset={10} /><Dimension x1={120} y1={0} x2={120} y2={90} text="300" offset={-10} vertical={true} /></g>)}
                    {type === 'senior' && (<g transform="translate(30,20)"><rect x="0" y="0" width="140" height="120" className="cad-wall" /><path d="M0 100 A 20 20 0 0 1 20 120" className="cad-door-swing" /><line x1="0" y1="100" x2="0" y2="120" stroke="white" strokeWidth="4" /><rect x="20" y="35" width="70" height="35" className="cad-furniture" /><Chair x={55} y={25} r={180} /><rect x="100" y="20" width="30" height="80" fill="#f1f5f9" stroke="#94a3b8" /><rect x="110" y="30" width="10" height="20" className="cad-chair" /><rect x="110" y="70" width="10" height="20" className="cad-chair" /><Dimension x1={0} y1={120} x2={140} y2={120} text="500" offset={10} /><Dimension x1={140} y1={0} x2={140} y2={120} text="500" offset={-10} vertical={true} /></g>)}
                    {type === 'board' && (<g transform="translate(10,10)"><rect x="0" y="0" width="180" height="140" className="cad-wall" /><path d="M0 120 A 20 20 0 0 1 20 140" className="cad-door-swing" /><line x1="0" y1="120" x2="0" y2="140" stroke="white" strokeWidth="4" /><rect x="40" y="40" width="100" height="60" rx="20" className="cad-furniture" /><Chair x={30} y={50} r={90} /> <Chair x={30} y={70} r={90} /> <Chair x={30} y={90} r={90} /><Chair x={150} y={50} r={270} /> <Chair x={150} y={70} r={270} /> <Chair x={150} y={90} r={270} /><Chair x={60} y={30} r={180} /> <Chair x={90} y={30} r={180} /> <Chair x={120} y={30} r={180} /><Chair x={60} y={110} r={0} /> <Chair x={90} y={110} r={0} /> <Chair x={120} y={110} r={0} /><Dimension x1={0} y1={140} x2={180} y2={140} text="750" offset={10} /><Dimension x1={180} y1={0} x2={180} y2={140} text="800" offset={-10} vertical={true} /></g>)}
                    {type === 'small' && (<g transform="translate(50,30)"><rect x="0" y="0" width="100" height="100" className="cad-wall" /><path d="M0 80 A 20 20 0 0 1 20 100" className="cad-door-swing" /><line x1="0" y1="80" x2="0" y2="100" stroke="white" strokeWidth="4" /><circle cx="50" cy="50" r="25" className="cad-furniture" /><Chair x={50} y={20} r={180} /> <Chair x={50} y={80} r={0} /><Chair x={20} y={50} r={90} /> <Chair x={80} y={50} r={270} /><Dimension x1={0} y1={100} x2={100} y2={100} text="330" offset={10} /><Dimension x1={100} y1={0} x2={100} y2={100} text="300" offset={-10} vertical={true} /></g>)}
                    {type === 'medium' && (<g transform="translate(30,30)"><rect x="0" y="0" width="140" height="100" className="cad-wall" /><path d="M0 80 A 20 20 0 0 1 20 100" className="cad-door-swing" /><line x1="0" y1="80" x2="0" y2="100" stroke="white" strokeWidth="4" /><rect x="40" y="35" width="60" height="30" rx="5" className="cad-furniture" /><Chair x={50} y={25} r={180} /> <Chair x={70} y={25} r={180} /> <Chair x={90} y={25} r={180} /><Chair x={50} y={75} r={0} /> <Chair x={70} y={75} r={0} /> <Chair x={90} y={75} r={0} /><Dimension x1={0} y1={100} x2={140} y2={100} text="500" offset={10} /><Dimension x1={140} y1={0} x2={140} y2={100} text="400" offset={-10} vertical={true} /></g>)}
                    {type === 'large' && (<g transform="translate(20,20)"><rect x="0" y="0" width="160" height="110" className="cad-wall" /><path d="M0 90 A 20 20 0 0 1 20 110" className="cad-door-swing" /><line x1="0" y1="90" x2="0" y2="110" stroke="white" strokeWidth="4" /><rect x="40" y="40" width="80" height="30" className="cad-furniture" /><Chair x={50} y={30} r={180} /> <Chair x={70} y={30} r={180} /> <Chair x={90} y={30} r={180} /> <Chair x={110} y={30} r={180} /><Chair x={50} y={80} r={0} /> <Chair x={70} y={80} r={0} /> <Chair x={90} y={80} r={0} /> <Chair x={110} y={80} r={0} /><Chair x={30} y={55} r={90} /> <Chair x={130} y={55} r={270} /><Dimension x1={0} y1={110} x2={160} y2={110} text="800" offset={10} /><Dimension x1={160} y1={0} x2={160} y2={110} text="550" offset={-10} vertical={true} /></g>)}
                    {type === 'phone' && (<g transform="translate(80,40)"><rect x="0" y="0" width="40" height="40" className="cad-wall" /><path d="M0 30 A 10 10 0 0 1 10 40" className="cad-door-swing" /><line x1="0" y1="30" x2="0" y2="40" stroke="white" strokeWidth="4" /><line x1="0" y1="30" x2="10" y2="40" stroke="#1f2937" strokeWidth="1.5" /><rect x="5" y="5" width="30" height="10" className="cad-furniture" /><Chair x={20} y={25} r={0} scale={0.8} /><Dimension x1={0} y1={40} x2={40} y2={40} text="150" offset={5} /><Dimension x1={40} y1={0} x2={40} y2={40} text="150" offset={-5} vertical={true} /></g>)}
                </svg>
            );
        };

        const DATA = {
            desk: {
                small: { label: "高密度 3.5m²", area: 3.5, desc: "適合高密度排排坐或流動辦公位 (約 3.5 m²/人)" },
                medium: { label: "標準 5.0m²", area: 5.0, desc: "標準 L 型屏風座位，兼顧隱私與效率 (約 5.0 m²/人)" },
                large: { label: "寬敞 7.5m²", area: 7.5, desc: "獨立大桌或主管位，空間寬敞舒適 (約 7.5 m²/人)" }
            },
            room: {
                standardManager: { label: "標準主管室", area: 12 },
                seniorExec: { label: "高級主管室", area: 24 },
                phoneBooth: { label: "電話亭/專注", area: 2 },
                meetSmall: { label: "小洽談室", area: 10 },
                meetMedium: { label: "中會議室", area: 20 },
                meetLarge: { label: "大會議室", area: 45 },
                boardOffice: { label: "董事會議室", area: 60 },
            }
        };

        // --- Component: Detailed Audit (Reusable) ---
        const DetailedAudit = ({ inputs, results, DATA }) => {
            const renderStaffRows = () => { 
                return inputs.staffGroups.map(g => {
                    const count = g.headcount || 0;
                    const growth = g.growth || 0;
                    const ppl = Math.ceil((count * (100 + growth)) / 100);
                    const desks = Math.ceil(ppl * g.sharing);
                    const area = desks * (DATA.desk[g.deskType]?.area || 0);
                    return (
                        <div key={g.id} className="mb-3 pb-3 border-b border-slate-200 last:border-0">
                            <div className="font-bold text-slate-800 text-sm md:text-base">{g.name} ({DATA.desk[g.deskType]?.label || ''})</div>

        const App = () => {

                circulation: 1.35, publicRatio: 30,
                rentPerPing: 0, mgmtPerPing: 150, salePricePerPingWan: 0

            const [isExporting, setIsExporting] = useState(false);
            const [exportError, setExportError] = useState("");
            
            const pdfPage1Ref = useRef(null);
            const pdfPage2Ref = useRef(null);

            const updateStaffGroup = (index, field, val) => {
                const newGroups = [...inputs.staffGroups];
                newGroups[index] = { ...newGroups[index], [field]: val };
                setInputs(prev => ({ ...prev, staffGroups: newGroups }));
            };
            const addStaffGroup = () => {
                const label = String.fromCharCode(65 + inputs.staffGroups.length);
                setInputs(prev => ({
                    ...prev,
                    staffGroups: [...prev.staffGroups, { id: Date.now(), name: `人員配置 ${label}`, headcount: 0, growth: 0, sharing: 1.0, deskType: 'medium' }]
                }));
            };
            const removeStaffGroup = (index) => {
                if (inputs.staffGroups.length <= 1) return;
                const newGroups = inputs.staffGroups.filter((_, i) => i !== index);
                const renamed = newGroups.map((g, i) => ({ ...g, name: `人員配置 ${String.fromCharCode(65 + i)}` }));
                setInputs(prev => ({ ...prev, staffGroups: renamed }));
            };

            const update = (field, val) => setInputs(prev => ({ ...prev, [field]: val }));

            // 改用同步的 useMemo 取代 useState + useEffect，避免初次渲染時數值 undefined 導致畫面破圖
            const results = useMemo(() => {
                const getVal = (val) => (val === '' || isNaN(val)) ? 0 : parseFloat(val);

                let totalPeople = 0, totalDesks = 0, totalDeskArea = 0;

                inputs.staffGroups.forEach(g => {
                    const count = getVal(g.headcount);
                    const growth = getVal(g.growth);
                    const p = Math.ceil((count * (100 + growth)) / 100);
                    const d = Math.ceil(p * g.sharing);
                    const area = d * (DATA.desk[g.deskType]?.area || 0);
                    totalPeople += p; totalDesks += d; totalDeskArea += area;
                });

                const areaRooms = (getVal(inputs.roomStandard) * DATA.room.standardManager.area) +
                                  (getVal(inputs.roomSenior) * DATA.room.seniorExec.area) +
                                  (getVal(inputs.roomPhone) * DATA.room.phoneBooth.area) +
                                  (getVal(inputs.meetSmall) * DATA.room.meetSmall.area) +
                                  (getVal(inputs.meetMedium) * DATA.room.meetMedium.area) +
                                  (getVal(inputs.meetLarge) * DATA.room.meetLarge.area) +
                                  (getVal(inputs.roomBoard) * DATA.room.boardOffice.area);
                
                const areaSupport = getVal(inputs.reception) + getVal(inputs.pantry) + getVal(inputs.server) + getVal(inputs.storage) + getVal(inputs.otherSupport);
                
                const netArea = totalDeskArea + areaRooms + areaSupport;
                const circulation = getVal(inputs.circulation);
                const usableArea = netArea * (circulation > 0 ? circulation : 1);
                const pubRatio = getVal(inputs.publicRatio);
                const rentableArea = pubRatio < 100 ? usableArea / (1 - (pubRatio / 100)) : usableArea;

                const ping = rentableArea * 0.3025;
                const rangeMin = ping * 0.9;
                const rangeMax = ping * 1.1;

                const rent = getVal(inputs.rentPerPing);
                const mgmt = getVal(inputs.mgmtPerPing);
                const salePriceWan = getVal(inputs.salePricePerPingWan);

                return {
                    totalPeople, desksNeeded: totalDesks, areaDesk: totalDeskArea, 
                    areaRooms, areaSupport, netArea, rentableArea, usableArea,
                    ping, rangeMin, rangeMax,
                    perPerson: totalPeople > 0 ? rentableArea / totalPeople : 0,
                    rentMin: rent * rangeMin, rentMax: rent * rangeMax, 
                    mgmtMin: mgmt * rangeMin, mgmtMax: mgmt * rangeMax, 
                    priceWanMin: salePriceWan * rangeMin, priceWanMax: salePriceWan * rangeMax
                };
            }, [inputs]);

            const generatePDF = async () => {
                setIsExporting(true);
                setExportError("");
                await new Promise(resolve => setTimeout(resolve, 500));
                
                try {
                    const doc = new window.jspdf.jsPDF('p', 'mm', 'a4'); 
                    const pageWidth = doc.internal.pageSize.getWidth();
                    
                    const canvas1 = await html2canvas(pdfPage1Ref.current, { scale: 2, useCORS: true, width: 794, windowWidth: 794 });
                    const imgData1 = canvas1.toDataURL('image/jpeg', 0.85);
                    const imgHeight1 = (canvas1.height * pageWidth) / canvas1.width;
                    doc.addImage(imgData1, 'JPEG', 0, 0, pageWidth, imgHeight1);
                    
                    doc.addPage();
                    const canvas2 = await html2canvas(pdfPage2Ref.current, { scale: 2, useCORS: true, width: 794, windowWidth: 794 });
                    const imgData2 = canvas2.toDataURL('image/jpeg', 0.85);
                    const imgHeight2 = (canvas2.height * pageWidth) / canvas2.width;
                    doc.addImage(imgData2, 'JPEG', 0, 0, pageWidth, imgHeight2);

                    doc.save("Office_Space_Financial_Report.pdf");
                } catch (error) { 
                    console.error("PDF Export Error:", error);
                    setExportError("匯出失敗，請重試或更換瀏覽器。");
                }
                setIsExporting(false);
            };

            const chartData = [
                { value: results.areaDesk || 0, color: '#3b82f6', label: '辦公座位' },
                { value: results.areaRooms || 0, color: '#10b981', label: '獨立房間' },
                { value: results.areaSupport || 0, color: '#f59e0b', label: '支援空間' },
                { value: Math.max(0, (results.usableArea || 0) - (results.netArea || 0)), color: '#8b5cf6', label: '走道空間' },
                { value: Math.max(0, (results.rentableArea || 0) - (results.usableArea || 0)), color: '#64748b', label: '大樓公設' },
            ];

            return (
                <div className="min-h-screen bg-slate-50/80 pb-20 md:pb-12 font-sans selection:bg-blue-200">
                    {/* Top Navigation Bar */}
                    <div className="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-[1600px] mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                                    <i className="fas fa-building text-sm"></i>
                                </div>
                                <h1 className="text-xl font-black text-slate-800 tracking-tight">辦公空間需求計算器</h1>
                                <span className="hidden sm:inline-block text-xs font-bold text-blue-700 bg-blue-100 border border-blue-200 px-2 py-0.5 rounded-md uppercase tracking-wider">Beta</span>
                            </div>
                            <div className="text-xs sm:text-sm font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-2">
                                <i className="fas fa-exclamation-circle text-amber-500"></i>
                                <span className="hidden sm:inline">計算結果僅供參考，實際面積依現場為準</span>
                            </div>
                        </div>
                    </div>

                    <div className="p-4 md:p-6 lg:p-8 max-w-[1600px] mx-auto">
                        <div className="flex flex-col xl:flex-row gap-6 lg:gap-8 items-start relative">
                            
                            {/* LEFT PANEL (Inputs & Details) */}
                            <div className="w-full xl:w-2/3 flex flex-col gap-6 lg:gap-8">
                                
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 transition-shadow hover:shadow-md">
                                    <SectionHeader icon="fa-users" title="1. 人員配置 (Staffing)" color="text-blue-700" />
                                    <div className="space-y-4">
                                        {inputs.staffGroups.map((group, index) => (
                                            <StaffCard key={group.id} group={group} index={index} onChange={updateStaffGroup} onRemove={() => removeStaffGroup(index)} showRemove={inputs.staffGroups.length > 1} />
                                        ))}
                                    </div>
                                    <button onClick={addStaffGroup} className="w-full mt-4 py-4 border-2 border-dashed border-slate-300 rounded-2xl text-slate-600 font-bold text-base hover:bg-blue-50 hover:border-blue-400 hover:text-blue-700 transition-all flex items-center justify-center gap-2 group"><i className="fas fa-plus-circle group-hover:scale-110 transition-transform"></i> 新增人員分組</button>
                                </div>

                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 transition-shadow hover:shadow-md">
                                    <SectionHeader icon="fa-door-open" title="2. 房間配置 (Rooms)" color="text-emerald-700" />
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <RoomCard type="standard" value={inputs.roomStandard} onChange={(val) => update('roomStandard', val)} label="標準主管室" area="12" />
                                        <RoomCard type="senior" value={inputs.roomSenior} onChange={(val) => update('roomSenior', val)} label="高級主管室" area="24" />
                                        <RoomCard type="phone" value={inputs.roomPhone} onChange={(val) => update('roomPhone', val)} label="電話亭/專注空間" area="2" />
                                        <RoomCard type="small" value={inputs.meetSmall} onChange={(val) => update('meetSmall', val)} label="小洽談室" area="10" />
                                        <RoomCard type="medium" value={inputs.meetMedium} onChange={(val) => update('meetMedium', val)} label="中會議室" area="20" />
                                        <RoomCard type="large" value={inputs.meetLarge} onChange={(val) => update('meetLarge', val)} label="大會議室" area="45" />
                                        <RoomCard type="board" value={inputs.roomBoard} onChange={(val) => update('roomBoard', val)} label="董事會議室" area="60" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
                                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 transition-shadow hover:shadow-md">
                                        <SectionHeader icon="fa-coffee" title="3. 支援空間 (Support)" color="text-amber-700" />
                                        <div className="space-y-4 pt-2">
                                            <SupportInput label="接待區" value={inputs.reception} onChange={(val) => update('reception', val)} icon="fa-concierge-bell" />
                                            <SupportInput label="茶水間" value={inputs.pantry} onChange={(val) => update('pantry', val)} icon="fa-mug-hot" />
                                            <SupportInput label="資訊機房" value={inputs.server} onChange={(val) => update('server', val)} icon="fa-server" />
                                            <SupportInput label="儲藏室" value={inputs.storage} onChange={(val) => update('storage', val)} icon="fa-box" />
                                            <SupportInput label="其他" value={inputs.otherSupport} onChange={(val) => update('otherSupport', val)} icon="fa-plus-circle" />
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 transition-shadow hover:shadow-md">
                                        <SectionHeader icon="fa-ruler-combined" title="4. 空間係數設定" color="text-purple-700" />
                                        <div className="space-y-6 pt-2">
                                            <div className="bg-slate-50 border border-slate-200 p-5 rounded-2xl relative overflow-hidden group">
                                                <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-purple-500"></div>
                                                <div className="flex justify-between items-center mb-3">
                                                    <div className="font-bold text-base text-slate-800">內部走道係數</div>
                                                    <select value={inputs.circulation} onChange={(e)=>update('circulation', parseFloat(e.target.value))} className="border border-slate-300 rounded-lg p-2 text-base font-bold bg-white outline-none w-28 text-center shadow-sm cursor-pointer hover:border-purple-400 focus:ring-2 focus:ring-purple-200 transition-all">
                                                        <option value="1.25">1.25</option>
                                                        <option value="1.35">1.35</option>
                                                        <option value="1.45">1.45</option>
                                                    </select>
                                                </div>
                                                <div className="text-sm text-slate-600 font-medium">場景：{getCirculationDesc(inputs.circulation)}</div>
                                            </div>
                                            <div className="bg-slate-50 border border-slate-200 p-5 rounded-2xl relative overflow-hidden group">
                                                <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-500"></div>
                                                <div className="flex justify-between items-center mb-3">
                                                    <div className="font-bold text-base text-slate-800">大樓公設比 (%)</div>
                                                    <div className="w-36"><SmartControl value={inputs.publicRatio} onChange={(val)=>update('publicRatio', val)} min={0} max={60} unit="%" large={true} /></div>
                                                </div>
                                                <div className="text-sm text-slate-600 font-medium">預估辦公室實得率約 {100 - inputs.publicRatio}%</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 transition-shadow hover:shadow-md">
                                    <SectionHeader icon="fa-calculator" title="5. 財務預估 (Financials)" color="text-slate-700" />
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-2">
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                            <label className="text-xs font-bold text-slate-500 mb-3 block uppercase tracking-wider">預計租金 (元/坪)</label>
                                            <SmartControl value={inputs.rentPerPing} onChange={(val) => update('rentPerPing', val)} min={0} step={100} large={true} />
                                        </div>
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                            <label className="text-xs font-bold text-slate-500 mb-3 block uppercase tracking-wider">預計管理費 (元/坪)</label>
                                            <SmartControl value={inputs.mgmtPerPing} onChange={(val) => update('mgmtPerPing', val)} min={0} step={10} large={true} />
                                        </div>
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                            <label className="text-xs font-bold text-slate-500 mb-3 block uppercase tracking-wider">預計售價 (萬元/坪)</label>
                                            <SmartControl value={inputs.salePricePerPingWan} onChange={(val) => update('salePricePerPingWan', val)} min={0} step={5} large={true} />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden">
                                    <DetailedAudit inputs={inputs} results={results} DATA={DATA} />
                                </div>
                            </div>

                            {/* RIGHT PANEL (Sticky Results) */}
                            <div className="w-full xl:w-1/3 flex flex-col gap-6 sticky top-24 z-10 self-start">
                                <div className="bg-gradient-to-b from-slate-900 to-slate-800 text-white p-6 md:p-8 rounded-3xl shadow-2xl relative overflow-hidden border border-slate-700">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-blue-500/20 rounded-full mix-blend-overlay filter blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
                                    <div className="absolute bottom-0 left-0 w-48 h-48 bg-indigo-500/20 rounded-full mix-blend-overlay filter blur-3xl -ml-12 -mb-12 pointer-events-none"></div>
                                    
                                    <div className="relative z-10">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="text-slate-300 text-sm font-bold uppercase tracking-widest flex items-center gap-2">
                                                <i className="fas fa-layer-group text-blue-400"></i> 總需求面積
                                            </div>
                                        </div>
                                        
                                        <div className="flex items-baseline gap-2 mb-2">
                                            <div className="text-6xl md:text-7xl font-black text-white tracking-tighter" style={{lineHeight: 1.1}}>{(results.ping || 0).toFixed(1)}</div>
                                            <div className="text-2xl text-slate-300 font-medium mb-1">坪</div>
                                        </div>
                                        
                                        <div className="flex items-center gap-2 text-sm text-cyan-300 font-mono mb-6 font-bold bg-slate-800/80 inline-block px-3 py-1.5 rounded-lg border border-slate-600/50 shadow-inner">
                                            ≒ {(results.rentableArea || 0).toFixed(1)} m² 
                                        </div>
                                        
                                        <div className="bg-blue-600/30 border border-blue-500/40 rounded-2xl p-4 mb-6 backdrop-blur-sm">
                                            <div className="text-xs text-blue-200 uppercase font-bold tracking-wider mb-2">建議看樓面積區間 (±10%)</div>
                                            <div className="text-xl font-bold text-white flex items-center gap-2">
                                                <span>{(results.rangeMin || 0).toFixed(0)}</span>
                                                <span className="text-blue-400 text-lg">~</span>
                                                <span>{(results.rangeMax || 0).toFixed(0)} 坪</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center mb-8">
                                            <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-600/50 flex flex-col justify-center backdrop-blur-sm">
                                                <div className="text-xs text-slate-400 mb-2 font-bold tracking-wide">月租總計</div>
                                                <div className="font-bold text-white text-sm leading-snug">
                                                    <span className="text-slate-400 text-xs">$</span>{Math.round(results.rentMin || 0).toLocaleString()}<br/>
                                                    <span className="text-slate-500 text-xs my-0.5 inline-block">~</span><br/>
                                                    <span className="text-slate-400 text-xs">$</span>{Math.round(results.rentMax || 0).toLocaleString()}
                                                </div>
                                            </div>
                                            <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-600/50 flex flex-col justify-center backdrop-blur-sm">
                                                 <div className="text-xs text-slate-400 mb-2 font-bold tracking-wide">管理費</div>
                                                 <div className="font-bold text-white text-sm leading-snug">
                                                    <span className="text-slate-400 text-xs">$</span>{Math.round(results.mgmtMin || 0).toLocaleString()}<br/>
                                                    <span className="text-slate-500 text-xs my-0.5 inline-block">~</span><br/>
                                                    <span className="text-slate-400 text-xs">$</span>{Math.round(results.mgmtMax || 0).toLocaleString()}
                                                 </div>
                                            </div>
                                            <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-600/50 flex flex-col justify-center backdrop-blur-sm">
                                                 <div className="text-xs text-slate-400 mb-2 font-bold tracking-wide">總價預估</div>
                                                 <div className="font-bold text-white text-sm leading-snug">
                                                    {Math.round(results.priceWanMin || 0).toLocaleString()}<span className="text-slate-400 font-normal text-xs ml-0.5">萬</span><br/>
                                                    <span className="text-slate-500 text-xs my-0.5 inline-block">~</span><br/>
                                                    {Math.round(results.priceWanMax || 0).toLocaleString()}<span className="text-slate-400 font-normal text-xs ml-0.5">萬</span>
                                                 </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-6 border-t border-slate-700/80 pt-6">
                                            <div className="flex flex-col">
                                                <span className="text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">總座位數</span>
                                                <div className="text-3xl font-bold text-white flex items-baseline gap-1">
                                                    {results.desksNeeded || 0} <span className="text-sm font-normal text-slate-500">席</span>
                                                </div>
                                            </div>
                                            <div className="flex flex-col border-l border-slate-700/80 pl-6">
                                                <span className="text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">人均坪效</span>
                                                <div className="text-3xl font-bold text-white flex items-baseline gap-1">
                                                    {(results.perPerson || 0).toFixed(1)} <span className="text-sm font-normal text-slate-500">m²/人</span>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        {exportError && (
                                            <div className="mt-6 mb-2 text-red-300 bg-red-900/30 p-3 rounded-lg text-sm font-bold border border-red-800/50">
                                                <i className="fas fa-exclamation-triangle mr-2"></i>{exportError}
                                            </div>
                                        )}
                                        <button onClick={generatePDF} disabled={isExporting} className="mt-8 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-blue-900/30 transition-all active:scale-[0.98] flex items-center justify-center gap-3 disabled:opacity-70 disabled:cursor-not-allowed border border-blue-500/50">
                                            {isExporting ? <div className="loader"></div> : <i className="fas fa-file-pdf text-xl"></i>}
                                            {isExporting ? "正在渲染報告..." : "下載 PDF 規劃報告"}
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200/80 flex flex-col">
                                    <h3 className="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center"><i className="fas fa-chart-pie text-sm"></i></div>
                                        空間面積分布
                                    </h3>
                                    <div className="mb-4"><SpaceUsageBar data={chartData} total={results.rentableArea} /></div>
                                    <AreaTreemap results={results} />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* --- HIDDEN PRINT STAGING AREA --- */}
                    <div id="print-staging-area">
                        <div ref={pdfPage1Ref} className="a4-page">
                            <PDFPage1 inputs={inputs} results={results} chartData={chartData} />
                        </div>
                        <div ref={pdfPage2Ref} className="a4-page">
                            <DetailedAudit inputs={inputs} results={results} DATA={DATA} />
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
