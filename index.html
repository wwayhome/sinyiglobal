    <!-- ==================== 登入驗證畫面 ==================== -->

                   onkeypress="if(event.key === 'Enter') checkPassword()">

            <button id="login-btn" onclick="checkPassword()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-1">

                    </div>

                <div class="absolute inset-0 bg-emerald-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 flex flex-col items-center text-center">

            <a href="https://wwayhome.github.io/sinyiglobal/dnb6/" target="_blank" class="group relative bg-white rounded-3xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 aspect-square flex flex-col items-center justify-center p-6 border border-gray-100 overflow-hidden">
                <div class="absolute inset-0 bg-purple-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 flex flex-col items-center text-center">
                    <div class="p-4 bg-purple-100 text-purple-600 rounded-full mb-4 group-hover:scale-110 group-hover:bg-purple-600 group-hover:text-white transition-all">

            <a href="https://wwayhome.github.io/sinyiglobal/ucng/" target="_blank" class="group relative bg-white rounded-3xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 aspect-square flex flex-col items-center justify-center p-6 border border-gray-100 overflow-hidden">
                <div class="absolute inset-0 bg-amber-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 flex flex-col items-center text-center">
                    <div class="p-4 bg-amber-100 text-amber-600 rounded-full mb-4 group-hover:scale-110 group-hover:bg-amber-500 group-hover:text-white transition-all">
                        <i data-lucide="image" class="w-10 h-10 md:w-12 md:h-12"></i>

                </div>
            </a>

            <a href="https://wwayhome.github.io/sinyiglobal/6qeb/" target="_blank" class="group relative bg-white rounded-3xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 aspect-square flex flex-col items-center justify-center p-6 border border-gray-100 overflow-hidden">
                <div class="absolute inset-0 bg-rose-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 flex flex-col items-center text-center">

            <a href="https://wwayhome.github.io/sinyiglobal/liaf/" target="_blank" class="group relative bg-white rounded-3xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 aspect-square flex flex-col items-center justify-center p-6 border border-gray-100 overflow-hidden">
                <div class="absolute inset-0 bg-orange-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>

            <a href="https://wwayhome.github.io/sinyiglobal/ad94/" target="_blank" class="group relative bg-white rounded-3xl shadow-sm hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 aspect-square flex flex-col items-center justify-center p-6 border border-gray-100 overflow-hidden">

                    </div>

                </div>
            </div>

            <div class="group relative bg-white rounded-3xl shadow-sm cursor-not-allowed aspect-square flex flex-col items-center justify-center p-6 border border-gray-100 overflow-hidden">
                <div class="relative z-10 flex flex-col items-center text-center opacity-40">
                    <div class="p-4 bg-slate-100 text-slate-600 rounded-full mb-4">
                        <i data-lucide="clock" class="w-10 h-10 md:w-12 md:h-12"></i>
                    </div>
                    <span class="text-xl md:text-2xl font-bold text-gray-400">製作中</span>

        <footer class="mt-16 text-center text-gray-400 text-sm">
            &copy; 2026 Sinyi Global Portal. All rights reserved.
            <div class="mt-4 flex flex-col items-center gap-2">
                <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fwwayhome.github.io%2Fsinyiglobal&label=%E7%80%8F%E8%A6%BD%E4%BA%BA%E6%AC%A1&countColor=%233B82F6" alt="Visitor Badge" />
                <button onclick="logout()" class="text-blue-500 hover:underline mt-2">登出系統</button>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showMainContent(false);
            }
        });

        function checkPassword() {
            const pwdInput = document.getElementById('pwd-input');
            const pwd = pwdInput.value;
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            if (!pwd) return;

            const originalText = loginBtn.innerText;
            loginBtn.innerText = "驗證中...";
            loginBtn.disabled = true;

            const API_URL = "https://script.google.com/macros/s/AKfycbwHe4uzatjxrUjIywi7boX5yH_WM3E_TdNsCh4gKTu1W_RajWAFTTRRbLKnMNCysQftOQ/exec"; 
            
            fetch(`${API_URL}?pwd=${pwd}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loginSuccess();
                    } else {
                        showError();
                    }
                })
                .catch((error) => {
                    console.error("驗證服務發生錯誤:", error);
                    showError();
                })
                .finally(() => {
                    loginBtn.innerText = originalText;
                    loginBtn.disabled = false;
                });

            function loginSuccess() {
                sessionStorage.setItem('isLoggedIn', 'true');
                errorMsg.classList.add('opacity-0');
                showMainContent(true);
            }

            function showError() {
                errorMsg.classList.remove('opacity-0');
                errorMsg.classList.add('opacity-100');
                pwdInput.value = "";
                pwdInput.focus();
            }
        }

        function showMainContent(animate) {
            const loginScreen = document.getElementById('login-screen');
            const mainContent = document.getElementById('main-content');
            
            if (animate) {
                loginScreen.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    mainContent.classList.add('flex');
                    setTimeout(() => {
                        mainContent.classList.remove('opacity-0');
                        mainContent.classList.add('opacity-100');
                    }, 50);
                }, 300);
            } else {
                loginScreen.classList.add('hidden');
                mainContent.classList.remove('hidden', 'opacity-0');
                mainContent.classList.add('flex', 'opacity-100');
            }
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }
    </script>
