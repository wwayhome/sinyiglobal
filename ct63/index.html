{title:'適用型態',short:'適用型態',desc:'這棟廠房適合做什麼？可勾選多種型態。',groups:[g('產業與使用型態',c('適用項目（可複選）','生產製造|精密加工|組裝／包裝|倉儲物流|冷鏈倉儲|食品加工|電子／光電|金屬加工|塑膠橡膠|研發實驗|辦公展示|資料中心／機房|汽修／機具|重工業／大型機具|純土地開發|其他'),t('其他適用型態'))]},
{title:'相關文件檢附',short:'文件檢附',desc:'勾選已備妥的文件；此預覽版不提供附件上傳。',groups:[g('文件清單',c('已檢附項目（可複選）','土地／建物登記謄本|地籍圖謄本|使用執照|竣工圖|平面配置圖|工廠登記證|租約影本|設備清單|台電契約容量證明|消防檢修申報書|環保許可文件|現況照片|空拍圖|區位圖|委託銷售契約書'))]},
{title:'綜合評估與建議',short:'綜合評估',desc:'整理主要優勢、待確認事項與銷售建議。',groups:[g('最適合產業（列 3 項）',t('適合產業 1'),t('適合產業 2'),t('適合產業 3')),g('本案主要優勢',a('主要優勢 1'),a('主要優勢 2'),a('主要優勢 3')),g('主要風險／待確認事項',a('風險或待確認事項 1'),a('風險或待確認事項 2'),a('風險或待確認事項 3')),g('銷售建議',a('建議銷售策略與定價區間'))]},
{title:'現場勘查備註與簽認',short:'備註與簽認',desc:'補充現場觀察與後續追蹤事項。',groups:[g('勘查備註',a('現場觀察／買方常問問題／後續追蹤')),g('勘查紀錄',t('勘查日期'),t('同行同仁'),t('勘查人簽章','','介面預覽先以姓名填寫，非電子簽章。'))]}
];
const state={};let active=0;let review=false;
sections.forEach((s,si)=>s.groups.forEach((g,gi)=>g.fields.forEach((f,fi)=>f.id=`s${si}g${gi}f${fi}`)));
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fields=s=>s.groups.flatMap(g=>g.fields);
const filled=f=>Array.isArray(state[f.id])?state[f.id].length>0:String(state[f.id]??'').trim().length>0;
function drawField(f){const val=state[f.id]??'';const hint=f.hint?`<p class="hint" id="${f.id}-hint">${esc(f.hint)}</p>`:'';let control;
if(f.options){control=`<div class="choices ${f.options.some(x=>x.length>9)?'long':''}">${f.options.map((o,i)=>`<label class="choice"><input type="${f.type}" name="${f.id}" data-id="${f.id}" value="${esc(o)}" ${(Array.isArray(val)?val.includes(o):val===o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;return `<fieldset class="field wide" style="border:0;padding:0;margin:0;min-width:0"><legend class="field-label">${esc(f.label)}</legend>${control}${hint}</fieldset>`;}
const described=f.hint?`aria-describedby="${f.id}-hint"`:'';
if(f.type==='area')control=`<textarea id="${f.id}" data-id="${f.id}" placeholder="輸入${esc(f.label)}" ${described}>${esc(val)}</textarea>`;
else control=`<div class="input-wrap"><input id="${f.id}" data-id="${f.id}" type="${f.type}" ${f.type==='number'?'min="0" step="any" inputmode="decimal"':''} class="${f.unit?'with-unit':''}" placeholder="${f.type==='number'?'尚未填寫':'請輸入'}" value="${esc(val)}" ${described}>${f.unit?`<span class="unit">${esc(f.unit)}</span>`:''}</div>`;
return `<div class="field ${f.wide?'wide':''}"><label class="field-label" for="${f.id}">${esc(f.label)}</label>${control}${hint}</div>`;}
function updateProgress(){const fs=fields(sections[active]);document.getElementById('answeredLabel').textContent=review?'尚未送出或存檔':`本項已填 ${fs.filter(filled).length} / ${fs.length} 欄`;document.getElementById('stepLabel').textContent=review?'填寫內容總覽':`第 ${active+1} / ${sections.length} 個項目`;document.getElementById('progressBar').style.width=review?'100%':`${(active+1)/sections.length*100}%`;document.querySelectorAll('.nav-done').forEach(el=>{const count=fields(sections[Number(el.dataset.section)]).filter(filled).length;el.textContent=count?`${count} 欄`:'';});}
function render(){document.getElementById('desktopNav').innerHTML=sections.map((s,i)=>`<button class="nav-item ${active===i&&!review?'active':''}" data-go="${i}" ${active===i&&!review?'aria-current="step"':''}><span class="nav-num">${i===0?'基本':String(i).padStart(2,'0')}</span><span>${s.short}</span><span class="nav-done" data-section="${i}"></span></button>`).join('');document.getElementById('chapterSelect').innerHTML=sections.map((s,i)=>`<option value="${i}" ${i===active?'selected':''}>${i===0?'基本':String(i).padStart(2,'0')} ${s.title}</option>`).join('');document.getElementById('sectionCount').textContent='基本資料＋15 項';
const s=sections[active];document.getElementById('content').innerHTML=review?`<div class="heading"><span class="eyebrow">REVIEW</span><h1 id="sectionTitle" tabindex="-1">填寫內容總覽</h1><p class="description">以下為本次預覽填寫內容。尚未連接後台，重新整理或關閉網頁後將清除。</p></div><div class="group">${sections.map((s,i)=>`<div class="review-card"><h3>${i===0?'基本':String(i).padStart(2,'0')} ${s.title}</h3>${fields(s).filter(filled).length?fields(s).filter(filled).map(f=>`<div class="review-value"><span>${esc(f.label)}</span><div style="white-space:pre-wrap">${esc(Array.isArray(state[f.id])?state[f.id].join('、'):state[f.id])}${f.unit?' '+esc(f.unit):''}</div></div>`).join(''):'<p class="empty">尚未填寫</p>'}<button data-go="${i}">返回此項編輯</button></div>`).join('')}</div>`:`<div class="heading"><span class="eyebrow">${active===0?'CASE INFORMATION':'CHECKLIST '+String(active).padStart(2,'0')}</span><h1 id="sectionTitle" tabindex="-1">${s.title}</h1><p class="description">${s.desc}</p></div>${s.groups.map(g=>`<div class="group"><h2>${g.title}</h2><div class="fields">${g.fields.map(drawField).join('')}</div></div>`).join('')}`;
document.getElementById('prev').disabled=active===0&&!review;document.getElementById('prev').textContent=review?'← 返回填寫':'← 上一項';document.getElementById('next').textContent=review?'回到第一項':active===sections.length-1?'查看填寫內容':'下一項 →';document.getElementById('bottomStep').textContent=review?'總覽':`${active+1} / ${sections.length}`;updateProgress();}
function go(i){active=i;review=false;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('sectionTitle').focus({preventScroll:true});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(Number(b.dataset.go));});
document.getElementById('chapterSelect').addEventListener('change',e=>go(Number(e.target.value)));
document.getElementById('content').addEventListener('input',e=>{const el=e.target;if(!el.dataset.id)return;const id=el.dataset.id;if(el.type==='checkbox')state[id]=Array.from(document.querySelectorAll(`input[name="${id}"]:checked`)).map(x=>x.value);else state[id]=el.value;updateProgress();});
document.getElementById('prev').onclick=()=>{if(review)go(sections.length-1);else if(active>0)go(active-1);};
document.getElementById('next').onclick=()=>{if(review)go(0);else if(active<sections.length-1)go(active+1);else{review=true;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('sectionTitle').focus({preventScroll:true});}};
document.getElementById('typeSize').onclick=e=>{const large=document.documentElement.classList.toggle('large-type');e.currentTarget.textContent=large?'標準大字':'大字 A＋';e.currentTarget.setAttribute('aria-label',large?'切換為標準大字':'切換為特大字體');};
render();
</script></body></html>
