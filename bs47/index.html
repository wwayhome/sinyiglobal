<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式心智圖工具</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-5YQY4RT9H2');
    </script>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel 轉換 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 html2pdf.js 用於匯出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .node-input {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 100%;
            font-size: inherit;
            font-weight: inherit;
            color: inherit;
            cursor: text;
        }
        .canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        /* 隱藏捲軸 */
        ::-webkit-scrollbar {
            display: none;
        }
        
        .toast-enter {
            opacity: 0;
            transform: translateY(100%);
        }
        .toast-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms, transform 300ms;
        }
        .toast-exit {
            opacity: 1;
        }
        .toast-exit-active {
            opacity: 0;
            transition: opacity 300ms;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 產生唯一 ID
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // 預設主題配色表
        const THEMES = [
            { id: 'default', root: 'bg-blue-600 text-white', child: 'bg-white border-slate-200 text-slate-800', line: '#94a3b8', inputRoot: 'text-white', inputChild: 'text-slate-800' },
            { id: 'forest', root: 'bg-emerald-600 text-white', child: 'bg-emerald-50 border-emerald-300 text-emerald-900', line: '#34d399', inputRoot: 'text-white', inputChild: 'text-emerald-900' },
            { id: 'sunset', root: 'bg-orange-500 text-white', child: 'bg-orange-50 border-orange-300 text-orange-900', line: '#fb923c', inputRoot: 'text-white', inputChild: 'text-orange-900' },
            { id: 'purple', root: 'bg-violet-600 text-white', child: 'bg-violet-50 border-violet-300 text-violet-900', line: '#a78bfa', inputRoot: 'text-white', inputChild: 'text-violet-900' },
            { id: 'rose', root: 'bg-rose-500 text-white', child: 'bg-rose-50 border-rose-300 text-rose-900', line: '#fb7185', inputRoot: 'text-white', inputChild: 'text-rose-900' },
            { id: 'midnight', root: 'bg-slate-800 text-white', child: 'bg-slate-100 border-slate-400 text-slate-800', line: '#64748b', inputRoot: 'text-white', inputChild: 'text-slate-800' },
            { id: 'ocean', root: 'bg-cyan-600 text-white', child: 'bg-cyan-50 border-cyan-300 text-cyan-900', line: '#22d3ee', inputRoot: 'text-white', inputChild: 'text-cyan-900' }
        ];

        // 預設初始資料
        const initialNodes = [
            { id: 'root', text: '中心主題', x: window.innerWidth / 2, y: window.innerHeight / 2, parentId: null }
        ];

        // 節點元件
        const Node = ({ node, isSelected, isEditing, onSelect, onDoubleClick, onChange, onDragStart, theme }) => {
            const nodeRef = useRef(null);
            
            useEffect(() => {
                if (isEditing && nodeRef.current) {
                    nodeRef.current.focus();
                    // 將游標移到最後
                    const val = nodeRef.current.value;
                    nodeRef.current.value = '';
                    nodeRef.current.value = val;
                }
            }, [isEditing]);

            const handlePointerDown = (e) => {
                e.stopPropagation(); // 防止觸發畫布拖曳
                if (!isEditing) {
                    onSelect(node.id);
                    onDragStart(e, node.id);
                }
            };

            const isRoot = node.parentId === null;

            return (
                <div
                    className={`absolute rounded-xl shadow-lg flex items-center justify-center transition-shadow duration-200
                        ${isSelected ? 'ring-4 ring-blue-400 ring-opacity-50 z-20' : 'z-10 hover:shadow-xl'}
                        ${isRoot ? `${theme.root} px-6 py-3 font-bold text-lg` : `${theme.child} border-2 px-4 py-2 font-medium`}
                    `}
                    style={{
                        left: node.x,
                        top: node.y,
                        transform: 'translate(-50%, -50%)',
                        minWidth: '100px',
                        cursor: isEditing ? 'text' : 'pointer',
                        touchAction: 'none'
                    }}
                    onPointerDown={handlePointerDown}
                    onDoubleClick={(e) => {
                        e.stopPropagation();
                        onDoubleClick(node.id);
                    }}
                >
                    {isEditing ? (
                        <input
                            ref={nodeRef}
                            className={`node-input ${isRoot ? theme.inputRoot : theme.inputChild}`}
                            value={node.text}
                            onChange={(e) => onChange(node.id, e.target.value)}
                            onBlur={() => onDoubleClick(null)} // 取消編輯狀態
                            onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    onDoubleClick(null); // 結束編輯
                                }
                            }}
                        />
                    ) : (
                        <div className="select-none text-center whitespace-pre-wrap w-full">
                            {node.text || ' '}
                        </div>
                    )}
                </div>
            );
        };

        const MindMapApp = () => {
            const [nodes, setNodes] = useState(initialNodes);
            const [selectedId, setSelectedId] = useState('root');
            const [editingId, setEditingId] = useState(null);
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const [currentTheme, setCurrentTheme] = useState(THEMES[0]);
            
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);

            // 拖曳狀態
            const dragState = useRef({
                isDraggingCanvas: false,
                isDraggingNode: false,
                nodeId: null,
                startX: 0,
                startY: 0,
                initialTransform: { x: 0, y: 0 },
                initialNodePos: { x: 0, y: 0 }
            });

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3000);
            };

            const handlePointerDown = (e) => {
                if (editingId) setEditingId(null);
                
                // 開始拖曳畫布
                dragState.current = {
                    isDraggingCanvas: true,
                    isDraggingNode: false,
                    nodeId: null,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialTransform: { ...transform },
                    initialNodePos: null
                };
                setSelectedId(null);
            };

            const handleNodeDragStart = (e, id) => {
                const node = nodes.find(n => n.id === id);
                if (!node) return;

                dragState.current = {
                    isDraggingCanvas: false,
                    isDraggingNode: true,
                    nodeId: id,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialTransform: null,
                    initialNodePos: { x: node.x, y: node.y }
                };
            };

            const handlePointerMove = (e) => {
                if (dragState.current.isDraggingCanvas) {
                    const dx = e.clientX - dragState.current.startX;
                    const dy = e.clientY - dragState.current.startY;
                    setTransform(prev => ({
                        ...prev,
                        x: dragState.current.initialTransform.x + dx,
                        y: dragState.current.initialTransform.y + dy
                    }));
                } else if (dragState.current.isDraggingNode) {
                    const dx = (e.clientX - dragState.current.startX) / transform.scale;
                    const dy = (e.clientY - dragState.current.startY) / transform.scale;
                    
                    setNodes(prevNodes => prevNodes.map(node => 
                        node.id === dragState.current.nodeId
                            ? { ...node, x: dragState.current.initialNodePos.x + dx, y: dragState.current.initialNodePos.y + dy }
                            : node
                    ));
                }
            };

            const handlePointerUp = () => {
                dragState.current.isDraggingCanvas = false;
                dragState.current.isDraggingNode = false;
                dragState.current.nodeId = null;
            };

            // 處理滾輪縮放
            const handleWheel = (e) => {
                e.preventDefault();
                const zoomSensitivity = 0.001;
                const delta = -e.deltaY * zoomSensitivity;
                let newScale = transform.scale * (1 + delta);
                
                // 限制縮放範圍
                newScale = Math.max(0.2, Math.min(newScale, 3));
                
                // 為了讓縮放以滑鼠為中心，需要複雜的計算。為保持程式碼簡潔且單一檔案穩定，這裡先實現以中心縮放
                setTransform(prev => ({ ...prev, scale: newScale }));
            };

            useEffect(() => {
                const container = containerRef.current;
                if (container) {
                    container.addEventListener('wheel', handleWheel, { passive: false });
                }
                window.addEventListener('pointermove', handlePointerMove);
                window.addEventListener('pointerup', handlePointerUp);
                
                return () => {
                    if (container) {
                        container.removeEventListener('wheel', handleWheel);
                    }
                    window.removeEventListener('pointermove', handlePointerMove);
                    window.removeEventListener('pointerup', handlePointerUp);
                };
            }, [transform.scale]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    // 如果正在編輯文字，不觸發快捷鍵
                    if (editingId) return;

                    if (!selectedId) return;

                    if (e.key === 'Tab') {
                        e.preventDefault();
                        addChildNode(selectedId);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        addSiblingNode(selectedId);
                    } else if (e.key === 'Delete' || e.key === 'Backspace') {
                        e.preventDefault();
                        deleteNode(selectedId);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedId, editingId, nodes]);

            const addChildNode = (parentId) => {
                const parent = nodes.find(n => n.id === parentId);
                if (!parent) return;

                const newId = generateId();
                // 簡單的佈局：放在右邊偏下
                const childrenCount = nodes.filter(n => n.parentId === parentId).length;
                
                const newNode = {
                    id: newId,
                    text: '新節點',
                    x: parent.x + 200,
                    y: parent.y + (childrenCount * 60) - 30, // 稍微錯開
                    parentId: parentId
                };

                setNodes(prev => [...prev, newNode]);
                setSelectedId(newId);
                setEditingId(newId); // 直接進入編輯模式
            };

            const addSiblingNode = (nodeId) => {
                const node = nodes.find(n => n.id === nodeId);
                if (!node || node.parentId === null) {
                    // 如果是根節點，Enter 就當作新增子節點
                    if (node && node.parentId === null) addChildNode(nodeId);
                    return;
                }

                const siblingCount = nodes.filter(n => n.parentId === node.parentId).length;
                const newId = generateId();
                const newNode = {
                    id: newId,
                    text: '新節點',
                    x: node.x,
                    y: node.y + 80, // 放在下方
                    parentId: node.parentId
                };

                setNodes(prev => [...prev, newNode]);
                setSelectedId(newId);
                setEditingId(newId);
            };

            const deleteNode = (nodeId) => {
                const nodeToDelete = nodes.find(n => n.id === nodeId);
                if (!nodeToDelete || nodeToDelete.parentId === null) {
                    showToast('無法刪除中心主題', 'error');
                    return; // 根節點不能刪除
                }

                // 遞迴取得所有要刪除的子節點 ID
                const getChildrenIds = (id) => {
                    const children = nodes.filter(n => n.parentId === id).map(n => n.id);
                    let allChildren = [...children];
                    children.forEach(childId => {
                        allChildren = [...allChildren, ...getChildrenIds(childId)];
                    });
                    return allChildren;
                };

                const idsToDelete = [nodeId, ...getChildrenIds(nodeId)];
                setNodes(prev => prev.filter(n => !idsToDelete.includes(n.id)));
                setSelectedId(nodeToDelete.parentId); // 選回父節點
            };

            const handleNodeTextChange = (id, newText) => {
                setNodes(prev => prev.map(n => n.id === id ? { ...n, text: newText } : n));
            };

            const handleSave = () => {
                const data = JSON.stringify(nodes, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mindmap-${new Date().getTime()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('心智圖已儲存為 JSON 檔案', 'success');
            };

            const handleLoad = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedNodes = JSON.parse(event.target.result);
                        if (Array.isArray(parsedNodes) && parsedNodes.length > 0 && parsedNodes[0].id === 'root') {
                            setNodes(parsedNodes);
                            setTransform({ x: 0, y: 0, scale: 1 });
                            showToast('成功讀取心智圖', 'success');
                        } else {
                            throw new Error('格式不正確');
                        }
                    } catch (error) {
                        showToast('讀取失敗，檔案格式錯誤', 'error');
                    }
                };
                reader.readAsText(file);
                // 重置 input，允許重複選擇同一個檔案
                e.target.value = '';
            };

            const handleExportPDF = () => {
                showToast('正在準備匯出 PDF...', 'info');
                const element = document.getElementById('export-container');
                
                // 為了匯出完整，暫時取消選取狀態，並重置變形
                const originalSelectedId = selectedId;
                const originalTransform = transform;
                setSelectedId(null);
                setEditingId(null);
                
                // 尋找邊界以調整匯出視圖
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodes.forEach(n => {
                    if (n.x < minX) minX = n.x;
                    if (n.y < minY) minY = n.y;
                    if (n.x > maxX) maxX = n.x;
                    if (n.y > maxY) maxY = n.y;
                });
                
                const padding = 100;
                const width = maxX - minX + padding * 2;
                const height = maxY - minY + padding * 2;
                const centerX = minX + (maxX - minX) / 2;
                const centerY = minY + (maxY - minY) / 2;
                
                // 調整畫布至置中並涵蓋所有節點
                setTransform({
                    x: window.innerWidth / 2 - centerX,
                    y: window.innerHeight / 2 - centerY,
                    scale: 1
                });

                // 給予 React 時間重新渲染再匯出
                setTimeout(() => {
                    const opt = {
                        margin:       10,
                        filename:     `mindmap-${new Date().getTime()}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true, logging: false },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: width > height ? 'landscape' : 'portrait' }
                    };

                    html2pdf().set(opt).from(element).save().then(() => {
                        // 恢復原狀
                        setTransform(originalTransform);
                        setSelectedId(originalSelectedId);
                        showToast('匯出 PDF 完成', 'success');
                    }).catch(err => {
                        console.error(err);
                        setTransform(originalTransform);
                        setSelectedId(originalSelectedId);
                        showToast('匯出 PDF 失敗', 'error');
                    });
                }, 500);
            };

            const resetView = () => {
                setTransform({ x: 0, y: 0, scale: 1 });
            };

            const handleRandomTheme = () => {
                // 隨機挑選與目前不同的一個主題
                const availableThemes = THEMES.filter(t => t.id !== currentTheme.id);
                const randomTheme = availableThemes[Math.floor(Math.random() * availableThemes.length)];
                setCurrentTheme(randomTheme);
            };

            // 確保 React 狀態更新後，Lucide 圖標仍然能正常渲染
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // 繪製貝茲曲線
            const renderConnections = () => {
                return nodes.map(node => {
                    if (node.parentId === null) return null;
                    const parent = nodes.find(n => n.id === node.parentId);
                    if (!parent) return null;

                    // 計算曲線控制點
                    const dx = node.x - parent.x;
                    const dy = node.y - parent.y;
                    
                    // 從父節點的右側/左側連出，連到子節點的左側/右側
                    const path = `M ${parent.x} ${parent.y} 
                                  C ${parent.x + dx/2} ${parent.y}, 
                                    ${node.x - dx/2} ${node.y}, 
                                    ${node.x} ${node.y}`;

                    return (
                        <path
                            key={`line-${node.id}`}
                            d={path}
                            fill="none"
                            stroke={currentTheme.line}
                            strokeWidth="3"
                            className="transition-all duration-200"
                        />
                    );
                });
            };

            return (
                <div className="relative w-screen h-screen overflow-hidden bg-slate-50 font-sans">
                    {/* 工具列 */}
                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm shadow-md px-6 py-3 rounded-full flex gap-4 z-50 items-center border border-slate-200">
                        <button onClick={handleSave} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors" title="儲存為 JSON">
                            <i data-lucide="save" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">儲存</span>
                        </button>
                        
                        <div className="w-px h-5 bg-slate-300"></div>
                        
                        <label className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors cursor-pointer" title="讀取 JSON">
                            <i data-lucide="folder-open" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">讀取</span>
                            <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleLoad} />
                        </label>
                        
                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={handleExportPDF} className="flex items-center gap-2 text-slate-700 hover:text-red-600 transition-colors" title="匯出為 PDF">
                            <i data-lucide="file-down" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">PDF匯出</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={handleRandomTheme} className="flex items-center gap-2 text-slate-700 hover:text-purple-600 transition-colors" title="隨機配色">
                            <i data-lucide="palette" className="w-5 h-5"></i> <span className="hidden sm:inline text-sm font-medium">隨機配色</span>
                        </button>

                        <div className="w-px h-5 bg-slate-300"></div>

                        <button onClick={resetView} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 transition-colors" title="重置視角">
                            <i data-lucide="maximize" className="w-5 h-5"></i>
                        </button>
                    </div>

                    {/* 操作提示 */}
                    <div className="absolute bottom-4 left-4 bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow border border-slate-200 z-50 text-xs text-slate-600 space-y-1">
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">雙擊</kbd> 編輯文字</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Tab</kbd> 新增子節點</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Enter</kbd> 新增同層節點</p>
                        <p><kbd className="bg-slate-100 border border-slate-300 px-1.5 py-0.5 rounded mr-1">Del</kbd> 刪除節點與分支</p>
                        <p>拖曳背景可平移，滾輪可縮放</p>
                    </div>

                    {/* 提示訊息 (Toast) */}
                    {toast.show && (
                        <div className={`absolute top-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-lg z-50 text-sm font-medium text-white transition-all duration-300 ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            {toast.message}
                        </div>
                    )}

                    {/* 畫布區域 */}
                    <div 
                        className="canvas-container"
                        ref={containerRef}
                        onPointerDown={handlePointerDown}
                        style={{
                            backgroundSize: '40px 40px',
                            backgroundImage: 'radial-gradient(circle, #cbd5e1 1px, transparent 1px)',
                            backgroundPosition: `${transform.x}px ${transform.y}px`
                        }}
                    >
                        <div 
                            id="export-container"
                            style={{
                                transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`,
                                transformOrigin: '0 0',
                                width: '100%',
                                height: '100%',
                                position: 'absolute',
                                top: 0,
                                left: 0
                            }}
                        >
                            {/* SVG 連線層 */}
                            <svg className="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none">
                                {renderConnections()}
                            </svg>

                            {/* 節點層 */}
                            {nodes.map(node => (
                                <Node
                                    key={node.id}
                                    node={node}
                                    isSelected={selectedId === node.id}
                                    isEditing={editingId === node.id}
                                    onSelect={setSelectedId}
                                    onDoubleClick={(id) => setEditingId(id)}
                                    onChange={handleNodeTextChange}
                                    onDragStart={handleNodeDragStart}
                                    theme={currentTheme}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MindMapApp />);

        // 初始化圖示
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
