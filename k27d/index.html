<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>土地清冊系統</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5YQY4RT9H2');
    </script>

    <!-- 引入 Tailwind CSS (用於快速排版美化) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons (用於圖示) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 html2canvas (用於網頁截圖匯出) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入 SortableJS (用於拖曳排序) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        /* 隱藏欄位用的 class */
        .hide-col { display: none !important; }
        
        /* 編輯區表格樣式 (加入垂直框線) */
        #inputTable th { position: sticky; top: 0; background-color: #f3f4f6; z-index: 10; border: 1px solid #e5e7eb; }
        #inputTable td { border: 1px solid #e5e7eb; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }

        /* 輸入框通用樣式 (黃色底色強調可輸入，單行高度) */
        .input-cell {
            width: 100%; border: 1px solid transparent; padding: 4px; border-radius: 4px; 
            transition: all 0.2s; background-color: #fef9c3; height: 32px;
        }
        .input-cell:focus {
            border-color: #eab308; outline: none; background-color: white; 
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
        }
        .input-cell:hover:not(:focus) { border-color: #fde047; background-color: #fffbeb; }
        
        /* 錯誤警示框 */
        .input-error { border-color: #ef4444 !important; background-color: #fee2e2 !important; }
        .input-warn { border-color: #fbbf24 !important; background-color: #fef3c7 !important; }
        .readonly-text { font-variant-numeric: tabular-nums; }

        /* 輸出區純文字表格美化樣式 (供截圖用) */
        .output-table {
            width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; font-family: sans-serif;
            margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .output-table th, .output-table td {
            border: 1px solid #d1d5db; padding: 8px 12px;
        }
        .output-table th { background-color: #e5e7eb; color: #374151; font-weight: bold; }
        .output-table tr:nth-child(even) td { background-color: #f9fafb; }
        .output-table tr:hover td { background-color: #f3f4f6; }
        .output-table .text-right { text-align: right; }
        .output-table .text-left { text-align: left; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- 頂部導覽與工具列 -->
    <header class="bg-white shadow-sm sticky top-0 z-50 flex-shrink-0" id="main-header">
        <div class="max-w-screen-2xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-map-trifold text-3xl text-blue-600"></i>
                <h1 class="text-xl font-bold text-gray-800">土地清冊系統</h1>
            </div>

            <!-- 工具按鈕區 -->
            <div class="flex items-center gap-2 text-sm flex-wrap">
                <button onclick="copyToClipboard()" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded border transition">
                    <i class="ph ph-copy text-lg"></i> 複製表格
                </button>
                <button onclick="exportCSV()" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded border transition">
                    <i class="ph ph-file-csv text-lg"></i> 匯出 CSV
                </button>
                <button onclick="exportImage()" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded border transition font-bold text-blue-700 bg-blue-50">
                    <i class="ph ph-camera text-lg"></i> 截圖下載報表
                </button>
                <div class="h-6 w-px bg-gray-300 mx-1 hidden sm:block"></div>
                <button onclick="exportJSON()" class="flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded border border-indigo-200 transition">
                    <i class="ph ph-download-simple text-lg"></i> 儲存專案
                </button>
                <label class="flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded border border-indigo-200 transition cursor-pointer">
                    <i class="ph ph-upload-simple text-lg"></i> 讀取專案
                    <input type="file" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
                <button onclick="clearAllData()" class="flex items-center gap-1 bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded border border-red-200 transition">
                    <i class="ph ph-trash text-lg"></i> 清空
                </button>
            </div>
        </div>

        <!-- 顯示設定列 -->
        <div class="max-w-screen-2xl mx-auto px-4 py-2 bg-gray-50 border-t flex flex-wrap gap-6 text-sm items-center">
            <!-- 面積顯示單位 -->
            <div class="flex items-center gap-2">
                <span class="font-medium text-gray-600">產出單位：</span>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="areaMode" value="sqm" checked onchange="changeAreaMode(this.value)"> 僅平方公尺</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="areaMode" value="ping" onchange="changeAreaMode(this.value)"> 僅坪</label>
                <label class="flex items-center gap-1 cursor-pointer text-blue-600 font-bold"><input type="radio" name="areaMode" value="both" onchange="changeAreaMode(this.value)"> 兩者並列 (分開產生兩表)</label>
            </div>
            <!-- 顯示欄位控制 (預設隱藏行政區與備註) -->
            <div class="flex items-center gap-3">
                <span class="font-medium text-gray-600">顯示欄位：</span>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" onchange="toggleColumn('district', this.checked)"> 行政區</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" onchange="toggleColumn('subsection', this.checked)"> 小段</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked onchange="toggleColumn('zoning', this.checked)"> 使用分區</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked onchange="toggleColumn('owner', this.checked)"> 所有權人</label>
                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" onchange="toggleColumn('remarks', this.checked)"> 備註</label>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-screen-2xl mx-auto w-full flex flex-col gap-8" id="main-content">
        
        <!-- 上半部：輸入與編輯區塊 -->
        <section class="flex flex-col gap-2">
            <div class="flex items-center gap-2 mb-1">
                <i class="ph-fill ph-pencil-simple text-2xl text-gray-600"></i>
                <h2 class="text-xl font-bold text-gray-700">1. 資料編輯區</h2>
                <span class="text-sm text-gray-500">(請在黃色底色欄位輸入資料)</span>
            </div>

            <div class="bg-white rounded-lg shadow border border-gray-200 overflow-x-auto relative">
                <table class="w-full text-left border-collapse whitespace-nowrap" id="inputTable">
                    <thead class="text-sm text-gray-600">
                        <tr>
                            <th class="py-2 px-3 w-10 text-center"></th>
                            <th class="py-2 px-3 w-12 text-center">項次</th>
                            <th class="py-2 px-3 w-28 col-district">行政區</th>
                            <th class="py-2 px-3 w-32">地段</th>
                            <th class="py-2 px-3 w-28 col-subsection">小段</th>
                            <th class="py-2 px-3 w-32">地號</th>
                            <th class="py-2 px-3 w-32 col-zoning">使用分區</th>
                            <th class="py-2 px-3 w-32 text-right">總面積(㎡)</th>
                            <th class="py-2 px-3 w-32 col-owner">所有權人</th>
                            <th class="py-2 px-3 text-center" colspan="3">持分(分子/分母)</th>
                            <th class="py-2 px-3 w-32 text-right">持分面積(㎡)</th>
                            <th class="py-2 px-3 w-48 col-remarks">備註</th>
                            <th class="py-2 px-3 w-24 text-center action-col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="input-table-body" class="text-sm">
                        <!-- 輸入列由 JS 動態生成 -->
                    </tbody>
                </table>
            </div>

            <!-- 快捷按鈕與小計 -->
            <div class="flex flex-wrap justify-between items-start gap-4 mt-2">
                <div class="flex gap-2">
                    <button onclick="duplicateLastRow()" class="flex items-center gap-1 bg-white hover:bg-indigo-50 text-indigo-600 px-4 py-2 rounded-md shadow-sm border border-gray-200 transition text-sm font-medium" title="複製最後一筆的所有資料，適合用於輸入同一個人的不同地號">
                        <i class="ph ph-copy text-lg"></i> 複製最後一筆
                    </button>
                    <button onclick="addNewRow()" class="flex items-center gap-1 bg-white hover:bg-blue-50 text-blue-600 px-4 py-2 rounded-md shadow-sm border border-gray-200 transition text-sm font-medium">
                        <i class="ph ph-plus text-lg"></i> 新增空白一筆
                    </button>
                </div>

                <!-- 各地號持分檢核小計 -->
                <div class="bg-white rounded-md shadow-sm border border-gray-200 p-3 w-full md:w-96">
                    <h3 class="font-bold text-gray-700 mb-1 border-b pb-1 flex items-center gap-1 text-sm">
                        <i class="ph ph-check-square-offset text-base"></i> 檢核小計
                    </h3>
                    <div class="overflow-y-auto max-h-40 pr-1">
                        <table class="w-full text-xs">
                            <tbody id="subtotal-body" class="divide-y divide-gray-100">
                                <!-- 小計由 JS 動態生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- 下半部：美觀成果輸出區塊 -->
        <section class="flex flex-col gap-2 border-t-2 border-gray-300 pt-6">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-printer text-2xl text-blue-600"></i>
                    <h2 class="text-xl font-bold text-gray-800">2. 報表輸出區</h2>
                    <span class="text-sm text-gray-500">(純文字版面，點擊「截圖下載報表」將僅擷取此範圍)</span>
                </div>
                <button onclick="exportImage()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow transition text-sm font-medium">
                    <i class="ph ph-camera text-lg"></i> 截圖下載報表
                </button>
            </div>

            <!-- 這個容器是截圖的目標 -->
            <div id="print-container" class="bg-white rounded-xl shadow-lg border border-gray-200 p-8 min-h-[300px]">
                <div id="output-tables-wrapper" class="flex flex-col gap-10">
                    <!-- 美觀表格將由 JS 動態生成 -->
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- Custom Alert & Confirm replacements ---
        window.customAlert = function(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow-lg z-[100] transition-opacity duration-300';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.customConfirm = function(msg, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] transition-opacity duration-300';
            const box = document.createElement('div');
            box.className = 'bg-white p-6 rounded shadow-xl max-w-sm w-full mx-4';
            box.innerHTML = `
                <p class="mb-6 text-gray-800 font-medium text-lg">${msg}</p>
                <div class="flex justify-end gap-3">
                    <button class="px-4 py-2 bg-gray-200 rounded text-gray-800 hover:bg-gray-300 transition" id="btn-cancel">取消</button>
                    <button class="px-4 py-2 bg-red-600 rounded text-white hover:bg-red-700 transition" id="btn-confirm">確定</button>
                </div>
            `;
            overlay.appendChild(box);
            document.body.appendChild(overlay);

            document.getElementById('btn-cancel').onclick = () => overlay.remove();
            document.getElementById('btn-confirm').onclick = () => {
                overlay.remove();
                onConfirm();
            };
        };

        // --- 核心狀態管理 ---
        let state = {
            data: [], 
            areaMode: 'sqm', // 'sqm', 'ping', 'both'
            hiddenCols: new Set(['district', 'subsection', 'remarks']) // 預設隱藏行政區、小段與備註
        };

        const PING_RATIO = 0.3025;

        // --- 防呆輔助函式：全形轉半形 ---
        function toHalfWidth(str) {
            if (str == null) return '';
            return String(str).replace(/[\uff01-\uff5e]/g, function(ch) {
                return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
            }).replace(/\u3000/g, ' ');
        }

        function init() {
            if (state.data.length === 0) addNewRow(); 
            renderInputTable();
            renderOutputTables();
            initSortable();
            setupBeforeUnload();
        }

        // --- 資料操作邏輯 ---
        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 5);
        }

        function createEmptyRow() {
            return {
                id: generateId(), district: '', section: '', subsection: '', plot: '', zoning: '', 
                area: '', owner: '', numerator: 1, denominator: 1, remarks: ''
            };
        }

        function addNewRow() {
            state.data.push(createEmptyRow());
            triggerUpdate();
            // 自動滾動到最後並 focus 在第一個輸入框
            setTimeout(() => { document.querySelector('#input-table-body tr:last-child input')?.focus(); }, 50);
        }

        function addCoOwnerRow(index) {
            const prevRow = state.data[index];
            const newRow = createEmptyRow();
            
            // 只複製土地基本屬性
            newRow.district = prevRow.district;
            newRow.section = prevRow.section;
            newRow.subsection = prevRow.subsection;
            newRow.plot = prevRow.plot;
            newRow.zoning = prevRow.zoning;
            newRow.area = prevRow.area;
            
            // 差異化優化：預設帶入相同分母，並清空分子讓使用者重填
            newRow.denominator = prevRow.denominator;
            newRow.numerator = '';
            
            state.data.splice(index + 1, 0, newRow);
            triggerUpdate();
            
            // 自動 Focus 到「姓名」欄位
            setTimeout(() => {
                const trs = document.querySelectorAll('#input-table-body tr');
                if(trs[index + 1]) trs[index + 1].querySelector('input[data-field="owner"]')?.focus();
            }, 50);
        }

        function duplicateLastRow() {
            if (state.data.length === 0) { addNewRow(); return; }
            const prevRow = state.data[state.data.length - 1];
            const newRow = createEmptyRow();
            
            // 複製所有屬性 (包含姓名、持分等)
            Object.keys(prevRow).forEach(key => {
                if(key !== 'id') newRow[key] = prevRow[key];
            });
            
            // 差異化優化：假設是連續輸入同一個人的相鄰土地，清空地號讓使用者重填
            newRow.plot = '';
            
            state.data.push(newRow);
            triggerUpdate();
            
            // 自動 Focus 到「地號」欄位
            setTimeout(() => { 
                const tr = document.querySelector('#input-table-body tr:last-child');
                if(tr) tr.querySelector('input[data-field="plot"]')?.focus(); 
            }, 50);
        }

        function deleteRow(id) {
            state.data = state.data.filter(row => row.id !== id);
            if (state.data.length === 0) addNewRow();
            triggerUpdate();
        }

        function clearAllData() {
            customConfirm("確定要清空所有資料嗎？", () => {
                state.data = [];
                addNewRow();
                triggerUpdate();
            });
        }

        // --- 集中更新處理 ---
        function triggerUpdate() {
            renderInputTable();
            renderOutputTables();
        }

        document.getElementById('input-table-body').addEventListener('input', (e) => {
            const tr = e.target.closest('tr');
            if (!tr) return;
            
            const id = tr.dataset.id;
            const field = e.target.dataset.field;
            const row = state.data.find(r => r.id === id);
            
            if (row && field) {
                let value = e.target.value;

                // 防呆 1：數字相關欄位自動將「全形轉半形」並去除多餘空白
                if (['plot', 'area', 'numerator', 'denominator'].includes(field)) {
                    value = toHalfWidth(value).trim();
                    if (e.target.value !== value && value !== '') e.target.value = value;
                }

                if (field === 'section') {
                    value = value.replace(/段$/, '');
                    if (e.target.value !== value) e.target.value = value;
                }
                if (field === 'subsection') {
                    value = value.replace(/小段$/, '');
                    if (e.target.value !== value) e.target.value = value;
                }
                if (['area', 'numerator', 'denominator'].includes(field)) {
                    // 防呆 2：面積與持分不允許負數
                    let numVal = Number(value);
                    if (numVal < 0) {
                        numVal = Math.abs(numVal);
                        e.target.value = numVal;
                        value = numVal;
                    }
                    value = value === '' ? '' : numVal;
                }
                row[field] = value;
                
                // 即時更新輸入區計算與驗證 UI，並同時重新渲染下方的輸出表
                updateInputCalculationsAndUI(); 
                renderOutputTables();
            }
        });

        function formatSection(sec) {
            if (!sec || String(sec).trim() === '') return '';
            let s = String(sec).trim();
            return s.endsWith('段') ? s : s + '段';
        }

        function formatSubsection(sub) {
            if (!sub || String(sub).trim() === '') return '';
            let s = String(sub).trim();
            return s.endsWith('小段') ? s : s + '小段';
        }

        function formatNumber(num) {
            if (num === '' || isNaN(num)) return '0.00';
            return (Math.round(num * 100) / 100).toFixed(2);
        }

        function analyzeGroups() {
            const groups = {};
            const groupStatus = {};
            const plotRegex = /^\d+(-\d+)?$/; // 地號格式檢核正則表達式

            state.data.forEach(row => {
                // 先計算單筆資料本身的防呆狀態 (不受是否填寫地段地號影響)
                const num = Number(row.numerator) || 0;
                const den = Number(row.denominator) || 1;
                const area = Number(row.area) || 0;
                const shareArea = den === 0 ? 0 : area * (num / den);
                const isPlotInvalid = row.plot !== '' && !plotRegex.test(row.plot); // 檢核地號格式
                
                groupStatus[row.id] = {
                    shareStatus: 'ok', areaInconsistent: false,
                    zoningInconsistent: false, hasDuplicateOwner: false,
                    denZero: den === 0, numGtDen: num > den && den !== 0, 
                    plotInvalid: isPlotInvalid,
                    shareAreaSqm: shareArea, groupKey: '-'
                };

                const s = formatSection(row.section);
                const sub = formatSubsection(row.subsection);
                const p = (row.plot || '').trim();
                
                // 若未填地段地號則不加入群組分析，但上述的本列防呆依然有效
                if (!s && !p) return; 
                
                const key = [s, sub, p].filter(Boolean).join('-');
                if (!groups[key]) {
                    groups[key] = { rows: [], totalShare: 0, areas: new Set(), zonings: new Set(), owners: new Set(), shareAreaSumSqm: 0 };
                }
                groups[key].rows.push(row);
                
                groups[key].totalShare += (num / den);
                
                if (row.area !== '') groups[key].areas.add(Number(row.area));
                if (row.zoning !== '') groups[key].zonings.add(row.zoning);
                if (row.owner !== '') {
                    if (groups[key].owners.has(row.owner)) groups[key].hasDuplicateOwner = true;
                    groups[key].owners.add(row.owner);
                }
            });

            for (const key in groups) {
                const g = groups[key];
                const epsilon = 1e-6;
                let shareStatus = 'ok';
                if (g.totalShare > 1 + epsilon) shareStatus = 'overflow';
                else if (g.totalShare < 1 - epsilon) shareStatus = 'underflow';

                const areaInconsistent = g.areas.size > 1;
                const zoningInconsistent = g.zonings.size > 1;

                g.rows.forEach(r => {
                    // 針對同地號群組覆蓋寫入與群組相關的防呆狀態
                    groupStatus[r.id].shareStatus = shareStatus;
                    groupStatus[r.id].areaInconsistent = areaInconsistent;
                    groupStatus[r.id].zoningInconsistent = zoningInconsistent;
                    groupStatus[r.id].hasDuplicateOwner = g.hasDuplicateOwner && r.owner !== '';
                    groupStatus[r.id].groupKey = key;
                });
            }
            return { groups, groupStatus };
        }

        function renderInputTable() {
            const tbody = document.getElementById('input-table-body');
            tbody.innerHTML = '';
            
            const analysis = analyzeGroups();
            const groupStatus = analysis.groupStatus;

            state.data.forEach((row, index) => {
                const status = groupStatus[row.id] || {};
                let rowBg = 'bg-white';
                let shareIcon = '';
                
                if (status.shareStatus === 'overflow') {
                    rowBg = 'bg-red-50';
                    shareIcon = `<i class="ph-fill ph-warning-circle text-red-500" title="此地號持分加總超過 1/1"></i>`;
                } else if (status.shareStatus === 'underflow') {
                    shareIcon = `<i class="ph-fill ph-info text-yellow-500" title="此地號持分加總不足 1/1"></i>`;
                } else if (status.shareStatus === 'ok') {
                    shareIcon = `<i class="ph-fill ph-check-circle text-green-500" title="持分完整 = 1/1"></i>`;
                }

                const areaClass = status.areaInconsistent ? 'input-error text-red-600' : '';
                const zoningClass = status.zoningInconsistent ? 'input-error text-red-600' : '';
                const denClass = status.denZero ? 'input-error text-red-600' : '';
                const numClass = status.numGtDen ? 'input-error text-red-600 font-bold' : '';
                const ownerClass = status.hasDuplicateOwner ? 'text-orange-600 font-bold' : '';
                const plotClass = status.plotInvalid ? 'input-error text-red-600' : '';

                const shareArea = status.denZero ? 0 : (Number(row.area) || 0) * ((Number(row.numerator) || 0) / (Number(row.denominator) || 1));
                const displaySection = (row.section || '').replace(/段$/, '');
                const displaySubsection = (row.subsection || '').replace(/小段$/, '');

                const tr = document.createElement('tr');
                tr.className = `transition-colors ${rowBg}`;
                tr.dataset.id = row.id;

                tr.innerHTML = `
                    <td class="py-1 px-1 text-center action-col"><i class="ph ph-dots-six-vertical text-gray-400 drag-handle text-lg"></i></td>
                    <td class="py-1 px-1 text-center text-gray-500 font-mono text-xs">${index + 1}</td>
                    <td class="py-1 px-1 col-district"><input type="text" data-field="district" value="${row.district}" class="input-cell" placeholder="行政區"></td>
                    <td class="py-1 px-1">
                        <div class="flex items-center">
                            <input type="text" data-field="section" value="${displaySection}" class="input-cell" placeholder="例: 中正">
                            <span class="text-gray-500 whitespace-nowrap ml-1 text-sm">段</span>
                        </div>
                    </td>
                    <td class="py-1 px-1 col-subsection">
                        <div class="flex items-center">
                            <input type="text" data-field="subsection" value="${displaySubsection}" class="input-cell" placeholder="例: 一">
                            <span class="text-gray-500 whitespace-nowrap ml-1 text-sm">小段</span>
                        </div>
                    </td>
                    <td class="py-1 px-1 relative">
                        <input type="text" data-field="plot" value="${row.plot}" class="input-cell ${plotClass}" placeholder="0001-0000" title="${status.plotInvalid ? '建議格式為數字或加上一個橫線 (例: 0001-0000)' : ''}">
                        <div class="absolute right-2 top-2 group-icon-container">${shareIcon}</div>
                    </td>
                    <td class="py-1 px-1 col-zoning"><input type="text" data-field="zoning" value="${row.zoning}" class="input-cell ${zoningClass}" placeholder="分區"></td>
                    <td class="py-1 px-1"><input type="number" step="0.01" data-field="area" value="${row.area}" class="input-cell text-right ${areaClass}" placeholder="0.00"></td>
                    <td class="py-1 px-1 col-owner relative">
                        <input type="text" data-field="owner" value="${row.owner}" class="input-cell ${ownerClass}" placeholder="姓名">
                        <div class="absolute right-2 top-2 owner-icon-container">${status.hasDuplicateOwner ? `<i class="ph-fill ph-warning text-orange-400" title="注意：此地號有重複輸入的所有權人"></i>` : ''}</div>
                    </td>
                    <td class="py-1 px-0 w-12 text-right relative">
                        <input type="number" data-field="numerator" value="${row.numerator}" class="input-cell text-center p-1 ${numClass}" placeholder="1" title="${status.numGtDen ? '分子不應大於分母' : ''}">
                    </td>
                    <td class="py-1 px-0 w-4 text-center text-gray-400 font-bold">/</td>
                    <td class="py-1 px-0 w-12 text-left"><input type="number" data-field="denominator" value="${row.denominator}" class="input-cell text-center p-1 ${denClass}" placeholder="1"></td>
                    <td class="py-1 px-2 text-right font-semibold text-gray-700 readonly-text share-area-display" data-val="${shareArea}">
                        ${formatNumber(shareArea)}
                    </td>
                    <td class="py-1 px-1 col-remarks"><input type="text" data-field="remarks" value="${row.remarks}" class="input-cell" placeholder="..."></td>
                    <td class="py-1 px-1 text-center action-col">
                        <button onclick="addCoOwnerRow(${index})" class="text-blue-500 hover:text-blue-700 mx-0.5" title="新增共同持有人"><i class="ph ph-users-three text-lg"></i></button>
                        <button onclick="deleteRow('${row.id}')" class="text-red-400 hover:text-red-600 mx-0.5" title="刪除此筆資料"><i class="ph ph-trash text-lg"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            applyColumnVisibility();
            updateSubtotalSummary(analysis);
        }

        function updateInputCalculationsAndUI() {
            const analysis = analyzeGroups();
            const groupStatus = analysis.groupStatus;

            state.data.forEach(row => {
                const status = groupStatus[row.id] || {};
                const tr = document.querySelector(`tr[data-id="${row.id}"]`);
                if (!tr) return;

                const newBgClass = `transition-colors ${status.shareStatus === 'overflow' ? 'bg-red-50' : 'bg-white'}`;
                if (tr.className !== newBgClass) tr.className = newBgClass;
                
                const iconContainer = tr.querySelector('.group-icon-container');
                if (iconContainer) {
                    let newIcon = '';
                    if (status.shareStatus === 'overflow') newIcon = `<i class="ph-fill ph-warning-circle text-red-500"></i>`;
                    else if (status.shareStatus === 'underflow') newIcon = `<i class="ph-fill ph-info text-yellow-500"></i>`;
                    else if (status.shareStatus === 'ok') newIcon = `<i class="ph-fill ph-check-circle text-green-500"></i>`;
                    if (iconContainer.innerHTML !== newIcon) iconContainer.innerHTML = newIcon;
                }

                const toggleClass = (el, force, cls) => {
                    if(!el) return;
                    if(force) el.classList.add(cls); else el.classList.remove(cls);
                };
                
                toggleClass(tr.querySelector('input[data-field="area"]'), status.areaInconsistent, 'input-error');
                toggleClass(tr.querySelector('input[data-field="zoning"]'), status.zoningInconsistent, 'input-error');
                toggleClass(tr.querySelector('input[data-field="denominator"]'), status.denZero, 'input-error');
                
                const plotInput = tr.querySelector('input[data-field="plot"]');
                if (plotInput) {
                    toggleClass(plotInput, status.plotInvalid, 'input-error');
                    toggleClass(plotInput, status.plotInvalid, 'text-red-600');
                    if (status.plotInvalid) plotInput.title = "建議格式為數字或加上一個橫線 (例: 0001-0000)"; 
                    else plotInput.removeAttribute('title');
                }

                const numInput = tr.querySelector('input[data-field="numerator"]');
                if (numInput) {
                    toggleClass(numInput, status.numGtDen, 'input-error');
                    toggleClass(numInput, status.numGtDen, 'font-bold');
                    toggleClass(numInput, status.numGtDen, 'text-red-600');
                    if (status.numGtDen) numInput.title = "分子不應大於分母"; else numInput.removeAttribute('title');
                }

                const ownerInput = tr.querySelector('input[data-field="owner"]');
                if(ownerInput) {
                    toggleClass(ownerInput, status.hasDuplicateOwner, 'text-orange-600');
                    toggleClass(ownerInput, status.hasDuplicateOwner, 'font-bold');
                }

                const ownerIconContainer = tr.querySelector('.owner-icon-container');
                if (ownerIconContainer) {
                    ownerIconContainer.innerHTML = status.hasDuplicateOwner ? `<i class="ph-fill ph-warning text-orange-400" title="注意：此地號有重複輸入的所有權人"></i>` : '';
                }

                const shareAreaCell = tr.querySelector('.share-area-display');
                if (shareAreaCell && shareAreaCell.dataset.val !== String(status.shareAreaSqm)) {
                    shareAreaCell.innerHTML = formatNumber(status.shareAreaSqm);
                    shareAreaCell.dataset.val = status.shareAreaSqm;
                }
            });
            updateSubtotalSummary(analysis);
        }

        function updateSubtotalSummary(analysis) {
            const subtotalBody = document.getElementById('subtotal-body');
            subtotalBody.innerHTML = '';
            let valid = 0;
            for (const key in analysis.groups) {
                const g = analysis.groups[key];
                if(key === '-') continue; 
                valid++;
                let shareStr = '', shareColor = '';
                if (Math.abs(g.totalShare - 1) < 1e-6) { shareStr = '完整 1/1'; shareColor = 'text-green-600'; } 
                else if (g.totalShare > 1) { shareStr = `溢出 (${formatNumber(g.totalShare)})`; shareColor = 'text-red-600'; } 
                else { shareStr = `未滿 (${formatNumber(g.totalShare)})`; shareColor = 'text-yellow-600'; }

                subtotalBody.innerHTML += `<tr><td class="py-1 pr-2">${key}</td><td class="py-1 text-right ${shareColor} font-bold">${shareStr}</td></tr>`;
            }
            if(valid === 0) subtotalBody.innerHTML = `<tr><td colspan="2" class="py-1 text-center text-gray-400">尚無資料</td></tr>`;
        }

        function renderOutputTables() {
            const wrapper = document.getElementById('output-tables-wrapper');
            wrapper.innerHTML = '';

            if (state.areaMode === 'sqm' || state.areaMode === 'both') {
                wrapper.appendChild(createOutputTableHTML('sqm'));
            }
            if (state.areaMode === 'ping' || state.areaMode === 'both') {
                wrapper.appendChild(createOutputTableHTML('ping'));
            }
        }

        function createOutputTableHTML(unitMode) {
            const isPing = (unitMode === 'ping');
            const unitLabel = isPing ? '坪' : '平方公尺';
            const unitSuffix = isPing ? ' 坪' : ' ㎡';
            const ratio = isPing ? PING_RATIO : 1;

            const container = document.createElement('div');
            container.className = 'flex flex-col gap-3';

            // 標題
            const headerHtml = `
                <div class="flex justify-between items-end border-b-2 border-gray-800 pb-2">
                    <h3 class="text-2xl font-bold text-gray-900 tracking-wider">土地清冊 <span class="text-lg text-gray-600 font-normal">(${unitLabel})</span></h3>
                    <div class="text-sm text-gray-600">製表日期：${new Date().toLocaleDateString()}</div>
                </div>
            `;

            // 欄位標題過濾
            let thHtml = `<th style="width:50px;">項次</th>`;
            if (!state.hiddenCols.has('district')) thHtml += `<th>行政區</th>`;
            thHtml += `<th>地段</th>`;
            if (!state.hiddenCols.has('subsection')) thHtml += `<th>小段</th>`;
            thHtml += `<th>地號</th>`;
            if (!state.hiddenCols.has('zoning')) thHtml += `<th>使用分區</th>`;
            thHtml += `<th class="text-right">總面積</th>`;
            if (!state.hiddenCols.has('owner')) thHtml += `<th>所有權人</th>`;
            thHtml += `<th>持分</th><th class="text-right">持分面積</th>`;
            if (!state.hiddenCols.has('remarks')) thHtml += `<th>備註</th>`;

            // 資料列
            let trsHtml = '';
            let totalArea = 0;
            let totalShareArea = 0;

            state.data.forEach((row, index) => {
                const areaSqm = Number(row.area) || 0;
                const num = Number(row.numerator) || 0;
                const den = Number(row.denominator) || 1;
                const shareSqm = den === 0 ? 0 : areaSqm * (num / den);

                const displayArea = areaSqm * ratio;
                const displayShareArea = shareSqm * ratio;
                
                // 加總計算
                totalShareArea += displayShareArea;

                trsHtml += `<tr><td>${index + 1}</td>`;
                if (!state.hiddenCols.has('district')) trsHtml += `<td class="text-left">${row.district || ''}</td>`;
                trsHtml += `<td class="text-left">${formatSection(row.section)}</td>`;
                if (!state.hiddenCols.has('subsection')) trsHtml += `<td class="text-left">${formatSubsection(row.subsection)}</td>`;
                trsHtml += `<td class="text-left font-mono">${row.plot || ''}</td>`;
                if (!state.hiddenCols.has('zoning')) trsHtml += `<td class="text-left">${row.zoning || ''}</td>`;
                trsHtml += `<td class="text-right font-mono">${formatNumber(displayArea)}</td>`;
                if (!state.hiddenCols.has('owner')) trsHtml += `<td class="text-left">${row.owner || ''}</td>`;
                trsHtml += `<td class="font-mono">${row.numerator} / ${row.denominator}</td><td class="text-right font-mono font-bold">${formatNumber(displayShareArea)}</td>`;
                if (!state.hiddenCols.has('remarks')) trsHtml += `<td class="text-left text-gray-500">${row.remarks || ''}</td>`;
                trsHtml += `</tr>`;
            });

            // 總計列
            const footerHtml = `
                <div class="flex justify-end text-lg mt-2 pr-2">
                    <div class="bg-gray-50 border border-gray-300 px-6 py-2 rounded shadow-sm font-bold text-gray-800">
                        總持分面積：<span class="text-2xl text-blue-800 ml-2">${formatNumber(totalShareArea)}</span> <span class="text-base font-normal">${unitSuffix}</span>
                    </div>
                </div>
            `;

            container.innerHTML = `
                ${headerHtml}
                <table class="output-table mt-4">
                    <thead><tr>${thHtml}</tr></thead>
                    <tbody>${trsHtml}</tbody>
                </table>
                ${footerHtml}
            `;
            return container;
        }

        function changeAreaMode(mode) {
            state.areaMode = mode;
            renderOutputTables();
        }

        function toggleColumn(colName, isVisible) {
            if (isVisible) state.hiddenCols.delete(colName);
            else state.hiddenCols.add(colName);
            
            applyColumnVisibility();
            renderOutputTables(); // 勾選欄位立即重繪下方報表
        }

        function applyColumnVisibility() {
            const allCols = ['district', 'subsection', 'zoning', 'owner', 'remarks'];
            allCols.forEach(col => {
                const elements = document.querySelectorAll(`.col-${col}`);
                elements.forEach(el => {
                    if (state.hiddenCols.has(col)) el.classList.add('hide-col');
                    else el.classList.remove('hide-col');
                });
            });
        }

        function initSortable() {
            new Sortable(document.getElementById('input-table-body'), {
                handle: '.drag-handle',
                animation: 150,
                onEnd: function (evt) {
                    const item = state.data.splice(evt.oldIndex, 1)[0];
                    state.data.splice(evt.newIndex, 0, item);
                    triggerUpdate();
                }
            });
        }

        function setupBeforeUnload() {
            window.addEventListener('beforeunload', (e) => {
                if (state.data.length > 1 || (state.data.length === 1 && state.data[0].section !== '')) {
                    e.preventDefault(); e.returnValue = '';
                }
            });
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `土地清冊專案_${new Date().toISOString().split('T')[0]}.json`;
            a.click(); URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) { state.data = data; triggerUpdate(); customAlert("讀取成功！"); } 
                    else customAlert("格式錯誤！");
                } catch (err) { customAlert("讀取失敗"); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // --- 匯出前防呆 ---
        function validateBeforeExport(onSuccess) {
            const hasEmpty = state.data.some(row => !row.section || !row.plot || row.area === '' || !row.owner);
            if (hasEmpty) {
                customConfirm("有部分關鍵資料（地段、地號、面積或所有權人）尚未填寫完整，確定要繼續執行嗎？", onSuccess);
            } else {
                onSuccess();
            }
        }

        function exportCSV() {
            validateBeforeExport(() => {
                let csv = "\uFEFF"; 
                const headers = ["項次", "行政區", "地段", "小段", "地號", "使用分區", "總面積(㎡)", "總面積(坪)", "所有權人", "持分", "持分面積(㎡)", "持分面積(坪)", "備註"];
                csv += headers.join(",") + "\n";

                state.data.forEach((row, idx) => {
                    const area = Number(row.area) || 0;
                    const num = Number(row.numerator) || 0;
                    const den = Number(row.denominator) || 1;
                    const share = area * (num / den);
                    
                    const rowData = [
                        idx + 1, `"${row.district || ''}"`, `"${formatSection(row.section)}"`, `"${formatSubsection(row.subsection)}"`, `="${row.plot || ''}"`,
                        `"${row.zoning || ''}"`, area, (area * PING_RATIO).toFixed(2), `"${row.owner || ''}"`,
                        `="${num}/${den}"`, share.toFixed(2), (share * PING_RATIO).toFixed(2), `"${row.remarks || ''}"`
                    ];
                    csv += rowData.join(",") + "\n";
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `土地清冊.csv`; a.click();
            });
        }

        function copyToClipboard() {
            validateBeforeExport(() => {
                // 直接擷取 Output tables 區塊的 HTML 並給予基本表格樣式
                const wrapper = document.getElementById('output-tables-wrapper');
                let html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><style>table{border-collapse:collapse;} td,th{border:1px solid #000; padding:4px;} .xl-text{mso-number-format:"\\@";}</style></head><body>';
                
                // 將輸出區塊直接轉換為可以貼入 Excel 的結構
                html += wrapper.innerHTML; 
                html += '</body></html>';

                const copyHandler = function(e) {
                    e.clipboardData.setData('text/html', html);
                    e.preventDefault();
                };
                document.addEventListener('copy', copyHandler);
                document.execCommand('copy');
                document.removeEventListener('copy', copyHandler);
                customAlert("已複製報表！可在 Excel 或 Word 貼上。");
            });
        }

        function exportImage() {
            validateBeforeExport(() => {
                // 針對下方的列印容器進行截圖，不再需要隱藏 UI
                const container = document.getElementById('print-container');
                
                html2canvas(container, {
                    scale: 2, 
                    backgroundColor: "#ffffff",
                    logging: false
                }).then(canvas => {
                    const url = canvas.toDataURL("image/png");
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `土地清冊報表_${new Date().toISOString().split('T')[0]}.png`;
                    a.click();
                }).catch(err => {
                    customAlert("截圖失敗，請稍後再試。");
                });
            });
        }

        window.onload = init;
    </script>
</body>
</html>
