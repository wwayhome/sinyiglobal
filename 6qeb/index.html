<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>營業項目編號對應台北市土管歸組</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5YQY4RT9H2');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei'; background-color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        /* Modal 動畫設定 */
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-modal { animation: modalFadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GAS_URL = "https://script.google.com/macros/s/AKfycbx0G-H3J0SSegGfDT_8lTvdqHLmB201QLATfg6l_KcCne5wfgTa8yxD0j8NtUc4pp_O/exec";

        // 萃取土管/建管歸組編號的工具函數 (已修復：強力提取引擎，不再因標點符號截斷)
        const extractGroupNumbers = (text) => {
            if (!text) return [];
            const groups = new Set();
            
            // 1. 將可能出現的全形英數字轉換為半形，避免漏抓 (如 ２２ 轉為 22，Ｂ－３ 轉為 B-3)
            const normalizedText = String(text).replace(/[\uff01-\uff5e]/g, function(ch) {
                return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
            });
            
            // 2. 直接全域掃描：抓取所有由英文、數字、橫線組成的代碼組合
            const matches = normalizedText.match(/[a-zA-Z0-9-]+/g);
            
            if (matches) {
                matches.forEach(match => {
                    const cleanMatch = match.trim().toUpperCase();
                    // 3. 防呆過濾：確保抓取出的字串「至少包含一個數字」
                    if (/\d/.test(cleanMatch)) {
                        groups.add(cleanMatch);
                    }
                });
            }
            
            return Array.from(groups);
        };

        function App() {
            const [mainData, setMainData] = useState([]);
            const [groupData, setGroupData] = useState([]);
            const [buildingData, setBuildingData] = useState([]);
            const [rulesData, setRulesData] = useState([]);
            const [extraData, setExtraData] = useState([]);
            const [conditionsData, setConditionsData] = useState([]);
            const [neihuConData, setNeihuConData] = useState([]); 
            
            const [isLoaded, setIsLoaded] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [filteredData, setFilteredData] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [showDropdown, setShowDropdown] = useState(false);
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalContent, setModalContent] = useState(null);
            
            const dropdownRef = useRef(null);

            useEffect(() => {
                function handleClickOutside(event) {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setShowDropdown(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const fetchJsonData = async (type) => {
                if (!GAS_URL) return [];
                const response = await fetch(`${GAS_URL}?type=${type}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return data;
            };

            useEffect(() => {
                const loadData = async () => {
                    try {
                        if (!GAS_URL) throw new Error("尚未設定 Google Apps Script (GAS) URL。請確認程式碼設定。");

                        const [mainRaw, groupRaw, buildingRaw, rulesRaw, extraRaw, conditionsRaw, neihuConRaw] = await Promise.all([
                            fetchJsonData('main'),
                            fetchJsonData('group').catch(e => []),
                            fetchJsonData('building').catch(e => []),
                            fetchJsonData('rules').catch(e => []),
                            fetchJsonData('extra').catch(e => []),
                            fetchJsonData('conditions').catch(e => []),
                            fetchJsonData('NeihuCon').catch(e => {
                                console.warn("T5D6內湖條件資料載入失敗", e);
                                return [];
                            })
                        ]);

                        if (!mainRaw || mainRaw.length === 0) {
                            throw new Error("讀取到的資料為空，請確認 Apps Script 權限或試算表 ID。");
                        }

                        setMainData(mainRaw);
                        setGroupData(groupRaw);
                        setBuildingData(buildingRaw);
                        setRulesData(rulesRaw);
                        setExtraData(extraRaw);
                        setConditionsData(conditionsRaw);
                        setNeihuConData(neihuConRaw); 
                        setIsLoaded(true);
                    } catch (error) {
                        console.error("載入失敗:", error);
                        setErrorMsg(`連線至資料庫時發生錯誤：\n${error.message}\n\n請確認您的 GAS API 網址是否正確。`);
                    }
                };

                loadData();
            }, []);

            const handleSearch = (e) => {
                const value = e.target.value;
                setSearchTerm(value);
                setSelectedItem(null);

                if (value.trim() === '') {
                    setFilteredData([]);
                    setShowDropdown(false);
                    return;
                }

                const upperTerm = value.toUpperCase();
                const results = mainData.filter(item => {
                    const code = item['營業項目代碼'] ? String(item['營業項目代碼']).toUpperCase() : '';
                    const name = item['營業項目'] ? String(item['營業項目']).toUpperCase() : '';
                    return code.includes(upperTerm) || name.includes(upperTerm);
                });

                setFilteredData(results);
                setShowDropdown(true);
            };

            const selectItem = (item) => {
                setSearchTerm(item['營業項目代碼']);
                setSelectedItem(item);
                setShowDropdown(false);
            };

            // 處理點擊 △ 符號的事件 (T5D5) - 完全嚴格精準比對版
            const handleConditionClick = (zone, group) => {
                if (!conditionsData || conditionsData.length === 0) {
                    alert("條件資料載入異常或為空，無法查詢。");
                    return;
                }

                const keys = Object.keys(conditionsData[0]);
                const zoneKey = keys[0];  
                const groupKey = keys[1]; 
                const cKey = keys[2] || '使用組及使用項目';
                const dKey = keys[3] || '允許使用條件';
                const eKey = keys[4] || '備註';

                const normalizeZoneStr = (str) => {
                    return str.replace(/之1/g, '之一')
                              .replace(/之2/g, '之二')
                              .replace(/之3/g, '之三')
                              .replace(/之4/g, '之四');
                };

                const matchedDetails = conditionsData.filter(item => {
                    const itemZone = String(item[zoneKey] || '').trim();
                    const itemGroup = String(item[groupKey] || '').trim();
                    
                    // 1. 將點擊的表頭 (如 "住三之一、住三之二") 切成陣列
                    const clickZones = zone.split(/[、,，\n/／|｜及與和&]+/).map(z => normalizeZoneStr(z.replace(/\s+/g, '')));
                    
                    // 2. 將 T5D5 表內的法規區 (如 "住三之一、之二") 切成陣列，並還原縮寫
                    const itemZonesRaw = itemZone.split(/[、,，\n/／|｜及與和&]+/).map(z => normalizeZoneStr(z.replace(/\s+/g, '')));
                    const itemZones = itemZonesRaw.map((z, index, arr) => {
                        // 如果有「之二」縮寫，去抓陣列前一個項目的母區 (例如從"住三之一"抓出"住三")
                        if (z.startsWith('之') && index > 0) {
                            const prev = arr[index - 1];
                            const match = prev.match(/^([商住工農].)/);
                            if (match) {
                                return match[1] + z;
                            }
                        }
                        return z;
                    });
                    
                    const zoneMatch = itemZones.some(z => {
                        const strippedZ = z.replace(/\(.*\)|\（.*\）|\[.*\]|【.*】|「.*」/g, '').trim();
                        const abbrZ = strippedZ.replace(/第一種住宅區/g, '住一')
                                             .replace(/第二種住宅區/g, '住二')
                                             .replace(/第三種住宅區/g, '住三')
                                             .replace(/第四種住宅區/g, '住四')
                                             .replace(/第一種商業區/g, '商一')
                                             .replace(/第二種商業區/g, '商二')
                                             .replace(/第三種商業區/g, '商三')
                                             .replace(/第四種商業區/g, '商四')
                                             .replace(/第二種工業區/g, '工二')
                                             .replace(/第三種工業區/g, '工三');

                        // 【嚴格精準比對】：只有在切出來的項目「完全相等」時才算符合，不再用 startsWith 模糊包容
                        return clickZones.some(cz => {
                            const strippedCz = cz.replace(/\(.*\)|\（.*\）|\[.*\]|【.*】|「.*」/g, '').trim();
                            return z === cz || strippedZ === cz || abbrZ === cz || abbrZ === strippedCz || z === strippedCz || strippedZ === strippedCz;
                        });
                    });
                    
                    const cleanGroup = String(group).replace(/第|組/g, '').trim();
                    const itemGroups = itemGroup.replace(/第|組/g, '').split(/[、,，\n/／|｜及與和&\s]+/);
                    
                    let groupMatch = false;
                    if (cleanGroup === '策略' || cleanGroup === '其他') {
                        groupMatch = itemGroups.includes(cleanGroup) || itemGroup.includes(cleanGroup);
                    } else {
                        const target = parseInt(cleanGroup, 10);
                        for (const g of itemGroups) {
                            const cleanG = g.replace(/\(.*\)|\（.*\）|\[.*\]|【.*】/g, '').trim();
                            if (cleanG === cleanGroup) {
                                groupMatch = true;
                                break;
                            }
                            const rangeMatch = cleanG.match(/^(\d+)(-|~|～|至)(\d+)$/);
                            if (rangeMatch && !isNaN(target)) {
                                const start = parseInt(rangeMatch[1], 10);
                                const end = parseInt(rangeMatch[3], 10);
                                if (target >= start && target <= end) {
                                    groupMatch = true;
                                    break;
                                }
                            }
                        }
                    }
                    
                    return zoneMatch && groupMatch;
                });

                setModalContent({
                    type: 'conditions',
                    title: '附條件允許使用說明',
                    zone,
                    group,
                    details: matchedDetails,
                    keys: { c: cKey, d: dKey, e: eKey }
                });
                setIsModalOpen(true);
            };

            const handleNeihuConClick = (group) => {
                if (!neihuConData || neihuConData.length === 0) {
                    alert("內湖科技園區附屬條件資料載入異常或為空，無法查詢。");
                    return;
                }

                const keys = Object.keys(neihuConData[0]);
                const groupKey = keys[0]; 

                const cleanGroup = String(group).replace(/第|組/g, '').trim();
                const target = parseInt(cleanGroup, 10);

                const matchedDetails = neihuConData.filter(item => {
                    const itemGroup = String(item[groupKey] || '').trim();
                    if (itemGroup === '其他') return true; 

                    const itemGroups = itemGroup.replace(/第|組/g, '').split(/[、,，\n/／|｜及與和&\s]+/);
                    
                    if (cleanGroup === '策略' || cleanGroup === '其他') {
                        return itemGroups.includes(cleanGroup) || itemGroup.includes(cleanGroup);
                    }

                    for (const g of itemGroups) {
                        const cleanG = g.replace(/\(.*\)|\（.*\）|\[.*\]|【.*】/g, '').trim();
                        if (cleanG === cleanGroup) return true;
                        
                        const rangeMatch = cleanG.match(/^(\d+)(-|~|～|至)(\d+)$/);
                        if (rangeMatch && !isNaN(target)) {
                            const start = parseInt(rangeMatch[1], 10);
                            const end = parseInt(rangeMatch[3], 10);
                            if (target >= start && target <= end) return true;
                        }
                    }
                    return false;
                });

                setModalContent({
                    type: 'neihu',
                    title: '內科附條件允許使用說明',
                    zone: '內湖科技園區',
                    group: group,
                    details: matchedDetails,
                    keys: keys 
                });
                setIsModalOpen(true);
            };

            const renderTextWithClick = (formattedText, zone, currentGroup, symbolColorClass) => {
                return formattedText.split(/(○|△|□|＃|×)/g).map((part, index) => {
                    if (part === '△') {
                        return (
                            <span 
                                key={index} 
                                onClick={() => handleConditionClick(zone, currentGroup)}
                                className={`text-lg font-bold leading-none inline-flex items-center justify-center -translate-y-[1px] cursor-pointer hover:scale-150 hover:drop-shadow-lg transition-transform relative group ${symbolColorClass}`}
                                style={{ padding: '0.1rem' }}
                            >
                                {part}
                                <span className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block w-max bg-gray-800 text-white text-xs rounded py-1.5 px-2.5 z-10 shadow-lg whitespace-nowrap font-normal" style={{ fontFamily: 'sans-serif' }}>
                                    點擊查看允許條件
                                    <svg className="absolute text-gray-800 h-2 w-full left-0 top-full" x="0px" y="0px" viewBox="0 0 255 255"><polygon className="fill-current" points="0,0 127.5,127.5 255,0"/></svg>
                                </span>
                            </span>
                        );
                    }
                    if (part === '□') {
                        return (
                            <span 
                                key={index} 
                                onClick={() => handleNeihuConClick(currentGroup)}
                                className={`text-base font-bold leading-none inline-flex items-center justify-center -translate-y-[1px] cursor-pointer hover:scale-150 hover:drop-shadow-lg transition-transform relative group ${symbolColorClass}`}
                                style={{ padding: '0.1rem' }}
                            >
                                {part}
                                <span className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block w-max bg-gray-800 text-white text-xs rounded py-1.5 px-2.5 z-10 shadow-lg whitespace-nowrap font-normal" style={{ fontFamily: 'sans-serif' }}>
                                    點擊查看內科附條件
                                    <svg className="absolute text-gray-800 h-2 w-full left-0 top-full" x="0px" y="0px" viewBox="0 0 255 255"><polygon className="fill-current" points="0,0 127.5,127.5 255,0"/></svg>
                                </span>
                            </span>
                        );
                    }
                    if (['○', '＃', '×'].includes(part)) {
                        return <span key={index} className="text-base font-bold leading-none inline-block">{part}</span>;
                    }
                    return part;
                });
            };

            const SearchIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            );

            const ExternalLinkIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-4 h-4 inline-block ml-1 text-blue-500 hover:text-blue-700 mb-0.5 transition-colors">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                </svg>
            );

            if (errorMsg) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-red-100">
                            <h1 className="text-xl font-bold text-red-600 mb-4 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                雲端連線失敗
                            </h1>
                            <p className="text-gray-600 whitespace-pre-wrap leading-relaxed bg-red-50 p-4 rounded-lg text-sm">{errorMsg}</p>
                        </div>
                    </div>
                );
            }

            if (!isLoaded) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="flex flex-col items-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                            <p className="text-gray-500 font-medium">正在連線至 API 資料庫...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto">
                    <div className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">營業項目編號對應台北市土管歸組</h1>
                        <div className="text-sm text-gray-600 bg-gray-100 inline-block px-4 py-3 rounded-md mb-2 leading-relaxed">
                            <div className="font-bold mb-1 text-gray-700">資料更新：</div>
                            <ol className="list-decimal list-inside ml-1 space-y-1">
                                <li>113.07.09 經濟部營業項目總表_對應土管歸組及歸目 <a href="https://tcooc-co.gov.taipei/Content_List.aspx?n=C359BAE6A481EB85" target="_blank" rel="noopener noreferrer" title="點擊查看原始網頁"><ExternalLinkIcon /></a></li>
                                <li>114.07.09 臺北市土地使用分區管制自治條例 <a href="https://laws.gov.taipei/Law/LawSearch/LawInformation/FL003962" target="_blank" rel="noopener noreferrer" title="點擊查看原始網頁"><ExternalLinkIcon /></a></li>
                                <li>114.07.09 臺北市土地使用分區附條件允許使用標準 <a href="https://laws.gov.taipei/Law/LawSearch/LawArticleContent/FL025529" target="_blank" rel="noopener noreferrer" title="點擊查看原始網頁"><ExternalLinkIcon /></a></li>
                                <li>111.09.22 修訂『變更臺北市「臺北內湖科技園區」(原內湖輕工業區)計畫案』土地使用規定案 <a href="https://webgis.udd.gov.taipei/book/P111035.pdf" target="_blank" rel="noopener noreferrer" title="點擊查看原始網頁"><ExternalLinkIcon /></a></li>
                                <li>97.08.05 變更臺北市『基隆河（中山橋至成美橋段）計畫案（南段地區）』及『內湖區新里族段羊稠小段附近地區都市計畫案』計畫案 <a href="https://webgis.udd.gov.taipei/book/P097013.pdf" target="_blank" rel="noopener noreferrer" title="點擊查看原始網頁"><ExternalLinkIcon /></a></li>
                            </ol>
                        </div>
                        <p className="text-xs text-gray-400 mt-1">透過 Google API 同步 | 主資料: {mainData.length} 筆</p>
                    </div>

                    <div className="relative mb-8 z-50" ref={dropdownRef}>
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <SearchIcon />
                            </div>
                            <input
                                type="text"
                                className="block w-full pl-12 pr-4 py-4 bg-white border-2 border-transparent shadow-sm rounded-xl text-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all"
                                placeholder="輸入代碼或名稱..."
                                value={searchTerm}
                                onChange={handleSearch}
                                onFocus={() => { if (searchTerm) setShowDropdown(true); }}
                            />
                        </div>

                        {showDropdown && filteredData.length > 0 && (
                            <div className="absolute w-full mt-2 bg-white rounded-xl shadow-2xl border border-gray-100 max-h-80 overflow-y-auto custom-scrollbar">
                                {filteredData.slice(0, 50).map((item, index) => (
                                    <div 
                                        key={index}
                                        className="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0 flex items-center gap-3"
                                        onClick={() => selectItem(item)}
                                    >
                                        <span className="font-mono font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded text-sm">{item['營業項目代碼']}</span>
                                        <span className="text-gray-700 font-medium">{item['營業項目']}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {selectedItem && (
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden animate-fade-in">
                            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-6 text-white">
                                <span className="bg-white/20 text-white border border-white/30 px-3 py-1 rounded-lg font-mono text-xl font-bold block mb-2 w-fit">
                                    {selectedItem['營業項目代碼']}
                                </span>
                                <h2 className="text-3xl font-extrabold">{selectedItem['營業項目']}</h2>
                            </div>

                            <div className="p-6 md:p-8">
                                {(() => {
                                    const landKey = Object.keys(selectedItem).find(k => k.includes('土管'));
                                    const landValue = landKey ? selectedItem[landKey] : null;
                                    
                                    const buildKey = Object.keys(selectedItem).find(k => k.includes('建管') || k.includes('建築'));
                                    const buildValue = buildKey ? selectedItem[buildKey] : null;

                                    let buildingDef = null;
                                    if (buildValue && buildingData.length > 0) {
                                        const bKeyName = Object.keys(buildingData[0])[0];
                                        const buildNums = extractGroupNumbers(buildValue);
                                        const defs = [];
                                        
                                        buildNums.forEach(bNum => {
                                            const matchedBItem = buildingData.find(b => String(b[bKeyName]).toUpperCase() === String(bNum));
                                            if (matchedBItem) {
                                                const defKey = Object.keys(matchedBItem).find(k => k.includes('組別定義'));
                                                if (defKey && matchedBItem[defKey]) {
                                                    defs.push(buildNums.length > 1 ? `【${bNum}】${matchedBItem[defKey]}` : matchedBItem[defKey]);

                                                                <div className="text-sm font-bold text-blue-700">{modalContent.keys.c}</div>
                                                            </div>
                                                            <div className="text-base text-gray-800 font-medium whitespace-pre-wrap pl-4 leading-relaxed">
                                                                {detail[modalContent.keys.c] || '-'}
                                                            </div>
                                                        </div>
                                                        <div className="px-5 py-4 bg-white border-b border-orange-50/50">
                                                            <div className="flex items-center gap-2 mb-2">
                                                                <div className="w-2 h-2 rounded-full bg-orange-500"></div>
                                                                <div className="text-sm font-bold text-orange-700">{modalContent.keys.d}</div>
                                                            </div>
                                                            <div className="text-base text-gray-800 whitespace-pre-wrap pl-4 leading-relaxed">
                                                                {detail[modalContent.keys.d] || '-'}
                                                            </div>
                                                        </div>
                                                        {detail[modalContent.keys.e] && String(detail[modalContent.keys.e]).trim() !== '' && (
                                                            <div className="px-5 py-4 bg-gray-50/80">
                                                                <div className="flex items-center gap-2 mb-2">
                                                                    <div className="w-2 h-2 rounded-full bg-gray-400"></div>
                                                                    <div className="text-sm font-bold text-gray-600">{modalContent.keys.e}</div>
                                                                </div>
                                                                <div className="text-sm text-gray-600 whitespace-pre-wrap pl-4 leading-relaxed">
                                                                    {detail[modalContent.keys.e]}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )
                                    ) : (
                                        <div className="text-center py-16 flex flex-col items-center">
                                            <div className="bg-gray-100 p-4 rounded-full mb-4">
                                                <svg className="w-10 h-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                            </div>
                                            <p className="text-gray-600 font-medium text-lg">目前沒有找到對應的特殊條件說明</p>
                                            <p className="text-gray-400 text-sm mt-2">無法在條件庫中匹配到相關記錄</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
