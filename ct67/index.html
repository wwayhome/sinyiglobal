<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d50">
  <title>工業地產物件查檢表</title>
  <meta name="description" content="工業地產物件查檢表線上入口">
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#183343;background:#eef3f5;font-size:18px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#123d50 0 34%,#eef3f5 34%)}
    main{width:min(100%,520px);background:#fff;border-radius:18px;padding:34px 28px;box-shadow:0 18px 50px #0b2a3830;text-align:center}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 20px;border-radius:14px;background:#123d50;color:#fff;font-size:1.5rem;font-weight:800}
    h1{font-size:1.55rem;line-height:1.45;margin:0 0 10px}p{color:#627984;line-height:1.7;margin:0 0 24px}
    a{display:flex;align-items:center;justify-content:center;min-height:56px;padding:12px 20px;border-radius:10px;background:#f2ad32;color:#2f2108;font-weight:800;text-decoration:none;box-shadow:0 4px 12px #a66a1533}
    a:focus-visible{outline:3px solid #006c78;outline-offset:3px}.status{font-size:.8rem;margin:18px 0 0}.error{color:#9a3412;background:#fff3e8;border:1px solid #f0c7a6;border-radius:10px;padding:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">工</div>
    <h1>工業地產物件查檢表</h1>
    <p>使用 Google 帳號登入後，可建立案件、自動儲存並繼續編輯。</p>
    <a id="openApp" href="#" rel="noopener">開啟查檢表</a>
    <p id="status" class="status" role="status">正在連接線上系統…</p>
  </main>
  <script src="app-config.js"></script>
  <script>
    (()=>{
      const url=String(window.CHECKLIST_CONFIG?.appScriptUrl||'').trim();
      const valid=/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url);
      const link=document.getElementById('openApp');
      const status=document.getElementById('status');
      if(!valid){
        link.hidden=true;
        status.className='status error';
        status.textContent='尚未設定 Apps Script 正式網址，請先編輯 app-config.js。';
        return;
      }
      link.href=url;
      status.textContent='即將開啟查檢表；若沒有自動前往，請按上方按鈕。';
      setTimeout(()=>location.replace(url),900);
    })();
  </script>
</body>
</html>
