<!DOCTYPE html>
<html lang="zh-TW">
<head>    
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>不動產定位與競品分析展示圖 (Leaflet 版)</title>    
    <script src="https://cdn.tailwindcss.com"></script>        
    <!-- 引入 Leaflet CSS -->    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>        
    <!-- 引入 SortableJS 實現拖曳功能 -->    
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>        
    <!-- 引入 html-to-image 替換原本的 html2canvas，完美解決排版偏移問題 -->    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>        
        /* 設定平滑捲動與移除多餘的 scrollbar */        
        html { scroll-behavior: smooth; }                
        .scrollable-panel::-webkit-scrollbar { width: 4px; }        
        .scrollable-panel::-webkit-scrollbar-track { background: transparent; }        
        .scrollable-panel::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* Leaflet 客製化圖標樣式 */        
        .custom-div-icon { background: transparent; border: none; }                
        /* 本案標記 (紅色) */        
        .marker-main {            
            background-color: #dc2626;            
            color: white;            
            font-weight: bold;            
            border-radius: 50%;            
            width: 32px !important;            
            height: 32px !important;            
            display: flex;            
            align-items: center;            
            justify-content: center;            
            border: 3px solid white;            
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);            
            position: relative;        
        }

        /* 本案懸浮文字 */        
        .marker-main::after {            
            content: attr(data-label);            
            position: absolute;            
            top: -35px;            
            left: 50%;            
            transform: translateX(-50%);            
            background-color: white;            
            color: #dc2626;            
            padding: 4px 8px;            
            border-radius: 6px;            
            border: 2px solid #dc2626;            
            font-size: 14px;            
            font-weight: 900;            
            white-space: nowrap;            
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);            
            pointer-events: none;        
        }

        /* 案例標記 (藍色) */        
        .marker-comp {            
            background-color: #2563eb;            
            color: white;            
            font-weight: bold;            
            font-size: 16px;            
            border-radius: 50%;            
            width: 32px !important;            
            height: 32px !important;            
            display: flex;            
            align-items: center;            
            justify-content: center;            
            border: 3px solid white;            
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);        
        }                
        .leaflet-popup-content-wrapper { border-radius: 0.5rem; }        
        .leaflet-popup-content { margin: 12px; font-family: inherit; }                
        
        /* 拖曳時的卡片視覺樣式 (半透明幽靈狀態) */        
        .sortable-ghost { opacity: 0.4; }                
        /* 準備對調時，目標卡片的高亮提示樣式 */        
        .sortable-swap-highlight {             
             outline: 4px dashed #3b82f6 !important;             
             outline-offset: -4px;            
            background-color: #eff6ff !important;            
            opacity: 0.8;            
            transform: scale(0.98);        
        }

        /* 拖曳中指標 */        
        .cursor-grab { cursor: -webkit-grab; cursor: grab; }        
        .cursor-grab:active { cursor: -webkit-grabbing; cursor: grabbing; }                
        
        /* 強制狀態覆蓋 */        
        .cursor-col-resize-force { cursor: col-resize !important; }        
        .select-none-force { user-select: none !important; }    
    </style>
</head>

<!-- Body 設定外部背景色。移除 margin 以防干擾置中 -->
<body class="font-sans text-slate-800 bg-slate-400 overflow-x-hidden min-h-screen m-0 p-0">

    <!-- 專屬的主容器：強制寬度 100% 且最大不超過 1600px，利用 mx-auto 達成置中效果 -->    
    <div class="mx-auto min-h-screen flex flex-col shadow-2xl relative overflow-hidden bg-slate-50 w-full" style="max-width: 1600px;">                
        
        <!-- 頂部導覽列 (固定在上方) -->        
        <header class="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-[2000] w-full">            
            <div>                
                <h1 class="text-2xl font-bold text-slate-800 tracking-wide">不動產定位與市場行情分析系統</h1>                
                <p class="text-sm text-slate-500 mt-1">在上方輸入資料，點擊按鈕即可於下方地圖呈現分析結果。</p>            
            </div>            
            <div>                
                <button onclick="scrollToMap()" class="text-blue-600 font-bold hover:text-blue-800 transition mr-4">                    
                    ↓ 前往展示區                
                </button>                
                <button onclick="generatePresentation()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-all inline-flex items-center gap-2">                    
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>                    
                    更新地圖與卡片                
                </button>            
            </div>        
        </header>

        <!-- 區塊 1: 編輯輸入區 -->        
        <section class="w-full p-6 lg:p-8 shrink-0">            
            <h2 class="text-xl font-bold text-slate-700 mb-4 border-l-4 border-blue-500 pl-3">1. 設定各案資料</h2>            
            <div id="input-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">                
                <!-- JS 動態產生 6 組輸入表單 -->            
            </div>        
        </section>

        <!-- 分隔線與按鈕區 -->        
        <div class="w-full flex justify-center py-6 bg-slate-200 shadow-inner">            
            <button onclick="generatePresentation()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-10 rounded-full shadow-lg transition-all flex items-center gap-2 text-lg transform hover:scale-105">                
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>                
                載入資料並更新下方圖表            
            </button>        
        </div>

        <!-- 區塊 2: 展示區 (16:9 版面) -->        
        <section id="map-section" class="w-full bg-slate-100 p-4 lg:p-8 flex-1 border-t border-slate-200">            
            <div class="w-full mx-auto flex flex-col items-center">                                
                <!-- 標題與截圖按鈕 (加入RWD排列，確保大螢幕完美置中) -->                
                <div class="flex flex-col xl:flex-row justify-between items-center mb-4 w-full relative gap-4">                    
                    <h2 class="text-xl font-bold text-slate-800 border-l-4 border-blue-500 pl-3 self-start xl:self-auto w-full xl:w-auto">2. 成果展示儀表板</h2>                                        
                    <!-- 地圖風格切換按鈕 -->                    
                    <div class="xl:absolute xl:left-1/2 xl:transform xl:-translate-x-1/2 flex bg-white p-1 rounded-lg shadow-sm border border-slate-200 z-10 w-full md:w-auto justify-center">                        
                        <button onclick="changeMapStyle('voyager', this)" class="map-style-btn flex-1 md:flex-none px-5 py-1.5 text-sm font-bold rounded bg-slate-800 text-white transition-colors">簡約</button>                        
                        <button onclick="changeMapStyle('osm', this)" class="map-style-btn flex-1 md:flex-none px-5 py-1.5 text-sm font-bold rounded text-slate-600 hover:bg-slate-100 transition-colors">詳細</button>                    
                    </div>
                    
                    <div class="flex items-center gap-4 self-end xl:self-auto w-full xl:w-auto justify-end">                        
                        <span class="text-sm font-bold text-slate-500 hidden md:block px-3 py-1 bg-slate-200 rounded-full">💡 可拖曳右側拉桿自訂儀表板寬度</span>                        
                        <button id="screenshot-btn" onclick="takeScreenshot()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-5 rounded-lg shadow-md flex items-center gap-2 text-sm transition-all">                            
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>                            
                            一鍵截圖下載                        
                        </button>                    
                    </div>                
                </div>                                
                
                <!-- 【外層調整容器】用來控制縮放範圍，並置中 -->                
                <div class="w-full flex justify-center relative">                                        
                    <!-- 【內部可縮放容器】寬度由拉桿控制 -->                    
                    <div id="board-container" class="relative w-full" style="max-width: 100%;">                                                
                        <!-- 儀表板實體 (截圖目標區塊) -->                        
                        <div id="presentation-board" class="flex flex-col md:flex-row gap-3 lg:gap-4 w-full relative bg-slate-100 p-2 rounded-xl">                                                        
                            
                            <!-- 左側面板 (顯示 3組) -->                            
                            <div id="left-panel" class="w-full md:w-[264px] lg:w-[312px] xl:w-[336px] flex flex-col gap-3 lg:gap-4 md:pr-1 shrink-0">                                
                                <!-- JS 動態生成純文字卡片 -->                            
                            </div>
                            
                            <!-- 中間地圖區 -->                            
                            <div class="flex-1 bg-white rounded-2xl shadow-lg overflow-hidden relative flex flex-col min-h-[400px] border border-slate-300">                                
                                <!-- Leaflet 地圖容器 -->                                
                                <div id="map" class="absolute inset-0 z-10 bg-slate-100 transition-colors duration-500"></div>                                                                
                                
                                <!-- 載入中遮罩 -->                                
                                <div id="loading-overlay" class="hidden absolute inset-0 bg-white/90 z-[1000] flex flex-col items-center justify-center">                                    
                                    <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>                                    
                                    <p class="text-slate-800 font-bold text-lg">正在解析地址並定位...</p>                                    
                                    <p class="text-sm text-slate-500 mt-2">ArcGIS 免費服務</p>                                
                                </div>                            
                            </div>
                            
                            <!-- 右側面板 (顯示 3組) -->                            
                            <div id="right-panel" class="w-full md:w-[264px] lg:w-[312px] xl:w-[336px] flex flex-col gap-3 lg:gap-4 md:pl-1 shrink-0">                                
                                <!-- JS 動態生成純文字卡片 -->                            
                            </div>

                        </div>                                                
                        
                        <!-- 垂直調整拉桿 -->                        
                        <div id="resizer-handle" class="hidden md:flex absolute top-1/2 -right-4 transform -translate-y-1/2 w-6 h-20 bg-white border-2 border-slate-300 hover:border-blue-500 hover:bg-blue-50 cursor-col-resize flex flex-col gap-1.5 items-center justify-center rounded-md shadow-[0_0_10px_rgba(0,0,0,0.1)] z-[2000] transition-colors" title="左右拖曳調整寬度">                            
                            <div class="w-1 h-1.5 bg-slate-400 rounded-full pointer-events-none"></div>                            
                            <div class="w-1 h-1.5 bg-slate-400 rounded-full pointer-events-none"></div>                            
                            <div class="w-1 h-1.5 bg-slate-400 rounded-full pointer-events-none"></div>                        
                        </div>
                    </div>                
                </div>
            </div>        
        </section>            
    </div> <!-- /主容器 -->

    <!-- 引入 Leaflet JS -->    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>        
        // 資料結構與初始值 (擴充為 6 個資料欄位)        
        const propertyData = [            
            { id: 0, type: 'main', title: '本案', label: '本案位置', name: '信義首席', address: '台北市信義區市府路1號', area_name: '面積', area: '55 坪', zoning_name: '分區', zoning: '商三', price_name: '總價', price: '1.2 億', c1_name: '單價', c1_val: '218 萬/坪', c2_name: '年月', c2_val: '112/05', c3_name: '買方', c3_val: '法人' },            
            { id: 1, type: 'comp', title: '案例 1', label: '1', name: '松高苑', address: '台北市信義區松高路11號', area_name: '面積', area: '48 坪', zoning_name: '分區', zoning: '住三', price_name: '總價', price: '9,800 萬', c1_name: '單價', c1_val: '204 萬/坪', c2_name: '年月', c2_val: '111/08', c3_name: '買方', c3_val: '自然人' },            
            { id: 2, type: 'comp', title: '案例 2', label: '2', name: '信義之星', address: '台北市信義區松智路17號', area_name: '面積', area: '60 坪', zoning_name: '分區', zoning: '商二', price_name: '總價', price: '1.5 億', c1_name: '單價', c1_val: '250 萬/坪', c2_name: '年月', c2_val: '112/11', c3_name: '買方', c3_val: '外資' },            
            { id: 3, type: 'comp', title: '案例 3', label: '3', name: '', address: '', area_name: '面積', area: '', zoning_name: '分區', zoning: '', price_name: '總價', price: '', c1_name: '單價', c1_val: '', c2_name: '年月', c2_val: '', c3_name: '買方', c3_val: '' },            
            { id: 4, type: 'comp', title: '案例 4', label: '4', name: '', address: '', area_name: '面積', area: '', zoning_name: '分區', zoning: '', price_name: '總價', price: '', c1_name: '單價', c1_val: '', c2_name: '年月', c2_val: '', c3_name: '買方', c3_val: '' },            
            { id: 5, type: 'comp', title: '案例 5', label: '5', name: '', address: '', area_name: '面積', area: '', zoning_name: '分區', zoning: '', price_name: '總價', price: '', c1_name: '單價', c1_val: '', c2_name: '年月', c2_val: '', c3_name: '買方', c3_val: '' },        
        ];

        let map = null;        
        let markerLayerGroup = null;        
        let currentTileLayer = null; 

        // 兩種地圖風格的圖磚來源        
        const mapStyles = {            
            voyager: {                
                url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',                
                attr: '&copy; OSM contributors',                
                className: ''            
            },            
            osm: {                
                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',                
                attr: '&copy; OSM contributors',                
                className: ''            
            }        
        };

        // 頁面載入時初始化所有元件        
        document.addEventListener("DOMContentLoaded", () => {            
            renderInputForm();            
            renderDisplayCards();            
            initMap();            
            updateMapMarkers();             
            initResizer();         
        });

        function scrollToMap() {            
            document.getElementById('map-section').scrollIntoView({ behavior: 'smooth' });        
        }

        // 產生輸入表單 HTML        
        function renderInputForm() {            
            const grid = document.getElementById('input-grid');            
            grid.innerHTML = '';                        
            
            propertyData.forEach(data => {                
                const isMain = data.type === 'main';                
                const headerColor = isMain ? 'bg-red-50 border-red-200 text-red-800' : 'bg-white border-slate-200 text-slate-800';                
                const badgeColor = isMain ? 'bg-red-600' : 'bg-blue-600';

                // 在本案的標題列右側加入「一鍵複製標題」按鈕                
                const copyButtonHtml = isMain ?                     
                    `<button onclick="copyTitlesToAll(this)" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-bold px-2 py-1 rounded shadow-sm border border-red-200 transition-all flex items-center gap-1" title="將此案的6個屬性標題同步至其他案例">                        
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>                        
                        複製標題至全案                    
                    </button>` : '';

                grid.innerHTML += `                    
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col transition hover:shadow-md">                        
                        <div class="${headerColor} px-4 py-3 border-b flex justify-between items-center">                            
                            <span class="font-bold flex items-center gap-2 text-lg">                                
                                <span class="${badgeColor} text-white text-sm w-6 h-6 flex items-center justify-center rounded-full shadow-inner">${isMain ? '★' : data.label}</span>                                
                                ${data.title}                            
                            </span>                            
                            ${copyButtonHtml}                        
                        </div>                        
                        <div class="p-5 flex flex-col gap-4 text-sm bg-slate-50">                            
                            <div class="grid grid-cols-2 gap-3">                                
                                <div class="col-span-2">                                    
                                    <label class="block text-xs font-bold text-slate-500 mb-1">案名</label>                                    
                                    <input type="text" id="in-name-${data.id}" value="${data.name}" class="w-full border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">                                
                                </div>                                
                                <div class="col-span-2">                                    
                                    <label class="block text-xs font-bold text-slate-500 mb-1">地址或座標 (緯度,經度)</label>                                    
                                    <input type="text" id="in-address-${data.id}" value="${data.address}" class="w-full border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">                                
                                </div>                                
                                <div class="col-span-2 flex gap-2">                                    
                                    <input type="text" id="in-area-name-${data.id}" value="${data.area_name || '面積'}" class="w-1/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-100 text-slate-600 font-medium" placeholder="面積">                                    
                                    <input type="text" id="in-area-${data.id}" value="${data.area}" class="w-2/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" placeholder="內容">                                
                                </div>                                
                                <div class="col-span-2 flex gap-2">                                    
                                    <input type="text" id="in-zoning-name-${data.id}" value="${data.zoning_name || '分區'}" class="w-1/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-100 text-slate-600 font-medium" placeholder="分區">                                    
                                    <input type="text" id="in-zoning-${data.id}" value="${data.zoning}" class="w-2/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" placeholder="內容">                                
                                </div>                                
                                <div class="col-span-2 flex gap-2">                                    
                                    <input type="text" id="in-price-name-${data.id}" value="${data.price_name || '總價'}" class="w-1/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-100 text-slate-600 font-medium" placeholder="總價">                                    
                                    <input type="text" id="in-price-${data.id}" value="${data.price}" class="w-2/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" placeholder="內容">                                
                                </div>                                
                                <div class="col-span-2 flex gap-2">                                    
                                    <input type="text" id="in-c1name-${data.id}" value="${data.c1_name || '單價'}" class="w-1/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-100 text-slate-600 font-medium" placeholder="單價">                                    
                                    <input type="text" id="in-c1val-${data.id}" value="${data.c1_val}" class="w-2/3 border border-slate-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" placeholder="內容">                                
                                </div>

        // 初始化拖曳功能 (SortableJS)        
        let leftSortable, rightSortable;        
        function initDragAndDrop() {            
            const leftPanel = document.getElementById('left-panel');            
            const rightPanel = document.getElementById('right-panel');

            if (leftSortable) leftSortable.destroy();            
            if (rightSortable) rightSortable.destroy();

            const sortableOptions = {                
                group: 'sharedCards',                
                animation: 150,                
                swap: true,                 
                swapClass: 'sortable-swap-highlight',                 
                ghostClass: 'sortable-ghost',                
                delay: 50,                
                delayOnTouchOnly: true            
            };

            leftSortable = new Sortable(leftPanel, sortableOptions);            
            rightSortable = new Sortable(rightPanel, sortableOptions);        
        }

        // 一鍵複製本案標題至所有案例

            // 取得本案(id=0)的6個標題值

            const zoningName = document.getElementById('in-zoning-name-0').value;            
            const priceName = document.getElementById('in-price-name-0').value;            
            const c1Name = document.getElementById('in-c1name-0').value;            
            const c2Name = document.getElementById('in-c2name-0').value;            
            const c3Name = document.getElementById('in-c3name-0').value;

            }, 1500);        
        }

        // 格式化座標字串，自動控制在小數點後 6 位        
        function formatCoordinateString(input) {            
            if (!input) return input;            
            const parts = input.split(',');            
            if (parts.length === 2) {                
                const lat = parseFloat(parts[0].trim());                
                const lng = parseFloat(parts[1].trim());                
                if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {                    
                    // 使用 Number() 去除多餘的結尾 0                    
                    const formatNum = (num) => Number(num.toFixed(6));                    
                    return `${formatNum(lat)}, ${formatNum(lng)}`;                
                }            
            }            
            return input;        
        }

        // 按下更新按鈕的動作        
        async function generatePresentation() {            
            propertyData.forEach(data => {                
                data.name = document.getElementById(`in-name-${data.id}`).value;                                
                
                // 讀取地址時，先過濾並格式化座標(如果輸入是座標)                
                const rawAddress = document.getElementById(`in-address-${data.id}`).value;                
                data.address = formatCoordinateString(rawAddress);                
                // 同步更新回輸入框，讓使用者看到已經被格式化                
                document.getElementById(`in-address-${data.id}`).value = data.address;

                data.area_name = document.getElementById(`in-area-name-${data.id}`).value;                
                data.area = document.getElementById(`in-area-${data.id}`).value;                
                data.zoning_name = document.getElementById(`in-zoning-name-${data.id}`).value;                
                data.zoning = document.getElementById(`in-zoning-${data.id}`).value;                
                data.price_name = document.getElementById(`in-price-name-${data.id}`).value;                
                data.price = document.getElementById(`in-price-${data.id}`).value;                
                data.c1_name = document.getElementById(`in-c1name-${data.id}`).value;                
                data.c1_val = document.getElementById(`in-c1val-${data.id}`).value;                
                data.c2_name = document.getElementById(`in-c2name-${data.id}`).value;                
                data.c2_val = document.getElementById(`in-c2val-${data.id}`).value;

            document.getElementById('loading-overlay').classList.remove('hidden');

        // ----------------------------------------------------        
        // 拉桿縮放畫面功能 (Resizer)        
        // ----------------------------------------------------        
        function initResizer() {            
            const resizerHandle = document.getElementById('resizer-handle');            
            const boardContainer = document.getElementById('board-container');            
            let isResizing = false;

            if (resizerHandle) {                
                resizerHandle.addEventListener('mousedown', (e) => {                    
                    isResizing = true;                    
                    // 加入強制覆寫 class 以避免滑鼠樣式在移動中亂跳                    
                    document.body.classList.add('cursor-col-resize-force', 'select-none-force');                    
                    e.preventDefault();                
                });

                window.addEventListener('mousemove', (e) => {                    
                    if (!isResizing) return;                                        
                    
                    // 因為儀表板是置中的，計算滑鼠與父容器中心的距離                    
                    const parentRect = boardContainer.parentElement.getBoundingClientRect();                    
                    const parentCenter = parentRect.left + (parentRect.width / 2);                                        
                    let halfWidth = e.clientX - parentCenter;                    
                    let newWidth = halfWidth * 2;                                        
                    
                    // 限制最小寬度為 800px，最大不超過父容器 100%                    
                    if (newWidth < 800) newWidth = 800;                    
                    if (newWidth > parentRect.width) newWidth = parentRect.width;

                    boardContainer.style.width = newWidth + 'px';                                        
                    
                    // 觸發地圖大小更新避免破圖                    
                    if (map) {                        
                        map.invalidateSize();                    
                    }                
                });

                window.addEventListener('mouseup', () => {                    
                    if (isResizing) {                        
                        isResizing = false;                        
                        document.body.classList.remove('cursor-col-resize-force', 'select-none-force');                        
                        if (map) map.invalidateSize();                    
                    }                
                });            
            }        
        }

        // ----------------------------------------------------        
        // Leaflet.js 地圖核心邏輯        
        // ----------------------------------------------------

        function initMap() {            
            map = L.map('map', {                
                zoomControl: true,                
                attributionControl: true            
            }).setView([25.033964, 121.564468], 14);

            // 預設加入簡約風格 (voyager)            
            currentTileLayer = L.tileLayer(mapStyles.voyager.url, {                
                attribution: mapStyles.voyager.attr,                
                subdomains: 'abcd',                
                maxZoom: 20,                
                crossOrigin: true            
            }).addTo(map);

            markerLayerGroup = L.featureGroup().addTo(map);                        
            
            setTimeout(() => { map.invalidateSize(); }, 200);        
        }

        // 切換地圖風格的功能        
        function changeMapStyle(styleKey, btn) {            
            // 1. 更新所有按鈕的外觀 (取消選取狀態)            
            document.querySelectorAll('.map-style-btn').forEach(el => {                
                el.classList.remove('bg-slate-800', 'text-white');                
                el.classList.add('text-slate-600', 'hover:bg-slate-100');            
            });            
            
            // 2. 讓被點擊的按鈕呈現選取狀態 (深底白字)            
            btn.classList.add('bg-slate-800', 'text-white');            
            btn.classList.remove('text-slate-600', 'hover:bg-slate-100');

            // 3. 設定地圖背景色為淺灰底色            
            document.getElementById('map').style.backgroundColor = '#f1f5f9';

            // 4. 移除舊圖層，加入新圖層            
            if (currentTileLayer) {                
                map.removeLayer(currentTileLayer);            
            }                        
            
            currentTileLayer = L.tileLayer(mapStyles[styleKey].url, {                
                attribution: mapStyles[styleKey].attr,                
                subdomains: 'abcd',                
                maxZoom: 20,                
                crossOrigin: true,                
                className: mapStyles[styleKey].className || ''            
            }).addTo(map);        
        }

        function parseLatLng(input) {            
            const parts = input.split(',');            
            if (parts.length === 2) {                
                const lat = parseFloat(parts[0].trim());                
                const lng = parseFloat(parts[1].trim());                
                if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {                    
                    return [lat, lng];                
                }            
            }            
            return null;        
        }

        async function geocodeAddress(address) {            
            if (!address || address === '-') return null;                        
            const latLng = parseLatLng(address);            
            if (latLng) return latLng;                        
            
            try {                
                const url = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&singleLine=${encodeURIComponent(address)}&maxLocations=1`;                
                const response = await fetch(url);                
                if (!response.ok) return null;                
                const data = await response.json();                                
                
                if (data && data.candidates && data.candidates.length > 0) {                    
                    return [parseFloat(data.candidates[0].location.y), parseFloat(data.candidates[0].location.x)];                
                }                
                return null;            
            } catch (error) {                
                console.error("Geocoding 發生錯誤:", error);                
                return null;            
            }        
        }

        async function updateMapMarkers() {            
            markerLayerGroup.clearLayers();            
            let validPointsCount = 0;

            for (const data of propertyData) {                
                if (!data.address.trim() || data.address === '-') continue;

                const location = await geocodeAddress(data.address);                                
                
                if (location) {                    
                    const isMain = data.type === 'main';                                        
                    
                    const customIcon = L.divIcon({                        
                        className: 'custom-div-icon',                        
                        html: `<div class="${isMain ? 'marker-main' : 'marker-comp'}" data-label="${data.label}">${isMain ? '★' : data.label}</div>`,                        
                        iconSize: [32, 32],                        
                        iconAnchor: [16, 16],                        
                        popupAnchor: [0, -16]                    
                    });

                    const marker = L.marker(location, { icon: customIcon });                    
                    // 地圖 Popup 的地址也使用 truncate 強制單行                    
                    const popupContent = `<div class="font-bold p-1 ${isMain ? 'text-red-700' : 'text-blue-700'} text-base">${isMain ? '★ ' : ''}${data.name || data.title}</div><div class="text-xs text-gray-500 px-1 pb-1 truncate" title="${data.address}">${data.address}</div>`;                    
                    marker.bindPopup(popupContent);

                    markerLayerGroup.addLayer(marker);                    
                    validPointsCount++;

                    await new Promise(resolve => setTimeout(resolve, 200));                
                }            
            }

            if (validPointsCount > 0) {                
                const bounds = markerLayerGroup.getBounds();                
                if (validPointsCount > 1) {                    
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });                
                } else {                    
                    map.setView(bounds.getCenter(), 16);                
                }            
            }        
        }    
    </script>
