<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6 relative overflow-x-hidden">

    <!-- ==================== 登入驗證畫面 ==================== -->
    <div id="login-screen" class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 text-center transition-all duration-500">
        <div class="mb-6 flex justify-center">
            <div class="p-4 bg-blue-100 text-blue-600 rounded-full">

            </div>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2">安全驗證</h2>
        <p class="text-gray-500 mb-8">請輸入系統密碼以進入工具</p>
        
        <div class="space-y-4">
            <div class="relative w-full">
                <input type="password" id="pwd-input" maxlength="8" 
                       class="w-full px-5 py-3 text-center text-2xl tracking-[0.5em] font-mono border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all"
                       placeholder="••••••••"
                       onkeypress="if(event.key === 'Enter') checkPassword()">
                
                <!-- 顯示/隱藏密碼的眼睛按鈕 -->
                <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-blue-500 focus:outline-none transition-colors">
                    <i id="eye-icon" data-lucide="eye" class="w-6 h-6"></i>
                    <i id="eye-off-icon" data-lucide="eye-off" class="w-6 h-6 hidden"></i>
                </button>
            </div>
            
            <p id="error-msg" class="text-red-500 text-sm font-bold opacity-0 transition-opacity">密碼錯誤或驗證失敗！</p>
            
            <button id="login-btn" onclick="checkPassword()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-1">
                進入系統
            </button>
        </div>
    </div>

    <!-- ==================== 系統主畫面 (預設隱藏) ==================== -->

        </header>

        <!-- 四大分類網格 -->

                <div class="flex flex-col gap-3 p-5">

                        <div class="p-2.5 bg-blue-100 text-blue-600 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-sm">

                    <a href="https://wwayhome.github.io/sinyiglobal/6qeb/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-indigo-50 border border-transparent hover:border-indigo-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-indigo-100 text-indigo-600 rounded-xl group-hover:bg-indigo-600 group-hover:text-white transition-colors shadow-sm">

                        </div>

                    </a>
                    <a href="https://wwayhome.github.io/sinyiglobal/tv2s/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-teal-50 border border-transparent hover:border-teal-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-teal-100 text-teal-600 rounded-xl group-hover:bg-teal-600 group-hover:text-white transition-colors shadow-sm">

                    </a>
                </div>
            </div>

            <!-- 3. 圖像類 -->
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all flex flex-col overflow-hidden">
                <div class="flex items-center gap-3 p-4 bg-amber-500 text-white">

                    <h2 class="text-xl font-extrabold text-white">圖像類</h2>
                </div>
                <div class="flex flex-col gap-3 p-5">
                    <a href="https://wwayhome.github.io/sinyiglobal/ucng/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-amber-50 border border-transparent hover:border-amber-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-amber-100 text-amber-600 rounded-xl group-hover:bg-amber-500 group-hover:text-white transition-colors shadow-sm">
                            <i data-lucide="image" class="w-6 h-6"></i>
                        </div>
                        <span class="ml-4 text-lg font-bold text-gray-700 group-hover:text-amber-700 tracking-wide">照片修圖</span>
                    </a>
                    <a href="https://wwayhome.github.io/sinyiglobal/ad94/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-cyan-50 border border-transparent hover:border-cyan-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-cyan-100 text-cyan-600 rounded-xl group-hover:bg-cyan-600 group-hover:text-white transition-colors shadow-sm">
                            <i data-lucide="pen-tool" class="w-6 h-6"></i>
                        </div>
                        <span class="ml-4 text-lg font-bold text-gray-700 group-hover:text-cyan-700 tracking-wide">案例製圖</span>
                    </a>
                    <a href="https://wwayhome.github.io/sinyiglobal/rm88/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-pink-50 border border-transparent hover:border-pink-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-pink-100 text-pink-600 rounded-xl group-hover:bg-pink-600 group-hover:text-white transition-colors shadow-sm">
                            <i data-lucide="palette" class="w-6 h-6"></i>
                        </div>
                        <span class="ml-4 text-lg font-bold text-gray-700 group-hover:text-pink-700 tracking-wide">地圖編輯</span>
                    </a>
                </div>
            </div>

            <!-- 4. 文書類 -->
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 hover:shadow-xl transition-all flex flex-col overflow-hidden">
                <div class="flex items-center gap-3 p-4 bg-red-500 text-white">
                    <i data-lucide="folder-open" class="w-6 h-6 text-white"></i>
                    <h2 class="text-xl font-extrabold text-white">文書類</h2>
                </div>
                <div class="flex flex-col gap-3 p-5">
                    <a href="https://wwayhome.github.io/sinyiglobal/wr3b/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-red-50 border border-transparent hover:border-red-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-red-100 text-red-600 rounded-xl group-hover:bg-red-600 group-hover:text-white transition-colors shadow-sm flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">

                                <path d="M14 2v4a2 2 0 0 0 2 2h4" />

                            </svg>
                        </div>
                        <span class="ml-4 text-lg font-bold text-gray-700 group-hover:text-red-700 tracking-wide">PDF調整</span>
                    </a>
                    <a href="https://wwayhome.github.io/sinyiglobal/g7de/" target="_blank" class="group flex items-center p-3 px-4 rounded-2xl hover:bg-lime-50 border border-transparent hover:border-lime-100 transition-all cursor-pointer">
                        <div class="p-2.5 bg-lime-100 text-lime-600 rounded-xl group-hover:bg-lime-600 group-hover:text-white transition-colors shadow-sm">

                        </div>

                    </a>
                </div>

        </main>

        <!-- 扁平化頁尾設計，減少垂直佔用 -->
        <footer class="mt-10 mb-2 w-full flex flex-col sm:flex-row items-center justify-between text-gray-400 text-sm px-6 border-t border-gray-200 pt-5 gap-4">
            <div>&copy; 2026 Sinyi Global Portal. All rights reserved.</div>
            <div class="flex items-center gap-5">
                <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fwwayhome.github.io%2Fsinyiglobal&label=%E7%80%8F%E8%A6%BD%E4%BA%BA%E6%AC%A1&countColor=%233B82F6" alt="Visitor Count" class="h-[29px] rounded opacity-80 shadow-sm">
                <button onclick="logout()" class="text-blue-500 hover:text-blue-600 hover:underline font-bold flex items-center gap-2 transition-colors text-[17px]">
                    <i data-lucide="log-out" class="w-5 h-5"></i>登出系統
                </button>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showMainContent(false);
            }
        });

        // 切換密碼顯示狀態的邏輯
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('pwd-input');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                pwdInput.type = 'password';
                eyeOffIcon.classList.add('hidden');
                eyeIcon.classList.remove('hidden');
            }
        }

        function checkPassword() {
            const pwdInput = document.getElementById('pwd-input');
            const pwd = pwdInput.value;
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            if (!pwd) return;

            const originalText = loginBtn.innerText;
            loginBtn.innerText = "驗證中...";
            loginBtn.disabled = true;

            const API_URL = "https://script.google.com/macros/s/AKfycbwHe4uzatjxrUjIywi7boX5yH_WM3E_TdNsCh4gKTu1W_RajWAFTTRRbLKnMNCysQftOQ/exec"; 
            
            fetch(`${API_URL}?pwd=${pwd}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loginSuccess();
                    } else {
                        showError();
                    }
                })
                .catch((error) => {
                    console.error("驗證服務發生錯誤:", error);
                    showError();
                })
                .finally(() => {
                    loginBtn.innerText = originalText;
                    loginBtn.disabled = false;
                });

            function loginSuccess() {
                sessionStorage.setItem('isLoggedIn', 'true');
                errorMsg.classList.add('opacity-0');
                showMainContent(true);
            }

            function showError() {
                errorMsg.classList.remove('opacity-0');
                errorMsg.classList.add('opacity-100');
                pwdInput.value = "";
                pwdInput.focus();
            }
        }

        function showMainContent(animate) {
            const loginScreen = document.getElementById('login-screen');
            const mainContent = document.getElementById('main-content');
            
            if (animate) {
                loginScreen.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    mainContent.classList.add('flex');
                    setTimeout(() => {
                        mainContent.classList.remove('opacity-0');
                        mainContent.classList.add('opacity-100');
                    }, 50);
                }, 300);
            } else {
                loginScreen.classList.add('hidden');
                mainContent.classList.remove('hidden', 'opacity-0');
                mainContent.classList.add('flex', 'opacity-100');
            }
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }
    </script>
</body>
</html>
