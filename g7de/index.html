
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易專案甘特圖 (進階關聯版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
        <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YQY4RT9H2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5YQY4RT9H2');
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hidden { display: none !important; }
        
        /* 避免拖曳時文字被選取 */
        .task-row { user-select: none; }
        .resize-handle { touch-action: none; }
        .drag-handle { touch-action: none; }
        
        /* 拖曳時的視覺回饋指示線 */
        .drag-over-top {
            box-shadow: inset 0 2px 0 0 #3b82f6 !important;
            background-color: #eff6ff !important; /* bg-blue-50 */
        }
        .drag-over-bottom {
            box-shadow: inset 0 -2px 0 0 #3b82f6 !important;
            background-color: #eff6ff !important;
        }

        /* 進階版連線 */
        .dependency-line {
            stroke-dasharray: 4;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 relative min-h-screen">

    <!-- 自訂訊息提示框 -->
    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
        <span id="message-text" class="text-sm font-medium">訊息</span>
    </div>

    <!-- 自訂確認對話框 -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 z-[200] flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-200" id="confirm-modal-content">
            <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                確認載入範本？
            </h3>
            <p class="text-sm text-slate-500 mb-4">載入範本將會完全覆蓋目前的專案資料，確定要繼續嗎？</p>
            
            <div class="mb-6">
                <label class="block text-xs font-medium text-slate-700 mb-1">請設定專案起算日</label>
                <input type="date" id="modal-start-date" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-700 shadow-sm">
            </div>

            <div class="flex gap-3">
                <button id="btn-confirm-cancel" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2.5 rounded-lg transition-colors text-sm">取消</button>
                <button id="btn-confirm-ok" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg transition-colors shadow-sm text-sm">確定載入</button>
            </div>
        </div>
    </div>

    <!-- 刪除前置任務的銜接選擇對話框 -->
    <div id="delete-dependency-modal" class="fixed inset-0 bg-slate-900/50 z-[210] flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-200" id="delete-dependency-modal-content">
            <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                刪除前置任務？
            </h3>
            <p id="delete-dependency-message" class="text-sm text-slate-500 mb-4"></p>
            <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-lg p-3 mb-5">
                銜接會讓後續任務改以前一個任務為前置，並依目前 Lag 重新排程；維持原地會清除前置關聯但保留目前日期。
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button id="btn-delete-cancel" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2.5 rounded-lg transition-colors text-sm">取消</button>
                <button id="btn-delete-keep" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-medium p-2.5 rounded-lg transition-colors text-sm">維持原地</button>
                <button id="btn-delete-reconnect" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2.5 rounded-lg transition-colors shadow-sm text-sm truncate">銜接前一個</button>
            </div>
        </div>
    </div>

    <!-- 編輯任務的 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-200" id="edit-modal-content">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                編輯工作項目
            </h3>
            <form id="edit-task-form" class="space-y-4">
                <input type="hidden" id="edit-task-id">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">選擇類別</label>
                    <select id="edit-task-category" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">工作項目名稱</label>
                    <input type="text" id="edit-task-name" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                
                <!-- 簡易模式欄位 -->
                <div class="grid grid-cols-2 gap-4 edit-simple-fields">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">開始日期</label>
                        <input type="date" id="edit-task-start" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">結束日期</label>
                        <input type="date" id="edit-task-end" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-700">
                    </div>
                </div>

                <!-- 進階模式欄位 -->
                <div class="space-y-4 edit-advanced-fields hidden">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">前置任務 (依賴關係)</label>
                        <select id="edit-task-predecessor" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-700">
                            <option value="">無前置任務 (手動設定起始)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate" title="等前置任務完成後，延遲幾天開始">延遲天數 (Lag)</label>
                            <input type="number" id="edit-task-lag" value="0" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-700">
                            <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">0=隔天開始，-1=重疊 1 天，1=空 1 天</p>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate">工期天數 (Duration)</label>
                            <input type="number" id="edit-task-duration" min="1" value="1" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-700">
                        </div>
                    </div>
                    <div id="edit-advanced-start-wrapper" class="hidden">
                        <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate text-amber-600">無前置任務時，需指定開始日期</label>
                        <input type="date" id="edit-task-adv-start" class="w-full border border-amber-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none text-sm text-slate-700">
                    </div>
                </div>

                <div class="flex gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium p-2.5 rounded-lg transition-colors text-sm">取消</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg transition-colors shadow-sm text-sm">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 拖曳提示浮動視窗 -->
    <div id="drag-tooltip" class="fixed z-[300] bg-slate-900/90 text-white text-xs font-medium px-3 py-1.5 rounded-lg pointer-events-none hidden shadow-lg whitespace-nowrap transform -translate-x-1/2 -translate-y-4 transition-none mt-[-10px]">
    </div>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 標題與工具列 -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 12 12 17 22 12"></polyline><polyline points="2 17 12 22 22 17"></polyline></svg>
                    專案甘特圖 <span id="mode-badge" class="ml-2 px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-500 uppercase">簡易版</span>
                </h1>
                <p class="text-sm text-slate-500 mt-1" id="mode-desc">手動拖曳調整日期，一鍵產出精美進度表</p>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- 簡易 / 進階 模式切換 -->
                <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button id="btn-mode-simple" class="text-sm px-3 py-1.5 rounded-md font-medium transition-colors bg-white shadow text-blue-600" onclick="switchAppMode('simple')">簡易模式</button>
                    <button id="btn-mode-advanced" class="text-sm px-3 py-1.5 rounded-md font-medium transition-colors text-slate-500 hover:text-slate-800" onclick="switchAppMode('advanced')">進階排程</button>
                </div>

                <div class="w-px h-6 bg-slate-200 mx-1 hidden sm:block"></div>

                <div class="flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white p-1 shadow-sm" title="檔案操作">
                    <button id="btn-import" class="flex items-center gap-1.5 bg-slate-600 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg font-medium transition-colors text-sm" title="讀取先前儲存的專案檔 (.json)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        讀取專案
                    </button>
                    <button id="btn-save" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium transition-colors text-sm" title="將目前專案存為檔案，以便日後繼續編輯">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        儲存專案
                    </button>
                </div>
                
                <select id="template-select" class="text-sm border border-slate-200 text-slate-600 rounded-md px-3 py-2 bg-white hover:bg-slate-50 transition-colors cursor-pointer outline-none focus:ring-2 focus:ring-blue-500 shadow-sm font-medium">
                    <option value="" disabled selected>📂 載入範本...</option>
                </select>
            </div>
        </div>

        <!-- 快速輸入區與自訂類別區 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                    <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg>
                        快速新增工作項目
                    </h2>
                    
                    <!-- 簡易模式的輸入切換 (進階模式隱藏) -->
                    <div id="simple-input-toggles" class="flex items-center gap-4 bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                        <label class="flex items-center gap-1.5 text-xs font-medium cursor-pointer text-slate-600">
                            <input type="radio" name="input-mode" value="absolute" checked class="accent-blue-600" onchange="toggleInputMode()"> 絕對日期
                        </label>
                        <label class="flex items-center gap-1.5 text-xs font-medium cursor-pointer text-slate-600">
                            <input type="radio" name="input-mode" value="relative" class="accent-blue-600" onchange="toggleInputMode()"> 相對天數
                        </label>
                    </div>
                </div>

                <form id="add-task-form" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-slate-500 mb-1">選擇類別</label>
                        <select id="task-category" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm"></select>
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-xs font-medium text-slate-500 mb-1">工作項目名稱</label>
                        <input type="text" id="task-name" placeholder="例如：項目1" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                    </div>

                    <!-- 簡易模式輸入區塊 -->
                    <div id="simple-inputs-area" class="md:col-span-5 relative">
                        <!-- 絕對日期區塊 -->
                        <div id="absolute-inputs" class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">開始日期</label>
                                <input type="date" id="task-start" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">結束日期</label>
                                <input type="date" id="task-end" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 text-sm">
                            </div>
                        </div>

                        <!-- 相對天數區塊 -->
                        <div id="relative-inputs" class="grid grid-cols-3 gap-2 hidden">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate" title="專案起算日">專案起算日</label>
                                <input type="date" id="proj-start-date" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 text-sm px-1">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate" title="第幾天開始">第幾天開始</label>
                                <input type="number" id="task-offset" min="1" value="1" placeholder="1" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate" title="工期(需要天數)">工期(天)</label>
                                <input type="number" id="task-duration" min="1" value="5" placeholder="5" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 進階模式輸入區塊 (隱藏) -->
                    <div id="advanced-inputs-area" class="md:col-span-5 grid grid-cols-3 gap-2 hidden">
                        <div class="col-span-1">
                            <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate">前置任務</label>
                            <select id="task-predecessor" class="w-full border border-indigo-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-indigo-50" onchange="toggleAdvStart()">
                                <option value="">無前置</option>
                            </select>
                        </div>
                        <div class="col-span-1" id="adv-start-container">
                            <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate text-amber-600">手動開始日</label>
                            <input type="date" id="task-adv-start" class="w-full border border-amber-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none text-slate-700 text-sm px-1">
                        </div>
                        <div class="col-span-1 hidden" id="adv-lag-container">
                            <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate">延遲天數</label>
                            <input type="number" id="task-adv-lag" value="0" class="w-full border border-indigo-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-indigo-50">
                            <p class="text-[10px] text-slate-400 mt-1 leading-relaxed">0=隔天開始，-1=重疊 1 天，1=空 1 天</p>
                        </div>
                        <div class="col-span-1">
                            <label class="block text-[11px] font-medium text-slate-500 mb-1 truncate">工期(天)</label>
                            <input type="number" id="task-adv-duration" min="1" value="5" placeholder="5" class="w-full border border-indigo-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-indigo-50">
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium p-2.5 rounded-lg transition-colors shadow-sm text-sm">
                            加入圖表
                        </button>
                    </div>
                </form>
            </div>

            <!-- 類別名稱直接編輯列 -->
            <div class="pt-3 border-t border-slate-100">
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs font-semibold text-slate-500">⚙️ 類別名稱自訂 (直接點擊修改名稱，拖曳區塊可調整排序)：</span>
                </div>
                <div id="category-editor" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                    <!-- 動態生成類別輸入框 -->
                </div>
            </div>
        </div>

        <!-- 甘特圖控制與呈現區 -->
        <div class="flex flex-col sm:flex-row justify-between items-end gap-3 px-1 mt-2">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                專案進度預覽
            </h2>

        function addDaysToDateString(dateStr, days) {
            if (!dateStr) return todayStr;
            // 修正：強制以 UTC 處理日期加減，避免時區導致的一天誤差
            const d = new Date(dateStr);
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().split('T')[0];
        }

        function diffDays(startStr, endStr) {
            if (!startStr || !endStr) return 1;
            const d1 = new Date(startStr);
            const d2 = new Date(endStr);
            return Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;

        // 動態渲染範本選單
        function renderTemplateOptions() {
            const select = document.getElementById('template-select');
            select.innerHTML = '<option value="" disabled selected>📂 載入範本...</option>';
            const currentTemplates = getTemplates()[appMode];
            Object.entries(currentTemplates).forEach(([key, tpl]) => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = tpl.label;
                select.appendChild(opt);
            });
        }

        // 預設載入 simple 模式的 'demo' 範本
        let currentTemplate = getTemplates()['simple']['demo'];
        let categories = JSON.parse(JSON.stringify(currentTemplate.categories));
        let tasks = JSON.parse(JSON.stringify(currentTemplate.tasks));

        document.getElementById('proj-start-date').value = todayStr;
        document.getElementById('task-adv-start').value = todayStr;

        let viewMode = 'month'; 
        let inputMode = 'absolute'; 
        let msgTimeout = null;
        let categoryDragSrcEl = null; 
        const LEFT_COLUMN_WIDTH = "w-[300px]";
        const HISTORY_LIMIT = 80;
        let undoStack = [];
        let redoStack = [];

        function showMessage(msg) {
            const msgBox = document.getElementById('message-box');
            document.getElementById('message-text').innerText = msg;
            msgBox.classList.remove('hidden');
            setTimeout(() => msgBox.classList.remove('opacity-0'), 10);
            clearTimeout(msgTimeout);
            msgTimeout = setTimeout(() => {
                msgBox.classList.add('opacity-0');
                setTimeout(() => msgBox.classList.add('hidden'), 300);
            }, 3000);
        }

        function ensureEndNotBeforeStart(startInputId, endInputId) {
            const startInput = document.getElementById(startInputId);
            const endInput = document.getElementById(endInputId);
            if (!startInput || !endInput) return false;

            endInput.min = startInput.value || '';
            if (startInput.value && endInput.value && endInput.value < startInput.value) {
                endInput.value = startInput.value;
                showMessage("結束日期不能早於開始日期，已自動調整");
                return true;
            }

            return false;
        }

        function bindDateGuard(startInputId, endInputId) {
            const startInput = document.getElementById(startInputId);
            const endInput = document.getElementById(endInputId);
            if (!startInput || !endInput) return;

            startInput.addEventListener('change', () => ensureEndNotBeforeStart(startInputId, endInputId));
            endInput.addEventListener('change', () => ensureEndNotBeforeStart(startInputId, endInputId));
            ensureEndNotBeforeStart(startInputId, endInputId);
        }

        function normalizeDateRange(startDate, endDate, endInputId = null) {
            if (startDate && endDate && endDate < startDate) {
                if (endInputId) {
                    const endInput = document.getElementById(endInputId);
                    if (endInput) endInput.value = startDate;
                }
                showMessage("結束日期不能早於開始日期，已自動調整");
                return startDate;
            }

            return endDate;
        }

        function cloneData(data) {
            return JSON.parse(JSON.stringify(data));
        }

        function getProjectState() {
            return {
                appMode,
                inputMode,
                viewMode,
                categories: cloneData(categories),
                tasks: cloneData(tasks),
                projStartDate: document.getElementById('proj-start-date').value,
                taskAdvStartDate: document.getElementById('task-adv-start').value
            };
        }

        function statesEqual(a, b) {
            return JSON.stringify(a) === JSON.stringify(b);
        }

        function setHistoryButtonState(buttonId, enabled) {
            const button = document.getElementById(buttonId);
            if (!button) return;

            button.disabled = !enabled;
            button.className = enabled
                ? "flex items-center gap-1.5 bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg font-medium transition-colors shadow-sm text-sm"
                : "flex items-center gap-1.5 bg-slate-100 text-slate-400 px-3 py-1.5 rounded-lg font-medium transition-colors shadow-sm text-sm cursor-not-allowed";
        }

        function updateHistoryButtons() {
            setHistoryButtonState('btn-undo', undoStack.length > 1);
            setHistoryButtonState('btn-redo', redoStack.length > 0);
        }

        function recordHistory() {
            const snapshot = getProjectState();
            const lastSnapshot = undoStack[undoStack.length - 1];
            if (lastSnapshot && statesEqual(lastSnapshot, snapshot)) {
                updateHistoryButtons();
                return;
            }

            undoStack.push(snapshot);
            if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
            redoStack = [];
            updateHistoryButtons();
        }

        function applyInputModeUi() {
            const absInputs = document.getElementById('absolute-inputs');

                absInputs.classList.add('hidden');
                relInputs.classList.remove('hidden');

        window.toggleAdvStart = function() {
            const predId = document.getElementById('task-predecessor').value;
            const startContainer = document.getElementById('adv-start-container');
            const lagContainer = document.getElementById('adv-lag-container');
            if (predId) {
                startContainer.classList.add('hidden');
                lagContainer.classList.remove('hidden');

                lagContainer.classList.add('hidden');

        function wouldCreateDependencyCycle(taskId, predecessorId) {
            if (!taskId || !predecessorId) return false;
            const targetId = parseInt(taskId);
            let currentId = parseInt(predecessorId);
            const visited = new Set();

            while (currentId) {
                if (currentId === targetId) return true;
                if (visited.has(currentId)) return false;
                visited.add(currentId);

                const currentTask = tasks.find(t => t.id == currentId);
                if (!currentTask || !currentTask.predecessor || !currentTask.predecessor.taskId) return false;
                currentId = parseInt(currentTask.predecessor.taskId);
            }

            return false;
        }

        function clearDependencyCycles() {
            let clearedCount = 0;
            tasks.forEach(task => {
                if (task.predecessor && task.predecessor.taskId && wouldCreateDependencyCycle(task.id, task.predecessor.taskId)) {
                    task.predecessor = null;
                    task.duration = diffDays(task.startDate, task.endDate);
                    clearedCount++;
                }
            });

            if (clearedCount > 0) {
                showMessage(`偵測到 ${clearedCount} 個循環依賴，已清除相關前置任務`);
            }

            return clearedCount;
        }

        function getDependentTasks(taskId) {
            return tasks.filter(task => task.predecessor && task.predecessor.taskId == taskId);
        }

        function findReconnectCandidate(removedTask) {
            if (!removedTask) return null;

            if (removedTask.predecessor && removedTask.predecessor.taskId) {
                const directPredecessor = tasks.find(task => task.id == removedTask.predecessor.taskId);
                if (directPredecessor) return directPredecessor;
            }

            const removedIndex = tasks.findIndex(task => task.id === removedTask.id);
            for (let i = removedIndex - 1; i >= 0; i--) {
                if (tasks[i] && tasks[i].id !== removedTask.id) return tasks[i];
            }

            return null;
        }

        function deleteTaskWithDependencyMode(taskId, mode, reconnectTaskId = null) {
            const removedTask = tasks.find(task => task.id === taskId);
            if (!removedTask) return;

            const dependentSnapshots = getDependentTasks(taskId).map(task => ({
                id: task.id,
                lag: task.predecessor && task.predecessor.lag !== undefined && task.predecessor.lag !== '' ? parseInt(task.predecessor.lag) : 0
            }));
            const reconnectTask = reconnectTaskId ? tasks.find(task => task.id == reconnectTaskId) : null;

            tasks = tasks.filter(task => task.id !== taskId);

            let reconnectedCount = 0;
            let clearedCount = 0;
            dependentSnapshots.forEach(snapshot => {
                const task = tasks.find(t => t.id === snapshot.id);
                if (!task) return;

                if (mode === 'reconnect' && reconnectTask && !wouldCreateDependencyCycle(task.id, reconnectTask.id)) {
                    task.predecessor = { taskId: reconnectTask.id, lag: snapshot.lag };
                    reconnectedCount++;
                } else {
                    task.predecessor = null;
                    task.duration = diffDays(task.startDate, task.endDate);
                    clearedCount++;
                }
            });

            updatePredecessorOptions();
            renderGantt();
            recordHistory();

            const taskName = removedTask.name || '工作項目';
            if (reconnectedCount > 0) {
                showMessage(`已刪除「${taskName}」，並銜接 ${reconnectedCount} 個後續任務`);
            } else if (clearedCount > 0) {
                showMessage(`已刪除「${taskName}」，並清除 ${clearedCount} 個後續任務的前置關聯`);
            }
        }

        // ==========================================
        // 核心連鎖計算引擎 (Calculation Engine)
        // ==========================================
        function recalculateDates() {
            if (appMode !== 'advanced') return;
            clearDependencyCycles();
            
            let changed = false;
            let maxIterations = 500; // 防止無窮迴圈
            
            do {
                changed = false;
                tasks.forEach(task => {
                    let expectedStart = task.startDate;
                    
                    if (task.predecessor && task.predecessor.taskId) {
                        const pred = tasks.find(t => t.id == task.predecessor.taskId);
                        // 確保 pred 的 endDate 已存在再推算，否則略過等下一次迴圈
                        if (pred && pred.endDate) {
                            const lagDays = task.predecessor.lag !== undefined && task.predecessor.lag !== '' ? parseInt(task.predecessor.lag) : 0;
                            // 修正：標準甘特圖中 Lag=0 代表前置結束後的「隔天」開始，因此加上 1 天
                            expectedStart = addDaysToDateString(pred.endDate, lagDays + 1);
                        }
                    }

                    if (!task.duration || task.duration < 1) task.duration = 1;
                    const expectedEnd = addDaysToDateString(expectedStart, task.duration - 1);

                    if (task.startDate !== expectedStart || task.endDate !== expectedEnd) {
                        task.startDate = expectedStart;
                        task.endDate = expectedEnd;
                        changed = true;
                    }
                });
                maxIterations--;
            } while (changed && maxIterations > 0);
        }

        function updatePredecessorOptions(excludeId = null) {
            const selects = [document.getElementById('task-predecessor'), document.getElementById('edit-task-predecessor')];
            selects.forEach(select => {
                if(!select) return;
                const currentVal = select.value;
                select.innerHTML = '<option value="">無前置任務 (手動設定起始)</option>';
                tasks.forEach(t => {
                    if (excludeId !== t.id && !wouldCreateDependencyCycle(excludeId, t.id)) {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = t.name;
                        select.appendChild(opt);
                    }
                });
                if (currentVal) select.value = currentVal;
            });
            toggleAdvStart();
        }

        const getIcons = () => ({
            // 更新：改為三條水平線(Hamburger)樣式，代表可以上下拖拉排序
            grip: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>`,

            pencil: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`,

        function renderCategories(selectElementId = 'task-category') {
            const selectEl = document.getElementById(selectElementId);
            if (!selectEl) return;
            const currentSelected = selectEl.value;
            selectEl.innerHTML = '';
            Object.entries(categories).forEach(([key, cat]) => {

                option.textContent = cat.name;

            });

                Object.entries(categories).forEach(([key, cat]) => {
                    const div = document.createElement('div');

                    div.innerHTML = `<div class="text-slate-400 shrink-0">${getIcons().grip}</div><span class="w-2.5 h-2.5 rounded-full shrink-0 ${cat.color}"></span><input type="text" data-key="${key}" value="${cat.name}" class="bg-transparent font-semibold text-xs text-slate-700 focus:outline-none w-full border-b border-transparent focus:border-slate-400 py-0.5">`;

                        setTimeout(() => this.style.opacity = '0.4', 0);
                    });
                    
                    div.addEventListener('dragover', (e) => e.preventDefault());
                    
                    div.addEventListener('dragenter', function(e) {
                        e.preventDefault();
                        if (this !== categoryDragSrcEl && categoryDragSrcEl) {
                            const items = Array.from(editorEl.children);
                            const srcIndex = items.indexOf(categoryDragSrcEl);
                            const targetIndex = items.indexOf(this);
                            if (srcIndex < targetIndex) this.after(categoryDragSrcEl);
                            else this.before(categoryDragSrcEl);
                        }
                    });
                    
                    div.addEventListener('dragend', function(e) {
                        this.style.opacity = '1';
                        const newCategories = {};
                        editorEl.querySelectorAll('div[data-category-key]').forEach(el => {
                            const k = el.dataset.categoryKey;
                            newCategories[k] = categories[k];
                        });

                        renderCategories('edit-task-category');

                    });
                });
            }
        }

        function computeTimeline() {
            if (tasks.length === 0) { const today = new Date(); return { timelineStart: today, timelineEnd: today, totalDays: 1, timeHeaders: [] }; }
            let minDate = new Date(Math.min(...tasks.map(t => new Date(t.startDate))));
            let maxDate = new Date(Math.max(...tasks.map(t => new Date(t.endDate))));
            let start = new Date(minDate); let end = new Date(maxDate);
            if (viewMode === 'day') { start.setDate(start.getDate() - 3); end.setDate(end.getDate() + 3); }
            else if (viewMode === 'month') { start = new Date(start.getFullYear(), start.getMonth(), 1); end = new Date(end.getFullYear(), end.getMonth() + 1, 0); }
            else if (viewMode === 'quarter') {
                const startQuarterMonth = Math.floor(start.getMonth() / 3) * 3;
                start = new Date(start.getFullYear(), startQuarterMonth, 1);
                const endQuarterMonth = Math.floor(end.getMonth() / 3) * 3 + 2;
                end = new Date(end.getFullYear(), endQuarterMonth + 1, 0);
            }
            else if (viewMode === 'year') {
                start = new Date(start.getFullYear(), 0, 1);
                end = new Date(end.getFullYear(), 11, 31);
            }
            const totalDays = (end - start) / (1000 * 60 * 60 * 24) + 1;
            const headers = [];
            let current = new Date(start);
            while (current <= end) {
                if (viewMode === 'day') { headers.push({ label: `${current.getMonth() + 1}/${current.getDate()}`, days: 1 }); current.setDate(current.getDate() + 1); }
                else if (viewMode === 'month') {
                    const year = current.getFullYear(); const month = current.getMonth();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    let activeDays = daysInMonth;
                    let monthEnd = new Date(year, month, daysInMonth);
                    if (monthEnd > end) activeDays = (end - current) / (1000 * 60 * 60 * 24) + 1;
                    headers.push({ label: `${year}年${month + 1}月`, days: activeDays });
                    current.setMonth(current.getMonth() + 1); current.setDate(1);
                }
                else if (viewMode === 'quarter') {
                    const year = current.getFullYear(); const quarter = Math.floor(current.getMonth() / 3) + 1;
                    const quarterStartMonth = (quarter - 1) * 3;
                    const daysInQuarter = (new Date(year, quarterStartMonth + 3, 0) - new Date(year, quarterStartMonth, 1)) / (1000 * 60 * 60 * 24) + 1;
                    headers.push({ label: `${year} Q${quarter}`, days: daysInQuarter });
                    current.setMonth(current.getMonth() + 3); current.setDate(1);
                }
                else if (viewMode === 'year') {
                    const year = current.getFullYear();
                    const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
                    const daysInYear = isLeap ? 366 : 365;
                    headers.push({ label: `${year}年`, days: daysInYear });
                    current.setFullYear(current.getFullYear() + 1); current.setMonth(0); current.setDate(1);
                }
            }
            return { timelineStart: start, timelineEnd: end, totalDays, timeHeaders: headers };
        }

        function getTaskStyle(startDateStr, endDateStr, timelineStart, timelineEnd, totalDays) {
            const start = new Date(startDateStr); const end = new Date(endDateStr);
            const effectiveStart = start < timelineStart ? timelineStart : start;
            const effectiveEnd = end > timelineEnd ? timelineEnd : end;
            const leftPercent = ((effectiveStart - timelineStart) / (1000 * 60 * 60 * 24)) / totalDays * 100;
            const widthPercent = ((effectiveEnd - effectiveStart) / (1000 * 60 * 60 * 24) + 1) / totalDays * 100;
            return { left: `${Math.max(0, leftPercent)}%`, width: `${Math.min(100 - leftPercent, widthPercent)}%` };
        }

        // ==========================================
        // 修正後的 SVG 連線繪製函式 (直角轉折 + 正確座標對齊)
        // ==========================================
        function drawDependencyLines() {
            const svgLayer = document.getElementById('dependency-svg');
            if (!svgLayer) return;

            // 將 arrow 的 path 修改為兩條線段(開放箭頭)，並加上 stroke 設定
            let svgContent = `<defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </marker>
            </defs>`;

            if (appMode !== 'advanced') {
                svgLayer.innerHTML = svgContent;
                return;
            }

            // 取得 SVG 畫布本身相對於視窗的座標，作為絕對的計算基準點
            const svgRect = svgLayer.getBoundingClientRect();

            tasks.forEach(task => {
                if (task.predecessor && task.predecessor.taskId) {
                    const predEl = document.querySelector(`.task-bar-element[data-task-id="${task.predecessor.taskId}"]`);
                    const curEl = document.querySelector(`.task-bar-element[data-task-id="${task.id}"]`);
                    
                    if (predEl && curEl) {
                        const predRect = predEl.getBoundingClientRect();
                        const curRect = curEl.getBoundingClientRect();

                        // 座標計算：拿色塊的螢幕位置減掉 SVG 畫布的螢幕位置，完美對齊座標系！
                        const startX = predRect.right - svgRect.left;
                        const startY = predRect.top - svgRect.top + (predRect.height / 2);
                        
                        const endX = curRect.left - svgRect.left;
                        const endY = curRect.top - svgRect.top + (curRect.height / 2);

                        // 繪製直角轉折的虛線 (Orthogonal Lines)
                        let pathD = `M ${startX} ${startY} `;
                        
                        if (startX <= endX - 30) {
                            // 正常的由左至右 (直角轉折：向右 -> 垂直向下/上 -> 向右)
                            const midX = startX + 15; 
                            pathD += `L ${midX} ${startY} L ${midX} ${endY} L ${endX - 2} ${endY}`;
                        } else {
                            // 向後回繞的線 (前置任務結束時間晚於後續任務的開始時間)
                            // 增加轉折的長度，讓箭頭後方有比較長的水平線 (turnLeftX 往左延伸 30px)
                            const dropY = startY + 28; 
                            const turnLeftX = Math.max(0, endX - 30); 
                            
                            pathD += `L ${startX + 15} ${startY} `;
                            pathD += `L ${startX + 15} ${dropY} `;
                            pathD += `L ${turnLeftX} ${dropY} `;
                            pathD += `L ${turnLeftX} ${endY} `;
                            pathD += `L ${endX - 2} ${endY}`;
                        }

                        // 將計算好的線段加入 SVG 中
                        svgContent += `<path d="${pathD}" fill="none" stroke="#4f46e5" stroke-width="1.5" class="dependency-line" marker-end="url(#arrow)" />`;
                    }
                }
            });

            svgLayer.innerHTML = svgContent;
        }

        // --- 新增：雙擊重新命名任務功能 ---
        window.editTaskNameInline = function(element, taskId) {
            // 防止重複點擊產生多個 input
            if (element.querySelector('input')) return;
            
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            const currentName = task.name;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentName;
            // 套用 Tailwind 樣式，讓輸入框融入背景
            input.className = 'w-full text-sm font-medium text-slate-800 border-b border-blue-500 focus:outline-none bg-white py-0.5 px-1';
            
            // 儲存邏輯
            const save = () => {
                const newName = input.value.trim();
                if (newName && newName !== currentName) {
                    task.name = newName;
                    renderGantt(); // 重新渲染畫面
                } else {
                    // 若空白或沒改，恢復原狀
                    element.innerHTML = currentName;
                }
                updatePredecessorOptions(); // 確保下拉選單名稱也更新
            };
            
            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur(); // 觸發 blur 自動儲存
                } else if (e.key === 'Escape') {
                    input.value = currentName; // 放棄修改
                    input.blur();
                }
            });
            
            element.innerHTML = '';
            element.appendChild(input);
            input.focus();
            input.select();
        };

        function renderGantt() {
            recalculateDates(); 

            const container = document.getElementById('chart-export-area');

            const tasksHtml = tasks.map(task => {
                const style = getTaskStyle(task.startDate, task.endDate, timelineStart, timelineEnd, totalDays);
                const catConfig = categories[task.category] || fallbackCategory;
                
                // 決定是否顯示「禁止平移」游標

                return `<div data-id="${task.id}" class="task-row flex border-b border-slate-100 hover:bg-slate-50 group relative transition-colors">

                                ${icons.grip}
                            </div>

                        </div>
                    </div>
                    <div class="flex-1 relative py-3 px-1 z-0">
                        <div class="absolute h-8 rounded shadow-sm flex items-center text-white text-sm font-medium hover:ring-2 ring-black/10 ${catConfig.color} task-bar-element ${cursorMoveClass}" data-task-id="${task.id}" style="left: ${style.left}; width: ${style.width}; top: 50%; transform: translateY(-50%);" title="項目：${task.name}&#10;期間：${task.startDate} ~ ${task.endDate}&#10;工期：${task.duration} 天">
                            <span class="whitespace-nowrap pointer-events-none select-none z-10 pl-2 pr-1" style="text-shadow: -1px -1px 0 rgba(0,0,0,0.6), 1px -1px 0 rgba(0,0,0,0.6), -1px 1px 0 rgba(0,0,0,0.6), 1px 1px 0 rgba(0,0,0,0.6);">${task.name}</span>
                            <div class="absolute right-0 top-0 bottom-0 w-2.5 cursor-ew-resize hover:bg-black/20 resize-handle rounded-r z-20" data-task-id="${task.id}" title="拖曳調整工期"></div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            // 重要：高度設定 h-full 確保 SVG 不會塌陷
            container.innerHTML = `<div class="flex flex-col w-full overflow-x-auto relative pb-2 chart-scroll-container"><div class="min-w-[800px] chart-content-wrapper"><div class="flex border-b border-slate-200 bg-slate-50 sticky top-0 z-10"><div class="${LEFT_COLUMN_WIDTH} shrink-0 p-2 border-r border-slate-200 font-bold text-slate-600 text-sm">工作項目</div><div class="flex-1 relative flex">${headersHtml}</div></div><div class="relative" id="tasks-list"><div class="absolute top-0 bottom-0 right-0 flex pointer-events-none" style="left: 300px;">${gridHtml}</div><svg id="dependency-svg" class="absolute top-0 left-0 pointer-events-none z-20 h-full" style="left: 300px; width: calc(100% - 300px);"></svg>${tasksHtml}</div></div></div>`;
