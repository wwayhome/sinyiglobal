<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APLI 01273 標籤列印產生器</title>
    <!-- 引入 Tailwind CSS 處理版面與 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS 處理 Excel 讀取 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }

        /* 預覽區的標籤樣式 (帶有虛線框方便檢視) */
        .preview-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            box-sizing: border-box;
            /* A4 紙張大小 */
        }

        .preview-label {
            width: 70mm;
            height: 37mm;
            box-sizing: border-box;
            border: 1px dashed #cbd5e1; /* 預覽用虛線 */
            padding: 4mm;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 標籤內的文字排版 */
        /* 地址與公司字體統一為 10pt */
        .label-address { font-size: 10pt; line-height: 1.4; margin-bottom: 2mm; word-break: break-all; }
        .label-company { font-size: 10pt; font-weight: 500; margin-bottom: 1mm; }
        /* 姓名縮小為 11pt */
        .label-recipient { font-size: 11pt; font-weight: bold; }
        
        .label-logo {
            position: absolute;
            top: 24px; /* 精準往下移得到 24px */
            right: 2mm; /* 保持靠右邊距 */
            height: 28mm; /* 根據高度調整大宗郵件圖案大小 */
            width: auto;
            object-fit: contain;
            display: none; /* 預設隱藏 */
        }

        .show-logo .label-logo {
            display: block;
        }
        
        /* 當顯示 Logo 時，保護右側不被地址文字覆蓋 */
        .show-logo .label-address {
            padding-right: 24mm; 
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0; /* 移除瀏覽器預設邊界 */
            }
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            /* 隱藏非列印區域 */
            .no-print {
                display: none !important;
            }
            
            /* 清除預覽區底部的 padding，避免撐出額外的空白頁 */
            #previewArea {
                padding-bottom: 0 !important;
            }

            .preview-page {
                margin: 0;
                box-shadow: none;
                /* 鎖死絕對高度並隱藏溢出，避免瀏覽器小數點運算撐破版面 */
                height: 297mm; 
                overflow: hidden; 
                page-break-after: always; /* 確保每張 A4 換頁 */
                break-after: page; 
            }
            
            /* 最後一張 A4 不再強制換頁，避免產生最後一頁空白頁 */
            .preview-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            /* 列印時移除虛線框 */
            .preview-label {
                border: none;
                /* 微調邊距以防列印機硬體留白咬紙 */
                padding-left: 5mm; 
                padding-right: 5mm;
            }
        }
    </style>
</head>
<body class="text-gray-800">

<div class="no-print p-6 max-w-5xl mx-auto">
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
        <h1 class="text-2xl font-bold mb-2 text-blue-700">APLI 01273 標籤列印產生器</h1>
        <!-- 下載工廠清單超連結 -->
        <div class="mb-4">
            <a href="https://land.bip.gov.tw/gis/" target="_blank" class="text-blue-600 hover:text-blue-800 underline font-medium flex items-center gap-1 inline-flex">
                🌐 下載工廠清單 (另開網頁)
            </a>
        </div>
        <p class="text-sm text-gray-500 mb-6">請依序設定您的資料，並確認預覽無誤後再點擊「列印 PDF」。 (建議列印設定：無邊界、縮放 100%)</p>

        <!-- 步驟區塊 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 步驟 1: 上傳 Excel -->
            <div class="border rounded-lg p-4 bg-blue-50">
                <h2 class="font-bold mb-2 flex items-center"><span class="bg-blue-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">1</span> 上傳 Excel 清單</h2>
                <input type="file" id="excelFile" accept=".xls,.xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"/>
                <p class="text-xs text-gray-500 mt-2">支援自動偵測欄位標題，或手動調整對應。</p>
            </div>

            <!-- 步驟 2: 設定大宗郵件 Logo -->
            <div class="border rounded-lg p-4 bg-green-50">
                <h2 class="font-bold mb-3 flex items-center"><span class="bg-green-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">2</span> 設定大宗郵件戳記</h2>
                
                <div class="flex flex-col gap-3">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="logoOption" value="none" class="w-4 h-4 text-green-600 bg-white border-gray-300 focus:ring-green-500" checked>
                        <span class="ml-2 text-sm font-medium text-gray-700">不使用大宗郵件戳記</span>
                    </label>
                    
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="logoOption" value="preset" class="w-4 h-4 text-green-600 bg-white border-gray-300 focus:ring-green-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">使用「信利達」預設戳記</span>
                    </label>
                    
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="logoOption" value="upload" class="w-4 h-4 text-green-600 bg-white border-gray-300 focus:ring-green-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">自行上傳圖片後套用</span>
                    </label>
                </div>

                <div id="uploadBox" class="mt-3 hidden p-3 border border-green-200 rounded-md bg-green-100/50">
                    <input type="file" id="logoFile" accept="image/png,image/jpeg" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer"/>
                </div>
            </div>

            <!-- 步驟 3: 產生與列印 -->
            <div class="border rounded-lg p-4 bg-orange-50 flex flex-col justify-center items-center">
                <button id="generateBtn" class="w-full bg-gray-400 text-white font-bold py-3 px-4 rounded shadow cursor-not-allowed transition mb-3" disabled>
                    等待上傳資料...
                </button>
                <button id="printBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow transition hidden">
                    🖨️ 列印標籤 / 匯出 PDF
                </button>
            </div>
        </div>
        
        <div id="statusMsg" class="mt-4 text-sm font-semibold text-center text-red-500">請先上傳 Excel 檔案。</div>

        <!-- 步驟 1.5 欄位對應與預覽 (預設隱藏) -->
        <div id="mappingSection" class="hidden mt-6 border rounded-lg p-5 bg-yellow-50 shadow-inner">
            <div class="mb-5 border-b border-yellow-200 pb-4">
                <h2 class="font-bold text-lg flex items-center text-yellow-800 mb-3">
                    <span class="bg-yellow-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs mr-2">!</span> 
                    確認欄位對應 (設定資料來源)
                </h2>
                <!-- 靠左放大的標題列設定 -->
                <div class="flex flex-col sm:flex-row sm:items-center gap-2 bg-yellow-100 p-3 rounded-lg border border-yellow-300 w-full md:w-auto inline-block shadow-sm">
                    <label class="text-base md:text-lg font-bold text-red-600">⚠️ 指定標題列為第幾列：</label>
                    <input type="number" id="headerRowInput" value="1" min="1" class="border-2 border-red-400 p-1 w-20 text-lg rounded text-center focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 font-bold text-red-700 shadow-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">公司名稱對應：</label>
                    <select id="selCompany" class="w-full border border-gray-300 rounded shadow-sm p-2 bg-white focus:outline-none focus:ring-2 focus:ring-yellow-500"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">地址對應：</label>
                    <select id="selAddress" class="w-full border border-gray-300 rounded shadow-sm p-2 bg-white focus:outline-none focus:ring-2 focus:ring-yellow-500"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">收件人對應：</label>
                    <select id="selRecipient" class="w-full border border-gray-300 rounded shadow-sm p-2 bg-white focus:outline-none focus:ring-2 focus:ring-yellow-500"></select>
                </div>
            </div>

            <!-- 進階標籤設定 -->
            <div class="mt-4 pt-4 border-t border-yellow-200 mb-4 bg-yellow-100/50 p-3 rounded">
                <h3 class="text-sm font-bold mb-3 text-yellow-800 flex items-center">
                    <span class="mr-1">⚙️</span> 標籤格式進階設定
                </h3>
                
                <div class="mb-4">
                    <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                        <input type="checkbox" id="autoBreakAddress" class="mr-2 rounded text-yellow-600 focus:ring-yellow-500 w-4 h-4" checked>
                        地址自動分為兩列 (系統將一律自動隱藏村里)
                    </label>
                </div>

                <div class="border-t border-yellow-200/50 pt-3">
                    <h4 class="text-sm font-bold mb-2 text-yellow-800">收件人設定 (三選一)：</h4>
                    <div class="flex flex-col gap-3 ml-1">
                        <!-- 選項 1 -->
                        <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                            <input type="radio" name="recipientOption" value="excel" class="mr-2 text-yellow-600 bg-white border-gray-300 focus:ring-yellow-500 w-4 h-4" checked>
                            1. 依清單聯絡人 + 自訂稱謂：
                            <!-- 預設值改為 鈞啟 -->
                            <input type="text" id="excelTitle" value="鈞啟" class="ml-2 border border-gray-300 p-1 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 w-32">
                        </label>
                        <!-- 選項 2 -->
                        <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                            <input type="radio" name="recipientOption" value="custom" class="mr-2 text-yellow-600 bg-white border-gray-300 focus:ring-yellow-500 w-4 h-4">
                            2. 統一自訂收件人 (忽略清單)：
                            <input type="text" id="customAllText" value="董事長 鈞啟" class="ml-2 border border-gray-300 p-1 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 w-32 disabled:bg-gray-200 disabled:text-gray-400" disabled>
                        </label>
                        <!-- 選項 3 -->
                        <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                            <input type="radio" name="recipientOption" value="company" class="mr-2 text-yellow-600 bg-white border-gray-300 focus:ring-yellow-500 w-4 h-4">
                            3. 隱藏收件人 (於公司名稱後加)：
                            <input type="text" id="companyOnlyTitle" value="收" class="ml-2 border border-gray-300 p-1 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 w-24 disabled:bg-gray-200 disabled:text-gray-400" disabled>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 即時預覽畫面 -->
            <div class="bg-white p-3 rounded border shadow-sm">
                <h3 class="text-sm font-bold text-gray-600 mb-3 border-b pb-2">🔍 前三筆快速預覽 (請確認資料是否正確)</h3>
                <div id="quickPreviewBox" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <!-- 預覽卡片將由 JS 動態產生 -->
                </div>
                
                <!-- 新增的第二顆產生預覽按鈕，方便使用者直接點擊 -->
                <button id="generateBtn2" class="w-full mt-5 bg-gray-400 text-white font-bold py-3 px-4 rounded shadow cursor-not-allowed transition hidden" disabled>
                    等待上傳資料...
                </button>
            </div>
        </div>
    </div>
</div>

<div id="previewArea" class="w-full flex flex-col items-center pb-10">
    <!-- 動態產生的標籤頁面會放在這裡 -->
</div>

    recipientOptions.forEach(radio => {
        radio.addEventListener('change', function() {
            excelTitle.disabled = this.value !== 'excel';
            customAllText.disabled = this.value !== 'custom';
            companyOnlyTitle.disabled = this.value !== 'company';
            updateQuickPreview();
        });
    });

    // 綁定三個收件人文字框，實現打字即時更新
    [excelTitle, customAllText, companyOnlyTitle].forEach(input => {
        input.addEventListener('input', updateQuickPreview);
    });

    // 大宗郵件戳記選項切換
    logoOptions.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'upload') {
                uploadBox.classList.remove('hidden');
                selectedLogoUrl = customLogoDataUrl;
            } else {
                uploadBox.classList.add('hidden');
                selectedLogoUrl = (this.value === 'preset') ? PRESET_LOGO_URL : '';
            }
            updateQuickPreview();
            updateGeneratedLabelsLogo();
        });
    });

    // 自行上傳大宗郵件圖檔
    logoFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            customLogoDataUrl = e.target.result;
            document.querySelector('input[name="logoOption"][value="upload"]').checked = true;
            selectedLogoUrl = customLogoDataUrl;
            updateQuickPreview();
            updateGeneratedLabelsLogo();
        };
        reader.readAsDataURL(file);
    });

    function updateGeneratedLabelsLogo() {
        const labels = document.querySelectorAll('#previewArea .preview-label');
        if (selectedLogoUrl) {
            labels.forEach(label => {
                label.classList.add('show-logo');
                label.querySelector('.label-logo').src = selectedLogoUrl;
            });
        } else {
            labels.forEach(label => label.classList.remove('show-logo'));
        }
    }

    function getZipCode(addressStr) {
        let clean = addressStr.replace(/\s+/g, '');
        // 抓取縣市與鄉鎮市區，例如：新北市板橋區
        const match = clean.match(/^(?:.{2}[縣市])?.{1,3}[區市鎮鄉]/);
        if (match) {
            let key = match[0].replace(/臺/g, '台');
            if (taiwanZipCodes[key]) return taiwanZipCodes[key];
        }
        return '';
    }

    function formatAddress(address, breakLine) {
        if (!address) return '';
        let cleanAddress = String(address).replace(/\s+/g, '').replace(/臺/g, '台');
        
        // 精準鎖定第一段：「縣市 (可省略) + 鄉鎮市區」
        const match = cleanAddress.match(/^(?:.{2}[縣市])?.{1,3}[區市鎮鄉]/);
        
        if (match) {
            let cityAndDistrict = match[0];
            let restAddress = cleanAddress.substring(cityAndDistrict.length);
            
            // 一律無條件過濾並隱藏「村」或「里」
            restAddress = restAddress.replace(/^.{1,3}[村里]/, '');
            
            // 決定是否強制折行
            if (breakLine && restAddress.length > 0) {
                return cityAndDistrict + '<br>' + restAddress;
            } else {
                return cityAndDistrict + restAddress;
            }
        }
        return cleanAddress; 
    }

    function formatCompany(company) {
        if (!company) return '';
        let result = String(company).trim();
        let companyIdx = result.indexOf('公司');
        if (companyIdx !== -1) {
            let afterCompany = result.substring(companyIdx + 2); 
            // 只要公司後面出現「廠」字，就直接截斷，只保留到「公司」
            if (afterCompany.includes('廠')) {
                return result.substring(0, companyIdx + 2);
            }
        }
        return result;
    }

    function updateQuickPreview() {
        if (rawExcelData.length === 0) return;

        let headerIndex = parseInt(headerRowInput.value, 10) - 1;
        if (isNaN(headerIndex) || headerIndex < 0) headerIndex = 0;
        
        let dataRows = rawExcelData.slice(headerIndex + 1);
        let previewCount = 0;
        quickPreviewBox.innerHTML = '';
        parsedData = []; 

        let idxC = selCompany.value;
        let idxA = selAddress.value;
        let idxR = selRecipient.value;

        // 取得目前選取的收件人模式
        const recOpt = document.querySelector('input[name="recipientOption"]:checked').value;

        for (let i = 0; i < dataRows.length; i++) {
            const row = dataRows[i];
            
            let rawCompany = row[idxC] !== undefined ? String(row[idxC]).trim() : '';
            let rawAddress = row[idxA] !== undefined ? String(row[idxA]).trim() : '';
            let rawRecipient = row[idxR] !== undefined ? String(row[idxR]).trim() : '';

            if (!rawCompany && !rawAddress && !rawRecipient) continue;

            parsedData.push({ company: rawCompany, address: rawAddress, recipient: rawRecipient });

            if (previewCount < 3) {
                let finalCompany = formatCompany(rawCompany);
                let displayRecipient = '';

                // 根據模式處理收件人與公司後綴文字
                if (recOpt === 'company') {
                    const appendText = companyOnlyTitle.value.trim();
                    if (appendText) finalCompany += ' ' + appendText;
                    // displayRecipient 保持空白
                } else if (recOpt === 'custom') {
                    displayRecipient = customAllText.value.trim();
                } else {
                    displayRecipient = rawRecipient;
                    const appendText = excelTitle.value.trim();
                    if (displayRecipient && appendText) {
                        displayRecipient += ' ' + appendText;
                    }
                }

                let zip = getZipCode(rawAddress);
                // 移除原本位在字首的郵遞區號(如果有)
                let cleanAddrForDisplay = rawAddress.replace(/^\d{3,5}\s*/, ''); 
                let formattedAddr = formatAddress(cleanAddrForDisplay, autoBreakAddress.checked);
                
                // 將郵遞區號直接前綴在地址第一列的最前方
                let finalAddressHtml = zip ? `${zip} ${formattedAddr}` : formattedAddr;

                let logoImgHtml = selectedLogoUrl ? `<img class="label-logo" src="${selectedLogoUrl}" alt="郵資已付" style="display:block;">` : '';
                let logoClass = selectedLogoUrl ? 'show-logo' : '';

                quickPreviewBox.innerHTML += `
                    <div class="border border-yellow-300 rounded p-3 relative overflow-hidden bg-white shadow-sm flex flex-col justify-center h-[130px] ${logoClass}">
                        ${logoImgHtml}
                        <div class="label-address" style="margin-bottom: 4px;">${finalAddressHtml}</div>
                        <div class="label-company">${finalCompany}</div>
                        <div class="label-recipient mt-1">${displayRecipient || '　'}</div>
                    </div>
                `;
                previewCount++;
            }
        }
        
        statusMsg.textContent = `對應完成！有效資料共 ${parsedData.length} 筆，請點擊「產生正式標籤預覽」。`;
        statusMsg.className = 'mt-4 text-sm font-semibold text-center text-green-600';
    }

    // 獨立出產生正式標籤的邏輯，供兩顆按鈕共用呼叫
    function generateFinalLabels() {
        if (parsedData.length === 0) return;

        previewArea.innerHTML = ''; 
        const LABELS_PER_PAGE = 24; 
        let currentPage = null;

        const recOpt = document.querySelector('input[name="recipientOption"]:checked').value;

        parsedData.forEach((row, index) => {
            if (index % LABELS_PER_PAGE === 0) {
                currentPage = document.createElement('div');
                currentPage.className = 'preview-page';
                previewArea.appendChild(currentPage);
            }

            let finalCompany = formatCompany(row.company);
            let displayRecipient = '';

            if (recOpt === 'company') {
                const appendText = companyOnlyTitle.value.trim();
                if (appendText) finalCompany += ' ' + appendText;
            } else if (recOpt === 'custom') {
                displayRecipient = customAllText.value.trim();
            } else {
                displayRecipient = row.recipient;
                const appendText = excelTitle.value.trim();
                if (displayRecipient && appendText) {
                    displayRecipient += ' ' + appendText;
                }
            }

            let zip = getZipCode(row.address);
            let cleanAddrForDisplay = row.address.replace(/^\d{3,5}\s*/, ''); 
            let formattedAddr = formatAddress(cleanAddrForDisplay, autoBreakAddress.checked);
            let finalAddressHtml = zip ? `${zip} ${formattedAddr}` : formattedAddr;

            const labelDiv = document.createElement('div');
            labelDiv.className = `preview-label ${selectedLogoUrl ? 'show-logo' : ''}`;
            
            labelDiv.innerHTML = `
                <img class="label-logo" src="${selectedLogoUrl || ''}" alt="郵資已付">
                <div class="label-address">${finalAddressHtml}</div>
                <div class="label-company">${finalCompany}</div>
                <div class="label-recipient">${displayRecipient || '　'}</div>
            `;
            
            currentPage.appendChild(labelDiv);
        });

        statusMsg.textContent = `預覽產生完畢！共計 ${parsedData.length} 張標籤。可以準備列印。`;
        statusMsg.className = 'mt-4 text-sm font-semibold text-center text-green-600';
        
        printBtn.classList.remove('hidden');
        previewArea.scrollIntoView({ behavior: 'smooth' });
    }

    // 將兩顆產生預覽按鈕，都綁定到同一個產生邏輯
    generateBtn.addEventListener('click', generateFinalLabels);
    generateBtn2.addEventListener('click', generateFinalLabels);

    printBtn.addEventListener('click', function() {
        // 在列印瞬間動態改變網頁標題，讓 PDF 產出自動帶入日期與筆數
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}${mm}${dd}`;
        
        const originalTitle = document.title;
        document.title = `${dateStr}_標籤共${parsedData.length}筆`;
        
        window.print();
        
        // 列印對話框彈出後，稍候將標題改回來
        setTimeout(() => {
            document.title = originalTitle;
        }, 1000);
    });

</script>
